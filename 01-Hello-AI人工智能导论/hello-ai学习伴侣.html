iv class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch01\">第 1 章：你已经在用 AI 了<\/a><\/span><\/div><h1>第 3 章：不只是神经网络<\/h1>\n<blockquote>第一部 · 地图　·　搜索、规则与试错。这三种「老式」AI 至今仍在导航、下棋和游戏里工作。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：2 小时 ｜ <strong>前置<\/strong>：第 1、2 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n能解释 A* 算法怎样用「已走代价 + 估计剩余」找最短路。\n<\/li><li>\n能区分规则系统与机器学习各自的优缺点。\n<\/li><li>\n能说清强化学习的奖励、探索与利用，以及 MCTS 怎样和神经网络结合。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>不靠学习的 AI 有三条路：搜索找解、规则做判断、试错学策略；现代最强系统往往把它们和神经网络组合起来。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：搜索与 A*<\/h3>\n<p>导航软件在一秒钟内给出路线，里面没有神经网络，也没有学习。它做的是<strong>搜索<\/strong>：在几千万个路口和路段组成的图里，找一条总代价最小的路径。<\/p>\n<p>最朴素的搜索会从起点一层层展开，遇到组合爆炸就慢得不可用。实用的搜索靠两件事省力：剪枝，以及<strong>启发式<\/strong>——一个便宜的估计，告诉搜索「往哪边更有希望」。<\/p>\n<p><strong>A\\<\/strong>* 算法给每个待展开的节点算一个分数：<\/p>\n<div class=\"katex-block\">f(n) = g(n) + h(n)<\/div>\n<p><span class=\"katex-inline\">g(n)<\/span> 是从起点走到 <span class=\"katex-inline\">n<\/span> 已经花掉的代价，<span class=\"katex-inline\">h(n)<\/span> 是从 <span class=\"katex-inline\">n<\/span> 到终点的估计代价。A<em> 优先展开 <span class=\"katex-inline\">f<\/span> 最小的节点。只要 <span class=\"katex-inline\">h<\/span> 从不高估真实剩余代价（这叫可采纳），A<\/em> 保证找到最短路，同时比盲目搜索少走很多弯路。地图上的直线距离就是一个好用的 <span class=\"katex-inline\">h<\/span>：它永远小于等于真实路程。<\/p>\n<h3>概念 2：规则系统<\/h3>\n<p><strong>规则系统<\/strong>把人写的 if-then 规则串起来做判断。它透明、可审计、可以精确控制：银行的反欺诈策略、医院的用药禁忌、飞机的检查清单，很多都是规则。<\/p>\n<p>它的缺点也明确：写不完、不会自己适应变化、规则多了会互相打架。专家系统在 1980 年代撞上的就是这堵墙。<\/p>\n<p>今天最常见的做法不是「规则或模型」，而是两者组合：模型给出概率和候选，规则加硬约束。比如智能体要执行删除文件、转账、部署这类不可逆操作，前面的模型可以建议，最后必须过一道规则或人工确认。<\/p>\n<h3>概念 3：强化学习与试错<\/h3>\n<p><strong>强化学习<\/strong>没有标签，只有奖励。智能体在环境里反复尝试，做一个动作，环境给它一个奖励和新的状态，它根据奖励调整策略，学会「在这种情况下该做什么」。<\/p>\n<p>它必须处理一个监督学习没有的矛盾：<strong>探索与利用<\/strong>。只利用已知有效的动作，会困在平庸解；只探索新动作，拿不到稳定回报。人下棋、玩游戏、学骑车，都在两者之间来回。<\/p>\n<p>奖励设计极其关键。奖励给错了，智能体会钻空子。你让它「尽快把房间打扫干净」，它可能把垃圾塞进抽屉；你让它「让用户满意」，它可能学会讨好而不是解决问题。这叫<strong>奖励破解<\/strong>，在大模型对齐里同样会出现。<\/p>\n<p><strong>蒙特卡洛树搜索（MCTS）<\/strong>是搜索与试错的结合：通过大量随机模拟评估走法，把算力集中在最有希望的分支上。AlphaGo 用 MCTS 向前推演，用策略网络缩小候选、用价值网络估计局面，三者合起来才击败了人类顶尖棋手。这是「老方法 + 神经网络」最经典的例子。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  S[起点] --&gt; A[展开候选]\n  A --&gt; B{算 f=g+h}\n  B --&gt; C[选最小]\n  C --&gt; D{到终点?}\n  D -- 否 --&gt; A\n  D -- 是 --&gt; E[输出路径]\n  F[规则库] --&gt; G[硬约束/审批]\n  H[强化学习] --&gt; I[策略]\n  I --&gt; G<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>左边是 A* 的循环：算分数、选最小、继续展开。右边说明规则和强化学习并没有被淘汰，它们在现代系统里常作为约束和策略层出现。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：A* 像在陌生城市找路：你既看已经走了多远，也看地图上离目的地还有多远。只看已走距离，会绕进死胡同；只看直线距离，会撞墙。两个加起来，才既快又不迷路。\n<\/li><li>\n<strong>实例<\/strong>：从徐家汇到浦东机场：Dijkstra 只看已走代价，会向所有方向均匀扩展；A* 用「到机场的直线距离」作启发式，优先沿东南方向展开，扩展的节点少一个数量级，路线仍然最短。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 有了大模型就不需要搜索和规则——实际上 导航、排课、游戏寻路仍然用搜索；金融、医疗、航空仍然大量用规则。大模型不擅长精确最优和硬约束。\n<\/li><li>\n别以为 强化学习就是给奖励让机器试——实际上 奖励设计、探索策略、稳定性都是核心难题。奖励给错，机器会学会钻空子。\n<\/li><li>\n别以为 A<em> 一定最快——实际上 A<\/em> 的快慢取决于启发式。估计越准，扩展越少；估计高估时可能找不到最短路。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\nA<em> 里的 g(n) 和 h(n) 分别是什么？（答案：g 是从起点到 n 的实际代价，h 是从 n 到终点的估计代价。；解析：A<\/em> 优先展开 f=g+h 最小的节点。）\n<\/li><li>\n什么样的启发式能保证 A* 找到最短路？（答案：从不高估真实剩余代价的启发式，即 h(n) 小于等于 n 到终点的真实最小代价。；解析：这叫可采纳启发式。）\n<\/li><li>\n规则系统最大的优点和缺点各是什么？（答案：优点是透明、可审计、可精确控制；缺点是写不完、难维护、难适应变化。；解析：专家系统的退潮就来自后者。）\n<\/li><li>\n强化学习里的探索与利用矛盾是什么？（答案：是继续用已知有效的动作，还是尝试未知动作以发现更好选择。只利用会困在平庸解，只探索拿不到稳定回报。；解析：这是强化学习特有的问题。）\n<\/li><li>\nAlphaGo 为什么不是单纯的神经网络？（答案：它把策略网络、价值网络和蒙特卡洛树搜索组合起来：网络缩小候选和评估局面，搜索负责向前推演。；解析：它是搜索、试错与神经网络的合流。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nA* 的分数是 f=g+h，h 不高估才保证最优。\n<\/li><li>\n规则系统透明但写不完，现代系统常用模型给概率、规则加约束。\n<\/li><li>\n强化学习靠奖励调整策略，必须处理探索与利用。\n<\/ul>", "kind": "chapter", "title": "第 3 章：不只是神经网络"}, "ch04": {"html": "<div class=\"source-badge\">📖 出处：hello-ai.pdf · p.37–48<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch01\">第 1 章：你已经在用 AI 了<\/a><\/span><\/div><h1>第 4 章：规则不是写出来的，是学出来的<\/h1>\n<blockquote>第二部 · 学习　·　机器学习的全部核心思想，其实只有一句话。这一章用一笔网约车订单把它讲透。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：第 1–3 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n能用自己的话解释监督学习：从带标签的样本里学一个映射。\n<\/li><li>\n能说清模型、参数、损失函数、梯度下降各自在做什么。\n<\/li><li>\n能判断一个任务该用监督、无监督还是自监督学习。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>机器学习不是写规则，而是给大量「输入—答案」的例子，让模型自己调参数，使预测的误差变小。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：从规则到样本<\/h3>\n<p>传统编程是「人写规则，程序按规则算答案」。机器学习反过来：给人一堆「输入 + 正确答案」的例子，让机器自己找规则。这个「答案」叫<strong>标签<\/strong>，一条例子叫<strong>样本<\/strong>，描述样本的各个数值叫<strong>特征<\/strong>。<\/p>\n<p>网约车报价是个好例子。三十年前，价格由一张收费表决定：起步价、每公里、夜间加成，全是人写的。今天的平台把过去几亿笔订单的距离、时段、天气、供需和最终成交价喂给模型，让模型自己找「什么样的行程值多少钱」。没有人写「雨天晚高峰加价 23%」，但模型的行为里包含了它，而且更细。<\/p>\n<h3>概念 2：模型就是一台带旋钮的机器<\/h3>\n<p>模型可以想成一台机器：输入特征，输出预测。机器里有一组<strong>参数<\/strong>，也就是旋钮。学习就是找到一组让预测尽量准的旋钮位置。<\/p>\n<p>最简单的模型是一条直线：<\/p>\n<div class=\"katex-block\">\\hat y = w_1x_1 + w_2x_2 + \\cdots + w_nx_n + b<\/div>\n<p><span class=\"katex-inline\">x_i<\/span> 是特征，<span class=\"katex-inline\">w_i<\/span> 是权重，<span class=\"katex-inline\">b<\/span> 是偏置。房价预测里，<span class=\"katex-inline\">w_1<\/span> 可以理解成「每多一平米加多少钱」；网约车报价里，某个 <span class=\"katex-inline\">w<\/span> 可能对应「每多一公里加多少钱」。大模型有几千亿个这样的旋钮，但道理一样：它们都是训练出来的数，不是人规定的。<\/p>\n<h3>概念 3：损失函数与梯度下降<\/h3>\n<p>模型错了多少，要变成一个可计算的数，叫<strong>损失函数<\/strong>。回归任务常用平方误差：<\/p>\n<div class=\"katex-block\">L = \\frac{1}{n}\\sum_{i=1}^{n}(\\hat y_i - y_i)^2<\/div>\n<p><span class=\"katex-inline\">\\hat y_i<\/span> 是预测，<span class=\"katex-inline\">y_i<\/span> 是真实值。损失越小，模型在当前数据上越准。<\/p>\n<p>训练就是不断调参数让损失下降。最常用的方法是<strong>梯度下降<\/strong>：对每个参数算一个梯度，告诉你「把这个旋钮往哪边拧、损失会变大还是变小」，然后沿变小的方向走一小步。<\/p>\n<div class=\"katex-block\">w \\leftarrow w - \\eta \\nabla L(w)<\/div>\n<p><span class=\"katex-inline\">\\eta<\/span> 是学习率，决定步子多大。步子太小，训练慢；步子太大，可能跨过谷底，损失反而上升。把梯度的直觉想成蒙眼下山：你摸到脚下哪边更低，就往那边迈一步，反复走，最后到谷底。<\/p>\n<h3>概念 4：三种学习方式<\/h3>\n<ul><li>\n<strong>监督学习<\/strong>：数据带标签，学从特征到标签的映射。识别和预测主要靠它，瓶颈是标签昂贵。\n<\/li><li>\n<strong>无监督学习<\/strong>：没有标签，只找结构：聚类、异常检测、降维。它告诉你数据里有分野，不告诉你每群叫什么。\n<\/li><li>\n<strong>自监督学习<\/strong>：从数据自身造标签。遮住一个词让模型猜、截断一段文字让模型续写。不需要人工标注，所以能用整个互联网训练。这是大语言模型能出现的直接原因。\n<\/ul>\n<p>一个完整项目不只是「选个模型」。通常要走七步：定义任务、收集数据、构造特征、划分数据、训练、评估、部署与监控。其中「用什么模型」往往是最不重要的决定。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  A[历史数据] --&gt; B[特征 + 标签]\n  B --&gt; C[模型]\n  C --&gt; D[预测]\n  D --&gt; E[损失]\n  E --&gt; F[梯度]\n  F --&gt; C\n  C --&gt; G[新数据评估]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>这张图看训练闭环：数据进模型，预测和真实答案算损失，梯度把参数往回拧，循环很多次。右边的新数据评估才是真正的考试。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：调参数像调一台老式收音机的旋钮。你先听声音清不清楚（损失），再判断该往左还是往右拧（梯度），每次拧一点（学习率），反复几次就调到最清楚的频道。\n<\/li><li>\n<strong>实例<\/strong>：用一条直线预测房价：面积 60 平米、真实成交 300 万，模型当前预测 280 万，误差 20 万；损失对权重的梯度为正，说明增大权重会让损失更大，于是把权重往小的方向调一点。重复几千次，直线逐渐贴近数据。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 机器学习就是让机器自己发明规则——实际上 它学的是数据里的统计规律，不是人那样的因果理解。规律以参数形式存在，人读不懂但可以测试。\n<\/li><li>\n别以为 参数越多一定越好——实际上 参数多能表达更复杂的规律，也更容易过拟合、更贵。关键是在新数据上表现好。\n<\/li><li>\n别以为 训练就是背答案——实际上 训练数据上的好成绩不算数。真正的目标是泛化，第五章会讲。\n<\/li><li>\n别以为 无监督学习不需要数据——实际上 它需要大量数据，只是不需要人打标签。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n监督学习和无监督学习的核心区别是什么？（答案：监督学习的数据带标签，学从特征到标签的映射；无监督学习没有标签，只找数据里的结构。；解析：区别在有没有「正确答案」。）\n<\/li><li>\n模型参数和超参数有什么区别？（答案：参数由训练决定，如权重和偏置；超参数由人在训练前设定，如学习率、层数、训练轮数。；解析：日常说「调参」多指调超参数。）\n<\/li><li>\n梯度下降里的学习率太大或太小会怎样？（答案：太小学得慢；太大可能跨过谷底，损失震荡甚至发散。；解析：学习率决定每一步走多远。）\n<\/li><li>\n自监督学习为什么能利用整个互联网？（答案：标签从数据自身产生，比如遮词猜词、续写下一段，不需要人工标注。；解析：这绕开了标注瓶颈，是大模型出现的关键。）\n<\/li><li>\n为什么说「用什么模型」往往不是最重要的决定？（答案：任务定义、数据质量、特征、评估和监控通常更决定成败；模型只是其中一环。；解析：一个完整项目有七步，模型选择只是其中之一。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n机器学习 = 从带标签样本里学映射，而不是人写规则。\n<\/li><li>\n模型是带旋钮的机器，参数由训练决定。\n<\/li><li>\n梯度下降沿损失下降方向小步调整参数。\n<\/ul>", "kind": "chapter", "title": "第 4 章：规则不是写出来的，是学出来的"}, "ch05": {"html": "<div class=\"source-badge\">📖 出处：hello-ai.pdf · p.49–58<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch04\">第 4 章：规则不是写出来的，是学出来的<\/a><\/span><\/div><h1>第 5 章：真正的考试在训练集之外<\/h1>\n<blockquote>第二部 · 学习　·　一个模型在见过的数据上表现好，不说明任何事。这一章讲泛化、过拟合、评估和数据陷阱。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：第 4 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n能解释泛化、过拟合、欠拟合，以及训练集/验证集/测试集为什么要分开。\n<\/li><li>\n能在类别不平衡时正确使用准确率、精确率、召回率和混淆矩阵。\n<\/li><li>\n能识别标签泄漏、分布偏移，以及「相关不等于因果」的常见误判。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>训练成绩只证明模型会做旧题；泛化才证明它学会了规律。评估设计比模型选择更容易决定成败。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：泛化、过拟合、欠拟合<\/h3>\n<p>一个学生把去年期末卷连题带答案背得滚瓜烂熟，今年换了题一道不会。你不会说他学会了。机器学习每天在发生同样的事：模型在训练数据上表现好，只说明它见过答案。<\/p>\n<p><strong>泛化<\/strong>是模型在没见过的数据上表现稳定的能力。它是机器学习唯一真正的目标，损失、梯度、参数都服务于它。<\/p>\n<ul><li>\n<strong>过拟合<\/strong>：模型不但学了规律，还把训练数据里的噪声和巧合当成规律。训练表现很好，新数据上很差。模型越灵活、数据越少越容易发生。\n<\/li><li>\n<strong>欠拟合<\/strong>：模型太简单，连真实规律都抓不住，训练损失就降不下去。用一条直线拟合明显弯曲的关系，就是欠拟合。\n<\/ul>\n<p>对策不复杂：更多数据、限制模型复杂度、正则化、早停。过拟合和欠拟合是永恒的拉锯，没有一劳永逸的参数。<\/p>\n<h3>概念 2：三份数据，各管一件事<\/h3>\n<ul><li>\n<strong>训练集<\/strong>：用来学参数。\n<\/li><li>\n<strong>验证集<\/strong>：用来调超参数、决定什么时候停。\n<\/li><li>\n<strong>测试集<\/strong>：只在最后考一次，用来估计真实表现。\n<\/ul>\n<p>为什么要三份而不是两份？因为你会反复根据验证集调整模型，调得多了，验证集也会被间接「背下来」。测试集必须留到最后一刻，只考一次。有时间顺序的数据，比如销量、天气，必须用过去预测未来，不能随机打乱。<\/p>\n<h3>概念 3：准确率会骗人<\/h3>\n<p><strong>准确率<\/strong>是预测正确的比例，最常被引用，也最容易误导。假设 1000 个人里只有 10 个患病，一个「全部判为健康」的模型准确率是 99%，但它一个病人都没找出来。<\/p>\n<p>把结果按「预测是/否 × 实际是/否」分成四格，就是<strong>混淆矩阵<\/strong>：<\/p>\n<ul><li>\n真阳性：实际有病，预测有病。\n<\/li><li>\n假阳性：实际没病，预测有病，也就是误报。\n<\/li><li>\n假阴性：实际有病，预测没病，也就是漏报。\n<\/li><li>\n真阴性：实际没病，预测没病。\n<\/ul>\n<p>由此得到两个更有用的指标：<\/p>\n<div class=\"katex-block\">\\text{精确率}=\\frac{TP}{TP+FP},\\qquad \\text{召回率}=\\frac{TP}{TP+FN}<\/div>\n<p>精确率问「模型说有的里面，多少是真的」；召回率问「真的有病的里面，模型找出了多少」。两者此消彼长，取舍取决于误报和漏报哪个代价更大。这是价值判断，不是技术选择。<\/p>\n<h3>概念 4：数据里的三个陷阱<\/h3>\n<ul><li>\n<strong>标签泄漏<\/strong>：某个特征偷偷包含了答案。预测是否住院，特征里却有「是否开了住院单」；模型训练成绩近乎完美，因为它作弊了，而这个特征在真正预测时并不存在。\n<\/li><li>\n<strong>分布偏移<\/strong>：部署后的数据和训练数据不再来自同一个世界。疫情改变出行，新教材改变学情。所有模型都默认「未来像过去」，这没有保证。所以部署不是终点，监控才是。\n<\/li><li>\n<strong>相关不是因果<\/strong>：模型学到的全部是相关，什么与什么倾向于同时出现。相关足以预测，不足以干预。给每个孩子发平板，不会自动提高成绩；可能是家庭条件好的孩子既有平板又成绩好。要区分因果，需要实验设计和领域知识，不是更大的模型。\n<\/ul>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TB\n  D[全部数据] --&gt; T[训练集 学参数]\n  D --&gt; V[验证集 调超参]\n  D --&gt; S[测试集 最后考一次]\n  T --&gt; M[模型]\n  V --&gt; M\n  M --&gt; S\n  M --&gt; P[部署]\n  P --&gt; Q[监控分布是否偏移]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>数据先分三份，训练和验证反复循环，测试集只在最后打开。部署之后还有一条监控回路，因为真实世界会变。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：训练集是课后练习，验证集是模拟考，测试集是正式考试。你可以反复做练习、用模拟考调复习策略，但正式考试只能考一次；提前偷看正式卷，成绩就没有意义。\n<\/li><li>\n<strong>实例<\/strong>：垃圾邮件过滤：100 封邮件里 10 封是垃圾。模型把 8 封垃圾正确拦下（TP=8），误拦 2 封正常邮件（FP=2），漏掉 2 封垃圾（FN=2）。准确率 96/100=96%，但精确率 8/10=80%，召回率 8/10=80%。三个数字一起看，才知道它到底好不好用。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 训练准确率高就是好模型——实际上 训练集见过答案，准确率高可能只是背下来了。要看测试集和真实场景。\n<\/li><li>\n别以为 准确率越高模型越好——实际上 类别不平衡时准确率会被多数类绑架，必须拆开看精确率和召回率。\n<\/li><li>\n别以为 模型学到的是因果——实际上 模型学的是相关。要用它做干预决策，必须另做因果验证。\n<\/li><li>\n别以为 部署完就结束了——实际上 数据会漂移，模型会退化，必须持续监控和再训练。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n过拟合和欠拟合的区别是什么？（答案：过拟合是训练表现好、新数据差，学了噪声；欠拟合是训练损失都降不下去，模型太简单。；解析：两者是模型复杂度与数据量之间的拉锯。）\n<\/li><li>\n为什么测试集只能最后用一次？（答案：反复根据测试集调模型，会让模型间接适应测试集，测试成绩就不再代表真实泛化。；解析：验证集用来调，测试集用来最后考。）\n<\/li><li>\n患病率 1% 时，全判健康的模型准确率是多少？为什么不能用它？（答案：准确率约 99%，但召回率为 0，一个病人都没找出来。；解析：类别不平衡时准确率会骗人。）\n<\/li><li>\n精确率和召回率分别关心什么？（答案：精确率关心「说有里的多少是真的」，召回率关心「真的里的多少被找出」。；解析：取舍取决于误报和漏报的代价。）\n<\/li><li>\n什么是标签泄漏？（答案：某个特征包含了预测目标的信息，训练时成绩虚高，部署时这个特征却不存在或不可用。；解析：它往往很隐蔽，是评估中最常见的坑之一。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n训练成绩不算数，泛化才是目标。\n<\/li><li>\n数据分训练/验证/测试，测试只考一次。\n<\/li><li>\n类别不平衡看精确率、召回率和混淆矩阵。\n<\/ul>", "kind": "chapter", "title": "第 5 章：真正的考试在训练集之外"}, "ch06": {"html": "<div class=\"source-badge\">📖 出处：hello-ai.pdf · p.59–70<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch05\">第 5 章：真正的考试在训练集之外<\/a><\/span><\/div><h1>第 6 章：一层一层看出一只猫<\/h1>\n<blockquote>第二部 · 学习　·　神经网络不是大脑的复制品，而是一种能把「该看什么」也学出来的模型。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：第 4、5 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n能说清一个神经元做的四件事，以及为什么必须有非线性激活。\n<\/li><li>\n能解释卷积网络的局部连接、权重共享和池化为什么适合图像。\n<\/li><li>\n能说明「表示学习」与手工特征的区别，以及反向传播在训练中的角色。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>神经网络把许多简单的计算单元堆成多层，让低层学边缘、中层学部件、高层学物体；连「该看什么特征」也交给数据去决定。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：一个神经元做四件事<\/h3>\n<p>神经网络的基本单元叫<strong>神经元<\/strong>。它做的事只有四步：<\/p>\n<ol><li>\n接收一组输入 <span class=\"katex-inline\">x_1,\\dots,x_n<\/span>。\n<\/li><li>\n每个输入乘一个权重 <span class=\"katex-inline\">w_i<\/span>。\n<\/li><li>\n把所有乘积求和，再加一个偏置 <span class=\"katex-inline\">b<\/span>。\n<\/li><li>\n把结果送进一个非线性函数 <span class=\"katex-inline\">f<\/span>，得到输出。\n<\/ol>\n<p>写成一行：<\/p>\n<div class=\"katex-block\">y = f\\left(\\sum_i w_i x_i + b\\right)<\/div>\n<p>权重是「这个输入有多重要」，偏置是「整体门槛」。如果没有第 4 步的非线性，堆多少层都等价于一个线性变换，网络再深也学不会弯曲的关系。<strong>激活函数<\/strong>就是那个非线性开关，常见的有 ReLU：负数归零，正数照旧。<\/p>\n<p>一个神经元像一个微型探测器：它只对某种模式敏感，输入够强就「放电」。单独看很笨，连成网络才厉害。<\/p>\n<h3>概念 2：层、深度与反向传播<\/h3>\n<p>把并排的神经元放在一起，就是<strong>一层<\/strong>；层数叫<strong>深度<\/strong>。低层看局部、简单的东西，高层把低层的结果组合成更复杂的结构。<\/p>\n<p>训练时，网络先做一次<strong>前向传播<\/strong>：输入从第一层走到最后一层，得到预测。预测和真实答案算损失，然后<strong>反向传播<\/strong>把误差从最后一层往回传，用链式法则算出每个参数该往哪个方向调。一次反向传播能得到全部梯度，计算量只比前向多常数倍。没有它，深网络在算力上根本训不动。<\/p>\n<h3>概念 3：卷积网络为什么适合图像<\/h3>\n<p>一张图片有几百万个像素。如果每个神经元都和所有像素相连，参数会爆炸，而且图像被平移几个像素，网络就认不出来了。<\/p>\n<p><strong>卷积神经网络（CNN）<\/strong>用两个先验解决这个问题：<\/p>\n<ul><li>\n<strong>局部连接<\/strong>：每个神经元只看图像的一小块区域，先找边缘、角点这些局部模式。\n<\/li><li>\n<strong>权重共享<\/strong>：同一组权重在整张图上滑动，同一个「边缘探测器」扫过所有位置。猫在左上角还是右下角，用的是同一个探测器。\n<\/ul>\n<p>再配合<strong>池化<\/strong>，把相邻区域压缩成一个代表，逐层扩大视野。低层看到边缘，中层把边缘组成眼睛、耳朵，高层把部件组成猫。这个层级不是人设计的，是网络为了完成任务自己形成的。<\/p>\n<h3>概念 4：表示学习<\/h3>\n<p>传统机器学习需要专家手工设计特征：边缘、纹理、颜色直方图。深度学习最大的变化是<strong>表示学习<\/strong>：人只给像素和标签，网络自己发明「该看什么」。<\/p>\n<p>这带来一个通用性：同一套方法可以用于图像、语音、文本、蛋白质结构。它们都变成一串数字，网络从数字里学表示。参数从几万到上万亿，但训练的道理仍然是第四章的损失加梯度下降，只是规模大了。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  A[像素] --&gt; B[第一层 边缘]\n  B --&gt; C[第二层 纹理/角]\n  C --&gt; D[第三层 部件]\n  D --&gt; E[高层 物体]\n  E --&gt; F[猫/不是猫]\n  G[反向传播] -. 调参数 .-&gt; B\n  G -.-&gt; C\n  G -.-&gt; D\n  G -.-&gt; E<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>这张图看两件事：前向是从像素到物体的逐层抽象；反向传播把误差从输出往回分配，调整每一层的参数。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：认猫像拼乐高：先有最小的凸起（边缘），再把凸起拼成眼睛、耳朵（部件），最后拼成整只猫。没有人直接给「猫」的规则，只有一层层的零件。\n<\/li><li>\n<strong>实例<\/strong>：手写数字识别：第一层对笔画边缘敏感，第二层把边缘组合成圈和竖线，第三层把圈和竖线组合成 0、1、8 的形状。输入一张新写的 8，网络仍然认得出，因为它学的是部件组合，不是某个具体像素位置。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 神经网络是在模仿大脑——实际上 它只是借用了「很多简单单元连接」的灵感，内部机制和人脑并不一样。\n<\/li><li>\n别以为 层数越多一定越好——实际上 太深会梯度消失、过拟合、训练困难。深度要和数据量、残差连接、归一化一起考虑。\n<\/li><li>\n别以为 网络自己会解释它看到了什么——实际上 特征层级是事后观察到的现象，网络内部没有人类可读的规则。\n<\/li><li>\n别以为 卷积只能用于图像——实际上 一维卷积可用于语音、文本、时间序列；关键是「局部模式 + 权重共享」这个先验。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n一个神经元做哪四件事？（答案：接收输入、各乘权重、求和加偏置、通过非线性激活函数输出。；解析：没有非线性，多层网络仍然只是一个线性变换。）\n<\/li><li>\n为什么激活函数必须是非线性的？（答案：线性函数的复合仍然是线性函数，堆多少层都只能表达直线关系。；解析：非线性是网络能逼近复杂函数的前提。）\n<\/li><li>\n卷积网络的两个关键先验是什么？（答案：局部连接和权重共享。；解析：它们大幅减少参数，并让图像平移不影响识别。）\n<\/li><li>\n表示学习和手工特征的区别是什么？（答案：手工特征由专家设计；表示学习让网络自己从原始数据里学出该看什么。；解析：这是深度学习通用性的来源。）\n<\/li><li>\n反向传播一次能得到什么？（答案：损失对网络中每个参数的梯度。；解析：有了全部梯度，才能用梯度下降更新参数。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n神经元 = 加权求和 + 偏置 + 非线性。\n<\/li><li>\nCNN 靠局部连接、权重共享、池化逐层抽象。\n<\/li><li>\n表示学习把「该看什么」也交给数据。\n<\/ul>", "kind": "chapter", "title": "第 6 章：一层一层看出一只猫"}, "ch07": {"html": "<div class=\"source-badge\">📖 出处：hello-ai.pdf · p.71–78<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch06\">第 6 章：一层一层看出一只猫<\/a><\/span><\/div><h1>第 7 章：文字怎样变成数字<\/h1>\n<blockquote>第三部 · 语言　·　大语言模型从来没有见过一个「字」。它见到的是 token，处理的是向量。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：2 小时 ｜ <strong>前置<\/strong>：第 6 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n能解释语言模型是一个「下一个 token」的概率分布。\n<\/li><li>\n能说清分词、BPE、词表和上下文窗口怎样影响模型的行为与成本。\n<\/li><li>\n能理解词向量、嵌入和余弦相似度，以及它们为什么会继承语料偏见。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>文字先被切成 token，再变成向量；模型的一切「语言能力」都建立在这两步转换之上，很多怪行为也源于此。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：语言模型是一个概率分布<\/h3>\n<p><strong>语言模型<\/strong>的定义七十年没变：给定前面的文字，对「下一个词是什么」的每种可能给出概率。翻译、写作、问答，都可以化归为「最可能的续写」。<\/p>\n<p>这个定义听起来窄，实际上很宽。要预测「法国的首都是」后面是什么，模型必须记住地理；要预测一段代码的下一行，它必须理解语法和逻辑；要预测一个故事的结尾，它必须追踪几十页前埋的线索。预测下一个词，是所有语言任务的公分母。<\/p>\n<h3>概念 2：分词与 token<\/h3>\n<p>模型不直接读字。它先把文本切成<strong>token<\/strong>，也就是模型词表里的基本单元。常见词可能是一个 token，生僻词被拆成几个片段，任何字符最终都能拆到字节。<\/p>\n<p><strong>BPE（字节对编码）<\/strong>是最常用的分词方法：从单个字节开始，反复把语料里最常相邻出现的两个单元合并成新单元，进行几万到几十万次，得到词表。它在「词表小」和「单元有意义」之间取一个由数据决定的平衡，对新词适应力强。<\/p>\n<p>分词决定了模型的「视力」。问它「strawberry 里有几个 r」，很多模型会答错，因为它看到的是两三个编号，字母 r 不是一个独立存在的东西。中文还有成本问题：主流词表多在英文语料上构建，很多汉字要占两三个 token，同样一段话的中文版可能比英文版更贵。<\/p>\n<p><strong>上下文窗口<\/strong>是模型一次能看到的 token 上限，从几千到上百万。超出部分模型看不见；窗口内的中间部分也常比开头结尾受到更少注意。窗口不是记忆，对话结束后模型什么都不记得。<\/p>\n<h3>概念 3：词向量与嵌入<\/h3>\n<p>每个 token 对应一串数字，叫<strong>词向量<\/strong>，几百到几千维。这些数字由训练得到：用法相似的词，向量在空间里靠近；意义关系对应方向。经典的例子是：<\/p>\n<div class=\"katex-block\">\\text{国王} - \\text{男人} + \\text{女人} \\approx \\text{女王}<\/div>\n<p><strong>嵌入<\/strong>是更一般的说法：把离散对象（token、图片、用户、商品）映射到连续向量空间。语义搜索、推荐、检索增强生成、图文互搜，都建立在「把不同东西嵌入同一空间再比较」之上。<\/p>\n<p>比较两个向量最常用<strong>余弦相似度<\/strong>：看夹角的余弦，方向一致为 1，垂直为 0。它反映的是训练语料里的共现关系。语料里有偏见，向量就会忠实地编码偏见。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  A[今天天气真好] --&gt; B[分词]\n  B --&gt; C[今天 / 天气 / 真 / 好]\n  C --&gt; D[token 编号]\n  D --&gt; E[嵌入向量]\n  E --&gt; F[几十层 Transformer]\n  F --&gt; G[下一个 token 的概率分布]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>这张图看文字进入模型的第一步：不是直接理解句子，而是切成 token、查表变成向量，再送进网络。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：分词像把一句话拆成乐高积木。常见词是一块大积木，生僻词由几块小积木拼成。模型只认积木的编号，不认积木上写的字母。\n<\/li><li>\n<strong>实例<\/strong>：「strawberry」在词表里可能被切成 [straw, berry] 两三个 token。模型要数 r，就得从 token 编号间接推断字母，所以经常数错。这不是它笨，是它的输入粒度太粗。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 模型是一个字一个字读的——实际上 它读的是 token，一个 token 可能是一个词、一个片段，甚至几个字节。\n<\/li><li>\n别以为 上下文窗口就是模型记忆——实际上 窗口只是这次调用能看到的范围，对话结束就没了；真正的持久记忆要靠外部文件或数据库。\n<\/li><li>\n别以为 词向量是人工标注的——实际上 它是训练出来的，语义关系来自语料共现，因此会继承语料里的偏见。\n<\/li><li>\n别以为 中文和英文成本一样——实际上 分词器多在英文语料上构建，中文往往占更多 token，成本和速度都可能不同。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n语言模型的定义是什么？（答案：给定前面的文字，对下一个词（token）的每种可能给出概率。；解析：翻译、写作、问答都可化归为条件续写。）\n<\/li><li>\nBPE 的基本做法是什么？（答案：从单个字节开始，反复合并语料里最常相邻出现的两个单元，直到达到预定词表大小。；解析：它在词表大小和单元意义之间取平衡。）\n<\/li><li>\n为什么模型会数错 strawberry 里的 r？（答案：它看到的是 token 编号，字母不是独立单位，需要间接推断。；解析：分词粒度决定了它在拼写、数字母类任务上的弱点。）\n<\/li><li>\n上下文窗口是不是模型的长期记忆？（答案：不是。它只是一次调用能看到的 token 范围，对话结束后不保留。；解析：持久记忆需要外部存储。）\n<\/li><li>\n余弦相似度衡量什么？（答案：两个向量方向的一致性，1 表示同向，0 表示垂直。；解析：它支撑语义搜索、推荐和 RAG。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n语言模型 = 下一个 token 的概率分布。\n<\/li><li>\n分词决定模型看见什么，也决定中文成本。\n<\/li><li>\n词向量把语义变成几何，但会继承语料偏见。\n<\/ul>", "kind": "chapter", "title": "第 7 章：文字怎样变成数字"}, "ch08": {"html": "<div class=\"source-badge\">📖 出处：hello-ai.pdf · p.79–86<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch07\">第 7 章：文字怎样变成数字<\/a><\/span><\/div><h1>第 8 章：每个词都能看见其他词<\/h1>\n<blockquote>第三部 · 语言　·　注意力机制是整门课的心脏。这一章把 Transformer 拆开，看它怎样让一个词根据上下文改变含义。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：3–4 小时 ｜ <strong>前置<\/strong>：第 6、7 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n能用查询、键、值的比喻解释自注意力怎样让「苹果」偏向水果或公司。\n<\/li><li>\n能说清多头注意力和位置编码各自解决什么问题。\n<\/li><li>\n能解释自回归生成、温度采样，以及模型为什么没有全局计划。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>每个词发出查询、提供键和值，按相关度从所有词那里加权收集信息；一层层叠加，固定的词向量就变成了随上下文变化的表示。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：一个词回头看其他词<\/h3>\n<p>「我早上吃了一个苹果。」和「苹果昨晚发布了新手机。」里的「苹果」是同一个 token，进入模型时是同一个向量。但它在这两句里的意思不同。模型要让它根据上下文改变。<\/p>\n<p>想象一个班级，每个词是一个学生，坐成一排。轮到「苹果」发言，它做三件事：<\/p>\n<ol><li>\n发出一个<strong>查询（Query）<\/strong>：「谁能告诉我，我是水果还是公司？」\n<\/li><li>\n每个同学举着一张<strong>键（Key）<\/strong>，写着自己能回答什么：「吃」写着「我和食物有关」，「发布」写着「我和商业行为有关」。\n<\/li><li>\n每个同学还准备了一份<strong>值（Value）<\/strong>，是它愿意贡献的信息。\n<\/ol>\n<p>「苹果」拿自己的查询和每张键比对，算出相关度；把所有得分用 softmax 变成加起来等于 1 的权重；再按权重把所有同学的值加权求和。因为「吃」的权重大，新向量里混入了大量食物信息，苹果的表示就偏向了水果。<\/p>\n<p>每个词同时做这件事，每个位置都在看所有位置，这就是<strong>自注意力<\/strong>。一层之后，每个词吸收了上下文；再来一层，它吸收的是已经吸收过上下文的向量，关系越来越复杂。<\/p>\n<p>写成公式：<\/p>\n<div class=\"katex-block\">\\text{Attention}(Q,K,V)=\\text{softmax}\\left(\\frac{QK^\\top}{\\sqrt{d_k}}\\right)V<\/div>\n<p><span class=\"katex-inline\">Q,K,V<\/span> 是词向量经过三个可训练矩阵变换得到的。除以 <span class=\"katex-inline\">\\sqrt{d_k}<\/span> 是防止分数随维度膨胀，softmax 把分数变成权重。这里没有任何「语法规则」，语法关系是模型为了预测下一个词而逼出来的副产品。<\/p>\n<h3>概念 2：多头与位置<\/h3>\n<p>一组查询键值不够用。一个词和其他词的关系不止一种：语法、语义、指代、位置。Transformer 用多组，每组叫一个<strong>头<\/strong>，各自学习关注不同的东西，最后把各头输出拼起来。事后观察，确实有的头专看前一个词，有的专追踪代词。<\/p>\n<p>注意力本身对词序完全无感。「猫追狗」和「狗追猫」，每个词的查询、键、值都相同，结果也相同。<strong>位置编码<\/strong>在每个词向量里加入位置信息，把顺序塞回一个本身不在乎顺序的机制。<\/p>\n<p>一个 Transformer 模块是：自注意力 + 残差与归一化，前馈网络 + 残差与归一化。把模块复制几十份叠起来，前面接嵌入层，后面接输出层，就是 GPT、Llama、Qwen、DeepSeek、Claude 的共同骨架。<\/p>\n<h3>概念 3：一个 token 一个 token 地写<\/h3>\n<p>生成是<strong>自回归<\/strong>的：把提示词切成 token 送进模型，模型输出下一个 token 的概率分布；选一个接在后面，再把新序列送进去，得到再下一个分布；重复，直到选中「结束」标记。<\/p>\n<p>一段五百字的回答，意味着几百次完整的前向计算。你在界面上看到文字一个个蹦出来，不是打字动画，是它真的一个一个算。<\/p>\n<p>从分布里选词有几种策略：<\/p>\n<ul><li>\n<strong>贪心<\/strong>：永远选概率最大的，稳定但单调、容易重复。\n<\/li><li>\n<strong>采样<\/strong>：按概率随机抽，有变化，也可能抽到低概率的怪词。\n<\/li><li>\n<strong>温度<\/strong>：低温把分布压尖，接近贪心；高温把分布压平，更随机。写代码用低温，写诗用高温。\n<\/li><li>\n<strong>top-k / top-p<\/strong>：只在前 k 个或累积概率达到 p 的候选里抽，限制长尾怪词。\n<\/ul>\n<p>一个重要推论：模型没有「计划」。它不会先想好整段再写，而是每一步只决定下一个 token。回答的结构感来自训练语料里大量有结构的文本。这既是它能力的来源，也是第十章幻觉的根源：它每一步选的是「最像会出现在这里的词」，不是「最真实的词」。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  A[输入词向量] --&gt; B[Q 查询]\n  A --&gt; C[K 键]\n  A --&gt; D[V 值]\n  B --&gt; E[Q 与所有 K 打分]\n  E --&gt; F[softmax 权重]\n  F --&gt; G[按权重加权 V]\n  G --&gt; H[上下文表示]\n  H --&gt; I[下一层/下一个 token]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>这张图看注意力的数据流：同一个词向量变成 Q、K、V 三个角色，Q 和所有 K 打分，权重再用来混合所有 V。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像一场圆桌讨论。每个人先说出自己的问题（查询），再举牌说明自己懂什么（键），最后把自己掌握的资料（值）交出来。主持人按问题和牌的匹配程度分配发言权重，大家把听到的信息汇总成新的理解。\n<\/li><li>\n<strong>实例<\/strong>：「苹果发布了新手机」：苹果的查询与「发布」「手机」的键匹配度高，与「吃」匹配度低。加权求和后，苹果的向量混入商业、产品信息，下一层就能把它当作公司。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 注意力就是模型在「关注」人——实际上 它只是数学上的加权求和，不是人类意义上的注意，也没有统一的目标。\n<\/li><li>\n别以为 Transformer 天生懂词序——实际上 自注意力本身不在乎顺序，顺序靠位置编码补进去。\n<\/li><li>\n别以为 模型先想好整段再写——实际上 它每次只预测一个 token，没有内部计划；结构感来自训练分布。\n<\/li><li>\n别以为 温度越高模型越聪明——实际上 温度只改变随机性。高温更发散，不等于更准确。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n用查询、键、值解释模型怎样知道「苹果」指公司？（答案：苹果的查询与「发布」「手机」的键匹配度高，注意力权重大，加权后向量混入商业信息，表示偏向公司。；解析：相关度由查询和键的点积算出。）\n<\/li><li>\n注意力本身不在乎词序，模型怎么区分「猫追狗」和「狗追猫」？（答案：位置编码把每个词的位置信息加进向量，让不同位置的同一个词在进入注意力前就不同。；解析：位置编码把顺序塞回机制。）\n<\/li><li>\n多头注意力解决什么问题？（答案：让模型同时学习多种关系类型，如语法、指代、位置，而不是用一组权重勉强表达全部。；解析：各头关注不同模式，最后拼接。）\n<\/li><li>\n温度和贪心有什么区别？（答案：贪心每步选概率最大的 token；温度采样按调整后的概率随机抽，温度低接近贪心，温度高更随机。；解析：温度是随机性的旋钮。）\n<\/li><li>\n为什么说模型没有「计划」？（答案：它每步只根据当前上下文预测下一个 token，不会先生成完整草稿再输出。；解析：结构感是训练语料分布的副产品。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n自注意力 = 查询与键打分，softmax 加权，混合值。\n<\/li><li>\n多头管关系类型，位置编码管顺序。\n<\/li><li>\n生成是一个 token 一个 token 的自回归采样。\n<\/ul>", "kind": "chapter", "title": "第 8 章：每个词都能看见其他词"}, "ch09": {"html": "<div class=\"source-badge\">📖 出处：hello-ai.pdf · p.87–96<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch08\">第 8 章：每个词都能看见其他词<\/a><\/span><\/div><h1>第 9 章：从续写机到助手<\/h1>\n<blockquote>第三部 · 语言　·　一个只会预测下一个词的模型，怎样变成会回答问题、会拒绝、会先思考的助手？<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：第 7、8 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n能说出预训练、监督微调、对齐三个阶段各自的数据、任务和产物。\n<\/li><li>\n能解释 RLHF 与 DPO 的区别，以及「对齐不是装道德模块」。\n<\/li><li>\n能说明涌现、思维链、推理模型和混合专家各自解决什么问题。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>预训练教会模型语言和世界，监督微调教它对话的形式，对齐用人类偏好塑造它的取舍；三阶段之后，它仍然是一个概率分布。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：三个阶段<\/h3>\n<p>从随机初始化的参数到一个可用助手，中间经过三段训练。<\/p>\n<p><strong>① 预训练<\/strong>：在几万亿 token 的网页、书籍、论文、代码上预测下一个 token，用几万块 GPU 跑几个月。任务看起来平淡，却逼出了语言、知识和推理能力。产物叫<strong>基础模型<\/strong>：懂世界，但只会续写。你问它「什么是光合作用」，它可能续写出「什么是呼吸作用」，因为习题集里问题后面常跟着另一个问题。<\/p>\n<p><strong>② 监督微调（SFT）<\/strong>：给它看几万到几十万条高质量的「问题 + 回答」示范，教它对话的格式与风格。它改变的主要是形式，不是知识；数据质量远比数量重要，一万条精心写的对话胜过一百万条随便写的。<\/p>\n<p><strong>③ 对齐<\/strong>：不再给标准答案，而是给人对几个回答的排序。用这些偏好训练一个奖励模型，再用强化学习让语言模型生成得分更高的回答。目标是让模型更有帮助、更诚实、更无害。<\/p>\n<h3>概念 2：RLHF 与 DPO<\/h3>\n<p><strong>RLHF（从人类反馈中强化学习）<\/strong>是 ChatGPT 的关键技术。做法是：同一问题生成几个回答，请人排序；用排序训练奖励模型；再用强化学习让语言模型追求高分。<\/p>\n<p>它有效，但难做：要维护单独的奖励模型，强化学习不稳定，模型还会学会「讨好」奖励模型而不是真的变好。比如写得更长、更啰嗦、更爱用「当然可以！」开头，因为标注者曾经无意中偏爱这样的回答。这叫<strong>奖励破解<\/strong>。<\/p>\n<p><strong>DPO（直接偏好优化）<\/strong>绕开奖励模型和强化学习：把「回答 A 胜过 B」直接写成一个损失函数，用普通梯度下降优化。它更简单、稳定、便宜，成为开源社区的标准做法。<\/p>\n<p>需要记住：对齐不是给模型装一个道德模块，而是继续用数据塑造它的概率分布。它可以被推回去（越狱），也可能在训练数据没覆盖的角落表现异常。<\/p>\n<h3>概念 3：涌现、思维链、推理模型<\/h3>\n<p>模型规模跨过某个门槛后，某些能力会从「完全不会」跳到「突然会了」，比如三位数加法、多步推理、上下文学习。这叫<strong>涌现<\/strong>。它是否真是突变有争议：换一种连续评分，曲线可能只是平滑上升。但「大到某个程度后能做以前做不了的事」这个事实，是行业押注规模的理由。<\/p>\n<p>模型每次只预测一个 token，没有内部草稿纸。让它把中间步骤写出来，等于把草稿纸放进上下文，每一步都能看到前面的步骤。这叫<strong>思维链<\/strong>，在数学和逻辑题上显著提高准确率。<\/p>\n<p><strong>推理模型<\/strong>把这个技巧训练成默认习惯：用强化学习奖励「先写推理过程、答案正确」，模型回答前会自发生成几百到几万 token 的思考，试错、回退、验证。代价是慢和贵。它意味着能力可以靠推理时的算力购买。<\/p>\n<h3>概念 4：混合专家<\/h3>\n<p><strong>混合专家（MoE）<\/strong>把 Transformer 里的前馈网络换成几十个并列的「专家」，前面加一个路由器，每个 token 只挑其中两三个计算。总参数可以很大，每次激活的参数很小。<\/p>\n<p>于是「参数量」这个数字不再直观：一个总参数六千亿、激活参数三百七十亿的 MoE 模型，运行成本可能低于一个七百亿参数的稠密模型。看参数量时，要问是总参数还是激活参数。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  A[海量文本] --&gt; B[预训练 基础模型]\n  B --&gt; C[监督微调 对话格式]\n  C --&gt; D[对齐 人类偏好]\n  D --&gt; E[可用助手]\n  E --&gt; F[推理模型 先思考]\n  B --&gt; G[混合专家 稀疏激活]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>这张图看训练的三段楼梯：预训练最贵、微调最短、对齐最微妙。推理模型和 MoE 是建筑完成后的两种改造。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像培养一个实习生：先让他读几年书（预训练），再教他怎么写邮件、怎么开会（微调），最后让同事对他的回复排序，告诉他什么该做、什么不该做（对齐）。\n<\/li><li>\n<strong>实例<\/strong>：同一个问题「如何提高作文分数」，基础模型可能续写出「如何提高数学分数」；SFT 后它学会直接回答；对齐后它会拒绝代写，改为给修改建议。三个阶段改的是不同层面。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 对齐就是给模型装道德模块——实际上 它是继续训练概率分布，可以被越狱、也可能在边界外失效。\n<\/li><li>\n别以为 微调能教会模型新知识——实际上 微调主要改形式和风格，知识在预训练时已经进去；新知识更适合用检索或重新训练。\n<\/li><li>\n别以为 涌现一定是突然开窍——实际上 可能是评估指标造成的假象，也可能是真实的能力门槛；两种解释都成立一部分。\n<\/li><li>\n别以为 参数量越大运行越贵——实际上 MoE 看激活参数，总参数大不代表每次计算都用全部。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n预训练、SFT、对齐各解决什么问题？（答案：预训练学语言与世界；SFT 学对话格式；对齐按人类偏好调整取舍。；解析：三者数据分别是海量文本、示范对话、偏好排序。）\n<\/li><li>\n基础模型为什么可能反问另一个问题？（答案：它只学过续写，训练语料里问题后面常跟着另一个问题，所以它会续写出问题而不是回答。；解析：这就是需要 SFT 的原因。）\n<\/li><li>\nRLHF 和 DPO 的主要区别是什么？（答案：RLHF 训练奖励模型再用强化学习；DPO 直接把偏好对写成损失，用梯度下降优化。；解析：DPO 更简单稳定，但目标与 RLHF 相近。）\n<\/li><li>\n思维链为什么能提高准确率？（答案：模型没有内部草稿纸，把中间步骤写进上下文后，每一步都能看到前面的推理。；解析：推理模型把这种习惯训练成默认。）\n<\/li><li>\nMoE 的「总参数」和「激活参数」有什么区别？（答案：总参数是模型全部专家之和；激活参数是每个 token 实际用到的部分。运行成本按激活参数算。；解析：所以六千亿总参数的 MoE 可能比七百亿稠密模型更便宜。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n三阶段：预训练 → 监督微调 → 对齐。\n<\/li><li>\n对齐塑造概率分布，不是装道德模块。\n<\/li><li>\nMoE 总参数大、激活参数小。\n<\/ul>", "kind": "chapter", "title": "第 9 章：从续写机到助手"}, "ch10": {"html": "<div class=\"source-badge\">📖 出处：hello-ai.pdf · p.97–104<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch09\">第 9 章：从续写机到助手<\/a><\/span><\/div><h1>第 10 章：它为什么会一本正经地胡说<\/h1>\n<blockquote>第四部 · 世界　·　幻觉不是故障，而是「预测下一个词」这种工作方式的必然产物。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：2–3 小时 ｜ <strong>前置<\/strong>：第 8、9 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n能解释幻觉为什么是续写目标的自然结果，而不是偶发 bug。\n<\/li><li>\n能区分知识截止、检索增强、接地、校准四个概念。\n<\/li><li>\n能识别提示注入，并说出至少三种降低幻觉的办法。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>模型优化的是「像不像会出现在这里的词」，不是「真不真」；自信的语气和内容的可靠性没有关系。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：幻觉的根源<\/h3>\n<p>2023 年，一位律师向法庭提交了一份由聊天助手协助撰写的诉状，引用了六个判例。法官查证后发现，这六个案子一个都不存在：案名、编号、判词、法官姓名，全是模型编的，而且编得像模像样。<\/p>\n<p>从前面几章看，这件事不奇怪。模型每步选的是「最像会出现在这里的 token」，不是「最真实的 token」。训练目标里只有「像」没有「真」。当它没有相关知识时，最像的续写往往是一个格式正确、语气自信的虚构。<\/p>\n<p>幻觉在冷门话题、精确数字、引文、日期、人名、条款、剂量这些地方更多。不是模型「故意骗人」，而是它的工作方式没有事实核查这一环。<\/p>\n<h3>概念 2：知识截止与检索增强<\/h3>\n<p><strong>知识截止日期<\/strong>是预训练数据收集截止的时间。此后的事模型一无所知，但它不一定知道自己不知道，可能基于旧知识编一个合理回答。<\/p>\n<p><strong>检索增强生成（RAG）<\/strong>是对症的办法：回答前先用向量相似度从可信资料库找出相关段落，放进上下文，让模型基于材料回答。续写的依据从模糊的训练印象变成眼前的文本，编造空间大减。企业级问答、「把 AI 接到自己的知识库」都是它。<\/p>\n<p>RAG 不能完全消除幻觉。检索可能没找到、找到的是错的、模型可能误读材料。它只是把「凭记忆答」改成「看着材料答」，降低了犯错概率。<\/p>\n<p><strong>接地<\/strong>是更一般的要求：让模型的陈述有可追溯的依据，来自上下文、链接或工具返回结果。要求引用是最简单的接地手段。给不出依据的陈述，应当按未验证处理。<\/p>\n<h3>概念 3：校准与提示注入<\/h3>\n<p><strong>校准<\/strong>衡量模型表达的把握程度和实际正确率是否一致。基础模型的校准通常不错：它说「很可能」时，确实比较可能对。对齐之后校准常变差，因为标注者偏爱肯定的语气。于是「自信」不再对应「正确」。实用建议：把语气当噪声，把多次回答的一致性当信号。<\/p>\n<p><strong>提示注入<\/strong>是另一个问题。模型读取的外部内容——网页、邮件、文件、工具描述——里可能藏着给模型的指令。模型无法可靠区分「用户的指令」和「文件里的话」。聊天时代最坏结果是错误文字；智能体时代可能是泄露数据或执行危险操作。<\/p>\n<p>目前没有完美解法。工程上靠限制权限、隔离外部内容、关键操作人工确认。对普通用户，至少要知道：你让 AI 读的那个文件，本身可能带着指挥它的句子。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  Q[问题] --&gt; R[检索可信资料]\n  R --&gt; C[放进上下文]\n  C --&gt; M[模型生成]\n  M --&gt; G[接地检查]\n  G --&gt; A[带引用的回答]\n  X[外部文件里的指令] -. 提示注入 .-&gt; M<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>这张图看 RAG 的主路：先检索、再放进上下文、生成后做接地检查。虚线是提示注入，它从外部内容直接影响模型。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：闭卷考试靠记忆，容易编；开卷考试可以翻书，但书可能翻错页、看错行。RAG 是把闭卷改成开卷，不是把错误消灭。\n<\/li><li>\n<strong>实例<\/strong>：问「某公司 2025 年营收多少」：模型凭记忆答了一个精确到小数点的数字，但知识截止在 2024 年；改用 RAG 检索公司年报，回答里带上页码和链接，可信度立刻不同。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 幻觉是模型出故障了——实际上 它是续写目标的自然产物，只能压低，不能彻底消灭。\n<\/li><li>\n别以为 模型语气自信就说明它对——实际上 对齐后自信和正确常脱节，必须查关键事实。\n<\/li><li>\n别以为 接了知识库就不会幻觉——实际上 检索会漏、会错、会被误读；RAG 降低概率，不提供保证。\n<\/li><li>\n别以为 文件内容一定安全——实际上 外部文件可能藏提示注入，让模型执行不属于用户的指令。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n幻觉为什么是「必然产物」而不是偶发 bug？（答案：训练目标只奖励「像会出现的词」，没有事实核查环节；缺少知识时，最像的续写就是合理虚构。；解析：它优化的是像不像，不是真不真。）\n<\/li><li>\nRAG 的基本步骤是什么？（答案：把问题变成向量，从资料库检索相关段落，放进上下文，让模型基于材料回答。；解析：它把闭卷变成开卷，但不能完全消除幻觉。）\n<\/li><li>\n什么是接地？（答案：让陈述有可追溯的依据，比如上下文、链接或工具返回结果。；解析：要求引用是最简单的接地手段。）\n<\/li><li>\n校准变差会带来什么实际问题？（答案：模型的自信程度不再对应正确率，用户容易把语气当成可靠性。；解析：对齐后的模型尤其明显。）\n<\/li><li>\n提示注入是什么？（答案：外部内容里藏着给模型的指令，模型可能把它当成用户指令执行。；解析：智能体时代可能造成数据泄露或危险操作。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n幻觉源于「像」而不是「真」。\n<\/li><li>\nRAG 把闭卷变开卷，但不保证正确。\n<\/li><li>\n自信不等于正确，关键事实必须查。\n<\/ul>", "kind": "chapter", "title": "第 10 章：它为什么会一本正经地胡说"}, "ch11": {"html": "<div class=\"source-badge\">📖 出处：hello-ai.pdf · p.105–113<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch09\">第 9 章：从续写机到助手<\/a><\/span><\/div><h1>第 11 章：模型长出了眼睛和手<\/h1>\n<blockquote>第四部 · 世界　·　模型开始看图、听声、画画、说话，也开始自己调用工具、执行多步任务。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：第 8–10 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n能解释多模态模型「一切都是 token」的基本做法。\n<\/li><li>\n能说清扩散模型怎样从噪声生成图像，以及语音克隆带来的身份风险。\n<\/li><li>\n能描述智能体的目标—工具—循环结构，并说出三条安全约束。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>多模态把图像、音频也变成 token；工具调用把模型从「会说」变成「会做」；一旦会做，权限和验证就成了主角。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：多模态：一切都是 token<\/h3>\n<p>前面几章的模型只处理 token 序列。但今天的助手可以看你拍的试卷照片、听你说话、根据描述画图、用自然的声音回答。这些能力没有推翻前面的原理，而是把同一种机制推向新的输入。<\/p>\n<p>基本做法是<strong>把一切变成 token<\/strong>：图像切成小方块（patch），每个方块变成一个向量；音频切成时间片，每片变成向量；文字本来就是 token。它们进入同一个 Transformer，靠注意力互相对齐。<strong>原生多模态<\/strong>从预训练起就同时学多种输入，比「先转成文字描述再处理」的外挂式保留更多信息，比如图表里的空间关系、语气里的情绪。<\/p>\n<h3>概念 2：扩散模型与语音合成<\/h3>\n<p><strong>扩散模型<\/strong>是今天图像和视频生成的主流。训练时给清晰图逐步加噪声，让网络学会「从更噪的图像恢复更清晰的一步」；生成时从纯噪声出发，反复应用几十次，图像从噪声中显影。文字提示通过注意力引导去噪方向。<\/p>\n<p>它不是「从数据库里拼贴」，而是在噪声里一步步雕刻出一个符合提示的新图像。这也解释了为什么生成图可能细节出错：它优化的是「看起来像」，不是「物理上正确」。<\/p>\n<p><strong>语音合成（TTS）<\/strong>从文字生成语音。近年越来越多地直接用语言模型预测「声音的 token」，能带情感、停顿和口音。几秒钟的样本就足以克隆一个人的声音。这意味着声音不能再作为身份证明，接到「家人声音」的转账电话也要先核实。<\/p>\n<h3>概念 3：工具调用与智能体<\/h3>\n<p><strong>工具调用<\/strong>是让模型「长出手」的关键。约定某些特殊格式的输出不是给人看的，而是触发程序去执行：搜索、计算、查数据库、操作文件。结果贴回上下文，模型继续推理。这项能力在微调和对齐阶段被训练进模型。<\/p>\n<p>把模型放进一个循环，就得到<strong>智能体<\/strong>：<\/p>\n<ol><li>\n给它目标和工具。\n<\/li><li>\n模型思考，决定下一步。\n<\/li><li>\n调用工具，程序执行。\n<\/li><li>\n看结果，继续、修正或完成。\n<\/li><li>\n不可逆的一步停下来，等人确认。\n<\/ol>\n<p><strong>MCP（模型上下文协议）<\/strong>让工具用统一格式描述自己能做什么、需要什么参数，任何支持协议的客户端都能接入，像 USB 接口之于硬件。<\/p>\n<p>智能体最先在编程领域成熟，因为代码可编译、可测试、反馈清晰自动。反馈越清晰的领域，智能体成熟得越快；反过来，反馈模糊、后果不可逆的领域，必须慢。<\/p>\n<h3>概念 4：安全带<\/h3>\n<p>智能体会执行有后果的行动，所以需要三道约束：<\/p>\n<ul><li>\n<strong>最小权限<\/strong>：只给完成当前任务必需的权限，能读就不给写，能沙盒就不碰真实系统。\n<\/li><li>\n<strong>隔离与沙盒<\/strong>：在受限的文件系统、网络和权限里执行，即使被提示注入或犯错，损害也被圈住。\n<\/li><li>\n<strong>人在回路<\/strong>：可逆的自动做，不可逆的先问。部署、删除、转账、发送这类操作，必须由人批准。\n<\/ul>\n<p>这三条不是技术细节，而是「AI 不承担责任」在流程上的体现。每件由 AI 参与的事，最后要有一个人为它负责。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  A[文字/图像/音频] --&gt; B[切成 token]\n  B --&gt; C[同一个 Transformer]\n  C --&gt; D[回答/图像/语音]\n  C --&gt; E[工具调用]\n  E --&gt; F[程序执行]\n  F --&gt; G[结果回贴]\n  G --&gt; C\n  C --&gt; H[不可逆操作 → 人确认]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>这张图看两条路：一条把多模态输入变成 token 再生成；另一条把模型输出接到工具，形成行动循环。循环最后有一道人确认的闸门。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：模型本来是一个只会说话的参谋。工具调用给它配了手和工具箱，智能体循环让它能连续干活。但手能干活也能闯祸，所以必须配权限、沙盒和审批。\n<\/li><li>\n<strong>实例<\/strong>：让智能体「把网站加上深色模式并部署」：它读代码、改文件、跑测试、截图验证，这些可逆操作自动做；最后部署是不可逆的，停下来等人点确认。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 多模态就是给模型加一个图片插件——实际上 原生多模态从预训练就一起学，能把图像、文字、声音放在同一空间里对齐。\n<\/li><li>\n别以为 扩散模型是在网上搜图拼贴——实际上 它是从噪声逐步去噪生成新图，训练目标是恢复清晰图，不是检索。\n<\/li><li>\n别以为 智能体就是会聊天的模型——实际上 智能体有目标、工具、循环和权限，它会执行有后果的行动。\n<\/li><li>\n别以为 给智能体更多权限效率更高——实际上 权限越多，提示注入和误操作的损害越大。最小权限是安全带。\n<\/li><li>\n别以为 声音克隆只是娱乐——实际上 几秒样本就能复制声音，声音不能再单独作为身份凭证。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n多模态模型怎样处理一张图片？（答案：把图片切成小方块，每块变成一个向量（token），再和文字 token 一起送进 Transformer。；解析：核心是「一切都是 token」。）\n<\/li><li>\n扩散模型生成图像的基本过程是什么？（答案：从纯噪声出发，反复应用学到的去噪步骤，在文字提示引导下逐步生成清晰图像。；解析：训练时学的是从加噪图恢复清晰图。）\n<\/li><li>\n工具调用怎样让模型「长出手」？（答案：模型输出特殊格式的调用请求，程序执行搜索、计算、写文件等操作，结果回贴上下文继续推理。；解析：它把语言输出变成真实行动。）\n<\/li><li>\n智能体循环的五个基本环节是什么？（答案：目标与工具、模型思考、调用工具、看结果继续/修正、不可逆操作等人确认。；解析：循环直到完成或被叫停。）\n<\/li><li>\n智能体的三条安全约束是什么？（答案：最小权限、隔离/沙盒、人在回路。；解析：它们对应「AI 不承担责任」的流程设计。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n多模态 = 图像/音频也变成 token。\n<\/li><li>\n扩散模型从噪声逐步去噪生成。\n<\/li><li>\n智能体 = 模型 + 工具 + 循环 + 权限。\n<\/ul>", "kind": "chapter", "title": "第 11 章：模型长出了眼睛和手"}, "ch12": {"html": "<div class=\"source-badge\">📖 出处：hello-ai.pdf · p.114–129<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch11\">第 11 章：模型长出了眼睛和手<\/a><\/span><\/div><h1>第 12 章：智能体的一天<\/h1>\n<blockquote>第四部 · 世界　·　一个任务进去之后，智能体到底做了什么？拆开驾具，里面没有魔法，只有一个循环、一堆规矩和很多工程。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：4 小时 ｜ <strong>前置<\/strong>：第 11 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n能按顺序说出智能体循环的八个环节。\n<\/li><li>\n能区分模型做的部分和驾具做的部分。\n<\/li><li>\n能说出至少五种智能体失败模式，并对应到权限、指令或验证设计。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>智能体的可靠性一大半不在模型，而在驾具：上下文怎么组装、工具怎么执行、权限怎么限制、结果怎么验证。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：驾具是什么<\/h3>\n<p>围绕模型的一整套程序叫<strong>驾具（harness）<\/strong>。模型是马，驾具让力气变成前进。它负责组装上下文、解析并执行工具调用、管理权限、压缩上下文、维护记忆、派出子智能体、验证与交付。<\/p>\n<p>你敲一句「把这个网站加上深色模式，然后部署」，二十分钟后回来，网站改好了、上线了，屏幕上是改动清单和说明。这二十分钟里，模型只负责「想下一步做什么」；读文件、改代码、跑测试、截图、提交，都是驾具在执行。<\/p>\n<h3>概念 2：一圈一圈地转<\/h3>\n<p>一个典型的智能体循环有八个环节：<\/p>\n<ol><li>\n<strong>组装上下文<\/strong>：系统提示、项目指令文件、工具说明、记忆、你的任务，拼成这次调用的输入。\n<\/li><li>\n<strong>调用模型<\/strong>：模型读上下文，决定下一步。\n<\/li><li>\n<strong>检查权限<\/strong>：自动放行、白名单、问人、禁止，四种策略。\n<\/li><li>\n<strong>执行工具<\/strong>：读、搜、改、跑、截图。\n<\/li><li>\n<strong>压缩上下文<\/strong>：窗口快满时，让模型按固定结构总结历史，替换原文。\n<\/li><li>\n<strong>派子智能体<\/strong>：要读很多文件时，派一个带独立上下文的分身，只把结论交回。\n<\/li><li>\n<strong>验证<\/strong>：跑测试、看截图、检查输出，不只看模型说「完成了」。\n<\/li><li>\n<strong>交付<\/strong>：改动清单、说明，也许一个提交；不可逆的一步停下来问你。\n<\/ol>\n<p>一个二十分钟的编程任务可能转一百多圈。每一圈都把整段历史重新送进模型，键值缓存让这不至于太贵。<\/p>\n<h3>概念 3：驾具里的零件<\/h3>\n<ul><li>\n<strong>系统提示<\/strong>：写给模型的总说明：身份、规则、工作方式、工具说明、安全边界、环境信息。2026 年的编程智能体系统提示可达几万 token。\n<\/li><li>\n<strong>指令文件<\/strong>：项目或个人写给智能体的文本，如 <code>CLAUDE.md<\/code>、<code>AGENTS.md<\/code>。它告诉通用模型这个项目怎么跑、怎么测、什么不能碰。\n<\/li><li>\n<strong>权限策略<\/strong>：哪些动作自动放行、哪些按白名单、哪些每次要人点头、哪些禁止。读通常自动，写和执行按策略，不可逆操作要问。\n<\/li><li>\n<strong>上下文压缩<\/strong>：长任务中窗口将满时，把历史按「原始要求、已完成、进行中、问题、计划、涉及文件」总结后替换。做得差会失忆。\n<\/li><li>\n<strong>子智能体<\/strong>：带明确任务和独立上下文出发，读完大量材料只交回结论。用于并行和隔离细节。\n<\/li><li>\n<strong>技能<\/strong>：把「怎样做一件事」写成带步骤、注意事项和示例的文本，需要时读进上下文。没有代码、不用训练，靠上下文学习起效。\n<\/li><li>\n<strong>钩子<\/strong>：在工具调用前后、改文件后自动运行的脚本，由驾具触发，不经模型判断。用确定性代码约束模型，比如自动跑格式检查、禁止写入某些目录。\n<\/li><li>\n<strong>MCP<\/strong>：统一的工具描述与调用协议，让任何工具接任何模型。\n<\/ul>\n<h3>概念 4：它怎样失败<\/h3>\n<p>智能体的失败模式很少来自「模型不够聪明」，多数对应驾具设计：<\/p>\n<ul><li>\n说做完了，其实没做完 → 验证不足。\n<\/li><li>\n为通过测试而改测试 → 目标错位，需要独立验收。\n<\/li><li>\n越界读写、部署 → 权限过大。\n<\/li><li>\n原地循环、反复试错 → 缺少进度检查和停止条件。\n<\/li><li>\n被文件里的话指挥 → 提示注入，外部内容没有隔离。\n<\/li><li>\n压缩后失忆 → 摘要结构不好，关键状态没落到外部文件。\n<\/li><li>\n成本失控 → 没有轮数、时间或费用上限。\n<\/ul>\n<p>对应的修法都在驾具：更细的权限、更明确的指令、独立的验证、外部状态文件、预算上限。先把一个智能体用好，再考虑多智能体；协调有成本，错误会累积，同样的盲点互审等于没审。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TB\n  A[组装上下文] --&gt; B[调用模型]\n  B --&gt; C{权限检查}\n  C -- 自动 --&gt; D[执行工具]\n  C -- 需批准 --&gt; H[人确认]\n  H --&gt; D\n  D --&gt; E{窗口快满?}\n  E -- 是 --&gt; F[压缩上下文]\n  E -- 否 --&gt; G{任务完成?}\n  F --&gt; G\n  G -- 否 --&gt; B\n  G -- 是 --&gt; I[验证]\n  I --&gt; J[交付]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>这张图看智能体的主循环：上下文进模型，模型决定工具，权限闸门放行或拦下，结果回贴，直到验证通过才交付。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像一家小作坊：模型是师傅，驾具是店长、工具间、门禁和质检。师傅决定下一步做什么，店长负责给材料、开权限、验成品。作坊可靠不可靠，很大程度看店长。\n<\/li><li>\n<strong>实例<\/strong>：修一个 bug：智能体先读报错和相关文件（读，自动放行），改代码（写，按白名单），跑测试（执行，自动），发现测试失败后回退再改；最后提交（不可逆，问人）。每一步都有记录，失败能追溯。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 智能体靠模型聪明就够了——实际上 长任务的可靠性更多来自驾具：上下文、权限、验证、压缩。\n<\/li><li>\n别以为 让智能体读所有文件更好——实际上 上下文会被撑满，关键信息被稀释；应该按需读、派子智能体、把状态写进文件。\n<\/li><li>\n别以为 智能体说完成了就是完成了——实际上 必须独立验证：跑测试、看输出、检查改动，不能只信模型的自我报告。\n<\/li><li>\n别以为 多智能体一定比一个强——实际上 协调有成本，错误会累积；先把单智能体用好。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n驾具是什么？它负责哪些事？（答案：围绕模型的整套程序，负责组装上下文、执行工具、管理权限、压缩上下文、维护记忆、派子智能体、验证与交付。；解析：模型只负责决定下一步，驾具负责让行动发生并受控。）\n<\/li><li>\n智能体循环的基本顺序是什么？（答案：组装上下文 → 调用模型 → 检查权限 → 执行工具 → 压缩/派分身（按需）→ 验证 → 交付，未完成则回到模型。；解析：一个任务可能转很多圈。）\n<\/li><li>\n系统提示和指令文件有什么区别？（答案：系统提示由驾具写给模型，包含身份、规则、工具和安全边界；指令文件是项目或个人写的项目说明，如 CLAUDE.md。；解析：两者都在每次任务开始时进入上下文。）\n<\/li><li>\n为什么智能体会「说做完了其实没做完」？（答案：它只根据上下文判断，缺少独立验证；驾具必须跑测试、看输出、检查改动。；解析：这是验证设计问题，不是模型智力问题。）\n<\/li><li>\n提示注入对智能体的危险为什么更大？（答案：智能体会执行工具，注入可能让它泄露数据、删文件或部署；聊天时代最多是错误文字。；解析：所以需要隔离外部内容、最小权限和人工确认。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n驾具 = 模型外面的整套工程。\n<\/li><li>\n循环八步：上下文、模型、权限、工具、压缩、分身、验证、交付。\n<\/li><li>\n失败模式大多能靠权限、指令、验证修。\n<\/ul>", "kind": "chapter", "title": "第 12 章：智能体的一天"}, "ch13": {"html": "<div class=\"source-badge\">📖 出处：hello-ai.pdf · p.130–141<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch09\">第 9 章：从续写机到助手<\/a><\/span><\/div><h1>第 13 章：AI 做科学：从 AlphaFold 说起<\/h1>\n<blockquote>第四部 · 世界　·　一个困扰生物学五十年的问题被神经网络在两年内解决大半，然后同样的事在气象、材料、数学上接连发生。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：第 6、8、10 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n能解释 AlphaFold 把蛋白质结构预测变成什么类型的机器学习问题。\n<\/li><li>\n能说出 AI 在科学里最容易成功的三个条件。\n<\/li><li>\n能区分「预测结构」与「理解机制」，以及校准在科研使用中的意义。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>AI 做科学最顺的场景，是数据多、目标明确、答案能被实验检验的预测任务；它加速发现，但不自动提供因果解释。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：AlphaFold 做了什么<\/h3>\n<p>蛋白质由一串氨基酸组成，这串序列会折叠成三维结构。结构决定功能，所以知道结构是理解疾病、设计药物的前提。实验测定结构很贵、很慢，生物学家攻了五十年。<\/p>\n<p>2020 年，DeepMind 的 AlphaFold 在蛋白质结构预测竞赛中，大多数题目给出与实验几乎一致的答案。它把问题变成：<strong>输入氨基酸序列，预测每个原子的三维坐标<\/strong>。这是一个监督学习任务，训练数据是已知的蛋白质结构。<\/p>\n<p>它的网络大量使用注意力机制：先把序列里相距很远的位置互相对齐，再从多个同源序列的比对中提取进化信息，最后输出原子之间的距离和角度。它还能给出每个残基的置信度，告诉使用者哪里可信、哪里不确定。<strong>校准<\/strong>在这里非常关键：科研使用不是只要一个结构，还要知道这个结构有多可靠。<\/p>\n<h3>概念 2：它改变了什么，没改变什么<\/h3>\n<p>改变的是速度。过去一个结构要博士生做几年实验，现在几分钟能算出来，而且能批量预测几乎全部已知蛋白质。药物研发、酶设计、基础生物学都因此加速。<\/p>\n<p>没有改变的是：它预测的是<strong>静态结构<\/strong>，不是蛋白质在细胞里的动态、它和别的分子怎么结合、它在不同条件下的构象变化。它给的是「可能长什么样」，不是「为什么这样折叠、在生命过程里起什么作用」。结构预测是理解的入口，不是理解的终点。<\/p>\n<h3>概念 3：AI 做科学的三个条件<\/h3>\n<p>从 AlphaFold、气象预报、材料筛选、数学定理证明这些案例里，可以提炼出三个更容易成功的条件：<\/p>\n<ul><li>\n<strong>大量结构化数据<\/strong>：蛋白质序列和结构、气象观测、材料计算数据。没有足够多的好数据，再强的网络也学不到规律。\n<\/li><li>\n<strong>明确的预测目标<\/strong>：预测下一个原子坐标、预测未来天气、预测材料性质。目标能写成损失函数。\n<\/li><li>\n<strong>能检验答案的办法<\/strong>：实验、观测、形式证明。反馈越清晰，迭代越快。\n<\/ul>\n<p>反过来说，数据稀少、目标模糊、答案没有共识的领域，AI 更容易变成噱头。它可以帮你读文献、提假设、做初筛，但不能替代领域判断和实验验证。<\/p>\n<h3>概念 4：科研使用者的姿势<\/h3>\n<p>一个不做 AI 的研究者，不需要从训练模型开始。更实际的路径是：<\/p>\n<ol><li>\n先问清问题：你要预测什么，错了代价是什么。\n<\/li><li>\n找一个傻基线：均值、线性模型、一棵树，先知道「多好算好」。\n<\/li><li>\n数据少时优先树模型或预训练模型，不要一上来就深网络。\n<\/li><li>\n用校准和不确定性决定「哪些预测值得做实验」。\n<\/li><li>\n把 AI 放进实验闭环，而不是当一次性预言机。\n<\/ol>\n<p>AI 在科学里最强的位置，是<strong>缩小搜索空间<\/strong>：从几万种候选里挑出几十个值得做的实验。它不替你做判断，但能把实验次数降一个数量级。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  A[氨基酸序列] --&gt; B[多序列比对]\n  B --&gt; C[注意力网络]\n  C --&gt; D[原子坐标]\n  D --&gt; E[置信度]\n  E --&gt; F[实验验证]\n  F --&gt; G[结构/功能理解]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>这张图看 AlphaFold 的输入输出：序列进网络，出坐标和置信度；真正的科学理解还要经过实验验证。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像用 GPS 预测一条山路的形状：它能给你高精度的三维路线，但不知道这条路为什么这么修、雨季会不会塌方。地图有用，不等于地质学。\n<\/li><li>\n<strong>实例<\/strong>：药物研发：靶点蛋白结构未知，先用 AlphaFold 预测，再用置信度挑出可信区域，拿去做分子对接筛选；命中候选再进实验。计算把候选从百万级降到几十个，实验只做最值得做的。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 AlphaFold 解决了蛋白质折叠的全部问题——实际上 它主要解决静态单体结构预测；复合物、动态构象、功能机制仍需实验和其他方法。\n<\/li><li>\n别以为 AI 做科学就是让 AI 自己发现规律——实际上 多数成功案例是加速预测和筛选，因果解释仍靠领域理论和实验。\n<\/li><li>\n别以为 预测准确率高就可以直接下结论——实际上 还要看校准、分布偏移和适用范围；科研使用必须知道哪里不确定。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\nAlphaFold 把蛋白质结构预测变成了什么类型的任务？（答案：监督学习：输入氨基酸序列，预测每个原子的三维坐标，训练数据是已知结构。；解析：目标明确、数据大量、答案可实验检验。）\n<\/li><li>\nAlphaFold 的输出为什么需要置信度？（答案：科研使用要知道哪里可信、哪里不确定；校准让使用者能决定哪些预测值得做实验。；解析：一个坐标数字没有不确定性就没有科研价值。）\n<\/li><li>\nAI 做科学最容易成功的三个条件是什么？（答案：大量结构化数据、明确的预测目标、能检验答案的办法。；解析：三者缺一，AI 更容易变成噱头。）\n<\/li><li>\nAlphaFold 没有解决什么？（答案：蛋白质的动态构象、与其它分子的结合、功能机制，以及「为什么这样折叠」。；解析：它预测静态结构，不自动提供因果理解。）\n<\/li><li>\n科研使用者应该把 AI 放在什么位置？（答案：放在实验闭环里，用来缩小搜索空间、挑值得做的实验，而不是当一次性预言机。；解析：AI 加速筛选，判断仍由人做。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nAlphaFold = 序列到结构的监督学习。\n<\/li><li>\nAI 做科学三条件：数据、目标、可检验。\n<\/li><li>\n预测结构不等于理解机制。\n<\/ul>", "kind": "chapter", "title": "第 13 章：AI 做科学：从 AlphaFold 说起"}, "ch14": {"html": "<div class=\"source-badge\">📖 出处：hello-ai.pdf · p.142–150<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch12\">第 12 章：智能体的一天<\/a><\/span><\/div><h1>第 14 章：与 AI 共事<\/h1>\n<blockquote>第四部 · 世界　·　前十三章讲它是什么。最后一章讲你该怎么办：怎样提问，怎样分工，怎样验证，怎样保护自己和别人。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：2–3 小时 ｜ <strong>前置<\/strong>：全书\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n能写出包含任务、对象、标准、例子和输出格式的提示词。\n<\/li><li>\n能判断哪些工作交给 AI、哪些必须自己保留，并建立验证习惯。\n<\/li><li>\n能说出数据最小化、人在回路和 AI 素养在真实场景里的做法。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>AI 产出很便宜，判断很稀缺；把任务、标准、例子说清，把关键事实查清，把最终责任留给人。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：提示词是在塑造分布<\/h3>\n<p>你给模型的全部文字，就是它的上下文，决定了续写的方向。<strong>提示词<\/strong>不是咒语，而是在用文字塑造一个概率分布的形状。<\/p>\n<p>一条好提示通常包含五件事：<\/p>\n<ol><li>\n<strong>任务<\/strong>：要它做什么，用动词说清。\n<\/li><li>\n<strong>对象<\/strong>：给谁看、基于什么材料。\n<\/li><li>\n<strong>标准<\/strong>：什么算好，长度、语气、必须包含/不能包含什么。\n<\/li><li>\n<strong>例子<\/strong>：给一两个输入输出示例，比形容词有效。\n<\/li><li>\n<strong>输出格式<\/strong>：列表、表格、JSON、多少字。\n<\/ol>\n<p>复杂任务让它先想再做：「先列出解题步骤，再给答案。」这不是玄学，是第八章讲的思维链：把草稿纸放进上下文。<\/p>\n<h3>概念 2：怎样分工<\/h3>\n<p>AI 擅长有大量先例、结果可检查、错了可改的任务：初稿、翻译、润色、总结、提取、分类、代码补全、格式转换。<\/p>\n<p>它不擅长，也不该独自承担：<\/p>\n<ul><li>\n<strong>决定目标和标准<\/strong>：做什么、什么算成功，是人的价值判断。\n<\/li><li>\n<strong>核对关键事实<\/strong>：数字、日期、引文、人名、条款、剂量，必须查原始来源。\n<\/li><li>\n<strong>对一个具体的人的判断<\/strong>：这个孩子为什么不想上学，这位病人该怎么安抚。\n<\/li><li>\n<strong>承担后果的决定<\/strong>：签字、宣判、开除、转账、部署。\n<\/ul>\n<p>一个实用的分工是「它的广度 + 你的深度」：让它快速铺开候选、找资料、写初稿；你负责选方向、挖细节、做判断、担责任。<\/p>\n<h3>概念 3：验证习惯<\/h3>\n<p>与模型共事有三个习惯：<\/p>\n<ul><li>\n<strong>关键事实必查<\/strong>：不查不用在最终产出里。\n<\/li><li>\n<strong>不懂的领域不用它做最终判断<\/strong>：它可以帮你入门，不能替专家签字。\n<\/li><li>\n<strong>要求它给出依据<\/strong>：来源、链接、页码、推理步骤；给不出就按未验证处理。\n<\/ul>\n<p>这不是不信任，而是由它的工作方式推出的必然。它优化「像」，不优化「真」；它的自信和正确没有稳定关系。<\/p>\n<h3>概念 4：保护自己与别人<\/h3>\n<p><strong>数据最小化<\/strong>：交给 AI 服务前，只提供任务需要的部分，能匿名先匿名。条款不明的服务，不交学生作业、病历、内部文件。给智能体权限也一样：只给必需的，因为每项权限都是提示注入可利用的通道。<\/p>\n<p><strong>人在回路<\/strong>：AI 的输出被采纳、行动被执行之前，由人审核或批准。聊天时代是核对输出，智能体时代是批准行动。<\/p>\n<p><strong>AI 素养<\/strong>不是「学提示词」或「学编程」，而是三种在 AI 之前就重要、现在更显眼的能力：提出好问题、判断产出的好坏与真假、愿意并能够为 AI 参与的事负责。<\/p>\n<p>如果你是教师，课堂里最该教的不是工具操作，而是边界：哪些作业可以用 AI，哪些必须自己思考；怎样要求引用；怎样识别「像而不对」。你不需要成为 AI 专家，但你需要成为判断的专家。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  A[任务] --&gt; B[写清任务/对象/标准/例子/格式]\n  B --&gt; C[AI 产出初稿]\n  C --&gt; D{关键事实?}\n  D -- 是 --&gt; E[查原始来源]\n  D -- 否 --&gt; F[人工判断]\n  E --&gt; F\n  F --&gt; G[人签字/交付]\n  G --&gt; H[记录责任]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>这张图看人机分工：AI 负责铺开和起草，人负责定标准、查事实、做判断、签字。责任永远落在最后那个人。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像带一个能力很强但不知道边界的实习生。你可以让他查资料、写初稿、做表格，但对外发送前你要核对，签字的是你。\n<\/li><li>\n<strong>实例<\/strong>：写一份家长通知：让 AI 根据校历和政策起草三个版本，你选定语气；核对日期、政策条款、姓名；最后签上学校和自己的名字。AI 省了起草时间，没有替你承担责任。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 提示词越长越好——实际上 关键是任务、标准、例子和格式清楚；堆形容词和重复要求只会稀释重点。\n<\/li><li>\n别以为 AI 说对了就可以直接用——实际上 关键事实、引用、数字必须查原始来源；语气自信不等于正确。\n<\/li><li>\n别以为 用 AI 就是不负责任——实际上 责任由谁签字、谁批准决定。合理使用 + 人在回路，责任仍在人。\n<\/li><li>\n别以为  AI 素养就是会用工具——实际上 工具会换代，提出好问题、判断真假、承担责任的能力更耐久。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n一条好提示通常包含哪五件事？（答案：任务、对象、标准、例子、输出格式。；解析：它是在用文字塑造概率分布，不是背模板。）\n<\/li><li>\n哪些工作应该留给人？（答案：决定目标和标准、核对关键事实、对具体人的判断、承担后果的决定。；解析：AI 可以辅助，但不能替人负责。）\n<\/li><li>\n三个验证习惯是什么？（答案：关键事实必查、不懂的领域不用它做最终判断、要求它给出依据。；解析：它们由模型的工作方式推出。）\n<\/li><li>\n数据最小化具体怎么做？（答案：只提供任务必需的信息，能匿名先匿名，条款不明的服务不交敏感资料，智能体只给必需权限。；解析：每项数据和权限都是潜在风险。）\n<\/li><li>\nAI 素养的三项能力是什么？（答案：提出好问题、判断产出的好坏与真假、愿意并能够为 AI 参与的事负责。；解析：当产出成本趋近于零，判断最稀缺。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n提示词五件事：任务、对象、标准、例子、格式。\n<\/li><li>\nAI 铺广度，人负责深度、判断和责任。\n<\/li><li>\n关键事实必查，最终签字的是人。\n<\/ul>", "kind": "chapter", "title": "第 14 章：与 AI 共事"}, "t01": {"html": "<div class=\"source-badge\">📖 出处：hello-ai.pdf · p.151–156<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch08\">第 8 章：每个词都能看见其他词<\/a><\/span><\/div><h1>专题 1：一句话的旅程<\/h1>\n<blockquote>第五部 · 拓展专题　·　从你按下发送，到屏幕上出现第一个字，中间发生了什么？<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：1–2 小时 ｜ <strong>前置<\/strong>：第 7–9 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n能按顺序说出一次回答的六个阶段。\n<\/li><li>\n能解释为什么第一个字最慢、后面越来越快。\n<\/li><li>\n能指出每个阶段最可能出错的地方。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>一次回答是一条流水线：组装上下文、分词、嵌入、几十层注意力、概率分布、采样；每个阶段都有自己的时间尺度和错误方式。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>一次回答的六个阶段<\/h3>\n<ol><li>\n<strong>你的话<\/strong>：提示词、系统提示、历史对话、检索材料，拼成上下文。\n<\/li><li>\n<strong>分词<\/strong>：文本切成 token。中文往往比英文占更多 token。\n<\/li><li>\n<strong>嵌入<\/strong>：每个 token 查表变成向量，再加上位置信息。\n<\/li><li>\n<strong>几十层<\/strong>：每层做自注意力（词与词交换信息）和前馈网络（每个词单独消化）。这是计算量最大的部分。\n<\/li><li>\n<strong>概率<\/strong>：最后一个位置的向量变成词表上的分布，每个 token 一个分数。\n<\/li><li>\n<strong>选<\/strong>：按贪心、温度、top-p 等策略选一个 token，接回序列，再重复。\n<\/ol>\n<p>你看到的第一个字最慢，因为要先把整段提示读一遍、算完所有层；后面的字可以复用已经算过的键和值（KV 缓存），所以快很多。一段长回答不是一次性生成，而是几百次前向计算。<\/p>\n<h3>三个尺度<\/h3>\n<ul><li>\n<strong>毫秒级<\/strong>：分词、嵌入、采样。你感觉不到。\n<\/li><li>\n<strong>几十毫秒每个 token<\/strong>：几十层注意力与前馈。这是主要成本。\n<\/li><li>\n<strong>几秒到几十秒<\/strong>：整个回答，取决于长度、模型大小、是否联网、是否先思考。\n<\/ul>\n<h3>它没有的三样东西<\/h3>\n<ul><li>\n<strong>没有长期记忆<\/strong>：对话结束，上下文就没了；跨会话记住你，要靠外部存储。\n<\/li><li>\n<strong>没有事实核查<\/strong>：它只保证「像」，不保证「真」。\n<\/li><li>\n<strong>没有计划<\/strong>：它每步只决定下一个 token，结构的连贯性是训练分布的副产品。\n<\/ul>\n<p>理解这条流水线，你就能定位问题：答错事实，多半在知识与检索；答非所问，多半在上下文与提示；数不清字母，多半在分词；前后矛盾，多半是自回归逐步生成没有全局校验。<\/p>\n<h3>三个时间尺度<\/h3>\n<ul><li>\n<strong>毫秒级<\/strong>：分词、查嵌入、采样。相对便宜，但 token 多时也会累积。\n<\/li><li>\n<strong>几十毫秒每 token<\/strong>：几十层 Transformer 的前向。模型越大、层越多、上下文越长，这一项越重。\n<\/li><li>\n<strong>几秒到几十秒<\/strong>：完整回答。五百字大约几百个 token，就是几百次前向。\n<\/ul>\n<p>这三个尺度能解释为什么「回答短一点」有时比「换更快的模型」更有效：输出长度直接乘在第二项上。<\/p>\n<h3>KV 缓存与批处理<\/h3>\n<p>自回归生成时，前面 token 的键和值不会变。缓存它们，下一步只算新 token 的注意力，不必重算整段。这就是 KV 缓存，也是「首 token 慢、后面快」的原因。<\/p>\n<p>服务端还会把多个用户的请求拼成一批，同时算，提高 GPU 利用率。批处理让单位成本下降，但会增加排队延迟。你感受到的「慢」，有时不是模型算得慢，而是排在别人后面。<\/p>\n<h3>为什么长上下文更贵<\/h3>\n<p>注意力要比较每个 token 和所有 token，计算量随长度平方增长；KV 缓存也随长度线性占显存。上下文从 4k 增到 128k，不只是「多读一点」，而是注意力和显存都大幅上升。<\/p>\n<p>这也解释了为什么「把整本书贴进提示」不总是好办法：贵、慢，而且中间部分容易被忽略。检索先筛出相关段落，通常比全文硬塞更有效。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  A[上下文] --&gt; B[分词]\n  B --&gt; C[嵌入 + 位置]\n  C --&gt; D[几十层 Transformer]\n  D --&gt; E[下一个 token 分布]\n  E --&gt; F[采样]\n  F --&gt; G{结束?}\n  G -- 否 --&gt; D\n  G -- 是 --&gt; H[回答]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>这张图看流水线的循环：每选出一个 token，就把它接回序列，再算下一个分布，直到结束标记。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像一条装配线：原料（文字）先被切成标准零件（token），再装上位置标签（嵌入），经过几十道工序（层），最后质检选出下一个零件。每道工序都可能出次品。\n<\/li><li>\n<strong>实例<\/strong>：问「用一句话解释什么是注意力」：分词后十几个 token，每层计算每个 token 和其他 token 的关系；第一个 token 要等全部提示算完，后面每个 token 只需算新增部分，所以输出越来越快。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 模型是一次性写好整段回答——实际上 它一次只生成一个 token，反复循环。\n<\/li><li>\n别以为 第一个字和最后一个字一样快——实际上 第一个字要处理完整提示，后面有 KV 缓存，通常更快。\n<\/li><li>\n别以为 回答慢一定是网络问题——实际上 也可能是模型更大、思考更长、上下文更长或服务排队。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n一次回答的六个阶段是什么？（答案：组装上下文、分词、嵌入、几十层 Transformer、概率分布、采样。；解析：采样出的 token 接回序列，循环直到结束。）\n<\/li><li>\n为什么第一个字最慢？（答案：要先处理完整提示、算完所有层；后续 token 可复用键值缓存。；解析：长回答是几百次前向计算。）\n<\/li><li>\n哪个阶段最可能导致「数不清字母」？（答案：分词。模型看到的是 token 编号，不是单个字母。；解析：分词粒度决定了拼写类任务的弱点。）\n<\/li><li>\n模型有长期记忆吗？（答案：没有。上下文窗口只在一次调用内有效，跨会话记忆需要外部存储。；解析：不要把窗口当记忆。）\n<\/li><li>\n为什么长回答的成本随字数上升？（答案：每生成一个 token 都要跑一次前向计算，长回答就是几百次前向；上下文越长，每次计算也越重。；解析：输出不是一次性写完，而是逐 token 累积。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n回答流水线：上下文→分词→嵌入→层→分布→采样。\n<\/li><li>\n首 token 最慢，后续靠 KV 缓存。\n<\/li><li>\n不同错误对应不同阶段。\n<\/ul>", "kind": "chapter", "title": "专题 1：一句话的旅程"}, "t02": {"html": "<div class=\"source-badge\">📖 出处：hello-ai.pdf · p.157–160<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch05\">第 5 章：真正的考试在训练集之外<\/a><\/span><\/div><h1>专题 2：推荐系统：你为什么停不下来<\/h1>\n<blockquote>第五部 · 拓展专题　·　它预测的不是「你喜欢什么」，而是「你下一步最可能点什么」。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：1–2 小时 ｜ <strong>前置<\/strong>：第 4、5 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n能解释推荐系统怎样把用户和内容变成向量并匹配。\n<\/li><li>\n能说清反馈循环为什么会让内容越来越窄。\n<\/li><li>\n能区分「提升点击」与「提升长期满意度」。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>推荐系统优化的是可测量的互动指标，不是你的长期幸福；指标选错，系统就会学会让你停不下来。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>它在预测什么<\/h3>\n<p>推荐系统做的核心预测是：给定你和一个候选内容，估计你会不会点、会不会看完、会不会赞。它把用户和内容都变成向量，在同一空间里算相似度，再按分数排序。<\/p>\n<p>常见信号有三类：<\/p>\n<ul><li>\n<strong>显式反馈<\/strong>：评分、点赞、收藏、不感兴趣。\n<\/li><li>\n<strong>隐式反馈<\/strong>：点击、停留、完播、跳过、搜索。\n<\/li><li>\n<strong>上下文<\/strong>：时间、地点、设备、当前会话。\n<\/ul>\n<p>点击是最容易收集的信号，但不等于满意。你点开一个标题党，可能三秒就退出；系统却记了一次点击。<\/p>\n<h3>反馈循环<\/h3>\n<p>推荐系统不是被动预测，它会<strong>改变<\/strong>你看到什么，从而改变你的行为，再改变训练数据。这叫反馈循环。<\/p>\n<p>如果系统只优化点击，它会不断放大标题党、极端内容、短刺激；用户越点，系统越推；系统越推，用户越点。内容越来越窄，兴趣被锁在一个小圈子里，这叫<strong>信息茧房<\/strong>或<strong>过滤气泡<\/strong>。<\/p>\n<p>更难的是<strong>冷启动<\/strong>：新用户没有历史，新内容没有互动。系统必须探索：给新内容一些曝光，否则永远不知道它好不好。这就是第三章的探索与利用。<\/p>\n<h3>它在优化什么<\/h3>\n<p>推荐系统常用的指标：点击率、停留时长、完播率、转化率、次日留存。每个指标都是一种价值判断。<\/p>\n<ul><li>\n只优化点击 → 标题党、震惊体。\n<\/li><li>\n只优化时长 → 无限下滑、自动播放。\n<\/li><li>\n只优化转化 → 过度推销、制造焦虑。\n<\/ul>\n<p>更合理的目标要同时看短期互动和长期满意度，比如加入「不感兴趣」、举报、取消关注、长期留存，甚至直接问用户。但长期指标难测、反馈慢，工程上常被短期指标压过。<\/p>\n<h3>使用者能做什么<\/h3>\n<ul><li>\n主动使用「不感兴趣」和取消关注，这是最直接的训练信号。\n<\/li><li>\n定期清理推荐源，不要让一个误点定义你接下来一个月的内容。\n<\/li><li>\n对「猜你喜欢」保持警觉：它猜的是互动概率，不是你的人格。\n<\/li><li>\n教育场景尤其要小心：用点击优化学习内容，会推给孩子更容易、更上瘾的东西，而不是更有价值的东西。\n<\/ul>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  U[用户行为] --&gt; D[训练数据]\n  D --&gt; M[推荐模型]\n  M --&gt; S[排序与展示]\n  S --&gt; U\n  S --&gt; E[探索新内容]\n  E --&gt; U<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>这张图看闭环：行为变成数据，数据训练模型，模型决定展示，展示又改变行为。闭环会放大指标，也会放大偏差。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像一位只记住你上次点了什么的服务员。你偶尔点了一次辣，他以后每顿都给你上辣；你越吃，他越确信你爱辣。不是你变了，是他的菜单把你塑造成了这样。\n<\/li><li>\n<strong>实例<\/strong>：你误点了一个游戏广告，系统记一次点击；接下来几天它反复推同类广告，你又点了一次；循环强化。直到你点「不感兴趣」，信号才被纠正。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 推荐系统懂我——实际上 它懂的是你在特定上下文里的互动概率，不是你完整的偏好。\n<\/li><li>\n别以为 点击多就是喜欢——实际上 点击可能来自标题党、误触、好奇；停留和回访才更接近满意。\n<\/li><li>\n别以为 算法是中立的——实际上 指标的选择、样本的偏差、优化目标都是价值判断。\n<\/li><li>\n别以为 信息茧房是用户自己选的——实际上 系统的排序和探索策略也在塑造你看到什么。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n推荐系统的核心预测是什么？（答案：给定用户和候选内容，估计点击、停留、完播、赞等互动概率，再排序。；解析：它优化的是可测量的互动指标。）\n<\/li><li>\n什么是反馈循环？（答案：推荐改变用户看到的内容，用户行为又变成训练数据，继续影响下一次推荐。；解析：闭环会放大指标，也会放大偏差。）\n<\/li><li>\n只优化点击会有什么后果？（答案：标题党、极端内容、短刺激被放大，内容变窄，长期满意度下降。；解析：点击不等于满意。）\n<\/li><li>\n冷启动为什么要探索？（答案：新用户和新内容没有历史数据，不给曝光就永远不知道好坏。；解析：这是探索与利用的取舍。）\n<\/li><li>\n使用者能做什么？（答案：主动使用不感兴趣、取消关注、清理推荐源，并对推荐保持警觉。；解析：你的反馈是最直接的训练信号。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n推荐预测互动概率，不预测长期幸福。\n<\/li><li>\n反馈循环会放大指标和偏差。\n<\/li><li>\n点击不等于满意，指标选择是价值判断。\n<\/ul>", "kind": "chapter", "title": "专题 2：推荐系统：你为什么停不下来"}, "t03": {"html": "<div class=\"source-badge\">📖 出处：hello-ai.pdf · p.161–173<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch06\">第 6 章：一层一层看出一只猫<\/a><\/span><\/div><h1>专题 3：自动驾驶：四种能力的合体<\/h1>\n<blockquote>第五部 · 拓展专题　·　感知、预测、规划、控制，四种能力全用上，难在长尾。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：2–3 小时 ｜ <strong>前置<\/strong>：第 1、6、11 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n能拆解自动驾驶的感知、预测、规划、控制四个模块。\n<\/li><li>\n能解释模块化与端到端两条路线的取舍。\n<\/li><li>\n能说明长尾、数据闭环和分级责任为什么是核心难题。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>自动驾驶不是单一模型，而是四种能力叠在一起；真正难的不是常见路况，是见不到几次的长尾和不可逆的后果。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>四个模块<\/h3>\n<ul><li>\n<strong>感知/识别<\/strong>：摄像头、激光雷达、毫米波雷达看到什么。检测车辆、行人、车道线、交通灯，估计距离和速度。\n<\/li><li>\n<strong>预测<\/strong>：其他车辆和行人下一步可能怎么动。这是典型的序列预测，要考虑意图、路况、历史轨迹。\n<\/li><li>\n<strong>规划/决策<\/strong>：自车走哪条路线、什么时候变道、让还是不让。它要在安全、舒适、效率之间取舍。\n<\/li><li>\n<strong>控制<\/strong>：把规划变成油门、刹车、方向盘的具体指令，还要处理执行延迟和车辆动力学。\n<\/ul>\n<p>四种能力全用上，而且必须实时闭环。感知错一点，预测就偏；预测错，规划就危险；控制慢，前面全白算。<\/p>\n<h3>两条路线<\/h3>\n<p><strong>模块化<\/strong>：四个模块分别做，接口清晰，每一段可解释、可测试。缺点是误差会累积，上游错了下游很难补救。<\/p>\n<p><strong>端到端<\/strong>：传感器输入直接到控制输出，一个网络学完整驾驶策略。优点是信息不丢失、整体优化；缺点是黑箱、难验证、需要大量驾驶数据。<\/p>\n<p>2023 年之后端到端成为主流方向，但量产系统通常是混合：端到端做主要策略，规则和冗余做安全兜底。<\/p>\n<h3>难在长尾<\/h3>\n<p>常见路况容易，罕见场景难：一个穿玩偶服的人、一块掉落的床垫、一辆逆行的电动车、暴雨里被遮住的交通灯。这些场景在训练数据里出现得极少，却可能致命。这叫<strong>长尾<\/strong>。<\/p>\n<p>应对靠<strong>数据闭环<\/strong>：车队遇到罕见场景，自动上传，标注，加入训练，再部署回车队。部署不是终点，而是下一轮数据的起点。谁的车队多、闭环快，谁的长尾覆盖就更好。<\/p>\n<h3>分级与责任<\/h3>\n<p>自动驾驶分 L0–L5：L2 是辅助驾驶，人必须监控；L3 是有条件自动驾驶，系统在限定场景负责，但接管请求时要人接手；L4 是在限定区域无人驾驶；L5 是任何地方。<\/p>\n<p>分级不只是技术能力，更是<strong>责任分配<\/strong>。L2 出事故，司机负责；L4 在限定区域出事故，运营方负责。这个边界必须让用户一眼看懂，否则「辅助驾驶」会被当成「自动驾驶」。<\/p>\n<h3>怎样衡量<\/h3>\n<p>不能只看「平均接管次数」。要分开看：安全性（碰撞率）、舒适性（急刹、顿挫）、可用性（接管频率）、可解释性（为什么这样决策）。一个在晴天表现很好的系统，可能在雨夜完全失效；平均值会掩盖长尾。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  S[摄像头/雷达] --&gt; P[感知]\n  P --&gt; F[预测]\n  F --&gt; D[规划/决策]\n  D --&gt; C[控制]\n  C --&gt; V[车辆]\n  V --&gt; S\n  P --&gt; X[长尾场景上传]\n  X --&gt; T[训练数据]\n  T --&gt; P<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>这张图看两个闭环：一个是毫秒级的感知—控制闭环，一个是月级的数据闭环。前者保证当下安全，后者扩展长尾覆盖。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像一位司机开车：眼睛看路（感知），猜前车会不会变道（预测），决定让不让（规划），手脚操作（控制）。区别是 AI 司机没有常识，也没法用「我感觉不对」兜底。\n<\/li><li>\n<strong>实例<\/strong>：雨天夜路，交通灯被树枝遮住：摄像头置信度低，激光雷达看不清颜色，毫米波雷达只能测距。系统必须降级：减速、结合地图和路口几何推断、必要时提醒人接管。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 自动驾驶就是一个大模型——实际上 它是感知、预测、规划、控制的组合，还要实时和安全冗余。\n<\/li><li>\n别以为 端到端一定比模块化好——实际上 端到端整体优化但难验证；量产常用混合架构，规则做兜底。\n<\/li><li>\n别以为 平均接管次数少就安全——实际上 平均值会掩盖长尾；要看罕见场景、雨夜、逆光等分组表现。\n<\/li><li>\n别以为 L3 可以完全放手——实际上 L3 是有条件自动驾驶，系统请求接管时人必须接手，责任边界要清楚。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n自动驾驶的四个模块是什么？（答案：感知/识别、预测、规划/决策、控制。；解析：四者实时闭环，误差会累积。）\n<\/li><li>\n模块化和端到端各有什么取舍？（答案：模块化可解释、可测试但误差累积；端到端整体优化但黑箱、难验证。；解析：量产常用混合架构。）\n<\/li><li>\n什么是长尾？（答案：训练数据里极少出现、却可能致命的罕见场景，如玩偶服行人、掉落床垫、雨夜遮灯。；解析：长尾是自动驾驶最难的部分。）\n<\/li><li>\n数据闭环怎样工作？（答案：车队遇到罕见场景上传，标注后加入训练，再部署回车队，形成循环。；解析：部署是下一轮数据的起点。）\n<\/li><li>\n自动驾驶分级为什么也是责任分配？（答案：不同级别下，司机、系统、运营方承担的责任不同；边界不清会误导用户。；解析：L2 司机监控，L4 运营方在限定区域负责。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n自动驾驶 = 感知 + 预测 + 规划 + 控制。\n<\/li><li>\n难在长尾，靠数据闭环扩展覆盖。\n<\/li><li>\n分级不只是能力，也是责任分配。\n<\/ul>", "kind": "chapter", "title": "专题 3：自动驾驶：四种能力的合体"}, "t04": {"html": "<div class=\"source-badge\">📖 出处：hello-ai.pdf · p.174–182<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch05\">第 5 章：真正的考试在训练集之外<\/a><\/span><\/div><h1>专题 4：给科研人的机器学习实用课<\/h1>\n<blockquote>第五部 · 拓展专题　·　不做 AI 的科研人，怎样在自己的领域开始用机器学习，而不被它带偏。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：2–3 小时 ｜ <strong>前置<\/strong>：第 4、5 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n能按「问题—表示—基线—模型—验证」的顺序设计一个科研机器学习方案。\n<\/li><li>\n能判断什么时候用树模型、什么时候才上深度网络。\n<\/li><li>\n能理解高斯过程、主动学习和校准在实验科学里的价值。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>先问清问题和代价，再找一个傻基线；小数据优先树模型或预训练表示，别一上来就深网络。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>第一步：问清问题<\/h3>\n<p>不要从「我要用深度学习」开始，从「我要预测什么、错了代价是什么」开始。<\/p>\n<ul><li>\n是预测一个数（回归），还是分一个类（分类），还是排一个序（排序）？\n<\/li><li>\n错报和漏报，哪个更贵？\n<\/li><li>\n如果模型给出一个预测，下一步动作是什么？做实验、筛候选、还是只做参考？\n<\/ul>\n<p>问题不清楚，模型再好也没用。一个能减少 30% 实验次数的筛选模型，比一个准确率高 1% 但无法落地的模型有价值得多。<\/p>\n<h3>第二步：表示<\/h3>\n<p>把样本变成数字。常见表示有三类：<\/p>\n<ul><li>\n<strong>手工描述符<\/strong>：人根据领域知识设计的几十到几百个数，比如元素的电负性均值、分子的官能团计数。小数据好用、可解释。\n<\/li><li>\n<strong>指纹<\/strong>：分子里有哪些子结构，变成固定长度的位串。相似性搜索的标准做法，配树模型很强。\n<\/li><li>\n<strong>学习表示<\/strong>：图神经网络、预训练模型。表示从数据里学出来，需要几千到几万样本；预训练模型可以在小数据上微调或直接取向量。\n<\/ul>\n<p>表示选错，后面的模型再强也救不回来。先问：这个表示保留了决定结果的哪些信息？<\/p>\n<h3>第三步：傻基线<\/h3>\n<p>在训练任何复杂模型之前，先做一个傻基线：均值、线性回归、逻辑回归、一棵决策树。<\/p>\n<p>基线的价值不是赢，而是给你一个「多好算好」的参照。如果深度模型只比均值好 2%，它可能没有实用价值；如果基线已经达到 90%，你可能根本不需要深度模型。<\/p>\n<h3>第四步：小数据先用树模型<\/h3>\n<p>科研数据常常只有几十到几千条。这个规模下，梯度提升树（XGBoost、LightGBM）和随机森林往往比深度网络更稳、更省、更容易解释。<\/p>\n<p>深度网络需要更多数据、更多调参、更多算力。数据不够时，它容易过拟合，表现还不如一棵树。等数据到几万条、或者有合适的预训练模型，再考虑深网络。<\/p>\n<h3>第五步：验证与不确定性<\/h3>\n<p>科研使用不只关心「预测多少」，还关心「这个预测有多可靠」。<strong>校准<\/strong>让你知道模型说 80% 把握时，实际对不对。<strong>高斯过程<\/strong>和集成模型能给出不确定性，适合小数据、实验贵的场景。<\/p>\n<p><strong>主动学习<\/strong>更进一步：模型不只给预测，还告诉你「哪个候选最值得做实验」——它同时考虑「可能好」和「不知道」。这就是探索与利用在实验设计里的版本。一次实验很贵时，先做信息量最大的那个，比随机筛更省。<\/p>\n<h3>常见坑<\/h3>\n<ul><li>\n<strong>标签泄漏<\/strong>：特征里混进了实验结果之后的量，模型成绩虚高。\n<\/li><li>\n<strong>分布偏移<\/strong>：训练数据来自旧实验条件，部署时条件是新的。\n<\/li><li>\n<strong>只报准确率<\/strong>：不报置信区间、不分组、不看校准。\n<\/li><li>\n<strong>拿测试集调模型<\/strong>：反复用同一份测试集选模型，测试成绩就失效了。\n<\/ul>\n<p>一个靠谱的科研机器学习项目，最后交付的不只是模型，还有：数据来源、特征定义、基线、验证方式、适用范围、失败案例。这些比多涨一个点重要。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  Q[问题与代价] --&gt; R[表示]\n  R --&gt; B[傻基线]\n  B --&gt; M{数据量?}\n  M -- 小 --&gt; T[树模型/高斯过程]\n  M -- 大 --&gt; D[深度网络/预训练]\n  T --&gt; V[验证与校准]\n  D --&gt; V\n  V --&gt; A[主动学习选实验]\n  A --&gt; Q<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>这张图看科研 ML 的顺序：先问题、再表示、再基线，数据量决定模型路线，最后一定要验证和校准。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像做实验前先写清楚假设、对照组和测量方法。模型只是其中一件仪器，不是实验设计本身。\n<\/li><li>\n<strong>实例<\/strong>：材料筛选：只有 300 个已合成样本。先用手工描述符 + 梯度提升树做基线，得到 0.75 的相关系数；再用高斯过程给出不确定性，挑出「预测好且不确定」的 20 个候选做实验。比随机挑省一半实验。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 科研一定要用最深的模型——实际上 小数据下树模型常常更稳；模型复杂度要匹配数据量。\n<\/li><li>\n别以为 准确率高就说明模型有用——实际上 还要看校准、分组表现、错了的代价和能否落地。\n<\/li><li>\n别以为 预训练模型只适合大公司——实际上 开放权重模型可以在小数据上微调或直接取特征，科研团队也能用。\n<\/li><li>\n别以为 主动学习就是多标数据——实际上 它是用模型的不确定性挑最有信息量的样本，不是盲目增加标注量。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n科研机器学习的第一步是什么？（答案：问清预测什么、错了代价是什么、预测之后做什么动作。；解析：不要从模型开始，从问题开始。）\n<\/li><li>\n为什么小数据优先树模型？（答案：树模型在几十到几千条数据上更稳、更省、更可解释；深网络容易过拟合。；解析：数据量决定模型复杂度。）\n<\/li><li>\n校准在科研里为什么重要？（答案：它告诉使用者预测的把握是否可信，决定哪些结果值得做实验。；解析：只有预测没有不确定性，科研价值有限。）\n<\/li><li>\n主动学习怎样选实验？（答案：优先选「可能好」且「模型不确定」的样本，用一次实验获取最多信息。；解析：它是探索与利用在实验设计里的版本。）\n<\/li><li>\n常见的四个坑是什么？（答案：标签泄漏、分布偏移、只报准确率、拿测试集调模型。；解析：它们都会让评估结果虚高。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n问题 → 表示 → 基线 → 模型 → 验证。\n<\/li><li>\n小数据先用树模型，数据够了再上深网络。\n<\/li><li>\n科研使用要看校准和不确定性，不只看准确率。\n<\/ul>", "kind": "chapter", "title": "专题 4：给科研人的机器学习实用课"}, "t05": {"html": "<div class=\"source-badge\">📖 出处：hello-ai.pdf · p.183–193<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch09\">第 9 章：从续写机到助手<\/a><\/span><\/div><h1>专题 5：训练一个模型：从数据到对齐的实操<\/h1>\n<blockquote>第五部 · 拓展专题　·　把前面所有原理串成一条工程流水线：数据、分词、预训练、评测、微调、对齐、部署。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：第 4、6、8、9 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n能按顺序说出训练一个大模型的七个阶段。\n<\/li><li>\n能区分预训练、SFT、偏好对齐、可验证奖励 RL 各自需要的数据和算力。\n<\/li><li>\n能判断一个需求该用提示、RAG、微调还是从头训练。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>训练是一条流水线，每一段都有自己的数据和评测；大多数团队真正该做的不是从头预训练，而是提示、检索或微调。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>流水线的七个阶段<\/h3>\n<ol><li>\n<strong>数据管道<\/strong>：抓取、去重、过滤、配比。网页、书籍、论文、代码、对话按比例混合；去重能显著提升效果，因为重复会让模型「背」而不是「学」。\n<\/li><li>\n<strong>分词器<\/strong>：在语料上训练 BPE，得到词表。词表大小、语言配比会影响成本和能力。\n<\/li><li>\n<strong>预训练<\/strong>：在几万亿 token 上预测下一个 token，用几万块 GPU 跑几个月。产物是基础模型。\n<\/li><li>\n<strong>评测<\/strong>：在标准 benchmark、领域测试集、安全测试上打分，决定下一步往哪走。\n<\/li><li>\n<strong>监督微调（SFT）<\/strong>：几万条高质量示范对话，教模型对话格式与风格。\n<\/li><li>\n<strong>偏好/强化学习<\/strong>：RLHF、DPO、GRPO 等，用人类偏好或可验证奖励调整行为。\n<\/li><li>\n<strong>蒸馏与部署<\/strong>：大模型教小模型，量化压缩，部署到服务或设备。\n<\/ol>\n<h3>三代偏好方法<\/h3>\n<ul><li>\n<strong>RLHF（PPO）<\/strong>：人类排序训练奖励模型，再用强化学习优化。通用助手对齐的经典方法，但需要奖励模型，训练不稳定。\n<\/li><li>\n<strong>DPO<\/strong>：把偏好对直接写成损失，用梯度下降。简单稳定，开源社区常用。\n<\/li><li>\n<strong>GRPO + 可验证奖励<\/strong>：数学、代码这类有标准答案的任务，直接用「答案对不对」作奖励，绕过人类偏好模型。推理模型主要靠这条路。\n<\/ul>\n<h3>数据从哪来<\/h3>\n<p>预训练数据：公开网页、书籍、论文、代码、百科，清洗后几万亿 token。高质量数据正在逼近上限，所以合成数据、代码、多模态数据越来越重要。合成数据有用，但必须与真实数据混合并筛选，否则会「模型崩溃」。<\/p>\n<p>SFT 数据：几万到几十万条人写或人审的对话，质量远比数量重要。<\/p>\n<p>偏好数据：几十万条人类排序，或可验证的答案对。<\/p>\n<h3>评测不是最后一步<\/h3>\n<p>评测要贯穿全程：预训练看损失和 benchmark，SFT 看指令遵循，对齐看有帮助/诚实/无害，部署前看安全、幻觉、分布偏移。评测集要防止泄漏；用测试集反复调模型，测试就失效。<\/p>\n<h3>你该选哪一段<\/h3>\n<ul><li>\n<strong>提示/技能<\/strong>：改的是模型看到什么。零成本、立刻生效，永远先试。\n<\/li><li>\n<strong>检索增强（RAG）<\/strong>：改的是模型回答时看到的材料。适合知识更新、企业资料。\n<\/li><li>\n<strong>微调<\/strong>：改的是行为、风格、格式。需要几千到几万条示例，成本几千元级。\n<\/li><li>\n<strong>从头预训练<\/strong>：改的是模型的一切。几万块 GPU、几个月、几亿元级，只有少数机构做。\n<\/ul>\n<p>一个常见错误是「知识不够就微调」。微调擅长教格式和风格，不擅长灌新知识；知识更新优先用 RAG。<\/p>\n<h3>成本量级<\/h3>\n<ul><li>\n个人微调：一块 GPU 一晚，几十元电费。\n<\/li><li>\n团队 SFT：几块 GPU 一天，几千元。\n<\/li><li>\n中等预训练：几十块 GPU 几天，几万元。\n<\/li><li>\n前沿预训练：几万块 GPU 几个月，几亿到几十亿元。\n<\/ul>\n<p>理解量级，能避免「用大炮打蚊子」，也能判断供应商的报价是否离谱。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  A[数据管道] --&gt; B[分词器]\n  B --&gt; C[预训练]\n  C --&gt; D[评测]\n  D --&gt; E[SFT]\n  E --&gt; F[偏好/RL]\n  F --&gt; G[评测]\n  G --&gt; H[蒸馏/量化/部署]\n  H --&gt; A<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>这张图看训练主线和反馈线：评测不是最后一关，它会在预训练、SFT、对齐后反复出现，决定下一步。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像一条食品加工线：原料清洗（数据）、切分（分词）、长时间烹煮（预训练）、试吃（评测）、调味（SFT）、按顾客偏好调整（对齐）、包装（部署）。每道工序都有质检。\n<\/li><li>\n<strong>实例<\/strong>：学校想做一个懂本校规章的助教：不需要从头训练。先用 RAG 把规章库接进去，再用几千条本校问答做 SFT 调语气；成本从几亿元降到几千元。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 想加新知识就微调——实际上 微调主要改行为和格式；新知识优先用 RAG 或重新训练。\n<\/li><li>\n别以为 预训练数据越多越好——实际上 质量、去重、配比同样重要；垃圾数据会教坏模型。\n<\/li><li>\n别以为 评测只在最后做——实际上 评测要贯穿全程，早发现问题比最后返工便宜。\n<\/li><li>\n别以为 开源模型就是完全开源——实际上 多数只开放权重，训练数据和代码不公开，准确说法是「开放权重」。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n训练大模型的七个阶段是什么？（答案：数据管道、分词器、预训练、评测、SFT、偏好/RL、蒸馏与部署。；解析：评测贯穿多个阶段，不是最后一步。）\n<\/li><li>\n预训练、SFT、偏好对齐各需要什么数据？（答案：预训练用几万亿 token 文本；SFT 用几万条示范对话；偏好对齐用人类排序或可验证答案。；解析：数据和算力量级依次下降。）\n<\/li><li>\nRLHF、DPO、GRPO 的主要区别是什么？（答案：RLHF 用奖励模型 + 强化学习；DPO 直接优化偏好对；GRPO 用可验证奖励，适合数学和代码。；解析：三者目标相近，工程复杂度和适用场景不同。）\n<\/li><li>\n想给模型加本校规章，应该优先用什么？（答案：RAG，把规章库检索进上下文；必要时再用 SFT 调语气。；解析：微调不擅长灌新知识。）\n<\/li><li>\n为什么合成数据不能单独用？（答案：一代代模型在上一代输出上训练会导致分布坍缩、罕见模式消失，必须与真实数据混合并筛选。；解析：这叫模型崩溃。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n训练流水线：数据→分词→预训练→评测→SFT→对齐→部署。\n<\/li><li>\n大多数团队该用提示、RAG、微调，而不是从头训练。\n<\/li><li>\n知识更新优先 RAG，行为风格才用微调。\n<\/ul>", "kind": "chapter", "title": "专题 5：训练一个模型：从数据到对齐的实操"}, "t06": {"html": "<div class=\"source-badge\">📖 出处：hello-ai.pdf · p.194–199<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch09\">第 9 章：从续写机到助手<\/a><\/span><\/div><h1>专题 6：AI 与开源<\/h1>\n<blockquote>第五部 · 拓展专题　·　代码、数据、权重，三层开放程度不同；「开源模型」多数只是开放权重。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：1–2 小时 ｜ <strong>前置<\/strong>：第 9 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n能区分代码开源、数据开放、权重开放三个层次。\n<\/li><li>\n能解释开放权重为什么有价值，以及它的许可证限制。\n<\/li><li>\n能判断「开源模型」这个词在具体语境里到底指什么。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>AI 的开源不是一个开关，而是三层：代码、数据、权重。多数所谓开源模型只开放权重，能运行和微调，但不能复现训练。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>三层开放<\/h3>\n<ul><li>\n<strong>代码<\/strong>：训练框架、推理代码、工具链。深度学习框架从第一天就开源，这一层开放度最高。\n<\/li><li>\n<strong>数据<\/strong>：公开数据集推动了每一次突破，但前沿模型的训练配方是核心机密；版权和隐私让数据最难完全开放。\n<\/li><li>\n<strong>权重<\/strong>：训练完的几千亿个参数。开放权重意味着你能下载、运行、微调，但训练数据和训练代码未必公开。\n<\/ul>\n<p>一个完全开源的模型会公开训练代码、数据来源与过滤规则、训练日志和权重，任何有算力的人都能复现。这样的模型很少，因为数据配方是核心资产，公开数据来源还会带来版权风险。<\/p>\n<p>绝大多数「开源模型」是<strong>开放权重<\/strong>：给你参数和推理代码，附一份许可证。许可证差别很大，从几乎无限制，到「月活超过某个数就要另谈」，再到禁止某些用途。读许可证比看「开源」标签重要。<\/p>\n<h3>开放权重的价值<\/h3>\n<p>最大的价值是<strong>可微调<\/strong>。在自己的数据上继续训练，得到一个懂本领域的模型，成本只是预训练的千分之一。学校可以用本校材料微调助教，医院可以用脱敏病历微调辅助系统。这是「AI 民主化」最实际的形式。<\/p>\n<p>第二是<strong>可审计<\/strong>。你能在本地跑、检查行为、做安全测试，不必完全依赖供应商。第三是<strong>可离线<\/strong>。在无网或敏感环境里，开放权重模型可以本地部署。<\/p>\n<h3>蒸馏与争议<\/h3>\n<p><strong>蒸馏<\/strong>让一个小模型学习大模型的输出，把能力「压」进小模型。小模型看不到大模型的参数，只看大量问题的回答或概率分布，然后模仿。蒸馏出的小模型可以在手机上跑，能力接近大模型的一部分。<\/p>\n<p>争议在于：用别家闭源模型的输出来训练自己的模型，是否违反服务条款？技术上很简单，商业上是一道边界。2025 年的几起纠纷就源于此。<\/p>\n<h3>对使用者的含义<\/h3>\n<ul><li>\n「开源」不等于「可复现」；要问开放的是代码、数据还是权重。\n<\/li><li>\n「免费」不等于「可商用」；许可证可能限制商业用途、用户规模、再分发。\n<\/li><li>\n开放权重模型可以本地部署，但安全、合规、维护责任也转移到你身上。\n<\/li><li>\n选择模型时，除了能力，还要看许可证、数据来源、社区支持和安全记录。\n<\/ul>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TB\n  A[AI 开源三层] --&gt; B[代码]\n  A --&gt; C[数据]\n  A --&gt; D[权重]\n  B --&gt; E[可读/可改/可再分发]\n  C --&gt; F[可复现训练/受版权隐私限制]\n  D --&gt; G[可运行/可微调/未必可复现]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>这张图看三层开放度：代码最常开放，数据最难，权重介于两者之间。所谓「开源模型」通常只指最下面一层。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像一家餐厅公开了菜谱（代码）、食材采购单（数据）和半成品（权重）。只给半成品，你能加热上桌，却不知道菜谱和采购来源，也不能完全复刻。\n<\/li><li>\n<strong>实例<\/strong>：某模型标称「开源」，下载后能看到权重和推理代码，但训练数据只有模糊描述，训练代码未公开。你能微调、能商用（许可证允许），但不能复现它的训练过程。准确说法是开放权重。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 开源模型 = 完全开源——实际上 多数只开放权重，训练数据和代码不公开。\n<\/li><li>\n别以为 开放权重没有价值——实际上 可微调、可审计、可离线部署，对教育和科研很有价值。\n<\/li><li>\n别以为 免费模型可以随便商用——实际上 许可证可能限制商业用途、用户规模或再分发，必须读条款。\n<\/li><li>\n别以为 蒸馏只是小模型抄大模型——实际上 它学习输出分布，能在小模型上保留部分能力，但可能涉及服务条款争议。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\nAI 开源的三层是什么？（答案：代码、数据、权重。；解析：三层的开放程度和限制不同。）\n<\/li><li>\n开放权重模型能做什么、不能做什么？（答案：能下载、运行、微调、审计；不能仅凭权重复现完整训练过程。；解析：训练数据和代码未必公开。）\n<\/li><li>\n开放权重最大的实际价值是什么？（答案：可微调，用本领域数据得到懂行的模型，成本远低于预训练。；解析：学校、医院、企业都能用。）\n<\/li><li>\n蒸馏是什么？（答案：让小模型学习大模型的输出或概率分布，把部分能力压进小模型。；解析：技术简单，但可能涉及服务条款争议。）\n<\/li><li>\n看到「开源模型」应该追问什么？（答案：开放的是代码、数据还是权重？许可证允许什么？能否复现？；解析：「开源」标签不能代替许可证和数据来源。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nAI 开源三层：代码、数据、权重。\n<\/li><li>\n多数开源模型只是开放权重。\n<\/li><li>\n开放权重可微调、可审计、可离线，但要读许可证。\n<\/ul>", "kind": "chapter", "title": "专题 6：AI 与开源"}, "c01": {"html": "<div class=\"source-badge\">📖 出处：hello-ai.pdf · p.6<\/div><h1>AI 与 AI 效应<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 ｜ <strong>涉及章节<\/strong>：第 1 章：你已经在用 AI 了\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>AI 是让机器完成那些通常需要人类智能才能完成的任务；一旦某件事被机器做成常规，人们就不再把它算作智能，这就是 AI 效应。<\/p>\n<h2>为什么重要<\/h2>\n<p>它给你一把判断产品的尺子：不看宣传语，看它到底在做什么任务、靠什么做到、哪里会出错。<\/p>\n<h2>详解<\/h2>\n<p>定义的重点是任务，不是方法。下棋、翻译、认脸、写文章，过去只有人能做，所以机器做到就算 AI。它不要求意识，也不要求像人一样思考。<\/p>\n<p>AI 效应解释了这个词为什么总在往后退。计算器算得快，没人叫它 AI；语音输入、路线规划刚出现时是明星课题，普及后变成普通软件。边界永远指向机器还做不太好的那一片。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 AI 必须有意识——实际上定义只看任务是否需要人类智能。\n<\/li><li>\n别以为算得快就是 AI——常规计算会被移出 AI 的边界。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 1 章：你已经在用 AI 了<\/td><td>本章核心概念之一<\/td><td>AI 是让机器完成那些通常需要人类智能才能完成的任务；一旦某件事被机器做成常规，人们就不再把它算作智能，这就是 AI 效应。<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\nc02 六层包含关系、c03 四种能力\n<\/ul>", "kind": "concept", "title": "AI 与 AI 效应"}, "c02": {"html": "<div class=\"source-badge\">📖 出处：hello-ai.pdf · p.6<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c01\">AI 与 AI 效应<\/a><\/span><\/div><h1>六层包含关系<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 ｜ <strong>涉及章节<\/strong>：第 1 章：你已经在用 AI 了\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>AI、机器学习、深度学习、大模型、生成式 AI、智能体不是并列关系，而是一层套一层，越往里越新、越具体。<\/p>\n<h2>为什么重要<\/h2>\n<p>新闻里六个词混着用，分清包含关系能避免「大模型就是 AI」这类误判。<\/p>\n<h2>详解<\/h2>\n<p>人工智能是最大的伞，包含人写规则、搜索、统计学习等所有办法。机器学习是其中一种做法：从数据里学规律。深度学习是机器学习里用多层网络的分支。大语言模型是深度学习的一种极端形态。生成式 AI 强调用途，能造出新内容。智能体强调用法，把模型放进循环里执行任务。<\/p>\n<p>外面的圈没有消失。导航里的 A*、银行的反欺诈规则，仍然在大量使用。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为大模型等于 AI——它只是最里面的一层。\n<\/li><li>\n别以为生成式 AI 和智能体是并列技术——它们分别从用途和用法切面描述系统。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 1 章：你已经在用 AI 了<\/td><td>本章核心概念之一<\/td><td>AI、机器学习、深度学习、大模型、生成式 AI、智能体不是并列关系，而是一层套一层，越往里越新、越具体。<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\nc01 AI 与 AI 效应、c03 四种能力\n<\/ul>", "kind": "concept", "title": "六层包含关系"}, "c03": {"html": "<div class=\"source-badge\">📖 出处：hello-ai.pdf · p.6<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c01\">AI 与 AI 效应<\/a><\/span><\/div><h1>四种能力：识别、预测、生成、决策<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 ｜ <strong>涉及章节<\/strong>：第 1 章：你已经在用 AI 了\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>任何 AI 产品都能拆成识别、预测、生成、决策四种能力，或者它们的组合。<\/p>\n<h2>为什么重要<\/h2>\n<p>拆开之后，你能立刻看出产品的强项在哪、哪一环最可能出错。<\/p>\n<h2>详解<\/h2>\n<p>识别是输入一个东西判断它是什么，最成熟，很多任务超过人。预测是根据过去估计未知，质量取决于历史数据是否包含未来的规律。生成是造出原本不存在的内容，最容易「像而不对」。决策是在环境里选择行动，有后果，会改变环境。<\/p>\n<p>「帮我订高铁」会同时用到四种：语音识别、意图规划、车次预测、确认信息生成。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为一个产品只属于一种能力——真实产品往往四种都串起来。\n<\/li><li>\n别以为生成最难所以最可靠——生成最容易「像而不对」。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 1 章：你已经在用 AI 了<\/td><td>本章核心概念之一<\/td><td>任何 AI 产品都能拆成识别、预测、生成、决策四种能力，或者它们的组合。<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\nc02 六层包含关系、c10 监督学习\n<\/ul>", "kind": "concept", "title": "四种能力：识别、预测、生成、决策"}, "c04": {"html": "<div class=\"source-badge\">📖 出处：hello-ai.pdf · p.16<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c02\">六层包含关系<\/a><\/span><\/div><h1>三次浪潮与两次寒冬<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：第 2 章：七十年，三次浪潮\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>AI 历史是符号主义、专家系统、深度学习三次浪潮，中间夹着两次寒冬；寒冬的共同原因是承诺超过了能力。<\/p>\n<h2>为什么重要<\/h2>\n<p>它让你对「AI 又要改变一切」的宣传保持节奏感：先看想法，再看数据与算力能不能兑现。<\/p>\n<h2>详解<\/h2>\n<p>第一次浪潮是符号主义，把知识写成符号和规则，撞上知识获取瓶颈。第二次是专家系统，把狭窄领域的经验写成 if-then，维护成本高、遇新情况失灵。第三次是深度学习，2012 年 ImageNet 突破，2020 年后规模定律和大模型把它推到语言和科学。<\/p>\n<p>两次寒冬不是技术完全失败，而是演示只在玩具问题上成立，却被说成通用智能，经费和信心随后撤出。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 AI 一直匀速进步——它是浪潮式推进。\n<\/li><li>\n别以为寒冬说明方向错了——常常是承诺超过了当时条件。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 2 章：七十年，三次浪潮<\/td><td>本章核心概念之一<\/td><td>AI 历史是符号主义、专家系统、深度学习三次浪潮，中间夹着两次寒冬；寒冬的共同原因是承诺超过了能力。<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\nc05 规模定律、c06 数据算力算法三角\n<\/ul>", "kind": "concept", "title": "三次浪潮与两次寒冬"}, "c05": {"html": "<div class=\"source-badge\">📖 出处：hello-ai.pdf · p.16<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c04\">三次浪潮与两次寒冬<\/a><\/span><\/div><h1>规模定律<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 ｜ <strong>涉及章节<\/strong>：第 2 章：七十年，三次浪潮\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>在一定范围内，模型的损失随参数量、数据量、计算量增加，按可预测的幂律下降。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把「把模型做大」从赌博变成工程，是大模型军备竞赛的直接理由。<\/p>\n<h2>详解<\/h2>\n<p>2020 年前后，研究者发现损失和规模之间不是随机关系，而是近似幂律。按比例增加参数、数据和算力，性能大概会沿已知曲线改善。行业因此敢投入几万块 GPU 和几亿元训练。<\/p>\n<p>它不是万能：会遇到数据用尽、收益递减、能耗和成本上升；也无法保证模型在需要精确事实或承担责任的任务上可靠。规模买得到能力，买不到真实性。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为规模定律永远有效——它只在「一定范围内」成立。\n<\/li><li>\n别以为模型越大越可靠——能力和真实性是两件事。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 2 章：七十年，三次浪潮<\/td><td>本章核心概念之一<\/td><td>在一定范围内，模型的损失随参数量、数据量、计算量增加，按可预测的幂律下降。<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\nc04 三次浪潮、c26 涌现与思维链\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（规模定律）<\/summary><div class=\"depth-body\"><h2>0. 先要解决什么<\/h2>\n<p>「把模型做大，效果就会变好」听起来像经验之谈。但 2020 年前后，研究者发现它可以用一条相对稳定的曲线描述：损失随参数量、数据量、计算量按幂律下降。<\/p>\n<p>这条曲线把「大模型」从赌博变成预算问题：花多少钱、买多少数据、换多少性能，可以估算。<\/p>\n<h2>1. 依赖链：什么是幂律<\/h2>\n<p>幂律的形式：<\/p>\n<div class=\"katex-block\">L(x)=L_\\infty + a x^{-b}<\/div>\n<ul><li>\n<span class=\"katex-inline\">x<\/span> 是规模（参数量、数据量或计算量）。\n<\/li><li>\n<span class=\"katex-inline\">L_\\infty<\/span> 是规模无限大时的损失下限，不可能降到 0。\n<\/li><li>\n<span class=\"katex-inline\">a<\/span> 是常数，<span class=\"katex-inline\">b&gt;0<\/span> 是衰减指数。\n<\/li><li>\n<span class=\"katex-inline\">x<\/span> 越大，第二项越小，但永远不为负。\n<\/ul>\n<p>在双对数坐标里，<span class=\"katex-inline\">L-L_\\infty<\/span> 与 <span class=\"katex-inline\">x<\/span> 近似一条直线，斜率是 <span class=\"katex-inline\">-b<\/span>。这就是「幂律」名字的来源。<\/p>\n<h2>2. 三个规模轴<\/h2>\n<p><strong>参数量 <span class=\"katex-inline\">N<\/span><\/strong>：模型有多少权重。从几千万到几千亿。<\/p>\n<p><strong>数据量 <span class=\"katex-inline\">D<\/span><\/strong>：训练用多少 token。从几十亿到几万亿。<\/p>\n<p><strong>计算量 <span class=\"katex-inline\">C<\/span><\/strong>：训练总共做多少次浮点运算，近似：<\/p>\n<div class=\"katex-block\">C\\approx 6ND<\/div>\n<p>6 来自前向和反向的乘加次数。这个公式让你能从参数和数据估算算力账单。<\/p>\n<h2>3. 早期结论：越大越好<\/h2>\n<p>2020 年的缩放定律论文给出经验拟合：损失与 <span class=\"katex-inline\">N<\/span>、<span class=\"katex-inline\">D<\/span>、<span class=\"katex-inline\">C<\/span> 分别呈幂律。在固定计算预算下，他们建议优先增大模型，数据相对次要。<\/p>\n<p>这直接推动了「千亿参数」竞赛。但它有一个前提：数据量不能太小，否则模型会过拟合；也不能无限大，因为高质量文本有限。<\/p>\n<h2>4. 后续修正：计算最优分配<\/h2>\n<p>2022 年的 Chinchilla 结论修正了配比：在固定计算预算下，参数和数据应该<strong>同比例<\/strong>增长，而不是只堆参数。经验比例大约是每个参数配 20 个 token。<\/p>\n<p>用 <span class=\"katex-inline\">C\\approx6ND<\/span> 推：若 <span class=\"katex-inline\">C<\/span> 固定，<span class=\"katex-inline\">N<\/span> 和 <span class=\"katex-inline\">D<\/span> 的乘积固定。损失对两者的敏感度不同，最优解在某个配比上。只增参数不增数据，模型会「记不住」；只增数据不增参数，模型「装不下」。<\/p>\n<p>这条修正让行业从「参数越大越好」转向「参数和数据平衡」，同样预算下性能更好。<\/p>\n<h2>5. 数值算例<\/h2>\n<p>设某模型 <span class=\"katex-inline\">N=10^9<\/span>（10 亿参数），按 20 token/参数配数据：<\/p>\n<div class=\"katex-block\">D=20\\times10^9=2\\times10^{10}\\ \\text{token}<\/div>\n<p>计算量：<\/p>\n<div class=\"katex-block\">C\\approx6\\times10^9\\times2\\times10^{10}=1.2\\times10^{20}\\ \\text{FLOPs}<\/div>\n<p>一张 A100 峰值约 <span class=\"katex-inline\">3\\times10^{14}<\/span> FLOP/s，按 40% 利用率：<\/p>\n<div class=\"katex-block\">t=\\frac{1.2\\times10^{20}}{0.4\\times3\\times10^{14}}\\approx10^6\\ \\text{秒}\\approx11.6\\ \\text{天}<\/div>\n<p>一块卡要十几天，一百块卡约几小时。这个估算让你能判断「训练一个十亿模型」是什么量级。<\/p>\n<h2>6. 为什么不可能一直变大<\/h2>\n<ul><li>\n<strong>数据上限<\/strong>：高质量公开文本是有限资源，重复训练收益递减。\n<\/li><li>\n<strong>算力成本<\/strong>：损失每降一点，计算量按幂律增加，边际收益越来越小。\n<\/li><li>\n<strong>能耗与散热<\/strong>：万卡集群的电力、冷却、故障率都是工程瓶颈。\n<\/li><li>\n<strong>能力不等于可靠性<\/strong>：规模提升基准分数，不保证事实准确、价值观正确、长任务可靠。\n<\/ul>\n<p>所以前沿实验室同时在做：更好的数据配比、合成数据、架构改进、推理时计算、工具使用。规模只是其中一条轴。<\/p>\n<h2>7. 反例：只堆参数会怎样<\/h2>\n<p>固定 <span class=\"katex-inline\">D=10^{10}<\/span>，把 <span class=\"katex-inline\">N<\/span> 从 <span class=\"katex-inline\">10^9<\/span> 增到 <span class=\"katex-inline\">10^{11}<\/span>。参数多了 100 倍，但每个参数只见到 0.1 个 token，严重欠训练。模型在训练集上表现尚可，在新数据上很差——它没有足够样本学会泛化。<\/p>\n<p>这就是「大而空」：参数量漂亮，实际能力不如配比合理的小模型。<\/p>\n<h2>8. 后文连接<\/h2>\n<p>规模定律解释大模型为什么出现；涌现讲「大到一定程度后突然会做新任务」；思维链和推理模型则说明，除了训练规模，推理时多花计算也能换能力。三条路都在扩大「计算换能力」的边界。<\/p>\n<h2>9. 差生自查<\/h2>\n<ol><li>\n幂律里的 <span class=\"katex-inline\">L_\\infty<\/span> 是什么？规模无限大时的损失下限。\n<\/li><li>\n<span class=\"katex-inline\">C\\approx6ND<\/span> 怎么来的？前向和反向的乘加大致是参数乘 token 的 6 倍。\n<\/li><li>\nChinchilla 修正了什么？参数和数据要同比例增长，不是只堆参数。\n<\/li><li>\n为什么不能无限变大？数据有限、成本上升、边际收益递减、可靠性不随规模保证。\n<\/li><li>\n只堆参数的反例是什么？参数多但每个参数见的 token 太少，欠训练。\n<\/ol><\/div><\/details>", "kind": "concept", "title": "规模定律"}, "c06": {"html": "<div class=\"source-badge\">📖 出处：hello-ai.pdf · p.16<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c04\">三次浪潮与两次寒冬<\/a><\/span><\/div><h1>数据、算力、算法三角<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 ｜ <strong>涉及章节<\/strong>：第 2 章：七十年，三次浪潮\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>2012 年深度学习突破靠三件事同时到位：大数据、GPU 算力、可训练的多层网络算法。<\/p>\n<h2>为什么重要<\/h2>\n<p>它纠正「算法更聪明所以赢了」的单一叙事，也解释为什么同一套算法在别的年代跑不起来。<\/p>\n<h2>详解<\/h2>\n<p>ImageNet 提供一千四百万张标注图片；GPU 原本为游戏渲染设计，恰好擅长并行矩阵运算；多层网络、反向传播、ReLU 等零件让深网络可训练。三者缺一不可。<\/p>\n<p>只讲神经网络赢了，会漏掉数据与算力的工程条件。今天的大模型仍然是这个三角的放大版。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为算法是唯一变量——数据和算力同样关键。\n<\/li><li>\n别以为 GPU 是为 AI 发明的——它原本用于图形渲染。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 2 章：七十年，三次浪潮<\/td><td>本章核心概念之一<\/td><td>2012 年深度学习突破靠三件事同时到位：大数据、GPU 算力、可训练的多层网络算法。<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\nc05 规模定律、c17 卷积神经网络\n<\/ul>", "kind": "concept", "title": "数据、算力、算法三角"}, "c07": {"html": "<div class=\"source-badge\">📖 出处：hello-ai.pdf · p.27<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c03\">四种能力：识别、预测、生成、决策<\/a><\/span><\/div><h1>A* 搜索<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：第 3 章：不只是神经网络\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>A* 给每个待展开节点算 f(n)=g(n)+h(n)，优先展开 f 最小的；h 从不高估时保证最短路。<\/p>\n<h2>为什么重要<\/h2>\n<p>导航、游戏寻路至今用它；它也是理解「搜索 + 启发式」的入口。<\/p>\n<h2>详解<\/h2>\n<p>g(n) 是从起点到 n 的实际代价，h(n) 是到终点的估计代价。h 用直线距离时，永远小于等于真实路程，这叫可采纳。A* 因此既不会错过最短路，又比盲目搜索少展开很多节点。<\/p>\n<p>h 估计得越准，搜索越快；h 高估时可能找不到最优解。启发式是「便宜的猜测」，不是精确答案。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 A* 一定最快——它的效率取决于启发式质量。\n<\/li><li>\n别以为启发式越乐观越好——高估会破坏最优性保证。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 3 章：不只是神经网络<\/td><td>本章核心概念之一<\/td><td>A* 给每个待展开节点算 f(n)=g(n)+h(n)，优先展开 f 最小的；h 从不高估时保证最短路。<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\nc08 规则系统、c09 强化学习\n<\/ul>", "kind": "concept", "title": "A* 搜索"}, "c08": {"html": "<div class=\"source-badge\">📖 出处：hello-ai.pdf · p.27<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c03\">四种能力：识别、预测、生成、决策<\/a><\/span><\/div><h1>规则系统<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 ｜ <strong>涉及章节<\/strong>：第 3 章：不只是神经网络\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>规则系统把人写的 if-then 规则串起来做判断，透明、可审计、可精确控制，但写不完、难适应变化。<\/p>\n<h2>为什么重要<\/h2>\n<p>它今天仍在银行反欺诈、医疗禁忌、航空检查里工作，也是智能体安全约束的底层。<\/p>\n<h2>详解<\/h2>\n<p>规则系统的优点是每一条判断都能解释、能审计、能精确关闭。缺点是知识获取瓶颈：世界太复杂，规则写不完，规则多了还会互相打架。专家系统在 1980 年代就撞上这堵墙。<\/p>\n<p>现代做法常是组合：模型给概率和候选，规则加硬约束。删除文件、转账、部署这类不可逆操作，最后必须过规则或人工确认。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为规则系统已经过时——它在需要精确控制的地方不可替代。\n<\/li><li>\n别以为规则和模型只能二选一——现代系统常把两者串起来。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 3 章：不只是神经网络<\/td><td>本章核心概念之一<\/td><td>规则系统把人写的 if-then 规则串起来做判断，透明、可审计、可精确控制，但写不完、难适应变化。<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\nc07 A* 搜索、c34 权限与人在回路\n<\/ul>", "kind": "concept", "title": "规则系统"}, "c09": {"html": "<div class=\"source-badge\">📖 出处：hello-ai.pdf · p.27<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c08\">规则系统<\/a><\/span><\/div><h1>强化学习与探索利用<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：第 3 章：不只是神经网络\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>强化学习让智能体在环境里试错
