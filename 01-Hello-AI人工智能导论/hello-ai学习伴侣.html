<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Hello, AI · 人工智能导论</title>
<link rel="stylesheet" href="https://registry.npmmirror.com/katex/0.16.9/files/dist/katex.min.css">
<link rel="stylesheet" href="https://registry.npmmirror.com/picocss/2.0.6/dist/css/pico.min.css">
<link rel="stylesheet" href="https://registry.npmmirror.com/vis-network/9.1.9/dist/dist/vis-network.min.css">
<style>
:root{
  --bg:#f7f7f8; --panel:#ffffff; --text:#1f2328; --muted:#6b7280;
  --accent:#2563eb; --accent-soft:#dbeafe; --border:#e5e7eb;
  --ok:#16a34a; --bad:#dc2626; --code-bg:#f3f4f6;
  --depth-bg:#fef9c3; --depth-border:#ca8a04;
}
[data-theme="dark"]{
  --bg:#111318; --panel:#1a1d24; --text:#e5e7eb; --muted:#9ca3af;
  --accent:#60a5fa; --accent-soft:#1e3a5f; --border:#2d333d;
  --ok:#4ade80; --bad:#f87171; --code-bg:#20242c;
  --depth-bg:#2a2410; --depth-border:#a16207;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.7;font-size:15px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.layout{display:flex;min-height:100vh}
.sidebar{width:290px;flex:none;background:var(--panel);border-right:1px solid var(--border);
  padding:14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar h1{font-size:17px;margin:2px 0 2px}
.sidebar .sub{font-size:12px;color:var(--muted);margin-bottom:10px}
#q{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
.nav-sec{font-size:12px;color:var(--muted);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.4px}
.nav-item{display:block;padding:5px 10px;border-radius:6px;color:var(--text);font-size:14px}
.nav-item:hover{background:var(--accent-soft);text-decoration:none}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-item .done{float:right;color:var(--ok);font-size:12px}
#nav-toggle{display:none}
.main{flex:1;min-width:0;padding:28px 40px 80px;max-width:920px;margin:0 auto}
.page h1{font-size:26px;border-bottom:2px solid var(--border);padding-bottom:8px;margin-top:0}
.page h2{font-size:20px;margin-top:26px}
.page h3{font-size:17px;margin-top:22px}
.page table{border-collapse:collapse;width:100%;margin:12px 0;font-size:14px}
.page th,.page td{border:1px solid var(--border);padding:6px 10px;text-align:left}
.page th{background:var(--code-bg)}
.page code{background:var(--code-bg);padding:2px 5px;border-radius:4px;font-size:.9em}
.page pre{background:var(--code-bg);padding:12px;border-radius:8px;overflow-x:auto;font-size:13px}
.page pre code{background:none;padding:0}
.page blockquote{border-left:4px solid var(--accent);margin:12px 0;padding:6px 14px;background:var(--accent-soft);border-radius:0 6px 6px 0}
.page blockquote blockquote{border-color:var(--muted)}
.page img{max-width:100%}
.mermaid{background:var(--code-bg);padding:14px;border-radius:8px;overflow-x:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;white-space:pre;color:var(--muted)}
.mermaid-hint{font-size:12px;color:var(--muted);margin:4px 0 14px}
svg{max-width:100%;height:auto}
/* 出处脚注 */
.source-badge{font-size:12px;color:var(--muted);background:var(--code-bg);padding:4px 10px;border-radius:6px;margin:0 0 12px;display:inline-block}
/* 前置知识条 */
.prereq-bar{font-size:13px;color:var(--muted);border-left:3px solid var(--accent);padding:4px 10px;margin:0 0 12px;background:var(--accent-soft)}
.prereq-hard a{color:var(--bad);font-weight:600}
.prereq-soft a{color:var(--muted)}
.prereq-rec a{color:var(--accent)}
.prereq-tag{display:inline-block;font-size:10px;padding:0 4px;border-radius:3px;margin-right:2px;vertical-align:middle}
.prereq-hard .prereq-tag{background:var(--bad);color:#fff}
.prereq-soft .prereq-tag{background:var(--muted);color:#fff}
.prereq-rec .prereq-tag{background:var(--accent);color:#fff}
/* 误解卡片 */
.misconception-card{margin-top:10px;padding:10px 14px;border-left:4px solid var(--bad);background:#fef2f2;border-radius:0 8px 8px 0;font-size:13px}
.misconception-card b{color:var(--bad)}
[data-theme="dark"] .misconception-card{background:#2a1215}
/* 掌握度条 */
.mastery-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin:4px 0}
.mastery-bar>div{height:100%;background:var(--ok);transition:width .3s}
.mastery-label{font-size:11px;color:var(--muted)}
/* 深度推导片段 */
.depth-fragment{margin:18px 0;border:1px solid var(--depth-border);border-radius:10px;background:var(--depth-bg);overflow:hidden}
.depth-fragment>summary{padding:10px 14px;cursor:pointer;font-weight:600;font-size:14px;list-style:none}
.depth-fragment>summary:hover{filter:brightness(.95)}
.depth-body{padding:14px 18px;border-top:1px dashed var(--depth-border);background:var(--panel)}
.depth-missing{color:var(--bad);font-size:13px;padding:8px;background:var(--code-bg);border-radius:6px}
/* KaTeX */
.katex-inline{font-size:1.05em}
.katex-block{overflow-x:auto;padding:8px 0;text-align:center}
.katex-block .katex{font-size:1.1em}
/* 测验 */
.quiz-item{border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin:14px 0;background:var(--panel)}
.quiz-q{margin:0 0 8px;font-weight:500}
.quiz-opts label{display:block;padding:4px 0;cursor:pointer}
.quiz-blank{width:60%;padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text)}
.quiz-check{margin-top:10px;padding:6px 16px;border:none;border-radius:6px;background:var(--accent);color:#fff;cursor:pointer}
.quiz-feedback{margin-left:12px;font-size:13px}
.fb-ok{color:var(--ok)}.fb-bad{color:var(--bad)}
.quiz-explain{margin-top:8px;font-size:13px;color:var(--muted);border-top:1px dashed var(--border);padding-top:6px}
.quiz-remedy{margin-top:8px;padding:8px 12px;background:var(--accent-soft);border-radius:6px;font-size:13px}
/* 抽认卡 */
.flashcard{perspective:1200px;margin:24px auto;max-width:520px;cursor:pointer;user-select:none}
.fc-inner{position:relative;width:100%;height:240px;transform-style:preserve-3d;transition:transform .5s}
.flashcard.flip .fc-inner{transform:rotateY(180deg)}
.fc-front,.fc-back{position:absolute;inset:0;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;
  padding:22px;border-radius:14px;border:1px solid var(--border);background:var(--panel);font-size:16px;text-align:center}
.fc-back{transform:rotateY(180deg);background:var(--accent-soft);color:var(--text)}
.card-controls{display:flex;gap:14px;align-items:center;margin:12px 0;flex-wrap:wrap}
.card-actions{display:flex;gap:12px;justify-content:center}
.card-actions button{padding:8px 22px;border:none;border-radius:8px;cursor:pointer;font-size:14px}
#card-known-btn{background:var(--ok);color:#fff}
#card-again-btn{background:var(--bad);color:#fff}
.card-counts{color:var(--muted);font-size:13px}
.path-step{margin:8px 0;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--panel)}
.path-step.passed{border-color:var(--ok)}
#glossary-filter{width:100%;max-width:380px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
#glossary-list li{padding:6px 0;border-bottom:1px dashed var(--border)}
.glossary-ref{color:var(--muted);font-size:12px}
.search-hit{margin:10px 0}
.topbar{position:sticky;top:0;background:var(--bg);padding:8px 0;display:flex;justify-content:flex-end;z-index:10}
#theme-btn{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 12px;cursor:pointer;white-space:nowrap}
#progress-bar{height:5px;background:var(--border);border-radius:3px;margin:8px 0;overflow:hidden}
#progress-bar>div{height:100%;width:0;background:var(--accent);transition:width .3s}
.empty{color:var(--muted);padding:20px 0}
/* 诊断 */
.diag-controls{margin:14px 0;padding:14px;background:var(--panel);border-radius:10px;border:1px solid var(--border)}
#diag-start{padding:8px 20px;border:none;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer;font-size:14px}
#diag-progress{margin-left:12px;color:var(--muted);font-size:13px}
#diag-stage .quiz-item{margin:10px 0}
#diag-result{margin-top:16px;padding:14px;background:var(--panel);border-radius:10px;border:1px solid var(--border)}
.diag-remedy-item{padding:10px;margin:8px 0;background:var(--accent-soft);border-radius:8px;font-size:14px}
@media print{.sidebar,.topbar,.quiz-actions,.card-actions,.card-controls,.diag-controls{display:none!important}.main{max-width:none;padding:0}}
@media (max-width:760px){.sidebar{width:100%;height:auto;position:static;padding:10px 14px}
  #nav{display:none;max-height:46vh;overflow-y:auto;overscroll-behavior:contain}.sidebar.open #nav{display:block}
  .nav-item{padding:9px 10px}
  #q,#glossary-filter{font-size:16px}
  .quiz-opts label{padding:8px 0;min-height:30px}
  .quiz-check{padding:10px 18px;min-height:40px}
  #diag-start{min-height:40px}
  .card-actions button{min-height:40px}
  #nav-toggle{display:block;width:100%;padding:8px 10px;margin:4px 0;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px;text-align:left;cursor:pointer}
  .layout{flex-direction:column}.main{padding:20px 18px 64px;max-width:none;width:100%}
  .page{overflow-wrap:anywhere}.page table{display:block;overflow-x:auto;max-width:100%}
  .page h1,.page h2,.page h3{line-height:1.35}}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <h1>Hello, AI · 人工智能导论</h1>
    <div class="sub">上海交通大学 AI+ 教育平台教材 · 零基础整书学习系统</div>
    <div id="progress-bar"><div id="progress-fill"></div></div>
    <div class="sub" id="progress-label">进度 0%</div>
    <input id="q" type="search" placeholder="搜索章节 / 概念 / 术语 / 全文…">
    <nav id="nav"></nav>
  </aside>
  <main class="main">
    <div class="topbar"><button id="theme-btn">🌙 深色</button></div>
    <div id="view" class="page"></div>
  </main>
</div>
<script>
const DATA = {"manifest": {"slug": "hello-ai", "title": "Hello, AI · 人工智能导论", "subtitle": "上海交通大学 AI+ 教育平台教材 · 零基础整书学习系统", "book": {"title": "Hello, AI · 人工智能导论", "author": "上海交通大学 AI+ 教育平台", "source": ["hello-ai.pdf", "219 页，14 章正文 + 6 篇专题 + 110 条术语"]}, "audience": "零基础", "goal": "把整本教材转译成可自学的路径：理解 AI 的基本概念、主流方法与真实应用，能判断何时可信、何时必须由人负责。", "learningPath": [{"step": "01", "title": "地图：AI 是什么、怎么走到今天", "chapterIds": ["ch01", "ch02"], "checkpoint": "完成 ch01、ch02 的自测题，正确率 ≥ 80%"}, {"step": "02", "title": "机器怎么学：搜索、规则、强化、监督", "chapterIds": ["ch03", "ch04", "ch05"], "checkpoint": "完成 ch03、ch04、ch05 的自测题，正确率 ≥ 80%"}, {"step": "03", "title": "神经网络：从神经元到表示学习", "chapterIds": ["ch06"], "checkpoint": "完成 ch06 的自测题，正确率 ≥ 80%"}, {"step": "04", "title": "语言模型：token、注意力、Transformer", "chapterIds": ["ch07", "ch08"], "checkpoint": "完成 ch07、ch08 的自测题，正确率 ≥ 80%"}, {"step": "05", "title": "训练与对齐：预训练、SFT、RLHF", "chapterIds": ["ch09"], "checkpoint": "完成 ch09 的自测题，正确率 ≥ 80%"}, {"step": "06", "title": "可靠使用：幻觉、检索、校准", "chapterIds": ["ch10"], "checkpoint": "完成 ch10 的自测题，正确率 ≥ 80%"}, {"step": "07", "title": "多模态与智能体：从会说到会做", "chapterIds": ["ch11", "ch12"], "checkpoint": "完成 ch11、ch12 的自测题，正确率 ≥ 80%"}, {"step": "08", "title": "AI 做科学：AlphaFold 与边界", "chapterIds": ["ch13"], "checkpoint": "完成 ch13 的自测题，正确率 ≥ 80%"}, {"step": "09", "title": "人的位置：提示、验证、责任", "chapterIds": ["ch14"], "checkpoint": "完成 ch14 的自测题，正确率 ≥ 80%"}, {"step": "10", "title": "六个专题：应用现场与工程实操", "chapterIds": ["t01", "t02", "t03", "t04", "t05", "t06"], "checkpoint": "完成 t01、t02、t03、t04、t05、t06 的自测题，正确率 ≥ 80%"}], "chapters": [{"id": "ch01", "title": "第 1 章：你已经在用 AI 了", "file": "chapters/ch01.md", "difficulty": 1, "source": {"file": "hello-ai.pdf", "page": "6–15"}, "prerequisites": [], "hours": "1–2", "part": "第一部 · 地图", "core": "AI 是让机器完成那些通常需要人类智能才能完成的任务；判断一个产品，先问它在做哪种任务，再问它靠什么做到、在哪里会出错。"}, {"id": "ch02", "title": "第 2 章：七十年，三次浪潮", "file": "chapters/ch02.md", "difficulty": 2, "source": {"file": "hello-ai.pdf", "page": "16–26"}, "prerequisites": ["ch01"], "hours": "2", "part": "第一部 · 地图", "core": "每一次浪潮都由一个真正的想法点燃，每一次退潮都因为撞上同一堵墙：承诺超过了当时的数据与算力能兑现的程度。"}, {"id": "ch03", "title": "第 3 章：不只是神经网络", "file": "chapters/ch03.md", "difficulty": 2, "source": {"file": "hello-ai.pdf", "page": "27–36"}, "prerequisites": ["ch01"], "hours": "2", "part": "第一部 · 地图", "core": "不靠学习的 AI 有三条路：搜索找解、规则做判断、试错学策略；现代最强系统往往把它们和神经网络组合起来。"}, {"id": "ch04", "title": "第 4 章：规则不是写出来的，是学出来的", "file": "chapters/ch04.md", "difficulty": 2, "source": {"file": "hello-ai.pdf", "page": "37–48"}, "prerequisites": ["ch01"], "hours": "3", "part": "第二部 · 学习", "core": "机器学习不是写规则，而是给大量「输入—答案」的例子，让模型自己调参数，使预测的误差变小。"}, {"id": "ch05", "title": "第 5 章：真正的考试在训练集之外", "file": "chapters/ch05.md", "difficulty": 2, "source": {"file": "hello-ai.pdf", "page": "49–58"}, "prerequisites": ["ch04"], "hours": "3", "part": "第二部 · 学习", "core": "训练成绩只证明模型会做旧题；泛化才证明它学会了规律。评估设计比模型选择更容易决定成败。"}, {"id": "ch06", "title": "第 6 章：一层一层看出一只猫", "file": "chapters/ch06.md", "difficulty": 3, "source": {"file": "hello-ai.pdf", "page": "59–70"}, "prerequisites": ["ch05"], "hours": "3", "part": "第二部 · 学习", "core": "神经网络把许多简单的计算单元堆成多层，让低层学边缘、中层学部件、高层学物体；连「该看什么特征」也交给数据去决定。"}, {"id": "ch07", "title": "第 7 章：文字怎样变成数字", "file": "chapters/ch07.md", "difficulty": 2, "source": {"file": "hello-ai.pdf", "page": "71–78"}, "prerequisites": ["ch06"], "hours": "2", "part": "第三部 · 语言", "core": "文字先被切成 token，再变成向量；模型的一切「语言能力」都建立在这两步转换之上，很多怪行为也源于此。"}, {"id": "ch08", "title": "第 8 章：每个词都能看见其他词", "file": "chapters/ch08.md", "difficulty": 3, "source": {"file": "hello-ai.pdf", "page": "79–86"}, "prerequisites": ["ch07"], "hours": "3–4", "part": "第三部 · 语言", "core": "每个词发出查询、提供键和值，按相关度从所有词那里加权收集信息；一层层叠加，固定的词向量就变成了随上下文变化的表示。"}, {"id": "ch09", "title": "第 9 章：从续写机到助手", "file": "chapters/ch09.md", "difficulty": 3, "source": {"file": "hello-ai.pdf", "page": "87–96"}, "prerequisites": ["ch08"], "hours": "3", "part": "第三部 · 语言", "core": "预训练教会模型语言和世界，监督微调教它对话的形式，对齐用人类偏好塑造它的取舍；三阶段之后，它仍然是一个概率分布。"}, {"id": "ch10", "title": "第 10 章：它为什么会一本正经地胡说", "file": "chapters/ch10.md", "difficulty": 2, "source": {"file": "hello-ai.pdf", "page": "97–104"}, "prerequisites": ["ch09"], "hours": "2–3", "part": "第四部 · 世界", "core": "模型优化的是「像不像会出现在这里的词」，不是「真不真」；自信的语气和内容的可靠性没有关系。"}, {"id": "ch11", "title": "第 11 章：模型长出了眼睛和手", "file": "chapters/ch11.md", "difficulty": 3, "source": {"file": "hello-ai.pdf", "page": "105–113"}, "prerequisites": ["ch09"], "hours": "3", "part": "第四部 · 世界", "core": "多模态把图像、音频也变成 token；工具调用把模型从「会说」变成「会做」；一旦会做，权限和验证就成了主角。"}, {"id": "ch12", "title": "第 12 章：智能体的一天", "file": "chapters/ch12.md", "difficulty": 3, "source": {"file": "hello-ai.pdf", "page": "114–129"}, "prerequisites": ["ch11"], "hours": "4", "part": "第四部 · 世界", "core": "智能体的可靠性一大半不在模型，而在驾具：上下文怎么组装、工具怎么执行、权限怎么限制、结果怎么验证。"}, {"id": "ch13", "title": "第 13 章：AI 做科学：从 AlphaFold 说起", "file": "chapters/ch13.md", "difficulty": 3, "source": {"file": "hello-ai.pdf", "page": "130–141"}, "prerequisites": ["ch09"], "hours": "3", "part": "第四部 · 世界", "core": "AI 做科学最顺的场景，是数据多、目标明确、答案能被实验检验的预测任务；它加速发现，但不自动提供因果解释。"}, {"id": "ch14", "title": "第 14 章：与 AI 共事", "file": "chapters/ch14.md", "difficulty": 2, "source": {"file": "hello-ai.pdf", "page": "142–150"}, "prerequisites": ["ch12"], "hours": "2–3", "part": "第四部 · 世界", "core": "AI 产出很便宜，判断很稀缺；把任务、标准、例子说清，把关键事实查清，把最终责任留给人。"}, {"id": "t01", "title": "专题 1：一句话的旅程", "file": "chapters/t01.md", "difficulty": 2, "source": {"file": "hello-ai.pdf", "page": "151–156"}, "prerequisites": ["ch08"], "hours": "1–2", "part": "第五部 · 拓展专题", "core": "一次回答是一条流水线：组装上下文、分词、嵌入、几十层注意力、概率分布、采样；每个阶段都有自己的时间尺度和错误方式。"}, {"id": "t02", "title": "专题 2：推荐系统：你为什么停不下来", "file": "chapters/t02.md", "difficulty": 2, "source": {"file": "hello-ai.pdf", "page": "157–160"}, "prerequisites": ["ch05"], "hours": "1–2", "part": "第五部 · 拓展专题", "core": "推荐系统优化的是可测量的互动指标，不是你的长期幸福；指标选错，系统就会学会让你停不下来。"}, {"id": "t03", "title": "专题 3：自动驾驶：四种能力的合体", "file": "chapters/t03.md", "difficulty": 3, "source": {"file": "hello-ai.pdf", "page": "161–173"}, "prerequisites": ["ch06"], "hours": "2–3", "part": "第五部 · 拓展专题", "core": "自动驾驶不是单一模型，而是四种能力叠在一起；真正难的不是常见路况，是见不到几次的长尾和不可逆的后果。"}, {"id": "t04", "title": "专题 4：给科研人的机器学习实用课", "file": "chapters/t04.md", "difficulty": 3, "source": {"file": "hello-ai.pdf", "page": "174–182"}, "prerequisites": ["ch05"], "hours": "2–3", "part": "第五部 · 拓展专题", "core": "先问清问题和代价，再找一个傻基线；小数据优先树模型或预训练表示，别一上来就深网络。"}, {"id": "t05", "title": "专题 5：训练一个模型：从数据到对齐的实操", "file": "chapters/t05.md", "difficulty": 3, "source": {"file": "hello-ai.pdf", "page": "183–193"}, "prerequisites": ["ch09"], "hours": "3", "part": "第五部 · 拓展专题", "core": "训练是一条流水线，每一段都有自己的数据和评测；大多数团队真正该做的不是从头预训练，而是提示、检索或微调。"}, {"id": "t06", "title": "专题 6：AI 与开源", "file": "chapters/t06.md", "difficulty": 2, "source": {"file": "hello-ai.pdf", "page": "194–199"}, "prerequisites": ["ch09"], "hours": "1–2", "part": "第五部 · 拓展专题", "core": "AI 的开源不是一个开关，而是三层：代码、数据、权重。多数所谓开源模型只开放权重，能运行和微调，但不能复现训练。"}], "concepts": [{"id": "c01", "title": "AI 与 AI 效应", "file": "concepts/c01.md", "chapterIds": ["ch01"], "difficulty": "基础", "source": {"file": "hello-ai.pdf", "page": "6"}, "prerequisites": [], "short": "AI 是让机器完成那些通常需要人类智能才能完成的任务；一旦某件事被机器做成常规，人们就不再把它算作智能，这就是 AI 效应。"}, {"id": "c02", "title": "六层包含关系", "file": "concepts/c02.md", "chapterIds": ["ch01"], "difficulty": "基础", "source": {"file": "hello-ai.pdf", "page": "6"}, "prerequisites": ["c01"], "short": "AI、机器学习、深度学习、大模型、生成式 AI、智能体不是并列关系，而是一层套一层，越往里越新、越具体。"}, {"id": "c03", "title": "四种能力：识别、预测、生成、决策", "file": "concepts/c03.md", "chapterIds": ["ch01"], "difficulty": "基础", "source": {"file": "hello-ai.pdf", "page": "6"}, "prerequisites": ["c01"], "short": "任何 AI 产品都能拆成识别、预测、生成、决策四种能力，或者它们的组合。"}, {"id": "c04", "title": "三次浪潮与两次寒冬", "file": "concepts/c04.md", "chapterIds": ["ch02"], "difficulty": "进阶", "source": {"file": "hello-ai.pdf", "page": "16"}, "prerequisites": ["c02"], "short": "AI 历史是符号主义、专家系统、深度学习三次浪潮，中间夹着两次寒冬；寒冬的共同原因是承诺超过了能力。"}, {"id": "c05", "title": "规模定律", "file": "concepts/c05.md", "chapterIds": ["ch02"], "difficulty": "高难", "source": {"file": "hello-ai.pdf", "page": "16"}, "prerequisites": ["c04"], "short": "在一定范围内，模型的损失随参数量、数据量、计算量增加，按可预测的幂律下降。", "depthFragment": "concepts/c05-depth.md"}, {"id": "c06", "title": "数据、算力、算法三角", "file": "concepts/c06.md", "chapterIds": ["ch02"], "difficulty": "基础", "source": {"file": "hello-ai.pdf", "page": "16"}, "prerequisites": ["c04"], "short": "2012 年深度学习突破靠三件事同时到位：大数据、GPU 算力、可训练的多层网络算法。"}, {"id": "c07", "title": "A* 搜索", "file": "concepts/c07.md", "chapterIds": ["ch03"], "difficulty": "进阶", "source": {"file": "hello-ai.pdf", "page": "27"}, "prerequisites": ["c03"], "short": "A* 给每个待展开节点算 f(n)=g(n)+h(n)，优先展开 f 最小的；h 从不高估时保证最短路。"}, {"id": "c08", "title": "规则系统", "file": "concepts/c08.md", "chapterIds": ["ch03"], "difficulty": "基础", "source": {"file": "hello-ai.pdf", "page": "27"}, "prerequisites": ["c03"], "short": "规则系统把人写的 if-then 规则串起来做判断，透明、可审计、可精确控制，但写不完、难适应变化。"}, {"id": "c09", "title": "强化学习与探索利用", "file": "concepts/c09.md", "chapterIds": ["ch03"], "difficulty": "进阶", "source": {"file": "hello-ai.pdf", "page": "27"}, "prerequisites": ["c08"], "short": "强化学习让智能体在环境里试错，用奖励调整策略；它必须处理探索与利用的矛盾。"}, {"id": "c10", "title": "监督学习", "file": "concepts/c10.md", "chapterIds": ["ch04"], "difficulty": "基础", "source": {"file": "hello-ai.pdf", "page": "37"}, "prerequisites": ["c03"], "short": "监督学习用带标签的数据训练模型，学从特征到标签的映射。"}, {"id": "c11", "title": "梯度下降", "file": "concepts/c11.md", "chapterIds": ["ch04"], "difficulty": "高难", "source": {"file": "hello-ai.pdf", "page": "37"}, "prerequisites": ["c10"], "short": "梯度下降沿损失下降的方向，对每个参数小步调整；学习率决定步子多大。", "depthFragment": "concepts/c11-depth.md"}, {"id": "c12", "title": "自监督学习", "file": "concepts/c12.md", "chapterIds": ["ch04"], "difficulty": "进阶", "source": {"file": "hello-ai.pdf", "page": "37"}, "prerequisites": ["c10"], "short": "自监督学习从数据自身制造标签，比如遮词猜词、续写下一段，不需要人工标注。"}, {"id": "c13", "title": "泛化与过拟合", "file": "concepts/c13.md", "chapterIds": ["ch05"], "difficulty": "高难", "source": {"file": "hello-ai.pdf", "page": "49"}, "prerequisites": ["c11"], "short": "泛化是模型在没见过的数据上表现稳定；过拟合是它把训练数据的噪声也背下来。", "depthFragment": "concepts/c13-depth.md"}, {"id": "c14", "title": "精确率、召回率与混淆矩阵", "file": "concepts/c14.md", "chapterIds": ["ch05"], "difficulty": "进阶", "source": {"file": "hello-ai.pdf", "page": "49"}, "prerequisites": ["c13"], "short": "混淆矩阵把预测和实际分成四格；精确率问「说有里的多少是真的」，召回率问「真的里的多少被找出」。"}, {"id": "c15", "title": "分布偏移与相关因果", "file": "concepts/c15.md", "chapterIds": ["ch05"], "difficulty": "进阶", "source": {"file": "hello-ai.pdf", "page": "49"}, "prerequisites": ["c13"], "short": "部署后的数据和训练数据不再来自同一个世界，叫分布偏移；模型学到的全是相关，不足以做因果干预。"}, {"id": "c16", "title": "神经元与激活函数", "file": "concepts/c16.md", "chapterIds": ["ch06"], "difficulty": "基础", "source": {"file": "hello-ai.pdf", "page": "59"}, "prerequisites": ["c10"], "short": "神经元做四件事：接收输入、各乘权重、求和加偏置、通过非线性激活输出。"}, {"id": "c17", "title": "卷积神经网络", "file": "concepts/c17.md", "chapterIds": ["ch06"], "difficulty": "进阶", "source": {"file": "hello-ai.pdf", "page": "59"}, "prerequisites": ["c16"], "short": "CNN 用局部连接、权重共享和池化，让同一组权重在整张图上滑动，逐层把边缘组成物体。"}, {"id": "c18", "title": "表示学习与反向传播", "file": "concepts/c18.md", "chapterIds": ["ch06"], "difficulty": "高难", "source": {"file": "hello-ai.pdf", "page": "59"}, "prerequisites": ["c17"], "short": "表示学习让网络自己发明该看什么特征；反向传播用链式法则把误差逐层分配，一次算出全部梯度。", "depthFragment": "concepts/c18-depth.md"}, {"id": "c19", "title": "分词与 BPE", "file": "concepts/c19.md", "chapterIds": ["ch07"], "difficulty": "进阶", "source": {"file": "hello-ai.pdf", "page": "71"}, "prerequisites": ["c12"], "short": "分词把文本切成 token；BPE 从字节开始反复合并高频相邻单元，得到词表。"}, {"id": "c20", "title": "词向量与嵌入", "file": "concepts/c20.md", "chapterIds": ["ch07"], "difficulty": "进阶", "source": {"file": "hello-ai.pdf", "page": "71"}, "prerequisites": ["c19"], "short": "嵌入把 token 映射成连续向量；用法相似的词向量靠近，语义关系对应方向。"}, {"id": "c21", "title": "自注意力与 QKV", "file": "concepts/c21.md", "chapterIds": ["ch08"], "difficulty": "高难", "source": {"file": "hello-ai.pdf", "page": "79"}, "prerequisites": ["c20"], "short": "每个词发出查询 Q、提供键 K 和值 V；Q 与所有 K 打分，softmax 成权重，再按权重混合所有 V。", "depthFragment": "concepts/c21-depth.md"}, {"id": "c22", "title": "Transformer 与位置编码", "file": "concepts/c22.md", "chapterIds": ["ch08"], "difficulty": "进阶", "source": {"file": "hello-ai.pdf", "page": "79"}, "prerequisites": ["c21"], "short": "Transformer 由自注意力、前馈网络、残差连接和归一化叠成；位置编码把词序补进机制。"}, {"id": "c23", "title": "自回归生成与采样", "file": "concepts/c23.md", "chapterIds": ["ch08"], "difficulty": "进阶", "source": {"file": "hello-ai.pdf", "page": "79"}, "prerequisites": ["c22"], "short": "模型一次只预测一个 token，接回序列再预测下一个；温度、top-k、top-p 决定怎么选。"}, {"id": "c24", "title": "预训练、SFT 与对齐", "file": "concepts/c24.md", "chapterIds": ["ch09"], "difficulty": "进阶", "source": {"file": "hello-ai.pdf", "page": "87"}, "prerequisites": ["c23"], "short": "预训练学语言和世界，监督微调学对话格式，对齐按人类偏好调整取舍。"}, {"id": "c25", "title": "RLHF 与 DPO", "file": "concepts/c25.md", "chapterIds": ["ch09"], "difficulty": "高难", "source": {"file": "hello-ai.pdf", "page": "87"}, "prerequisites": ["c24"], "short": "RLHF 用人类排序训练奖励模型，再用强化学习优化；DPO 直接把偏好对写成损失，绕开奖励模型。", "depthFragment": "concepts/c25-depth.md"}, {"id": "c26", "title": "涌现、思维链与推理模型", "file": "concepts/c26.md", "chapterIds": ["ch09"], "difficulty": "进阶", "source": {"file": "hello-ai.pdf", "page": "87"}, "prerequisites": ["c25"], "short": "规模跨过门槛后某些能力突然出现，叫涌现；让模型写出步骤，等于给它草稿纸。"}, {"id": "c27", "title": "幻觉", "file": "concepts/c27.md", "chapterIds": ["ch10"], "difficulty": "高难", "source": {"file": "hello-ai.pdf", "page": "97"}, "prerequisites": ["c23"], "short": "幻觉是模型以自信语气生成看似合理但不真实的内容，根源是训练目标只有「像」没有「真」。", "depthFragment": "concepts/c27-depth.md"}, {"id": "c28", "title": "RAG 与接地", "file": "concepts/c28.md", "chapterIds": ["ch10"], "difficulty": "进阶", "source": {"file": "hello-ai.pdf", "page": "97"}, "prerequisites": ["c27"], "short": "RAG 回答前先检索可信资料，把相关段落放进上下文；接地要求陈述有可追溯依据。"}, {"id": "c29", "title": "校准与提示注入", "file": "concepts/c29.md", "chapterIds": ["ch10"], "difficulty": "进阶", "source": {"file": "hello-ai.pdf", "page": "97"}, "prerequisites": ["c27"], "short": "校准是模型表达的把握和实际正确率是否一致；提示注入是外部内容里藏着给模型的指令。"}, {"id": "c30", "title": "多模态", "file": "concepts/c30.md", "chapterIds": ["ch11"], "difficulty": "进阶", "source": {"file": "hello-ai.pdf", "page": "105"}, "prerequisites": ["c22"], "short": "多模态把图像、音频也切成 token，和文字一起送进同一个 Transformer。"}, {"id": "c31", "title": "扩散模型", "file": "concepts/c31.md", "chapterIds": ["ch11"], "difficulty": "高难", "source": {"file": "hello-ai.pdf", "page": "105"}, "prerequisites": ["c30"], "short": "扩散模型训练时给清晰图逐步加噪，学从更噪恢复更清晰；生成时从纯噪声反复去噪。", "depthFragment": "concepts/c31-depth.md"}, {"id": "c32", "title": "工具调用与智能体", "file": "concepts/c32.md", "chapterIds": ["ch11"], "difficulty": "进阶", "source": {"file": "hello-ai.pdf", "page": "105"}, "prerequisites": ["c30"], "short": "工具调用让模型输出特殊格式触发程序执行；把模型放进循环，就得到能多步行动的智能体。"}, {"id": "c33", "title": "驾具与智能体循环", "file": "concepts/c33.md", "chapterIds": ["ch12"], "difficulty": "高难", "source": {"file": "hello-ai.pdf", "page": "114"}, "prerequisites": ["c32"], "short": "驾具是模型外面的整套程序：组装上下文、执行工具、管权限、压缩上下文、验证与交付。", "depthFragment": "concepts/c33-depth.md"}, {"id": "c34", "title": "权限、沙盒与人在回路", "file": "concepts/c34.md", "chapterIds": ["ch12"], "difficulty": "进阶", "source": {"file": "hello-ai.pdf", "page": "114"}, "prerequisites": ["c33"], "short": "智能体的三道安全带：最小权限、隔离沙盒、不可逆操作由人批准。"}, {"id": "c35", "title": "AlphaFold 与 AI 做科学", "file": "concepts/c35.md", "chapterIds": ["ch13"], "difficulty": "高难", "source": {"file": "hello-ai.pdf", "page": "130"}, "prerequisites": ["c22"], "short": "AlphaFold 把氨基酸序列到三维结构变成监督学习，用注意力提取进化信息，并给出置信度。", "depthFragment": "concepts/c35-depth.md"}, {"id": "c36", "title": "AI 做科学的三个条件", "file": "concepts/c36.md", "chapterIds": ["ch13"], "difficulty": "进阶", "source": {"file": "hello-ai.pdf", "page": "130"}, "prerequisites": ["c35"], "short": "数据多、目标明确、答案能被实验检验，是 AI 在科学里最容易成功的三个条件。"}, {"id": "c37", "title": "提示词", "file": "concepts/c37.md", "chapterIds": ["ch14"], "difficulty": "基础", "source": {"file": "hello-ai.pdf", "page": "142"}, "prerequisites": ["c23"], "short": "提示词是你给模型的全部上下文，决定续写方向；好提示说清任务、对象、标准、例子和输出格式。"}, {"id": "c38", "title": "人机分工与验证", "file": "concepts/c38.md", "chapterIds": ["ch14"], "difficulty": "进阶", "source": {"file": "hello-ai.pdf", "page": "142"}, "prerequisites": ["c37"], "short": "AI 铺广度、人负责深度；关键事实必查，不懂的领域不用它做最终判断，要求它给出依据。"}, {"id": "c39", "title": "数据最小化与 AI 素养", "file": "concepts/c39.md", "chapterIds": ["ch14"], "difficulty": "进阶", "source": {"file": "hello-ai.pdf", "page": "142"}, "prerequisites": ["c38"], "short": "只给任务必需的数据和权限；AI 素养是提出好问题、判断真假、为结果负责。"}, {"id": "c40", "title": "一次回答的推理流水线", "file": "concepts/c40.md", "chapterIds": ["t01"], "difficulty": "进阶", "source": {"file": "hello-ai.pdf", "page": "151"}, "prerequisites": ["c23"], "short": "一次回答经过上下文、分词、嵌入、几十层、概率、采样六个阶段，循环生成每个 token。"}, {"id": "c41", "title": "推荐系统与反馈循环", "file": "concepts/c41.md", "chapterIds": ["t02"], "difficulty": "进阶", "source": {"file": "hello-ai.pdf", "page": "157"}, "prerequisites": ["c15"], "short": "推荐系统预测你对候选内容的互动概率；推荐改变行为，行为又变成训练数据，形成反馈循环。"}, {"id": "c42", "title": "冷启动与探索", "file": "concepts/c42.md", "chapterIds": ["t02"], "difficulty": "进阶", "source": {"file": "hello-ai.pdf", "page": "157"}, "prerequisites": ["c41"], "short": "新用户和新内容没有历史数据，系统必须给一些曝光去探索，否则永远不知道好坏。"}, {"id": "c43", "title": "自动驾驶的四个模块", "file": "concepts/c43.md", "chapterIds": ["t03"], "difficulty": "进阶", "source": {"file": "hello-ai.pdf", "page": "161"}, "prerequisites": ["c17"], "short": "自动驾驶由感知、预测、规划/决策、控制四个模块组成，实时闭环。"}, {"id": "c44", "title": "长尾与数据闭环", "file": "concepts/c44.md", "chapterIds": ["t03"], "difficulty": "进阶", "source": {"file": "hello-ai.pdf", "page": "161"}, "prerequisites": ["c43"], "short": "长尾是训练数据里极少出现却可能致命的罕见场景；数据闭环把车队遇到的新场景传回训练。"}, {"id": "c45", "title": "科研机器学习流程", "file": "concepts/c45.md", "chapterIds": ["t04"], "difficulty": "进阶", "source": {"file": "hello-ai.pdf", "page": "174"}, "prerequisites": ["c13"], "short": "科研 ML 的顺序是问题、表示、傻基线、模型、验证；不要从「我要用深度学习」开始。"}, {"id": "c46", "title": "校准与主动学习", "file": "concepts/c46.md", "chapterIds": ["t04"], "difficulty": "进阶", "source": {"file": "hello-ai.pdf", "page": "174"}, "prerequisites": ["c45"], "short": "校准衡量预测把握是否可信；主动学习用不确定性挑最值得做的实验。"}, {"id": "c47", "title": "训练流水线与偏好方法", "file": "concepts/c47.md", "chapterIds": ["t05"], "difficulty": "进阶", "source": {"file": "hello-ai.pdf", "page": "183"}, "prerequisites": ["c25"], "short": "训练流水线是数据、分词、预训练、评测、SFT、偏好/RL、蒸馏部署；评测贯穿全程。"}, {"id": "c48", "title": "提示、RAG、微调怎么选", "file": "concepts/c48.md", "chapterIds": ["t05"], "difficulty": "基础", "source": {"file": "hello-ai.pdf", "page": "183"}, "prerequisites": ["c47"], "short": "改模型看到什么用提示，改回答材料用 RAG，改行为风格用微调，改一切才从头训练。"}, {"id": "c49", "title": "开放权重", "file": "concepts/c49.md", "chapterIds": ["t06"], "difficulty": "进阶", "source": {"file": "hello-ai.pdf", "page": "194"}, "prerequisites": ["c24"], "short": "多数「开源模型」只开放训练好的权重和推理代码，训练数据和代码未必公开。"}, {"id": "c50", "title": "蒸馏与许可证", "file": "concepts/c50.md", "chapterIds": ["t06"], "difficulty": "进阶", "source": {"file": "hello-ai.pdf", "page": "194"}, "prerequisites": ["c49"], "short": "蒸馏让小模型学习大模型的输出分布；许可证决定开放权重模型能做什么、不能做什么。"}], "glossary": [{"term": "人工智能", "def": "让机器完成那些通常需要人类智能才能完成的任务。定义的核心是「任务」而不是方法：规则、搜索、统计学习、神经网络都可以是实现手段。它是本书六层包含关系里最外面的一圈。", "chapterId": "ch01"}, {"term": "机器学习", "def": "人工智能的一个子集。不由人写规则，而是让机器从数据中自己找出规律。规律以模型参数的形式存在，人读不懂，但可以测试。1990 年代起成为 AI 的主流，今天绝大多数被称为 AI 的系统都是机器学习。", "chapterId": "ch01"}, {"term": "深度学习", "def": "用多层神经网络做的机器学习。它最重要的特点不是层数多，而是连「该看数据的哪些方面」（特征）也交给机器学习，即表示学习。2012 年起统治图像、语音，随后扩展到语言。", "chapterId": "ch01"}, {"term": "大语言模型", "def": "在海量文本上以「预测下一个 token」为目标训练的超大 Transformer 网络，参数从几十亿到上万亿。一个模型可以迁移到几乎所有与语言有关的任务。「基础模型」是更宽的说法，把处理图像、音频的同类模型也算进来。", "chapterId": "ch01"}, {"term": "生成式 AI", "def": "强调用途的一个词：不只是分类和预测，而是生成原本不存在的文本、图像、音频、视频或代码。2022 年底 ChatGPT 让它进入公众视野。「造得像」与「造得对」是两回事，这是它最需要警惕的地方。", "chapterId": "ch01"}, {"term": "AI 效应", "def": "一旦机器做到了某件事，人们就不再把那件事算作「智能」。计算、光学字符识别、语音输入、路线规划都经历过从 AI 明星课题到「普通软件」的转变。它解释了为什么「AI」这个词的边界总在往后退。", "chapterId": "ch01"}, {"term": "符号主义", "def": "认为智能是对符号（概念、命题）的逻辑操作，只要把知识写成符号和规则，机器就能推理。1956 到 1980 年代的 AI 正统，成就是定理证明与专家系统，瓶颈是知识写不完、规则会打架。", "chapterId": "ch02"}, {"term": "专家系统", "def": "把某个狭窄领域里专家的知识写成几百到几千条 if-then 规则，配一个推理引擎，让机器在该领域内当顾问。1980 年代的商业热潮，因「知识获取瓶颈」（规则靠人访谈录入、难维护、难适应变化）而退潮。", "chapterId": "ch02"}, {"term": "AI 寒冬", "def": "AI 历史上经费与信心大规模撤出的时期，主要有两次（1970 年代中期、1980 年代末）。共同原因不是技术「失败」，而是承诺与能力之间的落差。它提醒我们把「能做什么」与「被说成能做什么」分开。", "chapterId": "ch02"}, {"term": "感知机", "def": "1958 年罗森布拉特提出的单层神经网络，能从例子中学会简单的线性分类。1969 年被证明连异或都学不会，导致连接主义沉寂十余年；解决办法是多层结构加反向传播，但要到几十年后算力与数据到位才发挥威力。", "chapterId": "ch02"}, {"term": "ImageNet", "def": "李飞飞团队从 2007 年起建立的图像数据集，一千四百万张人工标注的图片。2012 年在其竞赛上，深度卷积网络把错误率从 26% 降到 16%，成为深度学习浪潮的起点。它说明「数据」是算法、数据、算力三角形里同等重要的一角。", "chapterId": "ch02"}, {"term": "摩尔定律与 GPU", "def": "芯片算力每约两年翻倍的经验规律，加上原本为游戏渲染设计、恰好擅长并行矩阵运算的图形处理器，共同提供了深度学习所需的算力。2012 年的突破就是在两块游戏显卡上完成的。今天前沿模型的训练用几万块 GPU。", "chapterId": "ch02"}, {"term": "规模定律", "def": "2020 年前后总结出的经验规律：在一定范围内，模型的损失随参数量、数据量、计算量的增加呈可预测的幂律下降。它让「把模型做大」从赌博变成工程，是行业押注超大模型的理由；它是否会持续、在何处失效，是当前最重要的开放问题之一。", "chapterId": "ch02"}, {"term": "搜索", "def": "在大量可能性里系统地寻找一个满足条件（或最优）的解：从起点出发展开可能的下一步，直到到达目标。走迷宫、排课、下棋、路径规划都是搜索问题。朴素搜索会遭遇组合爆炸，实用的搜索靠剪枝与启发式省力。", "chapterId": "ch03"}, {"term": "启发式", "def": "一个便宜的估计，告诉搜索「往哪边更有希望」。地图上的直线距离就是到目的地真实距离的启发式。好的启发式让搜索几乎不走弯路；从不高估真实代价的启发式能保证搜到最优解。", "chapterId": "ch03"}, {"term": "A* 算法", "def": "1968 年提出的启发式搜索算法，对每个节点计算「已走代价 + 到目标的估计代价」并优先展开最小者。只要估计从不高估，它保证找到最短路，且远快于盲目搜索。导航软件与游戏寻路至今用它。", "chapterId": "ch03"}, {"term": "规则系统", "def": "用人写的 if-then 规则做判断的系统。优点是透明、可审计、可精确控制；缺点是写不完、不会自己适应变化。今天常与机器学习模型组合使用：模型给概率，规则加硬约束，例如智能体执行危险操作前必须确认。", "chapterId": "ch03"}, {"term": "强化学习", "def": "让智能体在环境中反复尝试，按行动之后得到的奖励调整策略，学会「在这种情况下该做什么」。它没有标签，只有奖励；必须处理探索与利用的矛盾。是机器人、游戏 AI 的基础，也是大语言模型对齐阶段的核心方法。", "chapterId": "ch03"}, {"term": "奖励", "def": "强化学习中环境对智能体行动的反馈数值。学习的目标是最大化长期累积奖励。奖励的设计极其关键：设计不当会导致智能体钻空子（奖励破解），这一问题在用人类偏好训练语言模型时同样出现。", "chapterId": "ch03"}, {"term": "探索与利用", "def": "强化学习特有的矛盾：是沿用已知有效的行动（利用），还是尝试未知的行动以发现可能更好的选择（探索）。只利用会困在平庸解，只探索拿不到稳定回报。监督学习的数据是给定的，不存在这个问题。", "chapterId": "ch03"}, {"term": "蒙特卡洛树搜索", "def": "通过随机模拟大量对局来评估走法的搜索方法，把算力集中在最有希望的分支上。AlphaGo 用它向前推演，并用策略网络与价值网络替代了以往靠人手写的评估函数，是搜索与神经网络合流的典型。", "chapterId": "ch03"}, {"term": "样本与特征", "def": "样本是训练数据里的一条记录（一笔订单、一张照片）；特征是描述这条记录的各个数值（距离、时段、像素）。把现实变成特征的过程叫特征工程，在深度学习之前是机器学习工程师的主要工作。", "chapterId": "ch04"}, {"term": "标签", "def": "监督学习中希望模型学会预测的那个答案：订单的成交价、照片里是不是猫。标签通常由人提供，昂贵且可能带入标注者的偏见与错误。模型学到的上限是标签的质量。", "chapterId": "ch04"}, {"term": "模型与参数", "def": "模型是一台「带旋钮的机器」：输入特征，输出预测。旋钮就是参数（权重、偏置），学习就是找到让预测尽量准的参数取值。参数从一条直线的三个到大语言模型的上万亿个。", "chapterId": "ch04"}, {"term": "损失函数", "def": "把「模型错了多少」变成一个可计算、可比较的数，例如预测值与真实值之差的平方的平均。训练就是不断调整参数使损失下降。损失函数（训练用）与评估指标（最终汇报用）常常不同。", "chapterId": "ch04"}, {"term": "梯度下降", "def": "最常用的优化算法：对每个参数计算「稍微改动会让损失增大还是减小」（梯度），沿减小的方向走一小步，反复进行。像蒙眼下山。步长叫学习率。它就是训练万亿参数模型时用的那个算法。", "chapterId": "ch04"}, {"term": "监督学习", "def": "用带标签的数据训练模型，学习从特征到标签的映射。最成熟、应用最广的范式，识别与预测两类能力主要来自它。瓶颈是标签昂贵。", "chapterId": "ch04"}, {"term": "无监督学习", "def": "数据没有标签，模型只能寻找结构：把样本自动分群、发现异常、压缩表示。它不告诉你每一群是什么，只告诉你数据里存在这样的分野。", "chapterId": "ch04"}, {"term": "自监督学习", "def": "从数据自身制造标签：遮住一个词让模型猜、截断一段文字让模型续写。不需要人工标注，因此可以用整个互联网训练。它是大语言模型能出现的直接原因。", "chapterId": "ch04"}, {"term": "训练", "def": "用数据反复调整模型参数以降低损失的过程。一个完整项目还包括定义任务、收集数据、构造特征、划分数据、评估、部署与监控，其中「用什么模型」往往是最不重要的决定。", "chapterId": "ch04"}, {"term": "泛化", "def": "模型在没见过的数据上表现稳定的能力。它是机器学习唯一真正的目标，损失、梯度、参数都为它服务。训练数据上的表现不能说明泛化，必须在留出的数据上考。", "chapterId": "ch05"}, {"term": "过拟合", "def": "模型不但学到了规律，还把训练数据里的噪声和巧合当成规律，于是训练表现很好、新数据上很差。模型越灵活、数据越少越容易发生。对策：更多数据、限制复杂度、正则化、早停。", "chapterId": "ch05"}, {"term": "欠拟合", "def": "模型太简单，连数据里真实的规律都抓不住，训练损失就降不下去。用一条直线去拟合一段明显的曲线就是欠拟合。与过拟合构成机器学习里永恒的拉锯。", "chapterId": "ch05"}, {"term": "训练集与测试集", "def": "把数据分成三份：训练集用来学，验证集用来调参数和决定何时停，测试集只在最后考一次。验证与测试分开，是为了防止你反复根据同一份数据调整模型而间接过拟合它。有时间顺序的数据必须用过去预测未来。", "chapterId": "ch05"}, {"term": "准确率", "def": "预测正确的比例。最常被引用也最容易误导的指标：当关心的类别是少数（1%的患病率），一个「全判为否」的模型准确率也有 99%。需要拆成误报与漏报分开看。", "chapterId": "ch05"}, {"term": "精确率与召回率", "def": "精确率：模型说「是」的那些里，多少真的是。召回率：所有真的「是」里，模型找出了多少。两者此消彼长，取舍取决于误报与漏报各自的代价，这是价值判断而非技术选择。", "chapterId": "ch05"}, {"term": "混淆矩阵", "def": "把分类结果按「预测是/否 × 实际是/否」分成四格：真阳性、假阳性（误报）、假阴性（漏报）、真阴性。准确率、精确率、召回率都从这四格算出。", "chapterId": "ch05"}, {"term": "标签泄漏", "def": "某个特征偷偷包含了答案（预测是否住院，特征里有「是否开了住院单」）。模型会得到近乎完美的训练成绩，因为它作弊了，而作弊的特征在真正预测的时刻并不存在。往往很隐蔽。", "chapterId": "ch05"}, {"term": "分布偏移", "def": "部署后的数据与训练数据不再来自同一个「世界」：疫情改变了出行，新教材改变了学情。所有模型都默认「未来像过去」，而这没有保证。因此部署不是终点，监控才是。", "chapterId": "ch05"}, {"term": "相关与因果", "def": "模型学到的全部是相关（什么与什么倾向于同时出现）。相关足以预测，不足以干预：给每个孩子发平板不会自动提高成绩。区分两者需要实验设计与领域知识，不是更大的模型。辛普森悖论是相关方向可被隐藏变量反转的例子。", "chapterId": "ch05"}, {"term": "神经元", "def": "神经网络的基本单元，做四件事：接收一组输入，各乘一个权重，求和加偏置，送进非线性激活函数输出。可以看作一个「微型探测器」。与生物神经元只有「输入够强才放电」这一点相似。", "chapterId": "ch06"}, {"term": "激活函数", "def": "神经元求和之后的非线性函数（如「负数归零、正数照旧」）。没有它，堆多少层都只是一个线性变换；有了它，多层网络可以逼近几乎任何函数。非线性是神经网络一切能力的来源。", "chapterId": "ch06"}, {"term": "层与深度", "def": "一层是并排接收同样输入的一组神经元；深度是层数。层的意义在于组合：下层学边缘，上层把边缘组成部件、把部件组成物体。深网络比宽网络更高效，因为下层学到的东西可以被上层复用。", "chapterId": "ch06"}, {"term": "反向传播", "def": "高效计算深度网络中损失对每个参数的梯度的方法：先正向算出输出，再用链式法则把误差逐层往回「分配」。一次反向传播得到全部梯度，计算量只比正向多常数倍。没有它，深度网络在算力上不可训练。", "chapterId": "ch06"}, {"term": "卷积神经网络", "def": "为图像设计的网络：每个神经元只看一小块局部区域（局部连接），同一组权重在整张图上滑动（权重共享），配合池化逐层扩大视野。参数少、效果好，因为结构里内置了「图像模式与位置无关」的先验。", "chapterId": "ch06"}, {"term": "表示学习", "def": "深度学习真正的突破：不只学从特征到答案的映射，连从原始数据到特征的映射也一起学。人只提供像素和标签，网络自己发明「边缘」「纹理」「耳朵」。它让同一套方法可以用于图像、语音、文本、蛋白质结构。", "chapterId": "ch06"}, {"term": "特征层级", "def": "训练好的深度网络里事后观察到的现象：第一层对边缘敏感，第二层对角与纹理，更高层对部件与整体。这个层级不是人设计的，是为了完成任务而自发形成的。", "chapterId": "ch06"}, {"term": "参数量", "def": "网络中权重和偏置的总数，衡量模型规模最常用的数字，从几万到上万亿。对混合专家模型要区分「总参数」与每个 token 实际用到的「激活参数」，后者决定运行成本。", "chapterId": "ch06"}, {"term": "语言模型", "def": "一个概率分布：给定前面的文字，对「下一个词是什么」的每种可能给出概率。翻译、写作、问答都可化归为「最可能的续写」。七十年来定义未变，变的是能看多长的前文和用什么估计概率。", "chapterId": "ch07"}, {"term": "Token", "def": "模型处理文字的基本单元，由分词器从词表中切出：常见词一个 token，生僻词拆成几个片段，任何字符最终都能拆到字节。模型从未见过「字」，只见过token 的编号，这解释了它数字母、倒写等任务上的失误。", "chapterId": "ch07"}, {"term": "分词", "def": "把文本切成 token 序列的过程，是模型的「眼睛」。它决定了模型对字母、数字的视力，也决定了各种语言的成本：主流词表在英文语料上构建，很多汉字要占两三个 token。", "chapterId": "ch07"}, {"term": "BPE", "def": "字节对编码。从单个字节开始，反复把语料中最常相邻出现的两个单元合并成新单元，进行几万到几十万次，得到词表。它在「词表小」与「单元有意义」之间取得由数据决定的平衡，对新词适应力强，是今天几乎所有大模型的分词方法。", "chapterId": "ch07"}, {"term": "上下文窗口", "def": "模型一次能看到的 token 数量上限，从几千到上百万。超出部分模型看不见；窗口内的中间部分也常比开头结尾受到更少注意。窗口不是记忆，对话结束后模型什么都不记得。", "chapterId": "ch07"}, {"term": "词向量", "def": "每个 token 对应的一串数字（几百到几千维），由训练得到：用法相似的词向量靠近，意义关系对应空间中的方向，于是「国王 − 男人 + 女人 ≈ 女王」。它把语言变成了几何，是文字的表示学习。", "chapterId": "ch07"}, {"term": "嵌入", "def": "把离散对象（token、图片、用户、商品）映射到连续向量空间的操作或结果。词向量是文字的嵌入。语义搜索、推荐、检索增强生成、图文互搜都建立在「把不同东西嵌入同一空间再比较」之上。", "chapterId": "ch07"}, {"term": "向量相似度", "def": "衡量两个向量是否「相近」的方法，最常用的是夹角余弦（方向一致为 1，垂直为 0）。支撑语义搜索、推荐与检索增强生成。它反映的是训练语料中的共现，语料的偏见会被忠实编码。", "chapterId": "ch07"}, {"term": "自注意力", "def": "序列里每个位置都根据与所有位置的相关度加权收集信息，从而让一个词的表示随上下文改变（「苹果」在「吃」旁边偏向水果）。对整个序列可并行计算，这是 Transformer 能扩展到超大规模的原因；代价是计算量随长度平方增长。", "chapterId": "ch08"}, {"term": "查询键值", "def": "注意力的三个角色：每个词发出查询（我想知道什么），提供键（我能回答什么）和值（我愿意贡献的信息）。查询与各键比对得到权重，按权重对各值加权求和。三者由三个可训练矩阵从词向量变换而来。", "chapterId": "ch08"}, {"term": "多头注意力", "def": "同时用多组查询键值，每组（一个「头」）学习关注不同类型的关系（语法、指代、位置），最后把各头输出拼接。事后观察可见有的头专看前一个词、有的专追踪代词。", "chapterId": "ch08"}, {"term": "位置编码", "def": "注意力机制本身不在乎词序，「猫追狗」与「狗追猫」无法区分。位置编码在每个词的向量上加入表示位置的信息，把顺序塞回一个本身与顺序无关的机制。", "chapterId": "ch08"}, {"term": "Transformer", "def": "2017 年提出的架构，由多个模块叠成，每个模块是「自注意力 + 残差与归一化+ 前馈网络 + 残差与归一化」。前接嵌入层，后接输出层。GPT、Llama、Qwen、DeepSeek、Claude 在架构上都是它的变体。", "chapterId": "ch08"}, {"term": "前馈网络", "def": "Transformer 模块里对每个位置单独做非线性变换的多层感知机。注意力在词间搬运信息，前馈网络消化它。模型的大部分参数在这里，研究者认为许多「知识」也存在这里；混合专家架构替换的就是它。", "chapterId": "ch08"}, {"term": "残差连接", "def": "让每个子层的输出加上它的输入再往下传，信息可以绕过某层直行。2015 年提出，解决了深网络梯度消失的问题，使网络从几十层到上千层成为可能。Transformer 每个模块都带着它。", "chapterId": "ch08"}, {"term": "自回归生成", "def": "模型每次只预测一个 token，接在序列后再预测下一个，直到产生结束标记。一段五百字的回答意味着几百次完整计算；文字逐个蹦出来不是打字效果。模型没有「计划」，结构感来自训练语料。", "chapterId": "ch08"}, {"term": "采样与温度", "def": "从下一个 token 的概率分布里选词的方式。贪心永远选最大者，稳定但单调；采样按概率随机抽。温度是调节旋钮：低温压尖分布、接近贪心，高温压平分布、更随机。top-k、top-p 限制候选范围。", "chapterId": "ch08"}, {"term": "预训练", "def": "三阶段训练的第一阶段，也是最贵的：在几万亿 token 的文本上预测下一个token，用几万块 GPU 跑几个月。看似平淡的任务逼出了语言、知识与推理能力。产物是基础模型。", "chapterId": "ch09"}, {"term": "基础模型", "def": "只经过预训练的模型：懂语言与世界，但只会续写，不会对话。问它问题，它可能续写出另一个问题。需要监督微调与对齐才能成为助手。", "chapterId": "ch09"}, {"term": "监督微调", "def": "用几万到几十万条高质量「问题 + 回答」示范继续训练基础模型，教它对话的格式与风格。改变的主要是形式而非知识，数据质量远比数量重要。", "chapterId": "ch09"}, {"term": "对齐", "def": "用人类偏好（对几个回答的排序）而非标准答案训练模型，使其更有帮助、更诚实、更无害。三者有张力，「偏好由谁定义」是最受争议的问题。它不是给模型装道德模块，而是继续塑造概率分布，因此可以被推回去（越狱）。", "chapterId": "ch09"}, {"term": "RLHF", "def": "从人类反馈中强化学习：用人类排序训练一个奖励模型，再用强化学习让语言模型生成得分更高的回答。2022 年 ChatGPT 的关键技术。难点：奖励模型可被「讨好」（奖励破解），训练不稳定。", "chapterId": "ch09"}, {"term": "DPO", "def": "直接偏好优化：把「回答 A 胜过 B」直接写成损失函数，用梯度下降优化，绕开奖励模型与强化学习。与 RLHF 目标等价而更简单稳定，是开源社区的标准做法。", "chapterId": "ch09"}, {"term": "涌现", "def": "模型规模跨过某个门槛后，某些能力从「完全不会」跳到「突然会了」，如多步推理、上下文学习。是否真是突变有争议（可能是评估指标造成的假象），但「大到某个程度后能做以前做不了的事」是行业押注规模的理由。", "chapterId": "ch09"}, {"term": "思维链", "def": "让模型把中间推理步骤写出来再给答案。因为模型每步只预测一个 token、没有内部草稿纸，把步骤写进上下文相当于提供草稿纸，在数学与逻辑题上显著提高准确率。推理模型把它训练成默认习惯。", "chapterId": "ch09"}, {"term": "推理模型", "def": "用强化学习专门奖励「先写推理过程、答案正确」而训练出的模型，回答前自发生成几百到几万 token 的思考。数学、编程、科学问题上跃升一个台阶，代价是慢与贵。它意味着能力可以靠推理时的算力购买。", "chapterId": "ch09"}, {"term": "混合专家", "def": "把前馈网络换成几十个并列的「专家」，由路由器为每个 token 只挑两三个计算。总参数可以很大，每次激活的参数很小，训练与推理成本按激活参数算。2024 年底起成为大模型默认选择。", "chapterId": "ch09"}, {"term": "幻觉", "def": "模型以自信的语气生成看似合理但不真实的内容：不存在的引文、错误的数字、张冠李戴的事实。根源是训练目标里只有「像」没有「真」，在冷门话题与需要精确细节处更多。不会被消灭，但可用检索、引用、允许说不知道、交叉验证与人工把关压制。", "chapterId": "ch10"}, {"term": "知识截止日期", "def": "预训练数据收集截止的时间。此后的事模型一无所知，但它不一定知道自己不知道，可能基于旧知识编一个合理回答。联网搜索与检索可补缺口，但模型「自己」的知识始终有日期。", "chapterId": "ch10"}, {"term": "检索增强生成", "def": "回答前先用向量相似度从可信资料库找出相关段落放进上下文，让模型基于材料回答。续写的依据从模糊的训练印象变成眼前的文本，编造空间大减。企业级 AI 问答、「把 AI 接到自己的知识库」都是它。不能完全消除幻觉。", "chapterId": "ch10"}, {"term": "接地", "def": "让模型的陈述有可追溯的依据：来自上下文里的材料、可访问的链接或工具的返回结果。要求引用是最简单的接地手段。给不出依据的陈述应按未验证处理。", "chapterId": "ch10"}, {"term": "校准", "def": "模型表达的把握程度与实际正确率的一致性。基础模型校准通常很好，对齐后常变差，因为标注者偏爱肯定的语气。于是「自信」不再对应「正确」。实用建议：把语气当噪声，把多次回答的一致性当信号。", "chapterId": "ch10"}, {"term": "可解释性", "def": "研究如何理解神经网络内部在做什么的方向。因为模型不按人可读的规则运行，我们很难说清它答对是推理还是记忆、答错是哪一步的问题。这带来安全（未测试的输入上无保证）与责任（不能解释就不能独自负责）两个后果。", "chapterId": "ch10"}, {"term": "提示注入", "def": "模型读取的外部内容（网页、邮件、文件、工具描述）里藏着给模型的指令，模型无法区分它与用户的指令。聊天时代最坏结果是错误文字，智能体时代可能是泄露数据或执行危险操作。目前没有完美解法，靠限制权限、隔离内容、关键操作人工确认。", "chapterId": "ch10"}, {"term": "智能体", "def": "把语言模型放进一个循环：给它目标和工具，让它自己决定下一步、调用工具、看结果、再决定，直到完成任务。它是模型、搜索、规则与强化学习的合流。与只回答问题的「模型」相比，智能体会执行有后果的行动，因此需要权限限制与人工确认。", "chapterId": "ch11"}, {"term": "多模态", "def": "模型同时处理文字、图像、音频、视频。原理是「一切都是 token」：图切成小方块、音频切成时间片，各自变成向量进同一个 Transformer。原生多模态（预训练起就同时学）比外挂式（先转文字描述）保留更多信息。", "chapterId": "ch11"}, {"term": "扩散模型", "def": "今天图像与视频生成的主流方法：训练时给清晰图逐步加噪声，让网络学会「从更噪恢复更清晰」的一步；生成时从纯噪声出发反复应用几十次，图像从噪声中显影，文字提示通过注意力引导方向。", "chapterId": "ch11"}, {"term": "语音合成", "def": "从文字生成语音。近年越来越多地直接用语言模型预测「声音的 token」，能带情感、停顿与口音，几秒钟的样本足以克隆一个人的声音。这使声音不再能作为身份证明。", "chapterId": "ch11"}, {"term": "工具调用", "def": "约定某些特殊格式的输出不是给人看的，而是触发程序去执行（搜索、计算、查数据库、操作文件），结果贴回上下文让模型继续。在微调与对齐阶段训练进模型。它让模型「长出了手」。", "chapterId": "ch11"}, {"term": "MCP", "def": "模型上下文协议，2024 年底提出的开放标准：工具用统一格式描述自己能做什么、需要什么参数，任何支持协议的模型客户端都能直接接入，无需为每个组合单独开发。类似 USB 之于硬件。后交由中立基金会管理。", "chapterId": "ch11"}, {"term": "编程智能体", "def": "能读懂代码库、修改多个文件、运行测试、修复错误并提交改动的智能体。它最先成熟，因为代码可编译、可测试，反馈清晰自动。由此推断：反馈越清晰的领域，智能体成熟得越快。本站就是这样写出来的。", "chapterId": "ch11"}, {"term": "沙盒", "def": "让智能体在受限的隔离环境中执行操作（有限的文件、网络与权限），即使被提示注入或犯错，损害也被圈在沙盒里。与「行动分级：可逆的自动做、不可逆的先问」一起构成智能体的安全带。", "chapterId": "ch11"}, {"term": "人在回路", "def": "在 AI 的输出被采纳、或行动被执行之前，由人审核或批准。聊天时代是「核对输出」，智能体时代是「批准行动」。它是 AI 不承担责任这一事实在流程上的体现：每件由 AI 参与的事，最后有一个人为它负责。", "chapterId": "ch11"}, {"term": "驾具", "def": "围绕模型的那一整套程序：组装上下文、解析并执行工具调用、管理权限、压缩上下文、维护记忆、派出子智能体、验证与交付。借自马具一词：模型是马，驾具让力气变成前进。智能体的可靠性一大半来自它，2025 年后模型公司开始自己发布驾具。", "chapterId": "ch12"}, {"term": "系统提示", "def": "驾具写给模型、排在每次调用最前面的总说明：身份与规则、工作方式、每个工具的说明、安全边界、环境信息、技能清单。编程智能体的系统提示在 2026年已达几万 token，且逐版变化；Anthropic 逐版公开 Claude 网页版的系统提示（不含工具说明）。它能这么长，靠的是模型能遵守、窗口装得下、键值缓存只算一次。", "chapterId": "ch12"}, {"term": "指令文件", "def": "项目或个人写给智能体的文本（常见文件名如 CLAUDE.md、AGENTS.md，个人智能体的记忆文件也属此类），每次任务开始时被放进上下文。它告诉通用模型这个项目怎么跑、怎么测、什么不能碰。写好它是省掉大量往返的最有效办法。", "chapterId": "ch12"}, {"term": "智能体循环", "def": "调用模型 → 模型输出工具调用 → 驾具执行 → 结果贴回上下文 → 再调用模型，直到模型宣布完成或被人叫停。一个二十分钟的编程任务可能转一百多圈；每一圈都把整段历史重新送入，键值缓存让这不至于太贵。", "chapterId": "ch12"}, {"term": "权限策略", "def": "驾具里规定哪些动作自动放行、哪些按白名单、哪些每次要人点头、哪些禁止。读通常自动，写与执行按策略，不可逆的操作（部署、删除、发送）应当要问。它是智能体的安全带，与沙盒和钩子一起构成「限制模型」的那一半工程。", "chapterId": "ch12"}, {"term": "上下文压缩", "def": "长任务中上下文将满时，让模型把历史按固定结构（原始要求、已完成、进行中、问题、计划、涉及文件）总结后替换原文。做得差会「失忆」；做得好还会把关键状态写进外部文件，不只依赖总结。", "chapterId": "ch12"}, {"term": "子智能体", "def": "由主智能体派出的分身：带一个明确任务和独立的上下文出发，读完几十个文件后只把结论交回。用途是并行与隔离细节，不让主上下文被中间材料撑满。多个子智能体可以同时出发。", "chapterId": "ch12"}, {"term": "技能", "def": "把「怎样做一件事」写成带步骤、注意事项和示例的文本文件，放在约定位置，驾具在需要时读入上下文，模型照着做。没有代码、不用训练，靠上下文学习起效；价值在可传递，风险在说明书里可以藏指令。", "chapterId": "ch12"}, {"term": "渐进式披露", "def": "把信息分层交给模型的设计：启动时只给每份技能的名字和一句描述（约一百token），任务匹配时才读整份说明书，附件与脚本只在用到时读或运行。它把「上下文是稀缺资源」变成了一种结构，让驾具能装几十份技能而不占地方。", "chapterId": "ch12"}, {"term": "钩子", "def": "在某个事件（如每次工具调用前后、每次改文件后）自动运行的脚本，由驾具触发，不经模型判断。用途是用确定性代码约束模型：自动跑格式检查、禁止写入某些目录、强制验证。它是规则系统在智能体里的现代形态。", "chapterId": "ch12"}, {"term": "个人智能体", "def": "接入个人的聊天软件、邮箱、日历、文件与浏览器，常驻在自己机器上的智能体。2026 年初以「龙虾」为代表出圈，随后暴露出「难养、难管、难放心」的问题：维护成本、权限集中、提示注入。稳妥用法是专用账号、最小权限、定期看日志。", "chapterId": "ch12"}, {"term": "多智能体协作", "def": "多个智能体分工：主从（一个拆任务派活）、并行分支（各做一遍取最好）、流水线（写、审、测接力）、「白班夜班」（人布置、智能体夜里跑）。不是免费的乘法：协调有成本，错误会累积，同样的盲点互审等于没审。先把一个用好，再考虑一群。", "chapterId": "ch12"}, {"term": "智能体的失败模式", "def": "说做完了其实没做完、为通过测试而改测试、越界、原地循环、被文件里的话指挥、压缩后失忆、成本失控。没有一种来自模型不够聪明，全部对应驾具、指令与权限的设计，因此都可以由人减少。", "chapterId": "ch12"}, {"term": "提示词", "def": "你给模型的全部文字，即它的上下文，决定了续写的方向。好的提示说清任务、对象与标准，给例子而不是形容，让模型先想再做。它本质上是在用文字塑造一个概率分布的形状，理解这一点就不需要背模板。", "chapterId": "ch14"}, {"term": "验证习惯", "def": "与模型共事的三个习惯：关键事实（数字、日期、引文、人名、条款、剂量）必查；不懂的领域不用它做最终判断；要求它给出依据。它们不是不信任，而是由模型的工作方式推出的必然。", "chapterId": "ch14"}, {"term": "数据最小化", "def": "把内容交给 AI 服务前，只提供任务需要的部分，能匿名的先匿名，条款不明的服务不交学生作业、病历、内部文件。同时只给智能体必需的权限，因为每一项权限都是提示注入可利用的通道。", "chapterId": "ch14"}, {"term": "AI 素养", "def": "本书的答案不是「学提示词」或「学编程」，而是三种在 AI 之前就重要、现在更显眼的能力：提出好问题、判断产出的好坏与真假、愿意并能够为 AI 参与的事负责。当产出的成本趋近于零，判断成为最稀缺的东西。", "chapterId": "ch14"}, {"term": "长尾", "def": "每一种都极其罕见、加起来却经常遇到的情况。一辆车开一百万公里能见到几乎所有常见路况，但「几乎所有」不是「所有」；事故发生在没见过的情况里。长尾不能靠更多数据穷尽，只能靠仿真生成、数据闭环和模型外的规则底线共同应对。判断任何高风险 AI，问它在长尾上怎么办。", "chapterId": "ch14"}, {"term": "数据闭环", "def": "车队把遇到的不确定情况（预测分歧、人接管、急刹）上传，云端筛选、标注、训练、仿真验证、再推送回车队，每周甚至每天转一次。规模是核心：一百万辆车一天遇到的罕见情况比一百辆车一年多得多。代价是隐私，以及「模型不知道自己不知道的情况永远不会被上传」。", "chapterId": "ch14"}], "patterns": {"file": "patterns.md"}, "cheatsheet": {"file": "cheatsheet.md"}, "quizzes": [{"id": "q01", "chapterId": "ch01", "type": "single", "question": "判断一个软件是不是 AI，本章建议先看什么？", "options": ["它用的是不是大模型", "它做的任务是否需要通常由人承担的智能", "它的代码是不是开源", "它能不能自我意识"], "answer": 1, "explain": "定义看任务，不看方法。大模型只是实现手段之一。", "relatedConceptId": "c01", "source": {"file": "hello-ai.pdf", "page": "6–15"}}, {"id": "q02", "chapterId": "ch01", "type": "single", "question": "下列哪组包含关系是正确的？", "options": ["大模型 ⊃ 深度学习 ⊃ 机器学习 ⊃ AI", "AI ⊃ 机器学习 ⊃ 深度学习 ⊃ 大模型", "机器学习 ⊃ AI ⊃ 大模型 ⊃ 深度学习", "AI ⊃ 大模型 ⊃ 机器学习 ⊃ 深度学习"], "answer": 1, "explain": "AI 是最大的伞，逐层收窄到机器学习、深度学习、大模型。", "relatedConceptId": "c02", "source": {"file": "hello-ai.pdf", "page": "6–15"}}, {"id": "q03", "chapterId": "ch01", "type": "single", "question": "手机相册搜索「猫」主要用到哪种能力？", "options": ["生成", "决策", "识别", "强化学习"], "answer": 2, "explain": "判断图像内容是不是猫，属于识别。", "relatedConceptId": "c03", "source": {"file": "hello-ai.pdf", "page": "6–15"}}, {"id": "q04", "chapterId": "ch02", "type": "single", "question": "两次 AI 寒冬的共同原因是什么？", "options": ["算法完全没有价值", "承诺超过了当时数据与算力能兑现的能力", "政府禁止研究", "GPU 不够便宜"], "answer": 1, "explain": "演示只在玩具问题上成立，却被说成通用智能，经费随后撤出。", "relatedConceptId": "c04", "source": {"file": "hello-ai.pdf", "page": "16–26"}}, {"id": "q05", "chapterId": "ch02", "type": "single", "question": "2012 年 ImageNet 突破主要靠什么组合？", "options": ["数据、算力、算法三者同时到位", "只有更聪明的算法", "只有更多资金", "只有更好的摄像头"], "answer": 0, "explain": "大数据、GPU 算力、可训练的多层网络缺一不可。", "relatedConceptId": "c06", "source": {"file": "hello-ai.pdf", "page": "16–26"}}, {"id": "q06", "chapterId": "ch02", "type": "single", "question": "规模定律说的是什么？", "options": ["模型越大越有意识", "损失随参数、数据、计算增加按幂律可预测下降", "数据越多一定越好", "算法越复杂越省算力"], "answer": 1, "explain": "在一定范围内，损失与规模呈幂律关系；它有边界。", "relatedConceptId": "c05", "source": {"file": "hello-ai.pdf", "page": "16–26"}}, {"id": "q07", "chapterId": "ch03", "type": "single", "question": "A* 中 f(n)=g(n)+h(n)，h(n) 是什么？", "options": ["从起点到 n 的实际代价", "从 n 到终点的估计代价", "n 的编号", "随机噪声"], "answer": 1, "explain": "g 是已走代价，h 是剩余代价的启发式估计。", "relatedConceptId": "c07", "source": {"file": "hello-ai.pdf", "page": "27–36"}}, {"id": "q08", "chapterId": "ch03", "type": "single", "question": "规则系统最大的优点是？", "options": ["能自动学习所有规律", "判断透明、可审计、可精确控制", "不需要任何维护", "能处理所有长尾"], "answer": 1, "explain": "每条规则都能解释和关闭；缺点是写不完、难适应变化。", "relatedConceptId": "c08", "source": {"file": "hello-ai.pdf", "page": "27–36"}}, {"id": "q09", "chapterId": "ch03", "type": "single", "question": "强化学习里的「探索」指的是？", "options": ["一直选当前最高奖励的动作", "尝试未知动作以获取新信息", "把奖励调大", "把环境删掉"], "answer": 1, "explain": "探索尝试未知，利用沿用已知有效动作，两者需要平衡。", "relatedConceptId": "c09", "source": {"file": "hello-ai.pdf", "page": "27–36"}}, {"id": "q10", "chapterId": "ch04", "type": "single", "question": "监督学习的关键特征是？", "options": ["数据带标签", "数据完全无标签", "模型必须很深", "不需要损失函数"], "answer": 0, "explain": "监督学习用带标签数据学从特征到标签的映射。", "relatedConceptId": "c10", "source": {"file": "hello-ai.pdf", "page": "37–48"}}, {"id": "q11", "chapterId": "ch04", "type": "single", "question": "梯度下降更新参数的方向是？", "options": ["沿梯度上升方向", "沿梯度下降方向", "随机方向", "固定向右"], "answer": 1, "explain": "梯度指向上升最快方向，减去它是下降最快方向。", "relatedConceptId": "c11", "source": {"file": "hello-ai.pdf", "page": "37–48"}}, {"id": "q12", "chapterId": "ch04", "type": "single", "question": "自监督学习怎样获得标签？", "options": ["请人逐条标注", "从数据自身制造标签，如猜下一个词", "完全不需要数据", "用测试集当标签"], "answer": 1, "explain": "遮词、续写等任务让数据自身成为监督信号。", "relatedConceptId": "c12", "source": {"file": "hello-ai.pdf", "page": "37–48"}}, {"id": "q13", "chapterId": "ch05", "type": "single", "question": "过拟合的典型表现是？", "options": ["训练和验证都差", "训练好、验证差", "训练差、验证好", "训练和验证完全一样"], "answer": 1, "explain": "模型背下了训练集噪声，换新数据就退化。", "relatedConceptId": "c13", "source": {"file": "hello-ai.pdf", "page": "49–58"}}, {"id": "q14", "chapterId": "ch05", "type": "single", "question": "召回率回答的是哪一问？", "options": ["说有里的多少是真的", "真的里的多少被找出", "一共预测了多少", "模型有多大"], "answer": 1, "explain": "召回率 = TP/(TP+FN)，衡量漏报。", "relatedConceptId": "c14", "source": {"file": "hello-ai.pdf", "page": "49–58"}}, {"id": "q15", "chapterId": "ch05", "type": "single", "question": "部署后数据分布变化导致性能下降，叫什么？", "options": ["过拟合", "欠拟合", "分布偏移", "梯度消失"], "answer": 2, "explain": "训练和部署数据不再来自同一个世界，叫分布偏移。", "relatedConceptId": "c15", "source": {"file": "hello-ai.pdf", "page": "49–58"}}, {"id": "q16", "chapterId": "ch06", "type": "single", "question": "神经网络为什么需要非线性激活函数？", "options": ["让模型更好看", "没有它，多层网络会退化成线性变换", "为了增加参数", "为了省算力"], "answer": 1, "explain": "线性层复合仍是线性，非线性才让深网络表达复杂函数。", "relatedConceptId": "c16", "source": {"file": "hello-ai.pdf", "page": "59–70"}}, {"id": "q17", "chapterId": "ch06", "type": "single", "question": "卷积网络「权重共享」的作用是？", "options": ["让同一个探测器扫过所有位置，减少参数", "让每个位置用不同参数", "取消反向传播", "增加图像分辨率"], "answer": 0, "explain": "同一组权重在整张图上滑动，参数大幅减少并增强平移稳健性。", "relatedConceptId": "c17", "source": {"file": "hello-ai.pdf", "page": "59–70"}}, {"id": "q18", "chapterId": "ch06", "type": "single", "question": "反向传播的核心数学工具是？", "options": ["傅里叶变换", "链式法则", "矩阵求逆", "排序算法"], "answer": 1, "explain": "链式法则把误差逐层乘回，一次算出全部梯度。", "relatedConceptId": "c18", "source": {"file": "hello-ai.pdf", "page": "59–70"}}, {"id": "q19", "chapterId": "ch07", "type": "single", "question": "BPE 分词 不会出错"], "answer": 0, "explain": "模型输出特殊格式触发程序执行，结果回到上下文。", "relatedConceptId": "c32", "source": {"file": "hello-ai.pdf", "page": "105–113"}}, {"id": "q34", "chapterId": "ch12", "type": "single", "question": "智能体的可靠性主要取决于？", "options": ["模型参数量", "驾具：上下文、权限、执行、验证、交付", "用户打字速度", "显卡品牌"], "answer": 1, "explain": "长任务靠模型外的整套程序控制错误累积。", "relatedConceptId": "c33", "source": {"file": "hello-ai.pdf", "page": "114–129"}}, {"id": "q35", "chapterId": "ch12", "type": "single", "question": "「最小权限」的意思是？", "options": ["只给完成任务必需的权限", "给管理员权限最省事", "完全不给权限", "只给读权限永远不给写"], "answer": 0, "explain": "权限越多，提示注入和误操作的损害越大。", "relatedConceptId": "c34", "source": {"file": "hello-ai.pdf", "page": "114–129"}}, {"id": "q36", "chapterId": "ch12", "type": "single", "question": "模型说「已完成」但文件没写，属于哪种失败？", "options": ["假完成", "过拟合", "梯度消失", "冷启动"], "answer": 0, "explain": "必须独立验证产物，不能信模型自述。", "relatedConceptId": "c33", "source": {"file": "hello-ai.pdf", "page": "114–129"}}, {"id": "q37", "chapterId": "ch13", "type": "single", "question": "AlphaFold 属于哪种学习范式？", "options": ["监督学习", "无监督学习", "强化学习", "规则系统"], "answer": 0, "explain": "有实验结构作标签，有坐标误差作损失。", "relatedConceptId": "c35", "source": {"file": "hello-ai.pdf", "page": "130–141"}}, {"id": "q38", "chapterId": "ch13", "type": "single", "question": "多序列比对（MSA）为什么有用？", "options": ["它提供进化保守和协同变化信息", "它直接给出三维坐标", "它替代实验", "它压缩模型"], "answer": 0, "explain": "同源序列里保守位点和协同变化位点携带结构线索。", "relatedConceptId": "c35", "source": {"file": "hello-ai.pdf", "page": "130–141"}}, {"id": "q39", "chapterId": "ch13", "type": "single", "question": "AlphaFold 没有解决下列哪一项？", "options": ["单链蛋白静态结构", "蛋白质动态构象与配体结合", "序列到坐标的预测", "残基置信度估计"], "answer": 1, "explain": "它主要预测静态结构，动态、复合物、配体、功能仍待研究。", "relatedConceptId": "c36", "source": {"file": "hello-ai.pdf", "page": "130–141"}}, {"id": "q40", "chapterId": "ch14", "type": "single", "question": "提示词的本质是？", "options": ["咒语", "给模型的全部上下文，塑造续写方向", "模型参数", "训练数据"], "answer": 1, "explain": "提示词决定模型看到什么，不是神秘咒语。", "relatedConceptId": "c37", "source": {"file": "hello-ai.pdf", "page": "142–150"}}, {"id": "q41", "chapterId": "ch14", "type": "single", "question": "AI 说一个事实，最稳妥的做法是？", "options": ["直接相信", "查原始来源", "看它语气自不自信", "看回答长不长"], "answer": 1, "explain": "语气自信不等于正确，关键事实必查。", "relatedConceptId": "c38", "source": {"file": "hello-ai.pdf", "page": "142–150"}}, {"id": "q42", "chapterId": "ch14", "type": "single", "question": "数据最小化的核心是？", "options": ["只给任务必需的数据和权限", "数据越多越好", "把所有文件都上传", "关闭所有安全设置"], "answer": 0, "explain": "多给的每一份数据都是潜在风险。", "relatedConceptId": "c39", "source": {"file": "hello-ai.pdf", "page": "142–150"}}, {"id": "q43", "chapterId": "t01", "type": "single", "question": "一次回答的流水线顺序是？", "options": ["分词→嵌入→层计算→概率→采样", "采样→分词→训练→部署", "嵌入→分词→采样→层计算", "概率→分词→嵌入→采样"], "answer": 0, "explain": "先切 token，再变向量，过几十层，算概率，采样。", "relatedConceptId": "c40", "source": {"file": "hello-ai.pdf", "page": "151–156"}}, {"id": "q44", "chapterId": "t01", "type": "single", "question": "为什么回答的第一个字通常最慢？", "options": ["要处理完整提示并算完所有层", "因为网络一定卡", "因为第一个字最长", "因为模型在休息"], "answer": 0, "explain": "后续 token 可复用键值缓存，首 token 没有缓存。", "relatedConceptId": "c40", "source": {"file": "hello-ai.pdf", "page": "151–156"}}, {"id": "q45", "chapterId": "t01", "type": "single", "question": "模型算错数字母类问题，最可能卡在哪个阶段？", "options": ["分词", "采样", "部署", "UI 渲染"], "answer": 0, "explain": "字母不是独立 token，模型看到的是编号。", "relatedConceptId": "c40", "source": {"file": "hello-ai.pdf", "page": "151–156"}}, {"id": "q46", "chapterId": "t02", "type": "single", "question": "推荐系统最常优化的直接目标是？", "options": ["你的长期幸福", "你对候选内容的互动概率", "服务器温度", "模型参数量"], "answer": 1, "explain": "点击、停留等互动信号是训练目标，不等于长期满意。", "relatedConceptId": "c41", "source": {"file": "hello-ai.pdf", "page": "157–160"}}, {"id": "q47", "chapterId": "t02", "type": "single", "question": "推荐系统「反馈循环」指什么？", "options": ["推荐改变行为，行为又变成训练数据", "模型自动更新代码", "用户手动标注", "服务器定时重启"], "answer": 0, "explain": "系统推荐什么，用户就可能点什么，点过的又进了训练集。", "relatedConceptId": "c41", "source": {"file": "hello-ai.pdf", "page": "157–160"}}, {"id": "q48", "chapterId": "t02", "type": "single", "question": "冷启动的难点是？", "options": ["新用户/新内容没有历史数据", "数据太多", "模型太大", "网速太慢"], "answer": 0, "explain": "没有互动记录，只能靠内容特征和探索策略。", "relatedConceptId": "c42", "source": {"file": "hello-ai.pdf", "page": "157–160"}}, {"id": "q49", "chapterId": "t03", "type": "single", "question": "自动驾驶的四个模块是？", "options": ["感知、预测、规划/决策、控制", "训练、验证、部署、监控", "分词、嵌入、注意力、采样", "采集、标注、清洗、打包"], "answer": 0, "explain": "四模块实时闭环，分别回答「看到什么、将发生什么、怎么走、怎么执行」。", "relatedConceptId": "c43", "source": {"file": "hello-ai.pdf", "page": "161–173"}}, {"id": "q50", "chapterId": "t03", "type": "single", "question": "自动驾驶的长尾指的是？", "options": ["训练数据里极少出现却可能致命的罕见场景", "车很长", "路线很长", "模型很老"], "answer": 0, "explain": "穿玩偶服的人、掉落床垫等罕见场景，平均指标会掩盖。", "relatedConceptId": "c44", "source": {"file": "hello-ai.pdf", "page": "161–173"}}, {"id": "q51", "chapterId": "t03", "type": "single", "question": "数据闭环的作用是？", "options": ["把车队遇到的新场景传回训练，再部署回车队", "让车自动加油", "关闭传感器", "减少数据"], "answer": 0, "explain": "部署不是终点，是下一轮数据的起点。", "relatedConceptId": "c44", "source": {"file": "hello-ai.pdf", "page": "161–173"}}, {"id": "q52", "chapterId": "t04", "type": "single", "question": "科研机器学习的第一步是？", "options": ["选最深的模型", "问清预测什么、错了代价是什么", "先买 GPU", "先写论文"], "answer": 1, "explain": "从问题和代价开始，不是从模型开始。", "relatedConceptId": "c45", "source": {"file": "hello-ai.pdf", "page": "174–182"}}, {"id": "q53", "chapterId": "t04", "type": "single", "question": "只有几百条科研数据时，优先考虑？", "options": ["从头训练千亿模型", "树模型或预训练表示", "放弃机器学习", "只做可视化"], "answer": 1, "explain": "小数据下树模型更稳、更省、更可解释。", "relatedConceptId": "c45", "source": {"file": "hello-ai.pdf", "page": "174–182"}}, {"id": "q54", "chapterId": "t04", "type": "single", "question": "主动学习挑实验时优先选？", "options": ["模型最确定会好的样本", "可能好且模型不确定的样本", "最便宜的样本", "最旧的样本"], "answer": 1, "explain": "同时考虑「可能好」和「不知道」，一次实验获取最多信息。", "relatedConceptId": "c46", "source": {"file": "hello-ai.pdf", "page": "174–182"}}, {"id": "q55", "chapterId": "t05", "type": "single", "question": "训练流水线中 SFT 之后通常是？", "options": ["分词器训练", "偏好对齐/强化学习", "数据抓取", "部署"], "answer": 1, "explain": "预训练→评测→SFT→偏好/RL→评测→部署。", "relatedConceptId": "c47", "source": {"file": "hello-ai.pdf", "page": "183–193"}}, {"id": "q56", "chapterId": "t05", "type": "single", "question": "想给模型加本校规章，优先用什么？", "options": ["从头预训练", "RAG 检索规章库", "只调温度", "换分词器"], "answer": 1, "explain": "知识更新优先 RAG；微调主要改行为和格式。", "relatedConceptId": "c48", "source": {"file": "hello-ai.pdf", "page": "183–193"}}, {"id": "q57", "chapterId": "t05", "type": "single", "question": "GRPO 适合什么任务？", "options": ["有可验证奖励的数学、代码", "纯主观审美", "无答案的闲聊", "图像压缩"], "answer": 0, "explain": "直接用答案对不对作奖励，绕过人类偏好模型。", "relatedConceptId": "c47", "source": {"file": "hello-ai.pdf", "page": "183–193"}}, {"id": "q58", "chapterId": "t06", "type": "single", "question": "多数「开源模型」实际开放的是？", "options": ["代码、数据、权重全部", "主要是权重和推理代码", "只有论文", "只有 Logo"], "answer": 1, "explain": "训练数据和训练代码未必公开，准确说法是开放权重。", "relatedConceptId": "c49", "source": {"file": "hello-ai.pdf", "page": "194–199"}}, {"id": "q59", "chapterId": "t06", "type": "single", "question": "开放权重最大的实际价值是？", "options": ["可微调、可审计、可离线部署", "一定比闭源强", "完全无版权限制", "不需要算力"], "answer": 0, "explain": "本领域数据微调成本远低于预训练。", "relatedConceptId": "c49", "source": {"file": "hello-ai.pdf", "page": "194–199"}}, {"id": "q60", "chapterId": "t06", "type": "single", "question": "看到「开源模型」最该追问什么？", "options": ["开放的是代码、数据还是权重，许可证允许什么", "模型图标好不好看", "下载速度快不快", "有没有中文名"], "answer": 0, "explain": "「开源」标签不能代替许可证和数据来源。", "relatedConceptId": "c50", "source": {"file": "hello-ai.pdf", "page": "194–199"}}], "flashcards": [{"id": "f001", "chapterId": "ch01", "front": "用自己的话说，「AI 与 AI 效应」是什么、解决什么问题？", "back": "AI 是让机器完成那些通常需要人类智能才能完成的任务；一旦某件事被机器做成常规，人们就不再把它算作智能，这就是 AI 效应。 它给你一把判断产品的尺子：不看宣传语，看它到底在做什么任务、靠什么做到、哪里会出错。", "tags": ["ch01", "基础"]}, {"id": "f002", "chapterId": "ch01", "front": "用自己的话说，「六层包含关系」是什么、解决什么问题？", "back": "AI、机器学习、深度学习、大模型、生成式 AI、智能体不是并列关系，而是一层套一层，越往里越新、越具体。 新闻里六个词混着用，分清包含关系能避免「大模型就是 AI」这类误判。", "tags": ["ch01", "基础"]}, {"id": "f003", "chapterId": "ch01", "front": "用自己的话说，「四种能力：识别、预测、生成、决策」是什么、解决什么问题？", "back": "任何 AI 产品都能拆成识别、预测、生成、决策四种能力，或者它们的组合。 拆开之后，你能立刻看出产品的强项在哪、哪一环最可能出错。", "tags": ["ch01", "基础"]}, {"id": "f004", "chapterId": "ch02", "front": "用自己的话说，「三次浪潮与两次寒冬」是什么、解决什么问题？", "back": "AI 历史是符号主义、专家系统、深度学习三次浪潮，中间夹着两次寒冬；寒冬的共同原因是承诺超过了能力。 它让你对「AI 又要改变一切」的宣传保持节奏感：先看想法，再看数据与算力能不能兑现。", "tags": ["ch02", "进阶"]}, {"id": "f005", "chapterId": "ch02", "front": "用自己的话说，「规模定律」是什么、解决什么问题？", "back": "在一定范围内，模型的损失随参数量、数据量、计算量增加，按可预测的幂律下降。 它把「把模型做大」从赌博变成工程，是大模型军备竞赛的直接理由。", "tags": ["ch02", "高难"]}, {"id": "f006", "chapterId": "ch02", "front": "用自己的话说，「数据、算力、算法三角」是什么、解决什么问题？", "back": "2012 年深度学习突破靠三件事同时到位：大数据、GPU 算力、可训练的多层网络算法。 它纠正「算法更聪明所以赢了」的单一叙事，也解释为什么同一套算法在别的年代跑不起来。", "tags": ["ch02", "基础"]}, {"id": "f007", "chapterId": "ch03", "front": "用自己的话说，「A* 搜索」是什么、解决什么问题？", "back": "A* 给每个待展开节点算 f(n)=g(n)+h(n)，优先展开 f 最小的；h 从不高估时保证最短路。 导航、游戏寻路至今用它；它也是理解「搜索 + 启发式」的入口。", "tags": ["ch03", "进阶"]}, {"id": "f008", "chapterId": "ch03", "front": "用自己的话说，「规则系统」是什么、解决什么问题？", "back": "规则系统把人写的 if-then 规则串起来做判断，透明、可审计、可精确控制，但写不完、难适应变化。 它今天仍在银行反欺诈、医疗禁忌、航空检查里工作，也是智能体安全约束的底层。", "tags": ["ch03", "基础"]}, {"id": "f009", "chapterId": "ch03", "front": "用自己的话说，「强化学习与探索利用」是什么、解决什么问题？", "back": "强化学习让智能体在环境里试错，用奖励调整策略；它必须处理探索与利用的矛盾。 它是机器人、游戏 AI 的基础，也是大模型对齐阶段的核心方法。", "tags": ["ch03", "进阶"]}, {"id": "f010", "chapterId": "ch04", "front": "用自己的话说，「监督学习」是什么、解决什么问题？", "back": "监督学习用带标签的数据训练模型，学从特征到标签的映射。 识别和预测两类能力主要来自它，是机器学习最成熟、应用最广的范式。", "tags": ["ch04", "基础"]}, {"id": "f011", "chapterId": "ch04", "front": "用自己的话说，「梯度下降」是什么、解决什么问题？", "back": "梯度下降沿损失下降的方向，对每个参数小步调整；学习率决定步子多大。 它是训练几乎所有现代模型的基础算法，从一条直线到上万亿参数的大模型都用它。", "tags": ["ch04", "高难"]}, {"id": "f012", "chapterId": "ch04", "front": "用自己的话说，「自监督学习」是什么、解决什么问题？", "back": "自监督学习从数据自身制造标签，比如遮词猜词、续写下一段，不需要人工标注。 它绕开标注瓶颈，让模型能用整个互联网训练，是大语言模型能出现的直接原因。", "tags": ["ch04", "进阶"]}, {"id": "f013", "chapterId": "ch05", "front": "用自己的话说，「泛化与过拟合」是什么、解决什么问题？", "back": "泛化是模型在没见过的数据上表现稳定；过拟合是它把训练数据的噪声也背下来。 训练成绩不算数，泛化才是机器学习唯一真正的目标。", "tags": ["ch05", "高难"]}, {"id": "f014", "chapterId": "ch05", "front": "用自己的话说，「精确率、召回率与混淆矩阵」是什么、解决什么问题？", "back": "混淆矩阵把预测和实际分成四格；精确率问「说有里的多少是真的」，召回率问「真的里的多少被找出」。 类别不平衡时准确率会骗人，必须拆开看误报和漏报的代价。", "tags": ["ch05", "进阶"]}, {"id": "f015", "chapterId": "ch05", "front": "用自己的话说，「分布偏移与相关因果」是什么、解决什么问题？", "back": "部署后的数据和训练数据不再来自同一个世界，叫分布偏移；模型学到的全是相关，不足以做因果干预。 它解释为什么模型上线后会退化，也防止你把「同时出现」当成「谁导致谁」。", "tags": ["ch05", "进阶"]}, {"id": "f016", "chapterId": "ch06", "front": "用自己的话说，「神经元与激活函数」是什么、解决什么问题？", "back": "神经元做四件事：接收输入、各乘权重、求和加偏置、通过非线性激活输出。 它是所有神经网络的基本单元；没有非线性，堆多少层都只是一个线性变换。", "tags": ["ch06", "基础"]}, {"id": "f017", "chapterId": "ch06", "front": "用自己的话说，「卷积神经网络」是什么、解决什么问题？", "back": "CNN 用局部连接、权重共享和池化，让同一组权重在整张图上滑动，逐层把边缘组成物体。 它让图像识别参数大幅减少，并对平移更稳健，是 2012 年深度学习突破的主力架构。", "tags": ["ch06", "进阶"]}, {"id": "f018", "chapterId": "ch06", "front": "用自己的话说，「表示学习与反向传播」是什么、解决什么问题？", "back": "表示学习让网络自己发明该看什么特征；反向传播用链式法则把误差逐层分配，一次算出全部梯度。 前者是深度学习通用性的来源，后者是深网络可训练的前提。", "tags": ["ch06", "高难"]}, {"id": "f019", "chapterId": "ch07", "front": "用自己的话说，「分词与 BPE」是什么、解决什么问题？", "back": "分词把文本切成 token；BPE 从字节开始反复合并高频相邻单元，得到词表。 它决定模型「看见」什么，也决定中文成本、拼写能力和数字母类任务的弱点。", "tags": ["ch07", "进阶"]}, {"id": "f020", "chapterId": "ch07", "front": "用自己的话说，「词向量与嵌入」是什么、解决什么问题？", "back": "嵌入把 token 映射成连续向量；用法相似的词向量靠近，语义关系对应方向。 它把语言变成几何，支撑语义搜索、推荐、RAG 和图文互搜。", "tags": ["ch07", "进阶"]}, {"id": "f021", "chapterId": "ch08", "front": "用自己的话说，「自注意力与 QKV」是什么、解决什么问题？", "back": "每个词发出查询 Q、提供键 K 和值 V；Q 与所有 K 打分，softmax 成权重，再按权重混合所有 V。 注意力是 Transformer 的心脏，让「苹果」能根据「吃」或「发布」改变含义。", "tags": ["ch08", "高难"]}, {"id": "f022", "chapterId": "ch08", "front": "用自己的话说，「Transformer 与位置编码」是什么、解决什么问题？", "back": "Transformer 由自注意力、前馈网络、残差连接和归一化叠成；位置编码把词序补进机制。 GPT、Llama、Qwen、DeepSeek、Claude 在架构上都是它的变体。", "tags": ["ch08", "进阶"]}, {"id": "f023", "chapterId": "ch08", "front": "用自己的话说，「自回归生成与采样」是什么、解决什么问题？", "back": "模型一次只预测一个 token，接回序列再预测下一个；温度、top-k、top-p 决定怎么选。 它解释为什么回答一个字一个字出现、为什么每次不一样、为什么会有怪话。", "tags": ["ch08", "进阶"]}, {"id": "f024", "chapterId": "ch09", "front": "用自己的话说，「预训练、SFT 与对齐」是什么、解决什么问题？", "back": "预训练学语言和世界，监督微调学对话格式，对齐按人类偏好调整取舍。 它解释基础模型为什么只会续写、助手为什么能回答和拒绝。", "tags": ["ch09", "进阶"]}, {"id": "f025", "chapterId": "ch09", "front": "用自己的话说，「RLHF 与 DPO」是什么、解决什么问题？", "back": "RLHF 用人类排序训练奖励模型，再用强化学习优化；DPO 直接把偏好对写成损失，绕开奖励模型。 它们决定助手「有帮助、诚实、无害」的取舍，也是理解对齐争议的入口。", "tags": ["ch09", "高难"]}, {"id": "f026", "chapterId": "ch09", "front": "用自己的话说，「涌现、思维链与推理模型」是什么、解决什么问题？", "back": "规模跨过门槛后某些能力突然出现，叫涌现；让模型写出步骤，等于给它草稿纸。 它解释为什么大模型会「突然会了」，以及为什么「先想一想」能提高可靠性。", "tags": ["ch09", "进阶"]}, {"id": "f027", "chapterId": "ch10", "front": "用自己的话说，「幻觉」是什么、解决什么问题？", "back": "幻觉是模型以自信语气生成看似合理但不真实的内容，根源是训练目标只有「像」没有「真」。 它是与 AI 共事时最常见的风险，尤其在事实、数字、引文、日期上。", "tags": ["ch10", "高难"]}, {"id": "f028", "chapterId": "ch10", "front": "用自己的话说，「RAG 与接地」是什么、解决什么问题？", "back": "RAG 回答前先检索可信资料，把相关段落放进上下文；接地要求陈述有可追溯依据。 它把「凭记忆答」改成「看着材料答」，是企业知识库和事实问答的常用方案。", "tags": ["ch10", "进阶"]}, {"id": "f029", "chapterId": "ch10", "front": "用自己的话说，「校准与提示注入」是什么、解决什么问题？", "back": "校准是模型表达的把握和实际正确率是否一致；提示注入是外部内容里藏着给模型的指令。 前者决定你能不能信「它说很可能」，后者决定智能体是否会被文件、网页、邮件指挥。", "tags": ["ch10", "进阶"]}, {"id": "f030", "chapterId": "ch11", "front": "用自己的话说，「多模态」是什么、解决什么问题？", "back": "多模态把图像、音频也切成 token，和文字一起送进同一个 Transformer。 它让模型能看图、听声、画画、说话，是把语言能力扩展到现实输入的关键。", "tags": ["ch11", "进阶"]}, {"id": "f031", "chapterId": "ch11", "front": "用自己的话说，「扩散模型」是什么、解决什么问题？", "back": "扩散模型训练时给清晰图逐步加噪，学从更噪恢复更清晰；生成时从纯噪声反复去噪。 它是今天图像和视频生成的主流，理解它才能判断生成图为什么会细节出错。", "tags": ["ch11", "高难"]}, {"id": "f032", "chapterId": "ch11", "front": "用自己的话说，「工具调用与智能体」是什么、解决什么问题？", "back": "工具调用让模型输出特殊格式触发程序执行；把模型放进循环，就得到能多步行动的智能体。 它把模型从「会说」变成「会做」，也带来权限、验证和责任的新问题。", "tags": ["ch11", "进阶"]}, {"id": "f033", "chapterId": "ch12", "front": "用自己的话说，「驾具与智能体循环」是什么、解决什么问题？", "back": "驾具是模型外面的整套程序：组装上下文、执行工具、管权限、压缩上下文、验证与交付。 智能体的可靠性一大半不在模型，而在驾具；同一个模型配不同驾具，表现能差一个档。", "tags": ["ch12", "高难"]}, {"id": "f034", "chapterId": "ch12", "front": "用自己的话说，「权限、沙盒与人在回路」是什么、解决什么问题？", "back": "智能体的三道安全带：最小权限、隔离沙盒、不可逆操作由人批准。 智能体会执行有后果的行动；没有这三道约束，一次提示注入就可能造成真实损害。", "tags": ["ch12", "进阶"]}, {"id": "f035", "chapterId": "ch13", "front": "用自己的话说，「AlphaFold 与 AI 做科学」是什么、解决什么问题？", "back": "AlphaFold 把氨基酸序列到三维结构变成监督学习，用注意力提取进化信息，并给出置信度。 它证明 AI 能加速基础科学，也划出了「预测结构」与「理解机制」的边界。", "tags": ["ch13", "高难"]}, {"id": "f036", "chapterId": "ch13", "front": "用自己的话说，「AI 做科学的三个条件」是什么、解决什么问题？", "back": "数据多、目标明确、答案能被实验检验，是 AI 在科学里最容易成功的三个条件。 它帮你判断一个「AI for Science」项目是真实加速，还是把普通拟合包装成突破。", "tags": ["ch13", "进阶"]}, {"id": "f037", "chapterId": "ch14", "front": "用自己的话说，「提示词」是什么、解决什么问题？", "back": "提示词是你给模型的全部上下文，决定续写方向；好提示说清任务、对象、标准、例子和输出格式。 它是最便宜、最立刻生效的控制手段，也是理解「模型只是在续写」的实践入口。", "tags": ["ch14", "基础"]}, {"id": "f038", "chapterId": "ch14", "front": "用自己的话说，「人机分工与验证」是什么、解决什么问题？", "back": "AI 铺广度、人负责深度；关键事实必查，不懂的领域不用它做最终判断，要求它给出依据。 AI 产出很便宜，判断很稀缺；分工和验证决定你是用 AI，还是被 AI 带偏。", "tags": ["ch14", "进阶"]}, {"id": "f039", "chapterId": "ch14", "front": "用自己的话说，「数据最小化与 AI 素养」是什么、解决什么问题？", "back": "只给任务必需的数据和权限；AI 素养是提出好问题、判断真假、为结果负责。 它把隐私、安全和能力问题落到日常操作：少给数据、少给权限、多问依据。", "tags": ["ch14", "进阶"]}, {"id": "f040", "chapterId": "t01", "front": "用自己的话说，「一次回答的推理流水线」是什么、解决什么问题？", "back": "一次回答经过上下文、分词、嵌入、几十层、概率、采样六个阶段，循环生成每个 token。 它让你能定位问题：答错事实在知识/检索，答非所问在上下文，数字母错在分词，前后矛盾在自回归。", "tags": ["t01", "进阶"]}, {"id": "f041", "chapterId": "t02", "front": "用自己的话说，「推荐系统与反馈循环」是什么、解决什么问题？", "back": "推荐系统预测你对候选内容的互动概率；推荐改变行为，行为又变成训练数据，形成反馈循环。 它解释信息茧房、标题党和「停不下来」：系统优化的是可测指标，不是你的长期满意度。", "tags": ["t02", "进阶"]}, {"id": "f042", "chapterId": "t02", "front": "用自己的话说，「冷启动与探索」是什么、解决什么问题？", "back": "新用户和新内容没有历史数据，系统必须给一些曝光去探索，否则永远不知道好坏。 它是推荐系统里探索与利用的具体版本，也是内容生态多样性的关键。", "tags": ["t02", "进阶"]}, {"id": "f043", "chapterId": "t03", "front": "用自己的话说，「自动驾驶的四个模块」是什么、解决什么问题？", "back": "自动驾驶由感知、预测、规划/决策、控制四个模块组成，实时闭环。 它是「四种能力全用上」的真实系统，也是理解模块化与端到端取舍的入口。", "tags": ["t03", "进阶"]}, {"id": "f044", "chapterId": "t03", "front": "用自己的话说，「长尾与数据闭环」是什么、解决什么问题？", "back": "长尾是训练数据里极少出现却可能致命的罕见场景；数据闭环把车队遇到的新场景传回训练。 自动驾驶的难点不在常见路况，而在长尾；谁的数据闭环快，谁的覆盖好。", "tags": ["t03", "进阶"]}, {"id": "f045", "chapterId": "t04", "front": "用自己的话说，「科研机器学习流程」是什么、解决什么问题？", "back": "科研 ML 的顺序是问题、表示、傻基线、模型、验证；不要从「我要用深度学习」开始。 它帮你避免用大炮打蚊子，也避免被一个没有落地的准确率数字骗到。", "tags": ["t04", "进阶"]}, {"id": "f046", "chapterId": "t04", "front": "用自己的话说，「校准与主动学习」是什么、解决什么问题？", "back": "校准衡量预测把握是否可信；主动学习用不确定性挑最值得做的实验。 科研实验很贵，知道「哪里不知道」比多涨一个点更有价值。", "tags": ["t04", "进阶"]}, {"id": "f047", "chapterId": "t05", "front": "用自己的话说，「训练流水线与偏好方法」是什么、解决什么问题？", "back": "训练流水线是数据、分词、预训练、评测、SFT、偏好/RL、蒸馏部署；评测贯穿全程。 它把前面所有原理串成工程顺序，也让你知道每一步需要什么数据和算力。", "tags": ["t05", "进阶"]}, {"id": "f048", "chapterId": "t05", "front": "用自己的话说，「提示、RAG、微调怎么选」是什么、解决什么问题？", "back": "改模型看到什么用提示，改回答材料用 RAG，改行为风格用微调，改一切才从头训练。 大多数团队真正该做的是前三者，而不是预训练；选错成本差几个数量级。", "tags": ["t05", "基础"]}, {"id": "f049", "chapterId": "t06", "front": "用自己的话说，「开放权重」是什么、解决什么问题？", "back": "多数「开源模型」只开放训练好的权重和推理代码，训练数据和代码未必公开。 开放权重能运行、微调、审计、离线部署，但不能仅凭权重复现完整训练。", "tags": ["t06", "进阶"]}, {"id": "f050", "chapterId": "t06", "front": "用自己的话说，「蒸馏与许可证」是什么、解决什么问题？", "back": "蒸馏让小模型学习大模型的输出分布；许可证决定开放权重模型能做什么、不能做什么。 它让能力可以压进小模型、跑在手机上，也带来使用边界和商业争议。", "tags": ["t06", "进阶"]}, {"id": "f051", "chapterId": "ch01", "front": "你已经在用 AI 了这一章最该记住的一句话是什么？", "back": "AI 是让机器完成那些通常需要人类智能才能完成的任务；判断一个产品，先问它在做哪种任务，再问它靠什么做到、在哪里会出错。", "tags": ["ch01", "章节锚点"]}, {"id": "f052", "chapterId": "ch02", "front": "七十年，三次浪潮这一章最该记住的一句话是什么？", "back": "每一次浪潮都由一个真正的想法点燃，每一次退潮都因为撞上同一堵墙：承诺超过了当时的数据与算力能兑现的程度。", "tags": ["ch02", "章节锚点"]}, {"id": "f053", "chapterId": "ch03", "front": "不只是神经网络这一章最该记住的一句话是什么？", "back": "不靠学习的 AI 有三条路：搜索找解、规则做判断、试错学策略；现代最强系统往往把它们和神经网络组合起来。", "tags": ["ch03", "章节锚点"]}, {"id": "f054", "chapterId": "ch04", "front": "规则不是写出来的，是学出来的这一章最该记住的一句话是什么？", "back": "机器学习不是写规则，而是给大量「输入—答案」的例子，让模型自己调参数，使预测的误差变小。", "tags": ["ch04", "章节锚点"]}, {"id": "f055", "chapterId": "ch05", "front": "真正的考试在训练集之外这一章最该记住的一句话是什么？", "back": "训练成绩只证明模型会做旧题；泛化才证明它学会了规律。评估设计比模型选择更容易决定成败。", "tags": ["ch05", "章节锚点"]}, {"id": "f056", "chapterId": "ch06", "front": "一层一层看出一只猫这一章最该记住的一句话是什么？", "back": "神经网络把许多简单的计算单元堆成多层，让低层学边缘、中层学部件、高层学物体；连「该看什么特征」也交给数据去决定。", "tags": ["ch06", "章节锚点"]}, {"id": "f057", "chapterId": "ch07", "front": "文字怎样变成数字这一章最该记住的一句话是什么？", "back": "文字先被切成 token，再变成向量；模型的一切「语言能力」都建立在这两步转换之上，很多怪行为也源于此。", "tags": ["ch07", "章节锚点"]}, {"id": "f058", "chapterId": "ch08", "front": "每个词都能看见其他词这一章最该记住的一句话是什么？", "back": "每个词发出查询、提供键和值，按相关度从所有词那里加权收集信息；一层层叠加，固定的词向量就变成了随上下文变化的表示。", "tags": ["ch08", "章节锚点"]}, {"id": "f059", "chapterId": "ch09", "front": "从续写机到助手这一章最该记住的一句话是什么？", "back": "预训练教会模型语言和世界，监督微调教它对话的形式，对齐用人类偏好塑造它的取舍；三阶段之后，它仍然是一个概率分布。", "tags": ["ch09", "章节锚点"]}, {"id": "f060", "chapterId": "ch10", "front": "它为什么会一本正经地胡说这一章最该记住的一句话是什么？", "back": "模型优化的是「像不像会出现在这里的词」，不是「真不真」；自信的语气和内容的可靠性没有关系。", "tags": ["ch10", "章节锚点"]}, {"id": "f061", "chapterId": "ch11", "front": "模型长出了眼睛和手这一章最该记住的一句话是什么？", "back": "多模态把图像、音频也变成 token；工具调用把模型从「会说」变成「会做」；一旦会做，权限和验证就成了主角。", "tags": ["ch11", "章节锚点"]}, {"id": "f062", "chapterId": "ch12", "front": "智能体的一天这一章最该记住的一句话是什么？", "back": "智能体的可靠性一大半不在模型，而在驾具：上下文怎么组装、工具怎么执行、权限怎么限制、结果怎么验证。", "tags": ["ch12", "章节锚点"]}, {"id": "f063", "chapterId": "ch13", "front": "AI 做科学：从 AlphaFold 说起这一章最该记住的一句话是什么？", "back": "AI 做科学最顺的场景，是数据多、目标明确、答案能被实验检验的预测任务；它加速发现，但不自动提供因果解释。", "tags": ["ch13", "章节锚点"]}, {"id": "f064", "chapterId": "ch14", "front": "与 AI 共事这一章最该记住的一句话是什么？", "back": "AI 产出很便宜，判断很稀缺；把任务、标准、例子说清，把关键事实查清，把最终责任留给人。", "tags": ["ch14", "章节锚点"]}, {"id": "f065", "chapterId": "t01", "front": "一句话的旅程这一章最该记住的一句话是什么？", "back": "一次回答是一条流水线：组装上下文、分词、嵌入、几十层注意力、概率分布、采样；每个阶段都有自己的时间尺度和错误方式。", "tags": ["t01", "章节锚点"]}, {"id": "f066", "chapterId": "t02", "front": "推荐系统：你为什么停不下来这一章最该记住的一句话是什么？", "back": "推荐系统优化的是可测量的互动指标，不是你的长期幸福；指标选错，系统就会学会让你停不下来。", "tags": ["t02", "章节锚点"]}, {"id": "f067", "chapterId": "t03", "front": "自动驾驶：四种能力的合体这一章最该记住的一句话是什么？", "back": "自动驾驶不是单一模型，而是四种能力叠在一起；真正难的不是常见路况，是见不到几次的长尾和不可逆的后果。", "tags": ["t03", "章节锚点"]}, {"id": "f068", "chapterId": "t04", "front": "给科研人的机器学习实用课这一章最该记住的一句话是什么？", "back": "先问清问题和代价，再找一个傻基线；小数据优先树模型或预训练表示，别一上来就深网络。", "tags": ["t04", "章节锚点"]}, {"id": "f069", "chapterId": "t05", "front": "训练一个模型：从数据到对齐的实操这一章最该记住的一句话是什么？", "back": "训练是一条流水线，每一段都有自己的数据和评测；大多数团队真正该做的不是从头预训练，而是提示、检索或微调。", "tags": ["t05", "章节锚点"]}, {"id": "f070", "chapterId": "t06", "front": "AI 与开源这一章最该记住的一句话是什么？", "back": "AI 的开源不是一个开关，而是三层：代码、数据、权重。多数所谓开源模型只开放权重，能运行和微调，但不能复现训练。", "tags": ["t06", "章节锚点"]}], "companion": "hello-ai学习伴侣.html"}, "pages": {"ch01": {"html": "<div class=\"source-badge\">📖 出处：hello-ai.pdf · p.6–15<\/div><h1>第 1 章：你已经在用 AI 了<\/h1>\n<blockquote>第一部 · 地图　·　一个诚实的定义，一张不会过时的地图，以及为什么「AI」这个词总在往后退。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ ｜ <strong>预估学时<\/strong>：1–2 小时 ｜ <strong>前置<\/strong>：无\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n能用一句话说清什么算 AI、什么只是自动化。\n<\/li><li>\n能把一个 AI 产品拆成识别、预测、生成、决策四种能力。\n<\/li><li>\n能分清 AI、机器学习、深度学习、大模型、生成式 AI、智能体六层关系。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>AI 是让机器完成那些通常需要人类智能才能完成的任务；判断一个产品，先问它在做哪种任务，再问它靠什么做到、在哪里会出错。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：定义看任务，不看方法<\/h3>\n<p>「人工智能」这个词是 1956 年夏天在达特茅斯学院的一场研讨会上定下来的。提出它的约翰·麦卡锡给了一个很宽松的说法：让机器去做那些「如果由人来做，我们会说需要智能」的事。<\/p>\n<p>这个定义的重点在<strong>任务<\/strong>，不在实现方式。下棋、翻译、认脸、写一段话，过去只有人能做得像样，所以机器做到这些就算 AI。它不要求机器有意识，也不要求它像人一样思考。1997 年靠搜索击败国际象棋冠军的深蓝，和今天会聊天的大模型，技术路线完全不同，但都落在这个定义里。<\/p>\n<p>这也解释了一个反复出现的现象：<strong>AI 效应<\/strong>。计算器算得比人快，没人说它是 AI；语音输入、路线规划刚出现时都是 AI 明星课题，普及之后就成了「普通软件」。一旦机器把某件事做成了常规，我们就不再觉得那件事需要智能。AI 这个词的边界，永远指向机器还做不太好的那一片。<\/p>\n<h3>概念 2：六层包含关系<\/h3>\n<p>新闻里常混着六个词：AI、机器学习、深度学习、大模型、生成式 AI、智能体。它们不是并列关系，而是一层套一层。<\/p>\n<ul><li>\n<strong>人工智能<\/strong>：最大的伞，所有让机器做「聪明事」的办法都算，包括人写规则、搜索、统计学习。\n<\/li><li>\n<strong>机器学习<\/strong>：一种特定做法，不由人写规则，而是给大量例子让机器自己找规律。\n<\/li><li>\n<strong>深度学习<\/strong>：机器学习里用多层神经网络的分支，连「该看数据的哪些方面」也交给机器学习。\n<\/li><li>\n<strong>大语言模型<\/strong>：在海量文本上训练、以预测下一个 token 为目标的超大网络，是深度学习的一种极端形态。\n<\/li><li>\n<strong>生成式 AI<\/strong>：强调用途，能造出原本不存在的文字、图像、音频、视频或代码。\n<\/li><li>\n<strong>智能体<\/strong>：把模型放进一个循环，给它目标和工具，让它自己决定下一步，直到完成任务。\n<\/ul>\n<p>越往里越新、越具体，也越接近你每天用的产品；外面的圈没有消失。用大模型去解决一个查表就能解决的问题，等于用推土机撬罐头。<\/p>\n<h3>概念 3：四种能力<\/h3>\n<p>按「它在做什么」来分，几乎所有 AI 应用都能归入四种能力，或者它们的组合。<\/p>\n<ul><li>\n<strong>识别<\/strong>：输入一个东西，判断它是什么。人脸解锁、相册搜猫、语音转文字、垃圾邮件过滤。\n<\/li><li>\n<strong>预测<\/strong>：根据过去估计未来或未知。地图预计到达时间、电商猜你会买什么、医院预测再入院风险。\n<\/li><li>\n<strong>生成<\/strong>：造出原本不存在的内容。写文字、画图、合成语音、生成代码。\n<\/li><li>\n<strong>决策<\/strong>：在环境里选择行动。下棋、机器人移动、自动驾驶转向、智能体调用工具。\n<\/ul>\n<p>四者的难度和风险不一样。识别最成熟，很多任务准确率已超过人；预测完全依赖历史数据是否包含未来的规律；生成最抢眼，也最容易「像而不对」；决策有后果，后果会改变环境，环境又影响下一步。<\/p>\n<p>一个真实产品往往把它们串起来。你对着手机说「帮我订明天去北京的高铁」：语音识别把声音变成文字，语言模型理解意图并规划步骤，查询系统预测哪趟车更可能有票，最后生成一段确认信息。拆开之后，你立刻知道它的强项在哪、哪一环最可能出错。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TB\n  A[人工智能] --&gt; B[机器学习]\n  B --&gt; C[深度学习]\n  C --&gt; D[大语言模型 / 基础模型]\n  D --&gt; E[生成式 AI]\n  E --&gt; F[智能体]\n  A --&gt; G[搜索 / 规则系统]\n  G --&gt; F<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>这张图看两件事：越往下越新、越接近日常产品；左边的搜索和规则系统并没有消失，它们会和模型一起进入智能体。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：AI 像一把不断生长的伞。每当下雨的范围扩大，伞面就跟着扩；已经干了的区域会被移出伞下，改叫「普通软件」。伞的边界不是技术定义，而是人们还觉不觉得这件事难。\n<\/li><li>\n<strong>实例<\/strong>：早上 6:50 人脸解锁（识别），7:30 地图预测 25 分钟到达（预测），10:30 让助手把会议记录整理成要点（生成），18:30 网约车报价（预测）。一天里真正「纯生成」的环节很少，多数是识别或预测加规则执行。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 AI 就是大模型——实际上 大模型只是当前最耀眼的一层。导航里的 A*、银行的反欺诈规则、相机的自动对焦，很多都不是大模型，仍然属于 AI。\n<\/li><li>\n别以为 AI 什么都能做——实际上 AI 擅长例子多、答案相对明确、错了代价可检查的任务；例子稀少、没有共识、需要承担责任的判断，它做不了。\n<\/li><li>\n别以为 机器算得快就是智能——实际上 算得快只是速度。AI 效应说明，一旦某件事变成常规计算，人们就不再把它算作智能。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n一个软件能在 0.1 秒内算出 20 位数的乘法。按本章定义，它是 AI 吗？（答案：不是严格意义上的 AI。它做的是固定的算术流程，不需要通常由人承担的判断；这也是计算器不被当作 AI 的原因。；解析：定义看的是任务是否需要人类智能，不是算得快不快。）\n<\/li><li>\n「大模型就是 AI」这句话错在哪？（答案：大模型是 AI 的一个子集，属于深度学习里的语言模型。AI 还包括搜索、规则系统、强化学习等大量非大模型方法。；解析：六层包含关系里，大模型在里层，AI 在最外层。）\n<\/li><li>\n手机相册里搜索「猫」，属于四种能力里的哪一种？（答案：主要是识别：判断图像内容是不是猫。排序和检索还会用到预测，但核心是识别。；解析：识别是输入一个东西、判断它是什么。）\n<\/li><li>\n为什么说 AI 不承担责任是社会选择，不是技术限制？（答案：模型可以给出诊断建议或判决理由，但签字、宣判、承担后果仍然由人来做。社会把责任留给了人，而不是模型做不到。；解析：技术能生成建议，但不能替人承担后果。）\n<\/li><li>\nAI 效应是什么？（答案：机器一旦把某件事做成常规，人们就不再把这件事业算作智能。；解析：它解释了 AI 的边界为什么总在往后退。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nAI 的定义看任务，不看方法。\n<\/li><li>\n六层包含关系：AI ⊃ 机器学习 ⊃ 深度学习 ⊃ 大模型；生成式 AI 和智能体是另外两个切面。\n<\/li><li>\n看到产品先拆四种能力：识别、预测、生成、决策。\n<\/ul>", "kind": "chapter", "title": "第 1 章：你已经在用 AI 了"}, "ch02": {"html": "<div class=\"source-badge\">📖 出处：hello-ai.pdf · p.16–26<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch01\">第 1 章：你已经在用 AI 了<\/a><\/span><\/div><h1>第 2 章：七十年，三次浪潮<\/h1>\n<blockquote>第一部 · 地图　·　AI 的历史不是一条上升的直线，而是几次高潮与几次寒冬。每次转折都有一个具体的原因。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：2 小时 ｜ <strong>前置<\/strong>：第 1 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n能按时间顺序说出符号主义、专家系统、深度学习三次浪潮。\n<\/li><li>\n能解释两次 AI 寒冬的共同原因：承诺与能力之间的落差。\n<\/li><li>\n能说清算力、数据、算法在 2012 年突破里各自起了什么作用。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>每一次浪潮都由一个真正的想法点燃，每一次退潮都因为撞上同一堵墙：承诺超过了当时的数据与算力能兑现的程度。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：三次浪潮与两次寒冬<\/h3>\n<p><strong>第一次浪潮（1956–1970 年代）<\/strong>是符号主义。研究者相信智能就是对符号的操作：把知识写成概念、命题和逻辑规则，机器按规则推演就能推理。代表成果是定理证明、早期自然语言理解和通用问题求解器。它撞上的墙叫<strong>知识获取瓶颈<\/strong>：世界上的知识太多、太模糊，靠人一条条写进去写不完，规则之间还会打架。<\/p>\n<p><strong>第二次浪潮（1980 年代）<\/strong>是专家系统。把某个狭窄领域里专家的经验写成几百到几千条 if-then 规则，再配一个推理引擎，让机器当顾问。它在医疗、地质勘探、配置电脑等场景里卖得很好，商业上第一次成了产业。但它仍然要人写规则，维护成本高、遇到新情况就失灵，最后退潮。<\/p>\n<p><strong>第三次浪潮（2012 年至今）<\/strong>是深度学习。它不再由人写规则，而是让多层神经网络从数据里学。2012 年的 ImageNet 竞赛，深度卷积网络把图像识别错误率从 26% 降到 16%，标志着这轮浪潮的起点。2020 年前后，规模定律和大模型把它推到语言、代码、科学等几乎所有领域。<\/p>\n<p>两次寒冬（1970 年代中期、1980 年代末）的共同点不是技术「失败」，而是<strong>承诺与能力之间的落差<\/strong>。研究者在上一轮高潮里承诺了通用智能，演示却只能在玩具问题上跑；经费和信心一旦撤出，整个领域就进入低潮。<\/p>\n<h3>概念 2：2012 年为什么突然成了<\/h3>\n<p>深度学习的想法并不新。1958 年的感知机就会从例子里学简单的线性分类；反向传播在 1980 年代已经流行。它沉寂几十年，是因为三个条件同时不到位。<\/p>\n<ul><li>\n<strong>数据<\/strong>：ImageNet 从 2007 年起收集了一千四百万张人工标注的图片。没有这么多带标签的猫，网络再深也学不出猫。\n<\/li><li>\n<strong>算力<\/strong>：GPU 原本为游戏渲染设计，恰好擅长并行矩阵运算。2012 年的突破是在两块游戏显卡上跑出来的；今天前沿模型用几万块 GPU。\n<\/li><li>\n<strong>算法<\/strong>：多层结构、反向传播、卷积、激活函数这些零件早就有了，ReLU、Dropout 等技巧让深网络真正可训练。\n<\/ul>\n<p>三者缺一不可。只讲「神经网络赢了」会漏掉最关键的一点：同一套算法，在数据和算力不够的年代，连跑都跑不起来。<\/p>\n<h3>概念 3：规模定律<\/h3>\n<p>2020 年前后，研究者总结出一条经验规律：在一定范围内，模型的损失随参数量、数据量、计算量的增加，呈可预测的幂律下降。这就是<strong>规模定律<\/strong>。<\/p>\n<p>它把「把模型做大」从赌博变成了工程。只要按比例增加参数、数据和算力，性能大概会按已知的曲线改善，行业因此敢押注超大模型。它也是大模型军备竞赛的直接理由。<\/p>\n<p>但规模定律不是万能。它描述的是「一定范围内」的趋势，会遇到数据用尽、收益递减、能耗和成本上升等边界；它也无法保证模型在需要精确事实或承担责任的任务上变可靠。规模能买来能力，买不来真实性。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  A[1956 符号主义] --&gt; B[1970s 第一次寒冬]\n  B --&gt; C[1980s 专家系统]\n  C --&gt; D[1980s末 第二次寒冬]\n  D --&gt; E[2012 深度学习]\n  E --&gt; F[2020 规模定律与大模型]\n  F --&gt; G[2025 智能体]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>这张图看节奏：三座山、两个谷。每个谷都不是「技术没用」，而是承诺跑在了能力前面。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像修一条越走越高的山路。每次有人看到山顶就宣布「快到了」，但走到跟前发现前面还有一道崖；掉下去一次，队伍要花很多年才爬回原来的高度。\n<\/li><li>\n<strong>实例<\/strong>：2012 年 ImageNet：同一类卷积网络，在 CPU 和小数据上只能得到普通结果；两块 GPU 加一千四百万张标注图片，错误率从 26% 降到 16%。变的是条件，不只是想法。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 AI 是一直匀速进步的——实际上 它是浪潮式推进：想法先出现，等数据和算力到位才兑现，兑现不了就退潮。\n<\/li><li>\n别以为 寒冬说明方向错了——实际上 寒冬说明承诺超过了当时能兑现的能力，不等于技术没有价值。很多寒冬里的工作后来成了基础。\n<\/li><li>\n别以为 2012 年赢在算法更聪明——实际上 算法重要，但数据与算力同样关键。三者是三角形，缺一角都跑不起来。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n两次 AI 寒冬的共同原因是什么？（答案：承诺与能力之间的落差：演示只在玩具问题上成立，却被说成通用智能，经费和信心随后撤出。；解析：不是技术完全失败，而是兑现不了承诺。）\n<\/li><li>\n符号主义最大的瓶颈是什么？（答案：知识获取瓶颈：世界知识太多、太模糊，靠人写规则写不完，规则之间还会冲突。；解析：专家系统也继承了这个问题。）\n<\/li><li>\n2012 年深度学习的突破依赖哪三个条件？（答案：数据（ImageNet 等大规模标注集）、算力（GPU 并行计算）、算法（多层网络与反向传播等）。；解析：三者缺一不可，不能只归功于算法。）\n<\/li><li>\n规模定律说了什么？（答案：在一定范围内，模型损失随参数量、数据量、计算量增加而按幂律可预测地下降。；解析：它让扩大模型从赌博变成工程，但有边界。）\n<\/li><li>\n为什么说「AI 寒冬」对今天仍有提醒意义？（答案：它提醒我们把「能做什么」和「被说成能做什么」分开，别用演示效果代替真实能力。；解析：今天的模型也会被营销话术夸大。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n三次浪潮：符号主义、专家系统、深度学习。\n<\/li><li>\n两次寒冬的共同原因是承诺超过能力。\n<\/li><li>\n2012 年突破 = 数据 + 算力 + 算法。\n<\/ul>", "kind": "chapter", "title": "第 2 章：七十年，三次浪潮"}, "ch03": {"html": "<div class=\"source-badge\">📖 出处：hello-ai.pdf · p.27–36<\/div><d
