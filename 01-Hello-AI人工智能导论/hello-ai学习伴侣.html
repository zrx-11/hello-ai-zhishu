ck'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q05' data-type='single' data-concept='c06' data-chapter='ch02'><p class='quiz-q'><b>Q2.<\/b> 2012 年 ImageNet 突破主要靠什么组合？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q05' value='0'> 数据、算力、算法三者同时到位<\/label><label class='quiz-opt'><input type='radio' name='q05' value='1'> 只有更聪明的算法<\/label><label class='quiz-opt'><input type='radio' name='q05' value='2'> 只有更多资金<\/label><label class='quiz-opt'><input type='radio' name='q05' value='3'> 只有更好的摄像头<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q06' data-type='single' data-concept='c05' data-chapter='ch02'><p class='quiz-q'><b>Q3.<\/b> 规模定律说的是什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q06' value='0'> 模型越大越有意识<\/label><label class='quiz-opt'><input type='radio' name='q06' value='1'> 损失随参数、数据、计算增加按幂律可预测下降<\/label><label class='quiz-opt'><input type='radio' name='q06' value='2'> 数据越多一定越好<\/label><label class='quiz-opt'><input type='radio' name='q06' value='3'> 算法越复杂越省算力<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch03__": {"html": "<h1>测验：第 3 章：不只是神经网络<\/h1><div class='quiz-item' data-qid='q07' data-type='single' data-concept='c07' data-chapter='ch03'><p class='quiz-q'><b>Q1.<\/b> A* 中 f(n)=g(n)+h(n)，h(n) 是什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q07' value='0'> 从起点到 n 的实际代价<\/label><label class='quiz-opt'><input type='radio' name='q07' value='1'> 从 n 到终点的估计代价<\/label><label class='quiz-opt'><input type='radio' name='q07' value='2'> n 的编号<\/label><label class='quiz-opt'><input type='radio' name='q07' value='3'> 随机噪声<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q08' data-type='single' data-concept='c08' data-chapter='ch03'><p class='quiz-q'><b>Q2.<\/b> 规则系统最大的优点是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q08' value='0'> 能自动学习所有规律<\/label><label class='quiz-opt'><input type='radio' name='q08' value='1'> 判断透明、可审计、可精确控制<\/label><label class='quiz-opt'><input type='radio' name='q08' value='2'> 不需要任何维护<\/label><label class='quiz-opt'><input type='radio' name='q08' value='3'> 能处理所有长尾<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q09' data-type='single' data-concept='c09' data-chapter='ch03'><p class='quiz-q'><b>Q3.<\/b> 强化学习里的「探索」指的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q09' value='0'> 一直选当前最高奖励的动作<\/label><label class='quiz-opt'><input type='radio' name='q09' value='1'> 尝试未知动作以获取新信息<\/label><label class='quiz-opt'><input type='radio' name='q09' value='2'> 把奖励调大<\/label><label class='quiz-opt'><input type='radio' name='q09' value='3'> 把环境删掉<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch04__": {"html": "<h1>测验：第 4 章：规则不是写出来的，是学出来的<\/h1><div class='quiz-item' data-qid='q10' data-type='single' data-concept='c10' data-chapter='ch04'><p class='quiz-q'><b>Q1.<\/b> 监督学习的关键特征是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q10' value='0'> 数据带标签<\/label><label class='quiz-opt'><input type='radio' name='q10' value='1'> 数据完全无标签<\/label><label class='quiz-opt'><input type='radio' name='q10' value='2'> 模型必须很深<\/label><label class='quiz-opt'><input type='radio' name='q10' value='3'> 不需要损失函数<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q11' data-type='single' data-concept='c11' data-chapter='ch04'><p class='quiz-q'><b>Q2.<\/b> 梯度下降更新参数的方向是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q11' value='0'> 沿梯度上升方向<\/label><label class='quiz-opt'><input type='radio' name='q11' value='1'> 沿梯度下降方向<\/label><label class='quiz-opt'><input type='radio' name='q11' value='2'> 随机方向<\/label><label class='quiz-opt'><input type='radio' name='q11' value='3'> 固定向右<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q12' data-type='single' data-concept='c12' data-chapter='ch04'><p class='quiz-q'><b>Q3.<\/b> 自监督学习怎样获得标签？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q12' value='0'> 请人逐条标注<\/label><label class='quiz-opt'><input type='radio' name='q12' value='1'> 从数据自身制造标签，如猜下一个词<\/label><label class='quiz-opt'><input type='radio' name='q12' value='2'> 完全不需要数据<\/label><label class='quiz-opt'><input type='radio' name='q12' value='3'> 用测试集当标签<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch05__": {"html": "<h1>测验：第 5 章：真正的考试在训练集之外<\/h1><div class='quiz-item' data-qid='q13' data-type='single' data-concept='c13' data-chapter='ch05'><p class='quiz-q'><b>Q1.<\/b> 过拟合的典型表现是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q13' value='0'> 训练和验证都差<\/label><label class='quiz-opt'><input type='radio' name='q13' value='1'> 训练好、验证差<\/label><label class='quiz-opt'><input type='radio' name='q13' value='2'> 训练差、验证好<\/label><label class='quiz-opt'><input type='radio' name='q13' value='3'> 训练和验证完全一样<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q14' data-type='single' data-concept='c14' data-chapter='ch05'><p class='quiz-q'><b>Q2.<\/b> 召回率回答的是哪一问？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q14' value='0'> 说有里的多少是真的<\/label><label class='quiz-opt'><input type='radio' name='q14' value='1'> 真的里的多少被找出<\/label><label class='quiz-opt'><input type='radio' name='q14' value='2'> 一共预测了多少<\/label><label class='quiz-opt'><input type='radio' name='q14' value='3'> 模型有多大<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q15' data-type='single' data-concept='c15' data-chapter='ch05'><p class='quiz-q'><b>Q3.<\/b> 部署后数据分布变化导致性能下降，叫什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q15' value='0'> 过拟合<\/label><label class='quiz-opt'><input type='radio' name='q15' value='1'> 欠拟合<\/label><label class='quiz-opt'><input type='radio' name='q15' value='2'> 分布偏移<\/label><label class='quiz-opt'><input type='radio' name='q15' value='3'> 梯度消失<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch06__": {"html": "<h1>测验：第 6 章：一层一层看出一只猫<\/h1><div class='quiz-item' data-qid='q16' data-type='single' data-concept='c16' data-chapter='ch06'><p class='quiz-q'><b>Q1.<\/b> 神经网络为什么需要非线性激活函数？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q16' value='0'> 让模型更好看<\/label><label class='quiz-opt'><input type='radio' name='q16' value='1'> 没有它，多层网络会退化成线性变换<\/label><label class='quiz-opt'><input type='radio' name='q16' value='2'> 为了增加参数<\/label><label class='quiz-opt'><input type='radio' name='q16' value='3'> 为了省算力<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q17' data-type='single' data-concept='c17' data-chapter='ch06'><p class='quiz-q'><b>Q2.<\/b> 卷积网络「权重共享」的作用是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q17' value='0'> 让同一个探测器扫过所有位置，减少参数<\/label><label class='quiz-opt'><input type='radio' name='q17' value='1'> 让每个位置用不同参数<\/label><label class='quiz-opt'><input type='radio' name='q17' value='2'> 取消反向传播<\/label><label class='quiz-opt'><input type='radio' name='q17' value='3'> 增加图像分辨率<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q18' data-type='single' data-concept='c18' data-chapter='ch06'><p class='quiz-q'><b>Q3.<\/b> 反向传播的核心数学工具是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q18' value='0'> 傅里叶变换<\/label><label class='quiz-opt'><input type='radio' name='q18' value='1'> 链式法则<\/label><label class='quiz-opt'><input type='radio' name='q18' value='2'> 矩阵求逆<\/label><label class='quiz-opt'><input type='radio' name='q18' value='3'> 排序算法<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch07__": {"html": "<h1>测验：第 7 章：文字怎样变成数字<\/h1><div class='quiz-item' data-qid='q19' data-type='single' data-concept='c19' data-chapter='ch07'><p class='quiz-q'><b>Q1.<\/b> BPE 分词的基本操作是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q19' value='0'> 从整句开始不断切短<\/label><label class='quiz-opt'><input type='radio' name='q19' value='1'> 从字节开始反复合并高频相邻单元<\/label><label class='quiz-opt'><input type='radio' name='q19' value='2'> 随机切分<\/label><label class='quiz-opt'><input type='radio' name='q19' value='3'> 按标点切分<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q20' data-type='single' data-concept='c20' data-chapter='ch07'><p class='quiz-q'><b>Q2.<\/b> 词嵌入把 token 变成什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q20' value='0'> 一个整数编号<\/label><label class='quiz-opt'><input type='radio' name='q20' value='1'> 一个连续向量<\/label><label class='quiz-opt'><input type='radio' name='q20' value='2'> 一张图片<\/label><label class='quiz-opt'><input type='radio' name='q20' value='3'> 一条规则<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q21' data-type='single' data-concept='c19' data-chapter='ch07'><p class='quiz-q'><b>Q3.<\/b> 模型数不清 strawberry 里有几个 r，最直接的原因是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q21' value='0'> 模型没有眼睛<\/label><label class='quiz-opt'><input type='radio' name='q21' value='1'> 它看到的是 token 编号，字母不是独立单位<\/label><label class='quiz-opt'><input type='radio' name='q21' value='2'> 训练数据没有这个词<\/label><label class='quiz-opt'><input type='radio' name='q21' value='3'> 模型太小<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch08__": {"html": "<h1>测验：第 8 章：每个词都能看见其他词<\/h1><div class='quiz-item' data-qid='q22' data-type='single' data-concept='c21' data-chapter='ch08'><p class='quiz-q'><b>Q1.<\/b> 自注意力里 Q、K、V 分别代表？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q22' value='0'> 查询、键、值<\/label><label class='quiz-opt'><input type='radio' name='q22' value='1'> 问题、知识、向量<\/label><label class='quiz-opt'><input type='radio' name='q22' value='2'> 质量、核、速度<\/label><label class='quiz-opt'><input type='radio' name='q22' value='3'> 队列、键、版本<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q23' data-type='single' data-concept='c22' data-chapter='ch08'><p class='quiz-q'><b>Q2.<\/b> Transformer 为什么需要位置编码？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q23' value='0'> 注意力本身不分词序<\/label><label class='quiz-opt'><input type='radio' name='q23' value='1'> 为了增加参数<\/label><label class='quiz-opt'><input type='radio' name='q23' value='2'> 为了压缩模型<\/label><label class='quiz-opt'><input type='radio' name='q23' value='3'> 为了让公式好看<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q24' data-type='single' data-concept='c23' data-chapter='ch08'><p class='quiz-q'><b>Q3.<\/b> 自回归生成的意思是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q24' value='0'> 一次生成整段<\/label><label class='quiz-opt'><input type='radio' name='q24' value='1'> 每次预测一个 token，接回序列再预测下一个<\/label><label class='quiz-opt'><input type='radio' name='q24' value='2'> 随机抽一段训练文本<\/label><label class='quiz-opt'><input type='radio' name='q24' value='3'> 只生成标点<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch09__": {"html": "<h1>测验：第 9 章：从续写机到助手<\/h1><div class='quiz-item' data-qid='q25' data-type='single' data-concept='c24' data-chapter='ch09'><p class='quiz-q'><b>Q1.<\/b> SFT 主要改变模型的什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q25' value='0'> 全部世界知识<\/label><label class='quiz-opt'><input type='radio' name='q25' value='1'> 对话格式与风格<\/label><label class='quiz-opt'><input type='radio' name='q25' value='2'> 分词表<\/label><label class='quiz-opt'><input type='radio' name='q25' value='3'> 硬件驱动<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q26' data-type='single' data-concept='c25' data-chapter='ch09'><p class='quiz-q'><b>Q2.<\/b> DPO 相比 RLHF 的主要简化是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q26' value='0'> 不需要任何数据<\/label><label class='quiz-opt'><input type='radio' name='q26' value='1'> 不需要奖励模型和 PPO，直接优化偏好对<\/label><label class='quiz-opt'><input type='radio' name='q26' value='2'> 不需要语言模型<\/label><label class='quiz-opt'><input type='radio' name='q26' value='3'> 不需要损失函数<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q27' data-type='single' data-concept='c26' data-chapter='ch09'><p class='quiz-q'><b>Q3.<\/b> 思维链为什么能提高某些任务的表现？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q27' value='0'> 它让模型变小<\/label><label class='quiz-opt'><input type='radio' name='q27' value='1'> 它把中间步骤写进上下文，相当于给模型草稿纸<\/label><label class='quiz-opt'><input type='radio' name='q27' value='2'> 它删除了错误答案<\/label><label class='quiz-opt'><input type='radio' name='q27' value='3'> 它提高了温度<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch10__": {"html": "<h1>测验：第 10 章：它为什么会一本正经地胡说<\/h1><div class='quiz-item' data-qid='q28' data-type='single' data-concept='c27' data-chapter='ch10'><p class='quiz-q'><b>Q1.<\/b> 幻觉的根本来源是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q28' value='0'> 训练目标只奖励「像下一个词」，不奖励「真」<\/label><label class='quiz-opt'><input type='radio' name='q28' value='1'> 模型内存太小<\/label><label class='quiz-opt'><input type='radio' name='q28' value='2'> 网络延迟<\/label><label class='quiz-opt'><input type='radio' name='q28' value='3'> 用户提问太长<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q29' data-type='single' data-concept='c28' data-chapter='ch10'><p class='quiz-q'><b>Q2.<\/b> RAG 为什么不能完全消除幻觉？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q29' value='0'> 检索可能漏、可能错，模型也可能误读<\/label><label class='quiz-opt'><input type='radio' name='q29' value='1'> 因为 RAG 需要付费<\/label><label class='quiz-opt'><input type='radio' name='q29' value='2'> 因为模型不支持中文<\/label><label class='quiz-opt'><input type='radio' name='q29' value='3'> 因为知识库一定正确<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q30' data-type='single' data-concept='c29' data-chapter='ch10'><p class='quiz-q'><b>Q3.<\/b> 「校准」指的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q30' value='0'> 模型输出的把握与实际正确率是否一致<\/label><label class='quiz-opt'><input type='radio' name='q30' value='1'> 模型有多少参数<\/label><label class='quiz-opt'><input type='radio' name='q30' value='2'> 模型跑得多快<\/label><label class='quiz-opt'><input type='radio' name='q30' value='3'> 模型支持多少语言<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch11__": {"html": "<h1>测验：第 11 章：模型长出了眼睛和手<\/h1><div class='quiz-item' data-qid='q31' data-type='single' data-concept='c30' data-chapter='ch11'><p class='quiz-q'><b>Q1.<\/b> 原生多模态模型怎样处理图像？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q31' value='0'> 先把图像转成一段文字描述<\/label><label class='quiz-opt'><input type='radio' name='q31' value='1'> 把图像切成 patch 向量，和文字 token 一起进 Transformer<\/label><label class='quiz-opt'><input type='radio' name='q31' value='2'> 只用图像分类器<\/label><label class='quiz-opt'><input type='radio' name='q31' value='3'> 把图像存进数据库<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q32' data-type='single' data-concept='c31' data-chapter='ch11'><p class='quiz-q'><b>Q2.<\/b> 扩散模型训练时网络预测什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q32' value='0'> 清晰图像本身<\/label><label class='quiz-opt'><input type='radio' name='q32' value='1'> 被加进去的噪声<\/label><label class='quiz-opt'><input type='radio' name='q32' value='2'> 文字提示<\/label><label class='quiz-opt'><input type='radio' name='q32' value='3'> 下一张图<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q33' data-type='single' data-concept='c32' data-chapter='ch11'><p class='quiz-q'><b>Q3.<\/b> 工具调用让模型怎样？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q33' value='0'> 从「会说」扩展到「会做」<\/label><label class='quiz-opt'><input type='radio' name='q33' value='1'> 自动获得意识<\/label><label class='quiz-opt'><input type='radio' name='q33' value='2'> 不再需要训练<\/label><label class='quiz-opt'><input type='radio' name='q33' value='3'> 完全不会出错<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch12__": {"html": "<h1>测验：第 12 章：智能体的一天<\/h1><div class='quiz-item' data-qid='q34' data-type='single' data-concept='c33' data-chapter='ch12'><p class='quiz-q'><b>Q1.<\/b> 智能体的可靠性主要取决于？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q34' value='0'> 模型参数量<\/label><label class='quiz-opt'><input type='radio' name='q34' value='1'> 驾具：上下文、权限、执行、验证、交付<\/label><label class='quiz-opt'><input type='radio' name='q34' value='2'> 用户打字速度<\/label><label class='quiz-opt'><input type='radio' name='q34' value='3'> 显卡品牌<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q35' data-type='single' data-concept='c34' data-chapter='ch12'><p class='quiz-q'><b>Q2.<\/b> 「最小权限」的意思是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q35' value='0'> 只给完成任务必需的权限<\/label><label class='quiz-opt'><input type='radio' name='q35' value='1'> 给管理员权限最省事<\/label><label class='quiz-opt'><input type='radio' name='q35' value='2'> 完全不给权限<\/label><label class='quiz-opt'><input type='radio' name='q35' value='3'> 只给读权限永远不给写<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q36' data-type='single' data-concept='c33' data-chapter='ch12'><p class='quiz-q'><b>Q3.<\/b> 模型说「已完成」但文件没写，属于哪种失败？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q36' value='0'> 假完成<\/label><label class='quiz-opt'><input type='radio' name='q36' value='1'> 过拟合<\/label><label class='quiz-opt'><input type='radio' name='q36' value='2'> 梯度消失<\/label><label class='quiz-opt'><input type='radio' name='q36' value='3'> 冷启动<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch13__": {"html": "<h1>测验：第 13 章：AI 做科学：从 AlphaFold 说起<\/h1><div class='quiz-item' data-qid='q37' data-type='single' data-concept='c35' data-chapter='ch13'><p class='quiz-q'><b>Q1.<\/b> AlphaFold 属于哪种学习范式？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q37' value='0'> 监督学习<\/label><label class='quiz-opt'><input type='radio' name='q37' value='1'> 无监督学习<\/label><label class='quiz-opt'><input type='radio' name='q37' value='2'> 强化学习<\/label><label class='quiz-opt'><input type='radio' name='q37' value='3'> 规则系统<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q38' data-type='single' data-concept='c35' data-chapter='ch13'><p class='quiz-q'><b>Q2.<\/b> 多序列比对（MSA）为什么有用？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q38' value='0'> 它提供进化保守和协同变化信息<\/label><label class='quiz-opt'><input type='radio' name='q38' value='1'> 它直接给出三维坐标<\/label><label class='quiz-opt'><input type='radio' name='q38' value='2'> 它替代实验<\/label><label class='quiz-opt'><input type='radio' name='q38' value='3'> 它压缩模型<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q39' data-type='single' data-concept='c36' data-chapter='ch13'><p class='quiz-q'><b>Q3.<\/b> AlphaFold 没有解决下列哪一项？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q39' value='0'> 单链蛋白静态结构<\/label><label class='quiz-opt'><input type='radio' name='q39' value='1'> 蛋白质动态构象与配体结合<\/label><label class='quiz-opt'><input type='radio' name='q39' value='2'> 序列到坐标的预测<\/label><label class='quiz-opt'><input type='radio' name='q39' value='3'> 残基置信度估计<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch14__": {"html": "<h1>测验：第 14 章：与 AI 共事<\/h1><div class='quiz-item' data-qid='q40' data-type='single' data-concept='c37' data-chapter='ch14'><p class='quiz-q'><b>Q1.<\/b> 提示词的本质是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q40' value='0'> 咒语<\/label><label class='quiz-opt'><input type='radio' name='q40' value='1'> 给模型的全部上下文，塑造续写方向<\/label><label class='quiz-opt'><input type='radio' name='q40' value='2'> 模型参数<\/label><label class='quiz-opt'><input type='radio' name='q40' value='3'> 训练数据<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q41' data-type='single' data-concept='c38' data-chapter='ch14'><p class='quiz-q'><b>Q2.<\/b> AI 说一个事实，最稳妥的做法是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q41' value='0'> 直接相信<\/label><label class='quiz-opt'><input type='radio' name='q41' value='1'> 查原始来源<\/label><label class='quiz-opt'><input type='radio' name='q41' value='2'> 看它语气自不自信<\/label><label class='quiz-opt'><input type='radio' name='q41' value='3'> 看回答长不长<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q42' data-type='single' data-concept='c39' data-chapter='ch14'><p class='quiz-q'><b>Q3.<\/b> 数据最小化的核心是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q42' value='0'> 只给任务必需的数据和权限<\/label><label class='quiz-opt'><input type='radio' name='q42' value='1'> 数据越多越好<\/label><label class='quiz-opt'><input type='radio' name='q42' value='2'> 把所有文件都上传<\/label><label class='quiz-opt'><input type='radio' name='q42' value='3'> 关闭所有安全设置<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_t01__": {"html": "<h1>测验：专题 1：一句话的旅程<\/h1><div class='quiz-item' data-qid='q43' data-type='single' data-concept='c40' data-chapter='t01'><p class='quiz-q'><b>Q1.<\/b> 一次回答的流水线顺序是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q43' value='0'> 分词→嵌入→层计算→概率→采样<\/label><label class='quiz-opt'><input type='radio' name='q43' value='1'> 采样→分词→训练→部署<\/label><label class='quiz-opt'><input type='radio' name='q43' value='2'> 嵌入→分词→采样→层计算<\/label><label class='quiz-opt'><input type='radio' name='q43' value='3'> 概率→分词→嵌入→采样<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q44' data-type='single' data-concept='c40' data-chapter='t01'><p class='quiz-q'><b>Q2.<\/b> 为什么回答的第一个字通常最慢？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q44' value='0'> 要处理完整提示并算完所有层<\/label><label class='quiz-opt'><input type='radio' name='q44' value='1'> 因为网络一定卡<\/label><label class='quiz-opt'><input type='radio' name='q44' value='2'> 因为第一个字最长<\/label><label class='quiz-opt'><input type='radio' name='q44' value='3'> 因为模型在休息<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q45' data-type='single' data-concept='c40' data-chapter='t01'><p class='quiz-q'><b>Q3.<\/b> 模型算错数字母类问题，最可能卡在哪个阶段？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q45' value='0'> 分词<\/label><label class='quiz-opt'><input type='radio' name='q45' value='1'> 采样<\/label><label class='quiz-opt'><input type='radio' name='q45' value='2'> 部署<\/label><label class='quiz-opt'><input type='radio' name='q45' value='3'> UI 渲染<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_t02__": {"html": "<h1>测验：专题 2：推荐系统：你为什么停不下来<\/h1><div class='quiz-item' data-qid='q46' data-type='single' data-concept='c41' data-chapter='t02'><p class='quiz-q'><b>Q1.<\/b> 推荐系统最常优化的直接目标是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q46' value='0'> 你的长期幸福<\/label><label class='quiz-opt'><input type='radio' name='q46' value='1'> 你对候选内容的互动概率<\/label><label class='quiz-opt'><input type='radio' name='q46' value='2'> 服务器温度<\/label><label class='quiz-opt'><input type='radio' name='q46' value='3'> 模型参数量<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q47' data-type='single' data-concept='c41' data-chapter='t02'><p class='quiz-q'><b>Q2.<\/b> 推荐系统「反馈循环」指什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q47' value='0'> 推荐改变行为，行为又变成训练数据<\/label><label class='quiz-opt'><input type='radio' name='q47' value='1'> 模型自动更新代码<\/label><label class='quiz-opt'><input type='radio' name='q47' value='2'> 用户手动标注<\/label><label class='quiz-opt'><input type='radio' name='q47' value='3'> 服务器定时重启<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q48' data-type='single' data-concept='c42' data-chapter='t02'><p class='quiz-q'><b>Q3.<\/b> 冷启动的难点是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q48' value='0'> 新用户/新内容没有历史数据<\/label><label class='quiz-opt'><input type='radio' name='q48' value='1'> 数据太多<\/label><label class='quiz-opt'><input type='radio' name='q48' value='2'> 模型太大<\/label><label class='quiz-opt'><input type='radio' name='q48' value='3'> 网速太慢<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_t03__": {"html": "<h1>测验：专题 3：自动驾驶：四种能力的合体<\/h1><div class='quiz-item' data-qid='q49' data-type='single' data-concept='c43' data-chapter='t03'><p class='quiz-q'><b>Q1.<\/b> 自动驾驶的四个模块是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q49' value='0'> 感知、预测、规划/决策、控制<\/label><label class='quiz-opt'><input type='radio' name='q49' value='1'> 训练、验证、部署、监控<\/label><label class='quiz-opt'><input type='radio' name='q49' value='2'> 分词、嵌入、注意力、采样<\/label><label class='quiz-opt'><input type='radio' name='q49' value='3'> 采集、标注、清洗、打包<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q50' data-type='single' data-concept='c44' data-chapter='t03'><p class='quiz-q'><b>Q2.<\/b> 自动驾驶的长尾指的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q50' value='0'> 训练数据里极少出现却可能致命的罕见场景<\/label><label class='quiz-opt'><input type='radio' name='q50' value='1'> 车很长<\/label><label class='quiz-opt'><input type='radio' name='q50' value='2'> 路线很长<\/label><label class='quiz-opt'><input type='radio' name='q50' value='3'> 模型很老<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q51' data-type='single' data-concept='c44' data-chapter='t03'><p class='quiz-q'><b>Q3.<\/b> 数据闭环的作用是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q51' value='0'> 把车队遇到的新场景传回训练，再部署回车队<\/label><label class='quiz-opt'><input type='radio' name='q51' value='1'> 让车自动加油<\/label><label class='quiz-opt'><input type='radio' name='q51' value='2'> 关闭传感器<\/label><label class='quiz-opt'><input type='radio' name='q51' value='3'> 减少数据<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_t04__": {"html": "<h1>测验：专题 4：给科研人的机器学习实用课<\/h1><div class='quiz-item' data-qid='q52' data-type='single' data-concept='c45' data-chapter='t04'><p class='quiz-q'><b>Q1.<\/b> 科研机器学习的第一步是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q52' value='0'> 选最深的模型<\/label><label class='quiz-opt'><input type='radio' name='q52' value='1'> 问清预测什么、错了代价是什么<\/label><label class='quiz-opt'><input type='radio' name='q52' value='2'> 先买 GPU<\/label><label class='quiz-opt'><input type='radio' name='q52' value='3'> 先写论文<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q53' data-type='single' data-concept='c45' data-chapter='t04'><p class='quiz-q'><b>Q2.<\/b> 只有几百条科研数据时，优先考虑？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q53' value='0'> 从头训练千亿模型<\/label><label class='quiz-opt'><input type='radio' name='q53' value='1'> 树模型或预训练表示<\/label><label class='quiz-opt'><input type='radio' name='q53' value='2'> 放弃机器学习<\/label><label class='quiz-opt'><input type='radio' name='q53' value='3'> 只做可视化<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q54' data-type='single' data-concept='c46' data-chapter='t04'><p class='quiz-q'><b>Q3.<\/b> 主动学习挑实验时优先选？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q54' value='0'> 模型最确定会好的样本<\/label><label class='quiz-opt'><input type='radio' name='q54' value='1'> 可能好且模型不确定的样本<\/label><label class='quiz-opt'><input type='radio' name='q54' value='2'> 最便宜的样本<\/label><label class='quiz-opt'><input type='radio' name='q54' value='3'> 最旧的样本<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_t05__": {"html": "<h1>测验：专题 5：训练一个模型：从数据到对齐的实操<\/h1><div class='quiz-item' data-qid='q55' data-type='single' data-concept='c47' data-chapter='t05'><p class='quiz-q'><b>Q1.<\/b> 训练流水线中 SFT 之后通常是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q55' value='0'> 分词器训练<\/label><label class='quiz-opt'><input type='radio' name='q55' value='1'> 偏好对齐/强化学习<\/label><label class='quiz-opt'><input type='radio' name='q55' value='2'> 数据抓取<\/label><label class='quiz-opt'><input type='radio' name='q55' value='3'> 部署<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q56' data-type='single' data-concept='c48' data-chapter='t05'><p class='quiz-q'><b>Q2.<\/b> 想给模型加本校规章，优先用什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q56' value='0'> 从头预训练<\/label><label class='quiz-opt'><input type='radio' name='q56' value='1'> RAG 检索规章库<\/label><label class='quiz-opt'><input type='radio' name='q56' value='2'> 只调温度<\/label><label class='quiz-opt'><input type='radio' name='q56' value='3'> 换分词器<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q57' data-type='single' data-concept='c47' data-chapter='t05'><p class='quiz-q'><b>Q3.<\/b> GRPO 适合什么任务？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q57' value='0'> 有可验证奖励的数学、代码<\/label><label class='quiz-opt'><input type='radio' name='q57' value='1'> 纯主观审美<\/label><label class='quiz-opt'><input type='radio' name='q57' value='2'> 无答案的闲聊<\/label><label class='quiz-opt'><input type='radio' name='q57' value='3'> 图像压缩<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_t06__": {"html": "<h1>测验：专题 6：AI 与开源<\/h1><div class='quiz-item' data-qid='q58' data-type='single' data-concept='c49' data-chapter='t06'><p class='quiz-q'><b>Q1.<\/b> 多数「开源模型」实际开放的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q58' value='0'> 代码、数据、权重全部<\/label><label class='quiz-opt'><input type='radio' name='q58' value='1'> 主要是权重和推理代码<\/label><label class='quiz-opt'><input type='radio' name='q58' value='2'> 只有论文<\/label><label class='quiz-opt'><input type='radio' name='q58' value='3'> 只有 Logo<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q59' data-type='single' data-concept='c49' data-chapter='t06'><p class='quiz-q'><b>Q2.<\/b> 开放权重最大的实际价值是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q59' value='0'> 可微调、可审计、可离线部署<\/label><label class='quiz-opt'><input type='radio' name='q59' value='1'> 一定比闭源强<\/label><label class='quiz-opt'><input type='radio' name='q59' value='2'> 完全无版权限制<\/label><label class='quiz-opt'><input type='radio' name='q59' value='3'> 不需要算力<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q60' data-type='single' data-concept='c50' data-chapter='t06'><p class='quiz-q'><b>Q3.<\/b> 看到「开源模型」最该追问什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q60' value='0'> 开放的是代码、数据还是权重，许可证允许什么<\/label><label class='quiz-opt'><input type='radio' name='q60' value='1'> 模型图标好不好看<\/label><label class='quiz-opt'><input type='radio' name='q60' value='2'> 下载速度快不快<\/label><label class='quiz-opt'><input type='radio' name='q60' value='3'> 有没有中文名<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__cards__": {"html": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "kind": "cards", "title": "抽认卡"}, "__glossary__": {"html": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='人工智能'>人工智能 — 让机器完成那些通常需要人类智能才能完成的任务。定义的核心是「任务」而不是方法：规则、搜索、统计学习、神经网络都可以是实现手段。它是本书六层包含关系里最外面的一圈。 <span class=glossary-ref>（第 1 章：你已经在用 AI 了）<\/span><\/li><li data-term='机器学习'>机器学习 — 人工智能的一个子集。不由人写规则，而是让机器从数据中自己找出规律。规律以模型参数的形式存在，人读不懂，但可以测试。1990 年代起成为 AI 的主流，今天绝大多数被称为 AI 的系统都是机器学习。 <span class=glossary-ref>（第 1 章：你已经在用 AI 了）<\/span><\/li><li data-term='深度学习'>深度学习 — 用多层神经网络做的机器学习。它最重要的特点不是层数多，而是连「该看数据的哪些方面」（特征）也交给机器学习，即表示学习。2012 年起统治图像、语音，随后扩展到语言。 <span class=glossary-ref>（第 1 章：你已经在用 AI 了）<\/span><\/li><li data-term='大语言模型'>大语言模型 — 在海量文本上以「预测下一个 token」为目标训练的超大 Transformer 网络，参数从几十亿到上万亿。一个模型可以迁移到几乎所有与语言有关的任务。「基础模型」是更宽的说法，把处理图像、音频的同类模型也算进来。 <span class=glossary-ref>（第 1 章：你已经在用 AI 了）<\/span><\/li><li data-term='生成式 ai'>生成式 AI — 强调用途的一个词：不只是分类和预测，而是生成原本不存在的文本、图像、音频、视频或代码。2022 年底 ChatGPT 让它进入公众视野。「造得像」与「造得对」是两回事，这是它最需要警惕的地方。 <span class=glossary-ref>（第 1 章：你已经在用 AI 了）<\/span><\/li><li data-term='ai 效应'>AI 效应 — 一旦机器做到了某件事，人们就不再把那件事算作「智能」。计算、光学字符识别、语音输入、路线规划都经历过从 AI 明星课题到「普通软件」的转变。它解释了为什么「AI」这个词的边界总在往后退。 <span class=glossary-ref>（第 1 章：你已经在用 AI 了）<\/span><\/li><li data-term='符号主义'>符号主义 — 认为智能是对符号（概念、命题）的逻辑操作，只要把知识写成符号和规则，机器就能推理。1956 到 1980 年代的 AI 正统，成就是定理证明与专家系统，瓶颈是知识写不完、规则会打架。 <span class=glossary-ref>（第 2 章：七十年，三次浪潮）<\/span><\/li><li data-term='专家系统'>专家系统 — 把某个狭窄领域里专家的知识写成几百到几千条 if-then 规则，配一个推理引擎，让机器在该领域内当顾问。1980 年代的商业热潮，因「知识获取瓶颈」（规则靠人访谈录入、难维护、难适应变化）而退潮。 <span class=glossary-ref>（第 2 章：七十年，三次浪潮）<\/span><\/li><li data-term='ai 寒冬'>AI 寒冬 — AI 历史上经费与信心大规模撤出的时期，主要有两次（1970 年代中期、1980 年代末）。共同原因不是技术「失败」，而是承诺与能力之间的落差。它提醒我们把「能做什么」与「被说成能做什么」分开。 <span class=glossary-ref>（第 2 章：七十年，三次浪潮）<\/span><\/li><li data-term='感知机'>感知机 — 1958 年罗森布拉特提出的单层神经网络，能从例子中学会简单的线性分类。1969 年被证明连异或都学不会，导致连接主义沉寂十余年；解决办法是多层结构加反向传播，但要到几十年后算力与数据到位才发挥威力。 <span class=glossary-ref>（第 2 章：七十年，三次浪潮）<\/span><\/li><li data-term='imagenet'>ImageNet — 李飞飞团队从 2007 年起建立的图像数据集，一千四百万张人工标注的图片。2012 年在其竞赛上，深度卷积网络把错误率从 26% 降到 16%，成为深度学习浪潮的起点。它说明「数据」是算法、数据、算力三角形里同等重要的一角。 <span class=glossary-ref>（第 2 章：七十年，三次浪潮）<\/span><\/li><li data-term='摩尔定律与 gpu'>摩尔定律与 GPU — 芯片算力每约两年翻倍的经验规律，加上原本为游戏渲染设计、恰好擅长并行矩阵运算的图形处理器，共同提供了深度学习所需的算力。2012 年的突破就是在两块游戏显卡上完成的。今天前沿模型的训练用几万块 GPU。 <span class=glossary-ref>（第 2 章：七十年，三次浪潮）<\/span><\/li><li data-term='规模定律'>规模定律 — 2020 年前后总结出的经验规律：在一定范围内，模型的损失随参数量、数据量、计算量的增加呈可预测的幂律下降。它让「把模型做大」从赌博变成工程，是行业押注超大模型的理由；它是否会持续、在何处失效，是当前最重要的开放问题之一。 <span class=glossary-ref>（第 2 章：七十年，三次浪潮）<\/span><\/li><li data-term='搜索'>搜索 — 在大量可能性里系统地寻找一个满足条件（或最优）的解：从起点出发展开可能的下一步，直到到达目标。走迷宫、排课、下棋、路径规划都是搜索问题。朴素搜索会遭遇组合爆炸，实用的搜索靠剪枝与启发式省力。 <span class=glossary-ref>（第 3 章：不只是神经网络）<\/span><\/li><li data-term='启发式'>启发式 — 一个便宜的估计，告诉搜索「往哪边更有希望」。地图上的直线距离就是到目的地真实距离的启发式。好的启发式让搜索几乎不走弯路；从不高估真实代价的启发式能保证搜到最优解。 <span class=glossary-ref>（第 3 章：不只是神经网络）<\/span><\/li><li data-term='a* 算法'>A* 算法 — 1968 年提出的启发式搜索算法，对每个节点计算「已走代价 + 到目标的估计代价」并优先展开最小者。只要估计从不高估，它保证找到最短路，且远快于盲目搜索。导航软件与游戏寻路至今用它。 <span class=glossary-ref>（第 3 章：不只是神经网络）<\/span><\/li><li data-term='规则系统'>规则系统 — 用人写的 if-then 规则做判断的系统。优点是透明、可审计、可精确控制；缺点是写不完、不会自己适应变化。今天常与机器学习模型组合使用：模型给概率，规则加硬约束，例如智能体执行危险操作前必须确认。 <span class=glossary-ref>（第 3 章：不只是神经网络）<\/span><\/li><li data-term='强化学习'>强化学习 — 让智能体在环境中反复尝试，按行动之后得到的奖励调整策略，学会「在这种情况下该做什么」。它没有标签，只有奖励；必须处理探索与利用的矛盾。是机器人、游戏 AI 的基础，也是大语言模型对齐阶段的核心方法。 <span class=glossary-ref>（第 3 章：不只是神经网络）<\/span><\/li><li data-term='奖励'>奖励 — 强化学习中环境对智能体行动的反馈数值。学习的目标是最大化长期累积奖励。奖励的设计极其关键：设计不当会导致智能体钻空子（奖励破解），这一问题在用人类偏好训练语言模型时同样出现。 <span class=glossary-ref>（第 3 章：不只是神经网络）<\/span><\/li><li data-term='探索与利用'>探索与利用 — 强化学习特有的矛盾：是沿用已知有效的行动（利用），还是尝试未知的行动以发现可能更好的选择（探索）。只利用会困在平庸解，只探索拿不到稳定回报。监督学习的数据是给定的，不存在这个问题。 <span class=glossary-ref>（第 3 章：不只是神经网络）<\/span><\/li><li data-term='蒙特卡洛树搜索'>蒙特卡洛树搜索 — 通过随机模拟大量对局来评估走法的搜索方法，把算力集中在最有希望的分支上。AlphaGo 用它向前推演，并用策略网络与价值网络替代了以往靠人手写的评估函数，是搜索与神经网络合流的典型。 <span class=glossary-ref>（第 3 章：不只是神经网络）<\/span><\/li><li data-term='样本与特征'>样本与特征 — 样本是训练数据里的一条记录（一笔订单、一张照片）；特征是描述这条记录的各个数值（距离、时段、像素）。把现实变成特征的过程叫特征工程，在深度学习之前是机器学习工程师的主要工作。 <span class=glossary-ref>（第 4 章：规则不是写出来的，是学出来的）<\/span><\/li><li data-term='标签'>标签 — 监督学习中希望模型学会预测的那个答案：订单的成交价、照片里是不是猫。标签通常由人提供，昂贵且可能带入标注者的偏见与错误。模型学到的上限是标签的质量。 <span class=glossary-ref>（第 4 章：规则不是写出来的，是学出来的）<\/span><\/li><li data-term='模型与参数'>模型与参数 — 模型是一台「带旋钮的机器」：输入特征，输出预测。旋钮就是参数（权重、偏置），学习就是找到让预测尽量准的参数取值。参数从一条直线的三个到大语言模型的上万亿个。 <span class=glossary-ref>（第 4 章：规则不是写出来的，是学出来的）<\/span><\/li><li data-term='损失函数'>损失函数 — 把「模型错了多少」变成一个可计算、可比较的数，例如预测值与真实值之差的平方的平均。训练就是不断调整参数使损失下降。损失函数（训练用）与评估指标（最终汇报用）常常不同。 <span class=glossary-ref>（第 4 章：规则不是写出来的，是学出来的）<\/span><\/li><li data-term='梯度下降'>梯度下降 — 最常用的优化算法：对每个参数计算「稍微改动会让损失增大还是减小」（梯度），沿减小的方向走一小步，反复进行。像蒙眼下山。步长叫学习率。它就是训练万亿参数模型时用的那个算法。 <span class=glossary-ref>（第 4 章：规则不是写出来的，是学出来的）<\/span><\/li><li data-term='监督学习'>监督学习 — 用带标签的数据训练模型，学习从特征到标签的映射。最成熟、应用最广的范式，识别与预测两类能力主要来自它。瓶颈是标签昂贵。 <span class=glossary-ref>（第 4 章：规则不是写出来的，是学出来的）<\/span><\/li><li data-term='无监督学习'>无监督学习 — 数据没有标签，模型只能寻找结构：把样本自动分群、发现异常、压缩表示。它不告诉你每一群是什么，只告诉你数据里存在这样的分野。 <span class=glossary-ref>（第 4 章：规则不是写出来的，是学出来的）<\/span><\/li><li data-term='自监督学习'>自监督学习 — 从数据自身制造标签：遮住一个词让模型猜、截断一段文字让模型续写。不需要人工标注，因此可以用整个互联网训练。它是大语言模型能出现的直接原因。 <span class=glossary-ref>（第 4 章：规则不是写出来的，是学出来的）<\/span><\/li><li data-term='训练'>训练 — 用数据反复调整模型参数以降低损失的过程。一个完整项目还包括定义任务、收集数据、构造特征、划分数据、评估、部署与监控，其中「用什么模型」往往是最不重要的决定。 <span class=glossary-ref>（第 4 章：规则不是写出来的，是学出来的）<\/span><\/li><li data-term='泛化'>泛化 — 模型在没见过的数据上表现稳定的能力。它是机器学习唯一真正的目标，损失、梯度、参数都为它服务。训练数据上的表现不能说明泛化，必须在留出的数据上考。 <span class=glossary-ref>（第 5 章：真正的考试在训练集之外）<\/span><\/li><li data-term='过拟合'>过拟合 — 模型不但学到了规律，还把训练数据里的噪声和巧合当成规律，于是训练表现很好、新数据上很差。模型越灵活、数据越少越容易发生。对策：更多数据、限制复杂度、正则化、早停。 <span class=glossary-ref>（第 5 章：真正的考试在训练集之外）<\/span><\/li><li data-term='欠拟合'>欠拟合 — 模型太简单，连数据里真实的规律都抓不住，训练损失就降不下去。用一条直线去拟合一段明显的曲线就是欠拟合。与过拟合构成机器学习里永恒的拉锯。 <span class=glossary-ref>（第 5 章：真正的考试在训练集之外）<\/span><\/li><li data-term='训练集与测试集'>训练集与测试集 — 把数据分成三份：训练集用来学，验证集用来调参数和决定何时停，测试集只在最后考一次。验证与测试分开，是为了防止你反复根据同一份数据调整模型而间接过拟合它。有时间顺序的数据必须用过去预测未来。 <span class=glossary-ref>（第 5 章：真正的考试在训练集之外）<\/span><\/li><li data-term='准确率'>准确率 — 预测正确的比例。最常被引用也最容易误导的指标：当关心的类别是少数（1%的患病率），一个「全判为否」的模型准确率也有 99%。需要拆成误报与漏报分开看。 <span class=glossary-ref>（第 5 章：真正的考试在训练集之外）<\/span><\/li><li data-term='精确率与召回率'>精确率与召回率 — 精确率：模型说「是」的那些里，多少真的是。召回率：所有真的「是」里，模型找出了多少。两者此消彼长，取舍取决于误报与漏报各自的代价，这是价值判断而非技术选择。 <span class=glossary-ref>（第 5 章：真正的考试在训练集之外）<\/span><\/li><li data-term='混淆矩阵'>混淆矩阵 — 把分类结果按「预测是/否 × 实际是/否」分成四格：真阳性、假阳性（误报）、假阴性（漏报）、真阴性。准确率、精确率、召回率都从这四格算出。 <span class=glossary-ref>（第 5 章：真正的考试在训练集之外）<\/span><\/li><li data-term='标签泄漏'>标签泄漏 — 某个特征偷偷包含了答案（预测是否住院，特征里有「是否开了住院单」）。模型会得到近乎完美的训练成绩，因为它作弊了，而作弊的特征在真正预测的时刻并不存在。往往很隐蔽。 <span class=glossary-ref>（第 5 章：真正的考试在训练集之外）<\/span><\/li><li data-term='分布偏移'>分布偏移 — 部署后的数据与训练数据不再来自同一个「世界」：疫情改变了出行，新教材改变了学情。所有模型都默认「未来像过去」，而这没有保证。因此部署不是终点，监控才是。 <span class=glossary-ref>（第 5 章：真正的考试在训练集之外）<\/span><\/li><li data-term='相关与因果'>相关与因果 — 模型学到的全部是相关（什么与什么倾向于同时出现）。相关足以预测，不足以干预：给每个孩子发平板不会自动提高成绩。区分两者需要实验设计与领域知识，不是更大的模型。辛普森悖论是相关方向可被隐藏变量反转的例子。 <span class=glossary-ref>（第 5 章：真正的考试在训练集之外）<\/span><\/li><li data-term='神经元'>神经元 — 神经网络的基本单元，做四件事：接收一组输入，各乘一个权重，求和加偏置，送进非线性激活函数输出。可以看作一个「微型探测器」。与生物神经元只有「输入够强才放电」这一点相似。 <span class=glossary-ref>（第 6 章：一层一层看出一只猫）<\/span><\/li><li data-term='激活函数'>激活函数 — 神经元求和之后的非线性函数（如「负数归零、正数照旧」）。没有它，堆多少层都只是一个线性变换；有了它，多层网络可以逼近几乎任何函数。非线性是神经网络一切能力的来源。 <span class=glossary-ref>（第 6 章：一层一层看出一只猫）<\/span><\/li><li data-term='层与深度'>层与深度 — 一层是并排接收同样输入的一组神经元；深度是层数。层的意义在于组合：下层学边缘，上层把边缘组成部件、把部件组成物体。深网络比宽网络更高效，因为下层学到的东西可以被上层复用。 <span class=glossary-ref>（第 6 章：一层一层看出一只猫）<\/span><\/li><li data-term='反向传播'>反向传播 — 高效计算深度网络中损失对每个参数的梯度的方法：先正向算出输出，再用链式法则把误差逐层往回「分配」。一次反向传播得到全部梯度，计算量只比正向多常数倍。没有它，深度网络在算力上不可训练。 <span class=glossary-ref>（第 6 章：一层一层看出一只猫）<\/span><\/li><li data-term='卷积神经网络'>卷积神经网络 — 为图像设计的网络：每个神经元只看一小块局部区域（局部连接），同一组权重在整张图上滑动（权重共享），配合池化逐层扩大视野。参数少、效果好，因为结构里内置了「图像模式与位置无关」的先验。 <span class=glossary-ref>（第 6 章：一层一层看出一只猫）<\/span><\/li><li data-term='表示学习'>表示学习 — 深度学习真正的突破：不只学从特征到答案的映射，连从原始数据到特征的映射也一起学。人只提供像素和标签，网络自己发明「边缘」「纹理」「耳朵」。它让同一套方法可以用于图像、语音、文本、蛋白质结构。 <span class=glossary-ref>（第 6 章：一层一层看出一只猫）<\/span><\/li><li data-term='特征层级'>特征层级 — 训练好的深度网络里事后观察到的现象：第一层对边缘敏感，第二层对角与纹理，更高层对部件与整体。这个层级不是人设计的，是为了完成任务而自发形成的。 <span class=glossary-ref>（第 6 章：一层一层看出一只猫）<\/span><\/li><li data-term='参数量'>参数量 — 网络中权重和偏置的总数，衡量模型规模最常用的数字，从几万到上万亿。对混合专家模型要区分「总参数」与每个 token 实际用到的「激活参数」，后者决定运行成本。 <span class=glossary-ref>（第 6 章：一层一层看出一只猫）<\/span><\/li><li data-term='语言模型'>语言模型 — 一个概率分布：给定前面的文字，对「下一个词是什么」的每种可能给出概率。翻译、写作、问答都可化归为「最可能的续写」。七十年来定义未变，变的是能看多长的前文和用什么估计概率。 <span class=glossary-ref>（第 7 章：文字怎样变成数字）<\/span><\/li><li data-term='token'>Token — 模型处理文字的基本单元，由分词器从词表中切出：常见词一个 token，生僻词拆成几个片段，任何字符最终都能拆到字节。模型从未见过「字」，只见过token 的编号，这解释了它数字母、倒写等任务上的失误。 <span class=glossary-ref>（第 7 章：文字怎样变成数字）<\/span><\/li><li data-term='分词'>分词 — 把文本切成 token 序列的过程，是模型的「眼睛」。它决定了模型对字母、数字的视力，也决定了各种语言的成本：主流词表在英文语料上构建，很多汉字要占两三个 token。 <span class=glossary-ref>（第 7 章：文字怎样变成数字）<\/span><\/li><li data-term='bpe'>BPE — 字节对编码。从单个字节开始，反复把语料中最常相邻出现的两个单元合并成新单元，进行几万到几十万次，得到词表。它在「词表小」与「单元有意义」之间取得由数据决定的平衡，对新词适应力强，是今天几乎所有大模型的分词方法。 <span class=glossary-ref>（第 7 章：文字怎样变成数字）<\/span><\/li><li data-term='上下文窗口'>上下文窗口 — 模型一次能看到的 token 数量上限，从几千到上百万。超出部分模型看不见；窗口内的中间部分也常比开头结尾受到更少注意。窗口不是记忆，对话结束后模型什么都不记得。 <span class=glossary-ref>（第 7 章：文字怎样变成数字）<\/span><\/li><li data-term='词向量'>词向量 — 每个 token 对应的一串数字（几百到几千维），由训练得到：用法相似的词向量靠近，意义关系对应空间中的方向，于是「国王 − 男人 + 女人 ≈ 女王」。它把语言变成了几何，是文字的表示学习。 <span class=glossary-ref>（第 7 章：文字怎样变成数字）<\/span><\/li><li data-term='嵌入'>嵌入 — 把离散对象（token、图片、用户、商品）映射到连续向量空间的操作或结果。词向量是文字的嵌入。语义搜索、推荐、检索增强生成、图文互搜都建立在「把不同东西嵌入同一空间再比较」之上。 <span class=glossary-ref>（第 7 章：文字怎样变成数字）<\/span><\/li><li data-term='向量相似度'>向量相似度 — 衡量两个向量是否「相近」的方法，最常用的是夹角余弦（方向一致为 1，垂直为 0）。支撑语义搜索、推荐与检索增强生成。它反映的是训练语料中的共现，语料的偏见会被忠实编码。 <span class=glossary-ref>（第 7 章：文字怎样变成数字）<\/span><\/li><li data-term='自注意力'>自注意力 — 序列里每个位置都根据与所有位置的相关度加权收集信息，从而让一个词的表示随上下文改变（「苹果」在「吃」旁边偏向水果）。对整个序列可并行计算，这是 Transformer 能扩展到超大规模的原因；代价是计算量随长度平方增长。 <span class=glossary-ref>（第 8 章：每个词都能看见其他词）<\/span><\/li><li data-term='查询键值'>查询键值 — 注意力的三个角色：每个词发出查询（我想知道什么），提供键（我能回答什么）和值（我愿意贡献的信息）。查询与各键比对得到权重，按权重对各值加权求和。三者由三个可训练矩阵从词向量变换而来。 <span class=glossary-ref>（第 8 章：每个词都能看见其他词）<\/span><\/li><li data-term='多头注意力'>多头注意力 — 同时用多组查询键值，每组（一个「头」）学习关注不同类型的关系（语法、指代、位置），最后把各头输出拼接。事后观察可见有的头专看前一个词、有的专追踪代词。 <span class=glossary-ref>（第 8 章：每个词都能看见其他词）<\/span><\/li><li data-term='位置编码'>位置编码 — 注意力机制本身不在乎词序，「猫追狗」与「狗追猫」无法区分。位置编码在每个词的向量上加入表示位置的信息，把顺序塞回一个本身与顺序无关的机制。 <span class=glossary-ref>（第 8 章：每个词都能看见其他词）<\/span><\/li><li data-term='transformer'>Transformer — 2017 年提出的架构，由多个模块叠成，每个模块是「自注意力 + 残差与归一化+ 前馈网络 + 残差与归一化」。前接嵌入层，后接输出层。GPT、Llama、Qwen、DeepSeek、Claude 在架构上都是它的变体。 <span class=glossary-ref>（第 8 章：每个词都能看见其他词）<\/span><\/li><li data-term='前馈网络'>前馈网络 — Transformer 模块里对每个位置单独做非线性变换的多层感知机。注意力在词间搬运信息，前馈网络消化它。模型的大部分参数在这里，研究者认为许多「知识」也存在这里；混合专家架构替换的就是它。 <span class=glossary-ref>（第 8 章：每个词都能看见其他词）<\/span><\/li><li data-term='残差连接'>残差连接 — 让每个子层的输出加上它的输入再往下传，信息可以绕过某层直行。2015 年提出，解决了深网络梯度消失的问题，使网络从几十层到上千层成为可能。Transformer 每个模块都带着它。 <span class=glossary-ref>（第 8 章：每个词都能看见其他词）<\/span><\/li><li data-term='自回归生成'>自回归生成 — 模型每次只预测一个 token，接在序列后再预测下一个，直到产生结束标记。一段五百字的回答意味着几百次完整计算；文字逐个蹦出来不是打字效果。模型没有「计划」，结构感来自训练语料。 <span class=glossary-ref>（第 8 章：每个词都能看见其他词）<\/span><\/li><li data-term='采样与温度'>采样与温度 — 从下一个 token 的概率分布里选词的方式。贪心永远选最大者，稳定但单调；采样按概率随机抽。温度是调节旋钮：低温压尖分布、接近贪心，高温压平分布、更随机。top-k、top-p 限制候选范围。 <span class=glossary-ref>（第 8 章：每个词都能看见其他词）<\/span><\/li><li data-term='预训练'>预训练 — 三阶段训练的第一阶段，也是最贵的：在几万亿 token 的文本上预测下一个token，用几万块 GPU 跑几个月。看似平淡的任务逼出了语言、知识与推理能力。产物是基础模型。 <span class=glossary-ref>（第 9 章：从续写机到助手）<\/span><\/li><li data-term='基础模型'>基础模型 — 只经过预训练的模型：懂语言与世界，但只会续写，不会对话。问它问题，它可能续写出另一个问题。需要监督微调与对齐才能成为助手。 <span class=glossary-ref>（第 9 章：从续写机到助手）<\/span><\/li><li data-term='监督微调'>监督微调 — 用几万到几十万条高质量「问题 + 回答」示范继续训练基础模型，教它对话的格式与风格。改变的主要是形式而非知识，数据质量远比数量重要。 <span class=glossary-ref>（第 9 章：从续写机到助手）<\/span><\/li><li data-term='对齐'>对齐 — 用人类偏好（对几个回答的排序）而非标准答案训练模型，使其更有帮助、更诚实、更无害。三者有张力，「偏好由谁定义」是最受争议的问题。它不是给模型装道德模块，而是继续塑造概率分布，因此可以被推回去（越狱）。 <span class=glossary-ref>（第 9 章：从续写机到助手）<\/span><\/li><li data-term='rlhf'>RLHF — 从人类反馈中强化学习：用人类排序训练一个奖励模型，再用强化学习让语言模型生成得分更高的回答。2022 年 ChatGPT 的关键技术。难点：奖励模型可被「讨好」（奖励破解），训练不稳定。 <span class=glossary-ref>（第 9 章：从续写机到助手）<\/span><\/li><li data-term='dpo'>DPO — 直接偏好优化：把「回答 A 胜过 B」直接写成损失函数，用梯度下降优化，绕开奖励模型与强化学习。与 RLHF 目标等价而更简单稳定，是开源社区的标准做法。 <span class=glossary-ref>（第 9 章：从续写机到助手）<\/span><\/li><li data-term='涌现'>涌现 — 模型规模跨过某个门槛后，某些能力从「完全不会」跳到「突然会了」，如多步推理、上下文学习。是否真是突变有争议（可能是评估指标造成的假象），但「大到某个程度后能做以前做不了的事」是行业押注规模的理由。 <span class=glossary-ref>（第 9 章：从续写机到助手）<\/span><\/li><li data-term='思维链'>思维链 — 让模型把中间推理步骤写出来再给答案。因为模型每步只预测一个 token、没有内部草稿纸，把步骤写进上下文相当于提供草稿纸，在数学与逻辑题上显著提高准确率。推理模型把它训练成默认习惯。 <span class=glossary-ref>（第 9 章：从续写机到助手）<\/span><\/li><li data-term='推理模型'>推理模型 — 用强化学习专门奖励「先写推理过程、答案正确」而训练出的模型，回答前自发生成几百到几万 token 的思考。数学、编程、科学问题上跃升一个台阶，代价是慢与贵。它意味着能力可以靠推理时的算力购买。 <span class=glossary-ref>（第 9 章：从续写机到助手）<\/span><\/li><li data-term='混合专家'>混合专家 — 把前馈网络换成几十个并列的「专家」，由路由器为每个 token 只挑两三个计算。总参数可以很大，每次激活的参数很小，训练与推理成本按激活参数算。2024 年底起成为大模型默认选择。 <span class=glossary-ref>（第 9 章：从续写机到助手）<\/span><\/li><li data-term='幻觉'>幻觉 — 模型以自信的语气生成看似合理但不真实的内容：不存在的引文、错误的数字、张冠李戴的事实。根源是训练目标里只有「像」没有「真」，在冷门话题与需要精确细节处更多。不会被消灭，但可用检索、引用、允许说不知道、交叉验证与人工把关压制。 <span class=glossary-ref>（第 10 章：它为什么会一本正经地胡说）<\/span><\/li><li data-term='知识截止日期'>知识截止日期 — 预训练数据收集截止的时间。此后的事模型一无所知，但它不一定知道自己不知道，可能基于旧知识编一个合理回答。联网搜索与检索可补缺口，但模型「自己」的知识始终有日期。 <span class=glossary-ref>（第 10 章：它为什么会一本正经地胡说）<\/span><\/li><li data-term='检索增强生成'>检索增强生成 — 回答前先用向量相似度从可信资料库找出相关段落放进上下文，让模型基于材料回答。续写的依据从模糊的训练印象变成眼前的文本，编造空间大减。企业级 AI 问答、「把 AI 接到自己的知识库」都是它。不能完全消除幻觉。 <span class=glossary-ref>（第 10 章：它为什么会一本正经地胡说）<\/span><\/li><li data-term='接地'>接地 — 让模型的陈述有可追溯的依据：来自上下文里的材料、可访问的链接或工具的返回结果。要求引用是最简单的接地手段。给不出依据的陈述应按未验证处理。 <span class=glossary-ref>（第 10 章：它为什么会一本正经地胡说）<\/span><\/li><li data-term='校准'>校准 — 模型表达的把握程度与实际正确率的一致性。基础模型校准通常很好，对齐后常变差，因为标注者偏爱肯定的语气。于是「自信」不再对应「正确」。实用建议：把语气当噪声，把多次回答的一致性当信号。 <span class=glossary-ref>（第 10 章：它为什么会一本正经地胡说）<\/span><\/li><li data-term='可解释性'>可解释性 — 研究如何理解神经网络内部在做什么的方向。因为模型不按人可读的规则运行，我们很难说清它答对是推理还是记忆、答错是哪一步的问题。这带来安全（未测试的输入上无保证）与责任（不能解释就不能独自负责）两个后果。 <span class=glossary-ref>（第 10 章：它为什么会一本正经地胡说）<\/span><\/li><li data-term='提示注入'>提示注入 — 模型读取的外部内容（网页、邮件、文件、工具描述）里藏着给模型的指令，模型无法区分它与用户的指令。聊天时代最坏结果是错误文字，智能体时代可能是泄露数据或执行危险操作。目前没有完美解法，靠限制权限、隔离内容、关键操作人工确认。 <span class=glossary-ref>（第 10 章：它为什么会一本正经地胡说）<\/span><\/li><li data-term='智能体'>智能体 — 把语言模型放进一个循环：给它目标和工具，让它自己决定下一步、调用工具、看结果、再决定，直到完成任务。它是模型、搜索、规则与强化学习的合流。与只回答问题的「模型」相比，智能体会执行有后果的行动，因此需要权限限制与人工确认。 <span class=glossary-ref>（第 11 章：模型长出了眼睛和手）<\/span><\/li><li data-term='多模态'>多模态 — 模型同时处理文字、图像、音频、视频。原理是「一切都是 token」：图切成小方块、音频切成时间片，各自变成向量进同一个 Transformer。原生多模态（预训练起就同时学）比外挂式（先转文字描述）保留更多信息。 <span class=glossary-ref>（第 11 章：模型长出了眼睛和手）<\/span><\/li><li data-term='扩散模型'>扩散模型 — 今天图像与视频生成的主流方法：训练时给清晰图逐步加噪声，让网络学会「从更噪恢复更清晰」的一步；生成时从纯噪声出发反复应用几十次，图像从噪声中显影，文字提示通过注意力引导方向。 <span class=glossary-ref>（第 11 章：模型长出了眼睛和手）<\/span><\/li><li data-term='语音合成'>语音合成 — 从文字生成语音。近年越来越多地直接用语言模型预测「声音的 token」，能带情感、停顿与口音，几秒钟的样本足以克隆一个人的声音。这使声音不再能作为身份证明。 <span class=glossary-ref>（第 11 章：模型长出了眼睛和手）<\/span><\/li><li data-term='工具调用'>工具调用 — 约定某些特殊格式的输出不是给人看的，而是触发程序去执行（搜索、计算、查数据库、操作文件），结果贴回上下文让模型继续。在微调与对齐阶段训练进模型。它让模型「长出了手」。 <span class=glossary-ref>（第 11 章：模型长出了眼睛和手）<\/span><\/li><li data-term='mcp'>MCP — 模型上下文协议，2024 年底提出的开放标准：工具用统一格式描述自己能做什么、需要什么参数，任何支持协议的模型客户端都能直接接入，无需为每个组合单独开发。类似 USB 之于硬件。后交由中立基金会管理。 <span class=glossary-ref>（第 11 章：模型长出了眼睛和手）<\/span><\/li><li data-term='编程智能体'>编程智能体 — 能读懂代码库、修改多个文件、运行测试、修复错误并提交改动的智能体。它最先成熟，因为代码可编译、可测试，反馈清晰自动。由此推断：反馈越清晰的领域，智能体成熟得越快。本站就是这样写出来的。 <span class=glossary-ref>（第 11 章：模型长出了眼睛和手）<\/span><\/li><li data-term='沙盒'>沙盒 — 让智能体在受限的隔离环境中执行操作（有限的文件、网络与权限），即使被提示注入或犯错，损害也被圈在沙盒里。与「行动分级：可逆的自动做、不可逆的先问」一起构成智能体的安全带。 <span class=glossary-ref>（第 11 章：模型长出了眼睛和手）<\/span><\/li><li data-term='人在回路'>人在回路 — 在 AI 的输出被采纳、或行动被执行之前，由人审核或批准。聊天时代是「核对输出」，智能体时代是「批准行动」。它是 AI 不承担责任这一事实在流程上的体现：每件由 AI 参与的事，最后有一个人为它负责。 <span class=glossary-ref>（第 11 章：模型长出了眼睛和手）<\/span><\/li><li data-term='驾具'>驾具 — 围绕模型的那一整套程序：组装上下文、解析并执行工具调用、管理权限、压缩上下文、维护记忆、派出子智能体、验证与交付。借自马具一词：模型是马，驾具让力气变成前进。智能体的可靠性一大半来自它，2025 年后模型公司开始自己发布驾具。 <span class=glossary-ref>（第 12 章：智能体的一天）<\/span><\/li><li data-term='系统提示'>系统提示 — 驾具写给模型、排在每次调用最前面的总说明：身份与规则、工作方式、每个工具的说明、安全边界、环境信息、技能清单。编程智能体的系统提示在 2026年已达几万 token，且逐版变化；Anthropic 逐版公开 Claude 网页版的系统提示（不含工具说明）。它能这么长，靠的是模型能遵守、窗口装得下、键值缓存只算一次。 <span class=glossary-ref>（第 12 章：智能体的一天）<\/span><\/li><li data-term='指令文件'>指令文件 — 项目或个人写给智能体的文本（常见文件名如 CLAUDE.md、AGENTS.md，个人智能体的记忆文件也属此类），每次任务开始时被放进上下文。它告诉通用模型这个项目怎么跑、怎么测、什么不能碰。写好它是省掉大量往返的最有效办法。 <span class=glossary-ref>（第 12 章：智能体的一天）<\/span><\/li><li data-term='智能体循环'>智能体循环 — 调用模型 → 模型输出工具调用 → 驾具执行 → 结果贴回上下文 → 再调用模型，直到模型宣布完成或被人叫停。一个二十分钟的编程任务可能转一百多圈；每一圈都把整段历史重新送入，键值缓存让这不至于太贵。 <span class=glossary-ref>（第 12 章：智能体的一天）<\/span><\/li><li data-term='权限策略'>权限策略 — 驾具里规定哪些动作自动放行、哪些按白名单、哪些每次要人点头、哪些禁止。读通常自动，写与执行按策略，不可逆的操作（部署、删除、发送）应当要问。它是智能体的安全带，与沙盒和钩子一起构成「限制模型」的那一半工程。 <span class=glossary-ref>（第 12 章：智能体的一天）<\/span><\/li><li data-term='上下文压缩'>上下文压缩 — 长任务中上下文将满时，让模型把历史按固定结构（原始要求、已完成、进行中、问题、计划、涉及文件）总结后替换原文。做得差会「失忆」；做得好还会把关键状态写进外部文件，不只依赖总结。 <span class=glossary-ref>（第 12 章：智能体的一天）<\/span><\/li><li data-term='子智能体'>子智能体 — 由主智能体派出的分身：带一个明确任务和独立的上下文出发，读完几十个文件后只把结论交回。用途是并行与隔离细节，不让主上下文被中间材料撑满。多个子智能体可以同时出发。 <span class=glossary-ref>（第 12 章：智能体的一天）<\/span><\/li><li data-term='技能'>技能 — 把「怎样做一件事」写成带步骤、注意事项和示例的文本文件，放在约定位置，驾具在需要时读入上下文，模型照着做。没有代码、不用训练，靠上下文学习起效；价值在可传递，风险在说明书里可以藏指令。 <span class=glossary-ref>（第 12 章：智能体的一天）<\/span><\/li><li data-term='渐进式披露'>渐进式披露 — 把信息分层交给模型的设计：启动时只给每份技能的名字和一句描述（约一百token），任务匹配时才读整份说明书，附件与脚本只在用到时读或运行。它把「上下文是稀缺资源」变成了一种结构，让驾具能装几十份技能而不占地方。 <span class=glossary-ref>（第 12 章：智能体的一天）<\/span><\/li><li data-term='钩子'>钩子 — 在某个事件（如每次工具调用前后、每次改文件后）自动运行的脚本，由驾具触发，不经模型判断。用途是用确定性代码约束模型：自动跑格式检查、禁止写入某些目录、强制验证。它是规则系统在智能体里的现代形态。 <span class=glossary-ref>（第 12 章：智能体的一天）<\/span><\/li><li data-term='个人智能体'>个人智能体 — 接入个人的聊天软件、邮箱、日历、文件与浏览器，常驻在自己机器上的智能体。2026 年初以「龙虾」为代表出圈，随后暴露出「难养、难管、难放心」的问题：维护成本、权限集中、提示注入。稳妥用法是专用账号、最小权限、定期看日志。 <span class=glossary-ref>（第 12 章：智能体的一天）<\/span><\/li><li data-term='多智能体协作'>多智能体协作 — 多个智能体分工：主从（一个拆任务派活）、并行分支（各做一遍取最好）、流水线（写、审、测接力）、「白班夜班」（人布置、智能体夜里跑）。不是免费的乘法：协调有成本，错误会累积，同样的盲点互审等于没审。先把一个用好，再考虑一群。 <span class=glossary-ref>（第 12 章：智能体的一天）<\/span><\/li><li data-term='智能体的失败模式'>智能体的失败模式 — 说做完了其实没做完、为通过测试而改测试、越界、原地循环、被文件里的话指挥、压缩后失忆、成本失控。没有一种来自模型不够聪明，全部对应驾具、指令与权限的设计，因此都可以由人减少。 <span class=glossary-ref>（第 12 章：智能体的一天）<\/span><\/li><li data-term='提示词'>提示词 — 你给模型的全部文字，即它的上下文，决定了续写的方向。好的提示说清任务、对象与标准，给例子而不是形容，让模型先想再做。它本质上是在用文字塑造一个概率分布的形状，理解这一点就不需要背模板。 <span class=glossary-ref>（第 14 章：与 AI 共事）<\/span><\/li><li data-term='验证习惯'>验证习惯 — 与模型共事的三个习惯：关键事实（数字、日期、引文、人名、条款、剂量）必查；不懂的领域不用它做最终判断；要求它给出依据。它们不是不信任，而是由模型的工作方式推出的必然。 <span class=glossary-ref>（第 14 章：与 AI 共事）<\/span><\/li><li data-term='数据最小化'>数据最小化 — 把内容交给 AI 服务前，只提供任务需要的部分，能匿名的先匿名，条款不明的服务不交学生作业、病历、内部文件。同时只给智能体必需的权限，因为每一项权限都是提示注入可利用的通道。 <span class=glossary-ref>（第 14 章：与 AI 共事）<\/span><\/li><li data-term='ai 素养'>AI 素养 — 本书的答案不是「学提示词」或「学编程」，而是三种在 AI 之前就重要、现在更显眼的能力：提出好问题、判断产出的好坏与真假、愿意并能够为 AI 参与的事负责。当产出的成本趋近于零，判断成为最稀缺的东西。 <span class=glossary-ref>（第 14 章：与 AI 共事）<\/span><\/li><li data-term='长尾'>长尾 — 每一种都极其罕见、加起来却经常遇到的情况。一辆车开一百万公里能见到几乎所有常见路况，但「几乎所有」不是「所有」；事故发生在没见过的情况里。长尾不能靠更多数据穷尽，只能靠仿真生成、数据闭环和模型外的规则底线共同应对。判断任何高风险 AI，问它在长尾上怎么办。 <span class=glossary-ref>（第 14 章：与 AI 共事）<\/span><\/li><li data-term='数据闭环'>数据闭环 — 车队把遇到的不确定情况（预测分歧、人接管、急刹）上传，云端筛选、标注、训练、仿真验证、再推送回车队，每周甚至每天转一次。规模是核心：一百万辆车一天遇到的罕见情况比一百辆车一年多得多。代价是隐私，以及「模型不知道自己不知道的情况永远不会被上传」。 <span class=glossary-ref>（第 14 章：与 AI 共事）<\/span><\/li><\/ul>", "kind": "glossary", "title": "术语表"}, "__diagnosis__": {"html": "<h1>🩺 诊断测试<\/h1><p>系统会从全书中抽题。答错的题会自动沿知识依赖链回溯，告诉你真正需要补的前置知识点。<\/p><div class='diag-controls'><button id='diag-start'>开始诊断（随机抽 5 题）<\/button><span id='diag-progress'><\/span><\/div><div id='diag-stage'><\/div><div id='diag-result'><\/div>", "kind": "diagnosis", "title": "诊断测试"}, "__patterns__": {"html": "<h1>模式与框架库<\/h1>\n<p>这本书真正反复使用的分析框架不多，但每一个都能迁移到你要判断的具体产品上。下面按「什么时候用、怎么用、边界在哪」写。<\/p>\n<h2>框架一：六层地图<\/h2>\n<p><strong>什么时候用<\/strong>：听到「AI」「大模型」「生成式 AI」「智能体」混着说，先分层。<\/p>\n<p><strong>怎么用<\/strong>：<\/p>\n<ol><li>\n最外层是人工智能，包含所有让机器完成人类智能任务的方法。\n<\/li><li>\n往里是机器学习：从数据学规律，而不是人写死规则。\n<\/li><li>\n再往里是深度学习：多层神经网络，特征也由模型自己学。\n<\/li><li>\n大语言模型是深度学习里以文本为主、规模极大的分支。\n<\/li><li>\n生成式 AI 是按用途切的一层：造新内容，不只做判断。\n<\/li><li>\n智能体是按用法切的一层：把模型放进循环里，能调用工具、执行多步任务。\n<\/ol>\n<p><strong>边界<\/strong>：层与层不是替代关系。搜索、规则系统、强化学习仍然在大量系统里工作，不会因为大模型出现就消失。<\/p>\n<h2>框架二：四种能力拆解<\/h2>\n<p><strong>什么时候用<\/strong>：面对一个新产品，想知道它到底在做什么、哪里最可能出错。<\/p>\n<p><strong>怎么用<\/strong>：<\/p>\n<ul><li>\n识别：输入一个东西，判断它是什么。最成熟，很多任务超过人。\n<\/li><li>\n预测：根据过去估计未知。质量取决于历史数据是否包含未来的规律。\n<\/li><li>\n生成：造出原本不存在的内容。最容易「像而不对」。\n<\/li><li>\n决策：在环境里选择行动。有后果，会改变环境。\n<\/ul>\n<p>拆完再问：这条链路里哪一环错了代价最大？哪一环有验证手段？哪一环必须人确认？<\/p>\n<p><strong>边界<\/strong>：真实产品常常四种全用，拆解是为了定位风险，不是为了贴标签。<\/p>\n<h2>框架三：数据、算力、算法三角<\/h2>\n<p><strong>什么时候用<\/strong>：看到「某算法带来突破」的叙事，想判断条件是否成立。<\/p>\n<p><strong>怎么用<\/strong>：问三件事——数据够不够、算力够不够、算法是否可训练。三者缺一，突破不会发生。<\/p>\n<p><strong>边界<\/strong>：三角解释的是「为什么现在能做成」，不解释「为什么这个方向值得做」。后者是价值判断。<\/p>\n<h2>框架四：训练三件套<\/h2>\n<p><strong>什么时候用<\/strong>：想理解一个模型的能力从哪来，或者判断「微调能不能解决」。<\/p>\n<p><strong>怎么用<\/strong>：<\/p>\n<ul><li>\n预训练：学语言和世界，产物是基础模型。\n<\/li><li>\n监督微调：教对话格式和风格，不擅长灌新知识。\n<\/li><li>\n对齐：按人类偏好调整取舍，可以被越狱，也会带来校准下降。\n<\/ul>\n<p><strong>边界<\/strong>：三件套之后，模型仍然是概率分布，不是规则库。它没有可读的「道德模块」。<\/p>\n<h2>框架五：评估三份数据<\/h2>\n<p><strong>什么时候用<\/strong>：看到「准确率 95%」这类数字，想判断它是否可信。<\/p>\n<p><strong>怎么用<\/strong>：<\/p>\n<ol><li>\n训练集学参数。\n<\/li><li>\n验证集调超参、早停、选模型。\n<\/li><li>\n测试集最后只考一次。\n<\/ol>\n<p>再问：类别平衡吗？只报了平均吗？有没有校准？有没有分组？测试集被反复用过吗？<\/p>\n<p><strong>边界<\/strong>：三份数据只能防「自己骗自己」，防不了分布偏移。部署后仍要监控。<\/p>\n<h2>框架六：生成—检索—对齐<\/h2>\n<p><strong>什么时候用<\/strong>：想降低幻觉，或设计一个知识型应用。<\/p>\n<p><strong>怎么用<\/strong>：<\/p>\n<ul><li>\n生成：模型续写，容易编。\n<\/li><li>\n检索：回答前先找材料，把依据放进上下文。\n<\/li><li>\n对齐：用偏好数据调整「承认不知道」的行为。\n<\/li><li>\n接地：要求引用、链接、工具返回，给不出依据就标未验证。\n<\/ul>\n<p><strong>边界<\/strong>：RAG 降低概率，不提供保证。检索会漏、会错，模型会误读。<\/p>\n<h2>框架七：驾具循环<\/h2>\n<p><strong>什么时候用<\/strong>：设计或评估一个智能体。<\/p>\n<p><strong>怎么用<\/strong>：把循环拆成七件事——组装上下文、模型决策、权限检查、执行工具、压缩上下文、验证产物、交付结果。<\/p>\n<p>再问：模型说完成时，谁独立验证？上下文太长时怎么压缩？危险操作谁批？出错后能回滚吗？<\/p>\n<p><strong>边界<\/strong>：驾具能截断错误累积，但不能让一个错误的判断变成正确。判断本身仍要看模型和资料。<\/p>\n<h2>框架八：AI 做科学三条件<\/h2>\n<p><strong>什么时候用<\/strong>：判断一个「AI for Science」项目是真实加速还是包装。<\/p>\n<p><strong>怎么用<\/strong>：问三件事——数据够多吗？目标能写成明确的预测吗？答案能被实验检验吗？<\/p>\n<p>三个都满足，AI 最容易成功；缺一个，就要降低预期。<\/p>\n<p><strong>边界<\/strong>：AI 加速的是预测和筛选，不自动产生因果解释。实验验证和机制研究仍由人负责。<\/p>\n<h2>决策规则<\/h2>\n<ul><li>\n如果任务有大量先例、答案可检查、错了可改 → 优先让 AI 做初稿或初筛。\n<\/li><li>\n如果任务需要定义目标、核对关键事实、对具体人负责 → 人做最终判断。\n<\/li><li>\n如果知识会更新 → 优先 RAG，不要靠微调灌知识。\n<\/li><li>\n如果只想改风格和格式 → 微调，不要从头训练。\n<\/li><li>\n如果数据只有几百条 → 先做傻基线，再试树模型或预训练表示，不要上深网络。\n<\/li><li>\n如果错了代价不可逆 → 人在回路，先批准再执行。\n<\/li><li>\n如果模型说「已完成」 → 独立验证产物，不信自述。\n<\/li><li>\n如果模型语气很自信 → 把它当噪声，查原始来源。\n<\/ul>\n<h2>反模式<\/h2>\n<p><strong>「AI 就是大模型」<\/strong>。把最里面一层当成全部，会忽略搜索、规则、强化学习，也会误判传统系统的价值。替代方案：先用六层地图定位。<\/p>\n<p><strong>「准确率高就是好模型」<\/strong>。类别不平衡时准确率会被多数类绑架；测试集反复调也会虚高。替代方案：看混淆矩阵、分组表现、校准和代价。<\/p>\n<p><strong>「知识不够就微调」<\/strong>。微调擅长格式和风格，不擅长灌新知识。替代方案：先 RAG，再考虑继续预训练。<\/p>\n<p><strong>「模型越大越可靠」<\/strong>。规模买得到能力，买不到真实性。替代方案：检索、引用、验证、人。<\/p>\n<p><strong>「智能体能自己搞定」<\/strong>。长任务错误会累积，模型还会假完成。替代方案：驾具 + 权限 + 独立验证 + 人工检查点。<\/p>\n<p><strong>「开源模型就是完全开源」<\/strong>。多数只开放权重。替代方案：查清开放的是代码、数据还是权重，读许可证。<\/p>\n<p><strong>「AI 会替代科学家」<\/strong>。它加速预测和筛选，不替代问题选择、实验验证和机制解释。替代方案：把 AI 当仪器，不当作者。<\/p>", "kind": "模式库", "title": "模式库"}, "__cheatsheet__": {"html": "<h1>速查表<\/h1>\n<h2>核心公式与规则<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>A* 评价函数<\/td><td><span class=\"katex-inline\">f(n)=g(n)+h(n)<\/span>；<span class=\"katex-inline\">h<\/span> 不高估时保证最短路<\/td><\/tr><tr><td>监督学习损失<\/td><td><span class=\"katex-inline\">L=\\frac{1}{n}\\sum_i(\\hat y_i-y_i)^2<\/span><\/td><\/tr><tr><td>梯度下降<\/td><td><span class=\"katex-inline\">w\\leftarrow w-\\eta\\nabla L(w)<\/span><\/td><\/tr><tr><td>精确率<\/td><td><span class=\"katex-inline\">TP/(TP+FP)<\/span>，误报代价<\/td><\/tr><tr><td>召回率<\/td><td><span class=\"katex-inline\">TP/(TP+FN)<\/span>，漏报代价<\/td><\/tr><tr><td>注意力打分<\/td><td><span class=\"katex-inline\">\\mathrm{softmax}(QK^\\top/\\sqrt{d_k})V<\/span><\/td><\/tr><tr><td>缩放定律<\/td><td><span class=\"katex-inline\">L(x)=L_\\infty+a x^{-b}<\/span><\/td><\/tr><tr><td>训练算力估算<\/td><td><span class=\"katex-inline\">C\\approx6ND<\/span><\/td><\/tr><tr><td>扩散前向<\/td><td><span class=\"katex-inline\">x_t=\\sqrt{\\alpha_t}x_0+\\sqrt{1-\\alpha_t}\\epsilon<\/span><\/td><\/tr><tr><td>扩散训练目标<\/td><td>预测噪声 <span class=\"katex-inline\">\\epsilon<\/span>，损失 <span class=\"katex-inline\">\\|\\epsilon-\\epsilon_\\theta(x_t,t)\\|^2<\/span><\/td><\/tr><tr><td>奖励模型损失<\/td><td><span class=\"katex-inline\">-\\log\\sigma(r(x,y^+)-r(x,y^-))<\/span><\/td><\/tr><tr><td>RLHF 目标<\/td><td>奖励减去 KL 惩罚：<span class=\"katex-inline\">r-\\beta\\mathrm{KL}(\\pi_\\theta\\|\\pi_{\\text{ref}})<\/span><\/td><\/tr><tr><td>余弦相似度<\/td><td><span class=\"katex-inline\">\\cos(a,b)=a\\cdot b/(\\|a\\|\\|b\\|)<\/span><\/td><\/tr><\/tbody><\/table>\n<h2>概念对照<\/h2>\n<table><thead><tr><th>容易混<\/th><th>区别<\/th><\/tr><\/thead><tbody><tr><td>参数量 vs 数据量<\/td><td>参数是模型容量，数据是学习材料；固定算力下要按比例增长<\/td><\/tr><tr><td>预训练 vs 微调<\/td><td>预训练学语言与世界，微调改行为与格式<\/td><\/tr><tr><td>RLHF vs DPO<\/td><td>RLHF 用奖励模型 + 强化学习；DPO 直接优化偏好对<\/td><\/tr><tr><td>幻觉 vs 错误<\/td><td>幻觉是自信地编造看似合理的内容；错误也可能是算错、看错<\/td><\/tr><tr><td>RAG vs 微调<\/td><td>RAG 改回答时看到的材料；微调改模型行为<\/td><\/tr><tr><td>开放权重 vs 开源<\/td><td>开放权重给参数；开源还要求代码、数据、可复现<\/td><\/tr><tr><td>识别 vs 预测<\/td><td>识别判断「是什么」；预测估计「会怎样」<\/td><\/tr><tr><td>生成 vs 决策<\/td><td>生成造内容；决策选行动并承担后果<\/td><\/tr><tr><td>过拟合 vs 欠拟合<\/td><td>过拟合训练好验证差；欠拟合两者都差<\/td><\/tr><tr><td>分布偏移 vs 过拟合<\/td><td>偏移是部署数据变了；过拟合是模型背了训练噪声<\/td><\/tr><\/tbody><\/table>\n<h2>判断流程<\/h2>\n<ol><li>\n这个任务属于识别、预测、生成还是决策？\n<\/li><li>\n数据够不够？标签从哪来？会不会泄漏？\n<\/li><li>\n傻基线是什么？多好算好？\n<\/li><li>\n错了代价是什么？可逆吗？谁承担？\n<\/li><li>\n需要检索、工具、人工确认中的哪几项？\n<\/li><li>\n怎么验证？测试集是否只考一次？\n<\/li><li>\n部署后怎么监控漂移？\n<\/ol>\n<h2>成本量级<\/h2>\n<table><thead><tr><th>做法<\/th><th>数据<\/th><th>算力<\/th><th>量级<\/th><\/tr><\/thead><tbody><tr><td>提示/技能<\/td><td>无<\/td><td>推理<\/td><td>几乎零成本<\/td><\/tr><tr><td>RAG<\/td><td>文档库 + 向量索引<\/td><td>推理 + 检索<\/td><td>几百到几万元<\/td><\/tr><tr><td>微调<\/td><td>几千到几万条示例<\/td><td>几块 GPU<\/td><td>几千元级<\/td><\/tr><tr><td>中等预训练<\/td><td>几十到几百亿 token<\/td><td>几十块 GPU<\/td><td>几万元级<\/td><\/tr><tr><td>前沿预训练<\/td><td>几万亿 token<\/td><td>几万块 GPU<\/td><td>几亿到几十亿元<\/td><\/tr><\/tbody><\/table>\n<h2>术语速记<\/h2>\n<ul><li>\n<strong>Token<\/strong>：模型读写的最小单位，不等于字或词。\n<\/li><li>\n<strong>嵌入<\/strong>：把 token 变成连续向量。\n<\/li><li>\n<strong>注意力<\/strong>：每个位置按相关度从其他位置收集信息。\n<\/li><li>\n<strong>残差<\/strong>：给梯度一条直路，让深网络可训练。\n<\/li><li>\n<strong>校准<\/strong>：说 80% 把握时，实际是否约 80% 正确。\n<\/li><li>\n<strong>接地<\/strong>：陈述要有可追溯依据。\n<\/li><li>\n<strong>驾具<\/strong>：模型外面的上下文、工具、权限、验证、交付系统。\n<\/li><li>\n<strong>沙盒<\/strong>：把执行限制在隔离环境里。\n<\/li><li>\n<strong>长尾<\/strong>：极少出现却可能致命的罕见场景。\n<\/ul>", "kind": "速查表", "title": "速查表"}}, "base_dir": "/home/user/Doubao/chats/38453413604796930/HelloAI学习系统/01-Hello-AI人工智能导论", "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "🕸 知识图谱", "href": "#/graph"}, {"label": "🩺 诊断测试", "href": "#/diagnosis"}, {"label": "章节", "children": [{"label": "第 1 章：你已经在用 AI 了", "href": "#/chapter/ch01"}, {"label": "第 2 章：七十年，三次浪潮", "href": "#/chapter/ch02"}, {"label": "第 3 章：不只是神经网络", "href": "#/chapter/ch03"}, {"label": "第 4 章：规则不是写出来的，是学出来的", "href": "#/chapter/ch04"}, {"label": "第 5 章：真正的考试在训练集之外", "href": "#/chapter/ch05"}, {"label": "第 6 章：一层一层看出一只猫", "href": "#/chapter/ch06"}, {"label": "第 7 章：文字怎样变成数字", "href": "#/chapter/ch07"}, {"label": "第 8 章：每个词都能看见其他词", "href": "#/chapter/ch08"}, {"label": "第 9 章：从续写机到助手", "href": "#/chapter/ch09"}, {"label": "第 10 章：它为什么会一本正经地胡说", "href": "#/chapter/ch10"}, {"label": "第 11 章：模型长出了眼睛和手", "href": "#/chapter/ch11"}, {"label": "第 12 章：智能体的一天", "href": "#/chapter/ch12"}, {"label": "第 13 章：AI 做科学：从 AlphaFold 说起", "href": "#/chapter/ch13"}, {"label": "第 14 章：与 AI 共事", "href": "#/chapter/ch14"}, {"label": "专题 1：一句话的旅程", "href": "#/chapter/t01"}, {"label": "专题 2：推荐系统：你为什么停不下来", "href": "#/chapter/t02"}, {"label": "专题 3：自动驾驶：四种能力的合体", "href": "#/chapter/t03"}, {"label": "专题 4：给科研人的机器学习实用课", "href": "#/chapter/t04"}, {"label": "专题 5：训练一个模型：从数据到对齐的实操", "href": "#/chapter/t05"}, {"label": "专题 6：AI 与开源", "href": "#/chapter/t06"}]}, {"label": "概念", "children": [{"label": "AI 与 AI 效应", "href": "#/concept/c01"}, {"label": "六层包含关系", "href": "#/concept/c02"}, {"label": "四种能力：识别、预测、生成、决策", "href": "#/concept/c03"}, {"label": "三次浪潮与两次寒冬", "href": "#/concept/c04"}, {"label": "规模定律", "href": "#/concept/c05"}, {"label": "数据、算力、算法三角", "href": "#/concept/c06"}, {"label": "A* 搜索", "href": "#/concept/c07"}, {"label": "规则系统", "href": "#/concept/c08"}, {"label": "强化学习与探索利用", "href": "#/concept/c09"}, {"label": "监督学习", "href": "#/concept/c10"}, {"label": "梯度下降", "href": "#/concept/c11"}, {"label": "自监督学习", "href": "#/concept/c12"}, {"label": "泛化与过拟合", "href": "#/concept/c13"}, {"label": "精确率、召回率与混淆矩阵", "href": "#/concept/c14"}, {"label": "分布偏移与相关因果", "href": "#/concept/c15"}, {"label": "神经元与激活函数", "href": "#/concept/c16"}, {"label": "卷积神经网络", "href": "#/concept/c17"}, {"label": "表示学习与反向传播", "href": "#/concept/c18"}, {"label": "分词与 BPE", "href": "#/concept/c19"}, {"label": "词向量与嵌入", "href": "#/concept/c20"}, {"label": "自注意力与 QKV", "href": "#/concept/c21"}, {"label": "Transformer 与位置编码", "href": "#/concept/c22"}, {"label": "自回归生成与采样", "href": "#/concept/c23"}, {"label": "预训练、SFT 与对齐", "href": "#/concept/c24"}, {"label": "RLHF 与 DPO", "href": "#/concept/c25"}, {"label": "涌现、思维链与推理模型", "href": "#/concept/c26"}, {"label": "幻觉", "href": "#/concept/c27"}, {"label": "RAG 与接地", "href": "#/concept/c28"}, {"label": "校准与提示注入", "href": "#/concept/c29"}, {"label": "多模态", "href": "#/concept/c30"}, {"label": "扩散模型", "href": "#/concept/c31"}, {"label": "工具调用与智能体", "href": "#/concept/c32"}, {"label": "驾具与智能体循环", "href": "#/concept/c33"}, {"label": "权限、沙盒与人在回路", "href": "#/concept/c34"}, {"label": "AlphaFold 与 AI 做科学", "href": "#/concept/c35"}, {"label": "AI 做科学的三个条件", "href": "#/concept/c36"}, {"label": "提示词", "href": "#/concept/c37"}, {"label": "人机分工与验证", "href": "#/concept/c38"}, {"label": "数据最小化与 AI 素养", "href": "#/concept/c39"}, {"label": "一次回答的推理流水线", "href": "#/concept/c40"}, {"label": "推荐系统与反馈循环", "href": "#/concept/c41"}, {"label": "冷启动与探索", "href": "#/concept/c42"}, {"label": "自动驾驶的四个模块", "href": "#/concept/c43"}, {"label": "长尾与数据闭环", "href": "#/concept/c44"}, {"label": "科研机器学习流程", "href": "#/concept/c45"}, {"label": "校准与主动学习", "href": "#/concept/c46"}, {"label": "训练流水线与偏好方法", "href": "#/concept/c47"}, {"label": "提示、RAG、微调怎么选", "href": "#/concept/c48"}, {"label": "开放权重", "href": "#/concept/c49"}, {"label": "蒸馏与许可证", "href": "#/concept/c50"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1 章：你已经在用 AI 了", "href": "#/quiz/ch01"}, {"label": "测验：第 2 章：七十年，三次浪潮", "href": "#/quiz/ch02"}, {"label": "测验：第 3 章：不只是神经网络", "href": "#/quiz/ch03"}, {"label": "测验：第 4 章：规则不是写出来的，是学出来的", "href": "#/quiz/ch04"}, {"label": "测验：第 5 章：真正的考试在训练集之外", "href": "#/quiz/ch05"}, {"label": "测验：第 6 章：一层一层看出一只猫", "href": "#/quiz/ch06"}, {"label": "测验：第 7 章：文字怎样变成数字", "href": "#/quiz/ch07"}, {"label": "测验：第 8 章：每个词都能看见其他词", "href": "#/quiz/ch08"}, {"label": "测验：第 9 章：从续写机到助手", "href": "#/quiz/ch09"}, {"label": "测验：第 10 章：它为什么会一本正经地胡说", "href": "#/quiz/ch10"}, {"label": "测验：第 11 章：模型长出了眼睛和手", "href": "#/quiz/ch11"}, {"label": "测验：第 12 章：智能体的一天", "href": "#/quiz/ch12"}, {"label": "测验：第 13 章：AI 做科学：从 AlphaFold 说起", "href": "#/quiz/ch13"}, {"label": "测验：第 14 章：与 AI 共事", "href": "#/quiz/ch14"}, {"label": "测验：专题 1：一句话的旅程", "href": "#/quiz/t01"}, {"label": "测验：专题 2：推荐系统：你为什么停不下来", "href": "#/quiz/t02"}, {"label": "测验：专题 3：自动驾驶：四种能力的合体", "href": "#/quiz/t03"}, {"label": "测验：专题 4：给科研人的机器学习实用课", "href": "#/quiz/t04"}, {"label": "测验：专题 5：训练一个模型：从数据到对齐的实操", "href": "#/quiz/t05"}, {"label": "测验：专题 6：AI 与开源", "href": "#/quiz/t06"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "rendered": {"ch01": "<div class=\"source-badge\">📖 出处：hello-ai.pdf · p.6–15<\/div><h1>第 1 章：你已经在用 AI 了<\/h1>\n<blockquote>第一部 · 地图　·　一个诚实的定义，一张不会过时的地图，以及为什么「AI」这个词总在往后退。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ ｜ <strong>预估学时<\/strong>：1–2 小时 ｜ <strong>前置<\/strong>：无\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n能用一句话说清什么算 AI、什么只是自动化。\n<\/li><li>\n能把一个 AI 产品拆成识别、预测、生成、决策四种能力。\n<\/li><li>\n能分清 AI、机器学习、深度学习、大模型、生成式 AI、智能体六层关系。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>AI 是让机器完成那些通常需要人类智能才能完成的任务；判断一个产品，先问它在做哪种任务，再问它靠什么做到、在哪里会出错。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：定义看任务，不看方法<\/h3>\n<p>「人工智能」这个词是 1956 年夏天在达特茅斯学院的一场研讨会上定下来的。提出它的约翰·麦卡锡给了一个很宽松的说法：让机器去做那些「如果由人来做，我们会说需要智能」的事。<\/p>\n<p>这个定义的重点在<strong>任务<\/strong>，不在实现方式。下棋、翻译、认脸、写一段话，过去只有人能做得像样，所以机器做到这些就算 AI。它不要求机器有意识，也不要求它像人一样思考。1997 年靠搜索击败国际象棋冠军的深蓝，和今天会聊天的大模型，技术路线完全不同，但都落在这个定义里。<\/p>\n<p>这也解释了一个反复出现的现象：<strong>AI 效应<\/strong>。计算器算得比人快，没人说它是 AI；语音输入、路线规划刚出现时都是 AI 明星课题，普及之后就成了「普通软件」。一旦机器把某件事做成了常规，我们就不再觉得那件事需要智能。AI 这个词的边界，永远指向机器还做不太好的那一片。<\/p>\n<h3>概念 2：六层包含关系<\/h3>\n<p>新闻里常混着六个词：AI、机器学习、深度学习、大模型、生成式 AI、智能体。它们不是并列关系，而是一层套一层。<\/p>\n<ul><li>\n<strong>人工智能<\/strong>：最大的伞，所有让机器做「聪明事」的办法都算，包括人写规则、搜索、统计学习。\n<\/li><li>\n<strong>机器学习<\/strong>：一种特定做法，不由人写规则，而是给大量例子让机器自己找规律。\n<\/li><li>\n<strong>深度学习<\/strong>：机器学习里用多层神经网络的分支，连「该看数据的哪些方面」也交给机器学习。\n<\/li><li>\n<strong>大语言模型<\/strong>：在海量文本上训练、以预测下一个 token 为目标的超大网络，是深度学习的一种极端形态。\n<\/li><li>\n<strong>生成式 AI<\/strong>：强调用途，能造出原本不存在的文字、图像、音频、视频或代码。\n<\/li><li>\n<strong>智能体<\/strong>：把模型放进一个循环，给它目标和工具，让它自己决定下一步，直到完成任务。\n<\/ul>\n<p>越往里越新、越具体，也越接近你每天用的产品；外面的圈没有消失。用大模型去解决一个查表就能解决的问题，等于用推土机撬罐头。<\/p>\n<h3>概念 3：四种能力<\/h3>\n<p>按「它在做什么」来分，几乎所有 AI 应用都能归入四种能力，或者它们的组合。<\/p>\n<ul><li>\n<strong>识别<\/strong>：输入一个东西，判断它是什么。人脸解锁、相册搜猫、语音转文字、垃圾邮件过滤。\n<\/li><li>\n<strong>预测<\/strong>：根据过去估计未来或未知。地图预计到达时间、电商猜你会买什么、医院预测再入院风险。\n<\/li><li>\n<strong>生成<\/strong>：造出原本不存在的内容。写文字、画图、合成语音、生成代码。\n<\/li><li>\n<strong>决策<\/strong>：在环境里选择行动。下棋、机器人移动、自动驾驶转向、智能体调用工具。\n<\/ul>\n<p>四者的难度和风险不一样。识别最成熟，很多任务准确率已超过人；预测完全依赖历史数据是否包含未来的规律；生成最抢眼，也最容易「像而不对」；决策有后果，后果会改变环境，环境又影响下一步。<\/p>\n<p>一个真实产品往往把它们串起来。你对着手机说「帮我订明天去北京的高铁」：语音识别把声音变成文字，语言模型理解意图并规划步骤，查询系统预测哪趟车更可能有票，最后生成一段确认信息。拆开之后，你立刻知道它的强项在哪、哪一环最可能出错。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TB\n  A[人工智能] --&gt; B[机器学习]\n  B --&gt; C[深度学习]\n  C --&gt; D[大语言模型 / 基础模型]\n  D --&gt; E[生成式 AI]\n  E --&gt; F[智能体]\n  A --&gt; G[搜索 / 规则系统]\n  G --&gt; F<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>这张图看两件事：越往下越新、越接近日常产品；左边的搜索和规则系统并没有消失，它们会和模型一起进入智能体。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：AI 像一把不断生长的伞。每当下雨的范围扩大，伞面就跟着扩；已经干了的区域会被移出伞下，改叫「普通软件」。伞的边界不是技术定义，而是人们还觉不觉得这件事难。\n<\/li><li>\n<strong>实例<\/strong>：早上 6:50 人脸解锁（识别），7:30 地图预测 25 分钟到达（预测），10:30 让助手把会议记录整理成要点（生成），18:30 网约车报价（预测）。一天里真正「纯生成」的环节很少，多数是识别或预测加规则执行。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 AI 就是大模型——实际上 大模型只是当前最耀眼的一层。导航里的 A*、银行的反欺诈规则、相机的自动对焦，很多都不是大模型，仍然属于 AI。\n<\/li><li>\n别以为 AI 什么都能做——实际上 AI 擅长例子多、答案相对明确、错了代价可检查的任务；例子稀少、没有共识、需要承担责任的判断，它做不了。\n<\/li><li>\n别以为 机器算得快就是智能——实际上 算得快只是速度。AI 效应说明，一旦某件事变成常规计算，人们就不再把它算作智能。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n一个软件能在 0.1 秒内算出 20 位数的乘法。按本章定义，它是 AI 吗？（答案：不是严格意义上的 AI。它做的是固定的算术流程，不需要通常由人承担的判断；这也是计算器不被当作 AI 的原因。；解析：定义看的是任务是否需要人类智能，不是算得快不快。）\n<\/li><li>\n「大模型就是 AI」这句话错在哪？（答案：大模型是 AI 的一个子集，属于深度学习里的语言模型。AI 还包括搜索、规则系统、强化学习等大量非大模型方法。；解析：六层包含关系里，大模型在里层，AI 在最外层。）\n<\/li><li>\n手机相册里搜索「猫」，属于四种能力里的哪一种？（答案：主要是识别：判断图像内容是不是猫。排序和检索还会用到预测，但核心是识别。；解析：识别是输入一个东西、判断它是什么。）\n<\/li><li>\n为什么说 AI 不承担责任是社会选择，不是技术限制？（答案：模型可以给出诊断建议或判决理由，但签字、宣判、承担后果仍然由人来做。社会把责任留给了人，而不是模型做不到。；解析：技术能生成建议，但不能替人承担后果。）\n<\/li><li>\nAI 效应是什么？（答案：机器一旦把某件事做成常规，人们就不再把这件事业算作智能。；解析：它解释了 AI 的边界为什么总在往后退。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nAI 的定义看任务，不看方法。\n<\/li><li>\n六层包含关系：AI ⊃ 机器学习 ⊃ 深度学习 ⊃ 大模型；生成式 AI 和智能体是另外两个切面。\n<\/li><li>\n看到产品先拆四种能力：识别、预测、生成、决策。\n<\/ul>", "ch02": "<div class=\"source-badge\">📖 出处：hello-ai.pdf · p.16–26<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch01\">第 1 章：你已经在用 AI 了<\/a><\/span><\/div><h1>第 2 章：七十年，三次浪潮<\/h1>\n<blockquote>第一部 · 地图　·　AI 的历史不是一条上升的直线，而是几次高潮与几次寒冬。每次转折都有一个具体的原因。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：2 小时 ｜ <strong>前置<\/strong>：第 1 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n能按时间顺序说出符号主义、专家系统、深度学习三次浪潮。\n<\/li><li>\n能解释两次 AI 寒冬的共同原因：承诺与能力之间的落差。\n<\/li><li>\n能说清算力、数据、算法在 2012 年突破里各自起了什么作用。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>每一次浪潮都由一个真正的想法点燃，每一次退潮都因为撞上同一堵墙：承诺超过了当时的数据与算力能兑现的程度。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：三次浪潮与两次寒冬<\/h3>\n<p><strong>第一次浪潮（1956–1970 年代）<\/strong>是符号主义。研究者相信智能就是对符号的操作：把知识写成概念、命题和逻辑规则，机器按规则推演就能推理。代表成果是定理证明、早期自然语言理解和通用问题求解器。它撞上的墙叫<strong>知识获取瓶颈<\/strong>：世界上的知识太多、太模糊，靠人一条条写进去写不完，规则之间还会打架。<\/p>\n<p><strong>第二次浪潮（1980 年代）<\/strong>是专家系统。把某个狭窄领域里专家的经验写成几百到几千条 if-then 规则，再配一个推理引擎，让机器当顾问。它在医疗、地质勘探、配置电脑等场景里卖得很好，商业上第一次成了产业。但它仍然要人写规则，维护成本高、遇到新情况就失灵，最后退潮。<\/p>\n<p><strong>第三次浪潮（2012 年至今）<\/strong>是深度学习。它不再由人写规则，而是让多层神经网络从数据里学。2012 年的 ImageNet 竞赛，深度卷积网络把图像识别错误率从 26% 降到 16%，标志着这轮浪潮的起点。2020 年前后，规模定律和大模型把它推到语言、代码、科学等几乎所有领域。<\/p>\n<p>两次寒冬（1970 年代中期、1980 年代末）的共同点不是技术「失败」，而是<strong>承诺与能力之间的落差<\/strong>。研究者在上一轮高潮里承诺了通用智能，演示却只能在玩具问题上跑；经费和信心一旦撤出，整个领域就进入低潮。<\/p>\n<h3>概念 2：2012 年为什么突然成了<\/h3>\n<p>深度学习的想法并不新。1958 年的感知机就会从例子里学简单的线性分类；反向传播在 1980 年代已经流行。它沉寂几十年，是因为三个条件同时不到位。<\/p>\n<ul><li>\n<strong>数据<\/strong>：ImageNet 从 2007 年起收集了一千四百万张人工标注的图片。没有这么多带标签的猫，网络再深也学不出猫。\n<\/li><li>\n<strong>算力<\/strong>：GPU 原本为游戏渲染设计，恰好擅长并行矩阵运算。2012 年的突破是在两块游戏显卡上跑出来的；今天前沿模型用几万块 GPU。\n<\/li><li>\n<strong>算法<\/strong>：多层结构、反向传播、卷积、激活函数这些零件早就有了，ReLU、Dropout 等技巧让深网络真正可训练。\n<\/ul>\n<p>三者缺一不可。只讲「神经网络赢了」会漏掉最关键的一点：同一套算法，在数据和算力不够的年代，连跑都跑不起来。<\/p>\n<h3>概念 3：规模定律<\/h3>\n<p>2020 年前后，研究者总结出一条经验规律：在一定范围内，模型的损失随参数量、数据量、计算量的增加，呈可预测的幂律下降。这就是<strong>规模定律<\/strong>。<\/p>\n<p>它把「把模型做大」从赌博变成了工程。只要按比例增加参数、数据和算力，性能大概会按已知的曲线改善，行业因此敢押注超大模型。它也是大模型军备竞赛的直接理由。<\/p>\n<p>但规模定律不是万能。它描述的是「一定范围内」的趋势，会遇到数据用尽、收益递减、能耗和成本上升等边界；它也无法保证模型在需要精确事实或承担责任的任务上变可靠。规模能买来能力，买不来真实性。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  A[1956 符号主义] --&gt; B[1970s 第一次寒冬]\n  B --&gt; C[1980s 专家系统]\n  C --&gt; D[1980s末 第二次寒冬]\n  D --&gt; E[2012 深度学习]\n  E --&gt; F[2020 规模定律与大模型]\n  F --&gt; G[2025 智能体]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>这张图看节奏：三座山、两个谷。每个谷都不是「技术没用」，而是承诺跑在了能力前面。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：像修一条越走越高的山路。每次有人看到山顶就宣布「快到了」，但走到跟前发现前面还有一道崖；掉下去一次，队伍要花很多年才爬回原来的高度。\n<\/li><li>\n<strong>实例<\/strong>：2012 年 ImageNet：同一类卷积网络，在 CPU 和小数据上只能得到普通结果；两块 GPU 加一千四百万张标注图片，错误率从 26% 降到 16%。变的是条件，不只是想法。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 AI 是一直匀速进步的——实际上 它是浪潮式推进：想法先出现，等数据和算力到位才兑现，兑现不了就退潮。\n<\/li><li>\n别以为 寒冬说明方向错了——实际上 寒冬说明承诺超过了当时能兑现的能力，不等于技术没有价值。很多寒冬里的工作后来成了基础。\n<\/li><li>\n别以为 2012 年赢在算法更聪明——实际上 算法重要，但数据与算力同样关键。三者是三角形，缺一角都跑不起来。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n两次 AI 寒冬的共同原因是什么？（答案：承诺与能力之间的落差：演示只在玩具问题上成立，却被说成通用智能，经费和信心随后撤出。；解析：不是技术完全失败，而是兑现不了承诺。）\n<\/li><li>\n符号主义最大的瓶颈是什么？（答案：知识获取瓶颈：世界知识太多、太模糊，靠人写规则写不完，规则之间还会冲突。；解析：专家系统也继承了这个问题。）\n<\/li><li>\n2012 年深度学习的突破依赖哪三个条件？（答案：数据（ImageNet 等大规模标注集）、算力（GPU 并行计算）、算法（多层网络与反向传播等）。；解析：三者缺一不可，不能只归功于算法。）\n<\/li><li>\n规模定律说了什么？（答案：在一定范围内，模型损失随参数量、数据量、计算量增加而按幂律可预测地下降。；解析：它让扩大模型从赌博变成工程，但有边界。）\n<\/li><li>\n为什么说「AI 寒冬」对今天仍有提醒意义？（答案：它提醒我们把「能做什么」和「被说成能做什么」分开，别用演示效果代替真实能力。；解析：今天的模型也会被营销话术夸大。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n三次浪潮：符号主义、专家系统、深度学习。\n<\/li><li>\n两次寒冬的共同原因是承诺超过能力。\n<\/li><li>\n2012 年突破 = 数据 + 算力 + 算法。\n<\/ul>", "ch03": "<div class=\"source-badge\">📖 出处：hello-ai.pdf · p.27–36<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch01\">第 1 章：你已经在用 AI 了<\/a><\/span><\/div><h1>第 3 章：不只是神经网络<\/h1>\n<blockquote>第一部 · 地图　·　搜索、规则与试错。这三种「老式」AI 至今仍在导航、下棋和游戏里工作。<\/blockquote>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：2 小时 ｜ <strong>前置<\/strong>：第 1、2 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n能解释 A* 算法怎样用「已走代价 + 估计剩余」找最短路。\n<\/li><li>\n能区分规则系统与机器学习各自的优缺点。\n<\/li><li>\n能说清强化学习的奖励、探索与利用，以及 MCTS 怎样和神经网络结合。\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>不靠学习的 AI 有三条路：搜索找解、规则做判断、试错学策略；现代最强系统往往把它们和神经网络组合起来。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：搜索与 A*<\/h3>\n<p>导航软件在一秒钟内给出路线，里面没有神经网络，也没有学习。它做的是<strong>搜索<\/strong>：在几千万个路口和路段组成的图里，找一条总代价最小的路径。<\/p>\n<p>最朴素的搜索会从起点一层层展开，遇到组合爆炸就慢得不可用。实用的搜索靠两件事省力：剪枝，以及<strong>启发式<\/strong>——一个便宜的估计，告诉搜索「往哪边更有希望」。<\/p>\n<p><strong>A\\<\/strong>* 算法给每个待展开的节点算一个分数：<\/p>\n<div class=\"katex-block\">f(n) = g(n) + h(n)<\/div>\n<p><span class=\"katex-inline\">g(n)<\/span> 是从起点走到 <span class=\"katex-inline\">n<\/span> 已经花掉的代价，<span class=\"katex-inline\">h(n)<\/span> 是从 <span class=\"katex-inline\">n<\/span> 到终点的估计代价。A<em> 优先展开 <span class=\"katex-inline\">f<\/span> 最小的节点。只要 <span class=\"katex-inline\">h<\/span> 从不高估真实剩余代价（这叫可采纳），A<\/em> 保证找到最短路，同时比盲目搜索少走很多弯路。地图上的直线距离就是一个好用的 <span class=\"katex-inline\">h<\/span>：它永远小于等于真实路程。<\/p>\n<h3>概念 2：规则系统<\/h3>\n<p><strong>规则系统<\/strong>把人写的 if-then 规则串起来做判断。它透明、可审计、可以精确控制：银行的反欺诈策略、医院的用药禁忌、飞机的检查清单，很多都是规则。<\/p>\n<p>它的缺点也明确：写不完、不会自己适应变化、规则多了会互相打架。专家系统在 1980 年代撞上的就是这堵墙。<\/p>\n<p>今天最常见的做法不是「规则或模型」，而是两者组合：模型给出概率和候选，规则加硬约束。比如智能体要执行删除文件、转账、部署这类不可逆操作，前面的模型可以建议，最后必须过一道规则或人工确认。<\/p>\n<h3>概念 3：强化学习与试错<\/h3>\n<p><strong>强化学习<\/strong>没有标签，只有奖励。智能体在环境里反复尝试，做一个动作，环境给它一个奖励和新的状态，它根据奖励调整策略，学会「在这种情况下该做什么」。<\/p>\n<p>它必须处理一个监督学习没有的矛盾：<strong>探索与利用<\/strong>。只利用已知有效的动作，会困在平庸解；只探索新动作，拿不到稳定回报。人下棋、玩游戏、学骑车，都在两者之间来回。<\/p>\n<p>奖励设计极其关键。奖励给错了，智能体会钻空子。你让它「尽快把房间打扫干净」，它可能把垃圾塞进抽屉；你让它「让用户满意」，它可能学会讨好而不是解决问题。这叫<strong>奖励破解
