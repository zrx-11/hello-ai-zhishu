13' value='1'> 训练好、验证差<\/label><label class='quiz-opt'><input type='radio' name='q13' value='2'> 训练差、验证好<\/label><label class='quiz-opt'><input type='radio' name='q13' value='3'> 训练和验证完全一样<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q14' data-type='single' data-concept='c14' data-chapter='ch05'><p class='quiz-q'><b>Q2.<\/b> 召回率回答的是哪一问？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q14' value='0'> 说有里的多少是真的<\/label><label class='quiz-opt'><input type='radio' name='q14' value='1'> 真的里的多少被找出<\/label><label class='quiz-opt'><input type='radio' name='q14' value='2'> 一共预测了多少<\/label><label class='quiz-opt'><input type='radio' name='q14' value='3'> 模型有多大<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q15' data-type='single' data-concept='c15' data-chapter='ch05'><p class='quiz-q'><b>Q3.<\/b> 部署后数据分布变化导致性能下降，叫什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q15' value='0'> 过拟合<\/label><label class='quiz-opt'><input type='radio' name='q15' value='1'> 欠拟合<\/label><label class='quiz-opt'><input type='radio' name='q15' value='2'> 分布偏移<\/label><label class='quiz-opt'><input type='radio' name='q15' value='3'> 梯度消失<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch06__": "<h1>测验：第 6 章：一层一层看出一只猫<\/h1><div class='quiz-item' data-qid='q16' data-type='single' data-concept='c16' data-chapter='ch06'><p class='quiz-q'><b>Q1.<\/b> 神经网络为什么需要非线性激活函数？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q16' value='0'> 让模型更好看<\/label><label class='quiz-opt'><input type='radio' name='q16' value='1'> 没有它，多层网络会退化成线性变换<\/label><label io' name='q19' value='2'> 随机切分<\/label><label class='quiz-opt'><input type='radio' name='q19' value='3'> 按标点切分<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q20' data-type='single' data-concept='c20' data-chapter='ch07'><p class='quiz-q'><b>Q2.<\/b> 词嵌入把 token 变成什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q20' value='0'> 一个整数编号<\/label><label class='quiz-opt'><input type='radio' name='q20' value='1'> 一个连续向量<\/label><label class='quiz-opt'><input type='radio' name='q20' value='2'> 一张图片<\/label><label class='quiz-opt'><input type='radio' name='q20' value='3'> 一条规则<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q21' data-type='single' data-concept='c19' data-chapter='ch07'><p class='quiz-q'><b>Q3.<\/b> 模型数不清 strawberry 里有几个 r，最直接的原因是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q21' value='0'> 模型没有眼睛<\/label><label class='quiz-opt'><input type='radio' name='q21' value='1'> 它看到的是 token 编号，字母不是独立单位<\/label><label class='quiz-opt'><input type='radio' name='q21' value='2'> 训练数据没有这个词<\/label><label class='quiz-opt'><input type='radio' name='q21' value='3'> 模型太小<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch08__": "<h1>测验：第 8 章：每个词都能看见其他词<\/h1><div class='quiz-item' data-qid='q22' data-type='single' data-concept='c21' data-chapter='ch08'><p class='quiz-q'><b>Q1.<\/b> 自注意力里 Q、K、V 分别代表？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q22' value='0'> 查询、键、值<\/label><label class='quiz-opt'><input type='radio' name='q22' value='1'> 问题、知识、向量<\/label><label class='quiz-opt'><input type='radio' name='q22' v ='q53' data-type='single' data-concept='c45' data-chapter='t04'><p class='quiz-q'><b>Q2.<\/b> 只有几百条科研数据时，优先考虑？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q53' value='0'> 从头训练千亿模型<\/label><label class='quiz-opt'><input type='radio' name='q53' value='1'> 树模型或预训练表示<\/label><label class='quiz-opt'><input type='radio' name='q53' value='2'> 放弃机器学习<\/label><label class='quiz-opt'><input type='radio' name='q53' value='3'> 只做可视化<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q54' data-type='single' data-concept='c46' data-chapter='t04'><p class='quiz-q'><b>Q3.<\/b> 主动学习挑实验时优先选？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q54' value='0'> 模型最确定会好的样本<\/label><label class='quiz-opt'><input type='radio' name='q54' value='1'> 可能好且模型不确定的样本<\/label><label class='quiz-opt'><input type='radio' name='q54' value='2'> 最便宜的样本<\/label><label class='quiz-opt'><input type='radio' name='q54' value='3'> 最旧的样本<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_t05__": "<h1>测验：专题 5：训练一个模型：从数据到对齐的实操<\/h1><div class='quiz-item' data-qid='q55' data-type='single' data-concept='c47' data-chapter='t05'><p class='quiz-q'><b>Q1.<\/b> 训练流水线中 SFT 之后通常是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q55' value='0'> 分词器训练<\/label><label class='quiz-opt'><input type='radio' name='q55' value='1'> 偏好对齐/强化学习<\/label><label class='quiz-opt'><input type='radio' name='q55' value='2'> 数据抓取<\/label><label class='quiz-opt'><input type='radio' name='q55' value='3'> 部署<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q56' data-type='single' data-concept='c48' data-chapter='t05'><p class='quiz-q'><b>Q2.<\/b> 想给模型加本校规章，优先用什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q56' value='0'> 从头预训练<\/label><label class='quiz-opt'><input type='radio' name='q56' value='1'> RAG 检索规章库<\/label><label class='quiz-opt'><input type='radio' name='q56' value='2'> 只调温度<\/label><label class='quiz-opt'><input type='radio' name='q56' value='3'> 换分词器<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q57' data-type='single' data-concept='c47' data-chapter='t05'><p class='quiz-q'><b>Q3.<\/b> GRPO 适合什么任务？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q57' value='0'> 有可验证奖励的数学、代码<\/label><label class='quiz-opt'><input type='radio' name='q57' value='1'> 纯主观审美<\/label><label class='quiz-opt'><input type='radio' name='q57' value='2'> 无答案的闲聊<\/label><label class='quiz-opt'><input type='radio' name='q57' value='3'> 图像压缩<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_t06__": "<h1>测验：专题 6：AI 与开源<\/h1><div class='quiz-item' data-qid='q58' data-type='single' data-concept='c49' data-chapter='t06'><p class='quiz-q'><b>Q1.<\/b> 多数「开源模型」实际开放的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q58' value='0'> 代码、数据、权重全部<\/label><label class='quiz-opt'><input type='radio' name='q58' value='1'> 主要是权重和推理代码<\/label><label class='quiz-opt'><input type='radio' name='q58' value='2'> 只有论文<\/label><label class='quiz-opt'><input type='radio' name='q58' value='3'> 只有 Logo<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q59' data-type='single' data-concept='c49' data-chapter='t06'><p class='quiz-q'><b>Q2.<\/b> 开放权重最大的实际价值是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q59' value='0'> 可微调、可审计、可离线部署<\/label><label class='quiz-opt'><input type='radio' name='q59' value='1'> 一定比闭源强<\/label><label class='quiz-opt'><input type='radio' name='q59' value='2'> 完全无版权限制<\/label><label class='quiz-opt'><input type='radio' name='q59' value='3'> 不需要算力<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q60' data-type='single' data-concept='c50' data-chapter='t06'><p class='quiz-q'><b>Q3.<\/b> 看到「开源模型」最该追问什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q60' value='0'> 开放的是代码、数据还是权重，许可证允许什么<\/label><label class='quiz-opt'><input type='radio' name='q60' value='1'> 模型图标好不好看<\/label><label class='quiz-opt'><input type='radio' name='q60' value='2'> 下载速度快不快<\/label><label class='quiz-opt'><input type='radio' name='q60' value='3'> 有没有中文名<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='人工智能'>人工智能 — 让机器完成那些通常需要人类智能才能完成的任务。定义的核心是「任务」而不是方法：规则、搜索、统计学习、神经网络都可以是实现手段。它是本书六层包含关系里最外面的一圈。 <span class=glossary-ref>（第 1 章：你已经在用 AI 了）<\/span><\/li><li data-term='机器学习'>机器学习 — 人工智能的一个子集。不由人写规则，而是让机器从数据中自己找出规律。规律以模型参数的形式存在，人读不懂，但可以测试。1990 年代起成为 AI 的主流，今天绝大多数被称为 AI 的系统都是机器学习。 <span class=glossary-ref>（第 1 章：你已经在用 AI 了）<\/span><\/li><li data-term='深度学习'>深度学习 — 用多层神经网络做的机器学习。它最重要的特点不是层数多，而是连「该看数据的哪些方面」（特征）也交给机器学习，即表示学习。2012 年起统治图像、语音，随后扩展到语言。 <span class=glossary-ref>（第 1 章：你已经在用 AI 了）<\/span><\/li><li data-term='大语言模型'>大语言模型 — 在海量文本上以「预测下一个 token」为目标训练的超大 Transformer 网络，参数从几十亿到上万亿。一个模型可以迁移到几乎所有与语言有关的任务。「基础模型」是更宽的说法，把处理图像、音频的同类模型也算进来。 <span class=glossary-ref>（第 1 章：你已经在用 AI 了）<\/span><\/li><li data-term='生成式 ai'>生成式 AI — 强调用途的一个词：不只是分类和预测，而是生成原本不存在的文本、图像、音频、视频或代码。2022 年底 ChatGPT 让它进入公众视野。「造得像」与「造得对」是两回事，这是它最需要警惕的地方。 <span class=glossary-ref>（第 1 章：你已经在用 AI 了）<\/span><\/li><li data-term='ai 效应'>AI 效应 — 一旦机器做到了某件事，人们就不再把那件事算作「智能」。计算、光学字符识别、语音输入、路线规划都经历过从 AI 明星课题到「普通软件」的转变。它解释了为什么「AI」这个词的边界总在往后退。 <span class=glossary-ref>（第 1 章：你已经在用 AI 了）<\/span><\/li><li data-term='符号主义'>符号主义 — 认为智能是对符号（概念、命题）的逻辑操作，只要把知识写成符号和规则，机器就能推理。1956 到 1980 年代的 AI 正统，成就是定理证明与专家系统，瓶颈是知识写不完、规则会打架。 <span class=glossary-ref>（第 2 章：七十年，三次浪潮）<\/span><\/li><li data-term='专家系统'>专家系统 — 把某个狭窄领域里专家的知识写成几百到几千条 if-then 规则，配一个推理引擎，让机器在该领域内当顾问。1980 年代的商业热潮，因「知识获取瓶颈」（规则靠人访谈录入、难维护、难适应变化）而退潮。 <span class=glossary-ref>（第 2 章：七十年，三次浪潮）<\/span><\/li><li data-term='ai 寒冬'>AI 寒冬 — AI 历史上经费与信心大规模撤出的时期，主要有两次（1970 年代中期、1980 年代末）。共同原因不是技术「失败」，而是承诺与能力之间的落差。它提醒我们把「能做什么」与「被说成能做什么」分开。 <span class=glossary-ref>（第 2 章：七十年，三次浪潮）<\/span><\/li><li data-term='感知机'>感知机 — 1958 年罗森布拉特提出的单层神经网络，能从例子中学会简单的线性分类。1969 年被证明连异或都学不会，导致连接主义沉寂十余年；解决办法是多层结构加反向传播，但要到几十年后算力与数据到位才发挥威力。 <span class=glossary-ref>（第 2 章：七十年，三次浪潮）<\/span><\/li><li data-term='imagenet'>ImageNet — 李飞飞团队从 2007 年起建立的图像数据集，一千四百万张人工标注的图片。2012 年在其竞赛上，深度卷积网络把错误率从 26% 降到 16%，成为深度学习浪潮的起点。它说明「数据」是算法、数据、算力三角形里同等重要的一角。 <span class=glossary-ref>（第 2 章：七十年，三次浪潮）<\/span><\/li><li data-term='摩尔定律与 gpu'>摩尔定律与 GPU — 芯片算力每约两年翻倍的经验规律，加上原本为游戏渲染设计、恰好擅长并行矩阵运算的图形处理器，共同提供了深度学习所需的算力。2012 年的突破就是在两块游戏显卡上完成的。今天前沿模型的训练用几万块 GPU。 <span class=glossary-ref>（第 2 章：七十年，三次浪潮）<\/span><\/li><li data-term='规模定律'>规模定律 — 2020 年前后总结出的经验规律：在一定范围内，模型的损失随参数量、数据量、计算量的增加呈可预测的幂律下降。它让「把模型做大」从赌博变成工程，是行业押注超大模型的理由；它是否会持续、在何处失效，是当前最重要的开放问题之一。 <span class=glossary-ref>（第 2 章：七十年，三次浪潮）<\/span><\/li><li data-term='搜索'>搜索 — 在大量可能性里系统地寻找一个满足条件（或最优）的解：从起点出发展开可能的下一步，直到到达目标。走迷宫、排课、下棋、路径规划都是搜索问题。朴素搜索会遭遇组合爆炸，实用的搜索靠剪枝与启发式省力。 <span class=glossary-ref>（第 3 章：不只是神经网络）<\/span><\/li><li data-term='启发式'>启发式 — 一个便宜的估计，告诉搜索「往哪边更有希望」。地图上的直线距离就是到目的地真实距离的启发式。好的启发式让搜索几乎不走弯路；从不高估真实代价的启发式能保证搜到最优解。 <span class=glossary-ref>（第 3 章：不只是神经网络）<\/span><\/li><li data-term='a* 算法'>A* 算法 — 1968 年提出的启发式搜索算法，对每个节点计算「已走代价 + 到目标的估计代价」并优先展开最小者。只要估计从不高估，它保证找到最短路，且远快于盲目搜索。导航软件与游戏寻路至今用它。 <span class=glossary-ref>（第 3 章：不只是神经网络）<\/span><\/li><li data-term='规则系统'>规则系统 — 用人写的 if-then 规则做判断的系统。优点是透明、可审计、可精确控制；缺点是写不完、不会自己适应变化。今天常与机器学习模型组合使用：模型给概率，规则加硬约束，例如智能体执行危险操作前必须确认。 <span class=glossary-ref>（第 3 章：不只是神经网络）<\/span><\/li><li data-term='强化学习'>强化学习 — 让智能体在环境中反复尝试，按行动之后得到的奖励调整策略，学会「在这种情况下该做什么」。它没有标签，只有奖励；必须处理探索与利用的矛盾。是机器人、游戏 AI 的基础，也是大语言模型对齐阶段的核心方法。 <span class=glossary-ref>（第 3 章：不只是神经网络）<\/span><\/li><li data-term='奖励'>奖励 — 强化学习中环境对智能体行动的反馈数值。学习的目标是最大化长期累积奖励。奖励的设计极其关键：设计不当会导致智能体钻空子（奖励破解），这一问题在用人类偏好训练语言模型时同样出现。 <span class=glossary-ref>（第 3 章：不只是神经网络）<\/span><\/li><li data-term='探索与利用'>探索与利用 — 强化学习特有的矛盾：是沿用已知有效的行动（利用），还是尝试未知的行动以发现可能更好的选择（探索）。只利用会困在平庸解，只探索拿不到稳定回报。监督学习的数据是给定的，不存在这个问题。 <span class=glossary-ref>（第 3 章：不只是神经网络）<\/span><\/li><li data-term='蒙特卡洛树搜索'>蒙特卡洛树搜索 — 通过随机模拟大量对局来评估走法的搜索方法，把算力集中在最有希望的分支上。AlphaGo 用它向前推演，并用策略网络与价值网络替代了以往靠人手写的评估函数，是搜索与神经网络合流的典型。 <span class=glossary-ref>（第 3 章：不只是神经网络）<\/span><\/li><li data-term='样本与特征'>样本与特征 — 样本是训练数据里的一条记录（一笔订单、一张照片）；特征是描述这条记录的各个数值（距离、时段、像素）。把现实变成特征的过程叫特征工程，在深度学习之前是机器学习工程师的主要工作。 <span class=glossary-ref>（第 4 章：规则不是写出来的，是学出来的）<\/span><\/li><li data-term='标签'>标签 — 监督学习中希望模型学会预测的那个答案：订单的成交价、照片里是不是猫。标签通常由人提供，昂贵且可能带入标注者的偏见与错误。模型学到的上限是标签的质量。 <span class=glossary-ref>（第 4 章：规则不是写出来的，是学出来的）<\/span><\/li><li data-term='模型与参数'>模型与参数 — 模型是一台「带旋钮的机器」：输入特征，输出预测。旋钮就是参数（权重、偏置），学习就是找到让预测尽量准的参数取值。参数从一条直线的三个到大语言模型的上万亿个。 <span class=glossary-ref>（第 4 章：规则不是写出来的，是学出来的）<\/span><\/li><li data-term='损失函数'>损失函数 — 把「模型错了多少」变成一个可计算、可比较的数，例如预测值与真实值之差的平方的平均。训练就是不断调整参数使损失下降。损失函数（训练用）与评估指标（最终汇报用）常常不同。 <span class=glossary-ref>（第 4 章：规则不是写出来的，是学出来的）<\/span><\/li><li data-term='梯度下降'>梯度下降 — 最常用的优化算法：对每个参数计算「稍微改动会让损失增大还是减小」（梯度），沿减小的方向走一小步，反复进行。像蒙眼下山。步长叫学习率。它就是训练万亿参数模型时用的那个算法。 <span class=glossary-ref>（第 4 章：规则不是写出来的，是学出来的）<\/span><\/li><li data-term='监督学习'>监督学习 — 用带标签的数据训练模型，学习从特征到标签的映射。最成熟、应用最广的范式，识别与预测两类能力主要来自它。瓶颈是标签昂贵。 <span class=glossary-ref>（第 4 章：规则不是写出来的，是学出来的）<\/span><\/li><li data-term='无监督学习'>无监督学习 — 数据没有标签，模型只能寻找结构：把样本自动分群、发现异常、压缩表示。它不告诉你每一群是什么，只告诉你数据里存在这样的分野。 <span class=glossary-ref>（第 4 章：规则不是写出来的，是学出来的）<\/span><\/li><li data-term='自监督学习'>自监督学习 — 从数据自身制造标签：遮住一个词让模型猜、截断一段文字让模型续写。不需要人工标注，因此可以用整个互联网训练。它是大语言模型能出现的直接原因。 <span class=glossary-ref>（第 4 章：规则不是写出来的，是学出来的）<\/span><\/li><li data-term='训练'>训练 — 用数据反复调整模型参数以降低损失的过程。一个完整项目还包括定义任务、收集数据、构造特征、划分数据、评估、部署与监控，其中「用什么模型」往往是最不重要的决定。 <span class=glossary-ref>（第 4 章：规则不是写出来的，是学出来的）<\/span><\/li><li data-term='泛化'>泛化 — 模型在没见过的数据上表现稳定的能力。它是机器学习唯一真正的目标，损失、梯度、参数都为它服务。训练数据上的表现不能说明泛化，必须在留出的数据上考。 <span class=glossary-ref>（第 5 章：真正的考试在训练集之外）<\/span><\/li><li data-term='过拟合'>过拟合 — 模型不但学到了规律，还把训练数据里的噪声和巧合当成规律，于是训练表现很好、新数据上很差。模型越灵活、数据越少越容易发生。对策：更多数据、限制复杂度、正则化、早停。 <span class=glossary-ref>（第 5 章：真正的考试在训练集之外）<\/span><\/li><li data-term='欠拟合'>欠拟合 — 模型太简单，连数据里真实的规律都抓不住，训练损失就降不下去。用一条直线去拟合一段明显的曲线就是欠拟合。与过拟合构成机器学习里永恒的拉锯。 <span class=glossary-ref>（第 5 章：真正的考试在训练集之外）<\/span><\/li><li data-term='训练集与测试集'>训练集与测试集 — 把数据分成三份：训练集用来学，验证集用来调参数和决定何时停，测试集只在最后考一次。验证与测试分开，是为了防止你反复根据同一份数据调整模型而间接过拟合它。有时间顺序的数据必须用过去预测未来。 <span class=glossary-ref>（第 5 章：真正的考试在训练集之外）<\/span><\/li><li data-term='准确率'>准确率 — 预测正确的比例。最常被引用也最容易误导的指标：当关心的类别是少数（1%的患病率），一个「全判为否」的模型准确率也有 99%。需要拆成误报与漏报分开看。 <span class=glossary-ref>（第 5 章：真正的考试在训练集之外）<\/span><\/li><li data-term='精确率与召回率'>精确率与召回率 — 精确率：模型说「是」的那些里，多少真的是。召回率：所有真的「是」里，模型找出了多少。两者此消彼长，取舍取决于误报与漏报各自的代价，这是价值判断而非技术选择。 <span class=glossary-ref>（第 5 章：真正的考试在训练集之外）<\/span><\/li><li data-term='混淆矩阵'>混淆矩阵 — 把分类结果按「预测是/否 × 实际是/否」分成四格：真阳性、假阳性（误报）、假阴性（漏报）、真阴性。准确率、精确率、召回率都从这四格算出。 <span class=glossary-ref>（第 5 章：真正的考试在训练集之外）<\/span><\/li><li data-term='标签泄漏'>标签泄漏 — 某个特征偷偷包含了答案（预测是否住院，特征里有「是否开了住院单」）。模型会得到近乎完美的训练成绩，因为它作弊了，而作弊的特征在真正预测的时刻并不存在。往往很隐蔽。 <span class=glossary-ref>（第 5 章：真正的考试在训练集之外）<\/span><\/li><li data-term='分布偏移'>分布偏移 — 部署后的数据与训练数据不再来自同一个「世界」：疫情改变了出行，新教材改变了学情。所有模型都默认「未来像过去」，而这没有保证。因此部署不是终点，监控才是。 <span class=glossary-ref>（第 5 章：真正的考试在训练集之外）<\/span><\/li><li data-term='相关与因果'>相关与因果 — 模型学到的全部是相关（什么与什么倾向于同时出现）。相关足以预测，不足以干预：给每个孩子发平板不会自动提高成绩。区分两者需要实验设计与领域知识，不是更大的模型。辛普森悖论是相关方向可被隐藏变量反转的例子。 <span class=glossary-ref>（第 5 章：真正的考试在训练集之外）<\/span><\/li><li data-term='神经元'>神经元 — 神经网络的基本单元，做四件事：接收一组输入，各乘一个权重，求和加偏置，送进非线性激活函数输出。可以看作一个「微型探测器」。与生物神经元只有「输入够强才放电」这一点相似。 <span class=glossary-ref>（第 6 章：一层一层看出一只猫）<\/span><\/li><li data-term='激活函数'>激活函数 — 神经元求和之后的非线性函数（如「负数归零、正数照旧」）。没有它，堆多少层都只是一个线性变换；有了它，多层网络可以逼近几乎任何函数。非线性是神经网络一切能力的来源。 <span class=glossary-ref>（第 6 章：一层一层看出一只猫）<\/span><\/li><li data-term='层与深度'>层与深度 — 一层是并排接收同样输入的一组神经元；深度是层数。层的意义在于组合：下层学边缘，上层把边缘组成部件、把部件组成物体。深网络比宽网络更高效，因为下层学到的东西可以被上层复用。 <span class=glossary-ref>（第 6 章：一层一层看出一只猫）<\/span><\/li><li data-term='反向传播'>反向传播 — 高效计算深度网络中损失对每个参数的梯度的方法：先正向算出输出，再用链式法则把误差逐层往回「分配」。一次反向传播得到全部梯度，计算量只比正向多常数倍。没有它，深度网络在算力上不可训练。 <span class=glossary-ref>（第 6 章：一层一层看出一只猫）<\/span><\/li><li data-term='卷积神经网络'>卷积神经网络 — 为图像设计的网络：每个神经元只看一小块局部区域（局部连接），同一组权重在整张图上滑动（权重共享），配合池化逐层扩大视野。参数少、效果好，因为结构里内置了「图像模式与位置无关」的先验。 <span class=glossary-ref>（第 6 章：一层一层看出一只猫）<\/span><\/li><li data-term='表示学习'>表示学习 — 深度学习真正的突破：不只学从特征到答案的映射，连从原始数据到特征的映射也一起学。人只提供像素和标签，网络自己发明「边缘」「纹理」「耳朵」。它让同一套方法可以用于图像、语音、文本、蛋白质结构。 <span class=glossary-ref>（第 6 章：一层一层看出一只猫）<\/span><\/li><li data-term='特征层级'>特征层级 — 训练好的深度网络里事后观察到的现象：第一层对边缘敏感，第二层对角与纹理，更高层对部件与整体。这个层级不是人设计的，是为了完成任务而自发形成的。 <span class=glossary-ref>（第 6 章：一层一层看出一只猫）<\/span><\/li><li data-term='参数量'>参数量 — 网络中权重和偏置的总数，衡量模型规模最常用的数字，从几万到上万亿。对混合专家模型要区分「总参数」与每个 token 实际用到的「激活参数」，后者决定运行成本。 <span class=glossary-ref>（第 6 章：一层一层看出一只猫）<\/span><\/li><li data-term='语言模型'>语言模型 — 一个概率分布：给定前面的文字，对「下一个词是什么」的每种可能给出概率。翻译、写作、问答都可化归为「最可能的续写」。七十年来定义未变，变的是能看多长的前文和用什么估计概率。 <span class=glossary-ref>（第 7 章：文字怎样变成数字）<\/span><\/li><li data-term='token'>Token — 模型处理文字的基本单元，由分词器从词表中切出：常见词一个 token，生僻词拆成几个片段，任何字符最终都能拆到字节。模型从未见过「字」，只见过token 的编号，这解释了它数字母、倒写等任务上的失误。 <span class=glossary-ref>（第 7 章：文字怎样变成数字）<\/span><\/li><li data-term='分词'>分词 — 把文本切成 token 序列的过程，是模型的「眼睛」。它决定了模型对字母、数字的视力，也决定了各种语言的成本：主流词表在英文语料上构建，很多汉字要占两三个 token。 <span class=glossary-ref>（第 7 章：文字怎样变成数字）<\/span><\/li><li data-term='bpe'>BPE — 字节对编码。从单个字节开始，反复把语料中最常相邻出现的两个单元合并成新单元，进行几万到几十万次，得到词表。它在「词表小」与「单元有意义」之间取得由数据决定的平衡，对新词适应力强，是今天几乎所有大模型的分词方法。 <span class=glossary-ref>（第 7 章：文字怎样变成数字）<\/span><\/li><li data-term='上下文窗口'>上下文窗口 — 模型一次能看到的 token 数量上限，从几千到上百万。超出部分模型看不见；窗口内的中间部分也常比开头结尾受到更少注意。窗口不是记忆，对话结束后模型什么都不记得。 <span class=glossary-ref>（第 7 章：文字怎样变成数字）<\/span><\/li><li data-term='词向量'>词向量 — 每个 token 对应的一串数字（几百到几千维），由训练得到：用法相似的词向量靠近，意义关系对应空间中的方向，于是「国王 − 男人 + 女人 ≈ 女王」。它把语言变成了几何，是文字的表示学习。 <span class=glossary-ref>（第 7 章：文字怎样变成数字）<\/span><\/li><li data-term='嵌入'>嵌入 — 把离散对象（token、图片、用户、商品）映射到连续向量空间的操作或结果。词向量是文字的嵌入。语义搜索、推荐、检索增强生成、图文互搜都建立在「把不同东西嵌入同一空间再比较」之上。 <span class=glossary-ref>（第 7 章：文字怎样变成数字）<\/span><\/li><li data-term='向量相似度'>向量相似度 — 衡量两个向量是否「相近」的方法，最常用的是夹角余弦（方向一致为 1，垂直为 0）。支撑语义搜索、推荐与检索增强生成。它反映的是训练语料中的共现，语料的偏见会被忠实编码。 <span class=glossary-ref>（第 7 章：文字怎样变成数字）<\/span><\/li><li data-term='自注意力'>自注意力 — 序列里每个位置都根据与所有位置的相关度加权收集信息，从而让一个词的表示随上下文改变（「苹果」在「吃」旁边偏向水果）。对整个序列可并行计算，这是 Transformer 能扩展到超大规模的原因；代价是计算量随长度平方增长。 <span class=glossary-ref>（第 8 章：每个词都能看见其他词）<\/span><\/li><li data-term='查询键值'>查询键值 — 注意力的三个角色：每个词发出查询（我想知道什么），提供键（我能回答什么）和值（我愿意贡献的信息）。查询与各键比对得到权重，按权重对各值加权求和。三者由三个可训练矩阵从词向量变换而来。 <span class=glossary-ref>（第 8 章：每个词都能看见其他词）<\/span><\/li><li data-term='多头注意力'>多头注意力 — 同时用多组查询键值，每组（一个「头」）学习关注不同类型的关系（语法、指代、位置），最后把各头输出拼接。事后观察可见有的头专看前一个词、有的专追踪代词。 <span class=glossary-ref>（第 8 章：每个词都能看见其他词）<\/span><\/li><li data-term='位置编码'>位置编码 — 注意力机制本身不在乎词序，「猫追狗」与「狗追猫」无法区分。位置编码在每个词的向量上加入表示位置的信息，把顺序塞回一个本身与顺序无关的机制。 <span class=glossary-ref>（第 8 章：每个词都能看见其他词）<\/span><\/li><li data-term='transformer'>Transformer — 2017 年提出的架构，由多个模块叠成，每个模块是「自注意力 + 残差与归一化+ 前馈网络 + 残差与归一化」。前接嵌入层，后接输出层。GPT、Llama、Qwen、DeepSeek、Claude 在架构上都是它的变体。 <span class=glossary-ref>（第 8 章：每个词都能看见其他词）<\/span><\/li><li data-term='前馈网络'>前馈网络 — Transformer 模块里对每个位置单独做非线性变换的多层感知机。注意力在词间搬运信息，前馈网络消化它。模型的大部分参数在这里，研究者认为许多「知识」也存在这里；混合专家架构替换的就是它。 <span class=glossary-ref>（第 8 章：每个词都能看见其他词）<\/span><\/li><li data-term='残差连接'>残差连接 — 让每个子层的输出加上它的输入再往下传，信息可以绕过某层直行。2015 年提出，解决了深网络梯度消失的问题，使网络从几十层到上千层成为可能。Transformer 每个模块都带着它。 <span class=glossary-ref>（第 8 章：每个词都能看见其他词）<\/span><\/li><li data-term='自回归生成'>自回归生成 — 模型每次只预测一个 token，接在序列后再预测下一个，直到产生结束标记。一段五百字的回答意味着几百次完整计算；文字逐个蹦出来不是打字效果。模型没有「计划」，结构感来自训练语料。 <span class=glossary-ref>（第 8 章：每个词都能看见其他词）<\/span><\/li><li data-term='采样与温度'>采样与温度 — 从下一个 token 的概率分布里选词的方式。贪心永远选最大者，稳定但单调；采样按概率随机抽。温度是调节旋钮：低温压尖分布、接近贪心，高温压平分布、更随机。top-k、top-p 限制候选范围。 <span class=glossary-ref>（第 8 章：每个词都能看见其他词）<\/span><\/li><li data-term='预训练'>预训练 — 三阶段训练的第一阶段，也是最贵的：在几万亿 token 的文本上预测下一个token，用几万块 GPU 跑几个月。看似平淡的任务逼出了语言、知识与推理能力。产物是基础模型。 <span class=glossary-ref>（第 9 章：从续写机到助手）<\/span><\/li><li data-term='基础模型'>基础模型 — 只经过预训练的模型：懂语言与世界，但只会续写，不会对话。问它问题，它可能续写出另一个问题。需要监督微调与对齐才能成为助手。 <span class=glossary-ref>（第 9 章：从续写机到助手）<\/span><\/li><li data-term='监督微调'>监督微调 — 用几万到几十万条高质量「问题 + 回答」示范继续训练基础模型，教它对话的格式与风格。改变的主要是形式而非知识，数据质量远比数量重要。 <span class=glossary-ref>（第 9 章：从续写机到助手）<\/span><\/li><li data-term='对齐'>对齐 — 用人类偏好（对几个回答的排序）而非标准答案训练模型，使其更有帮助、更诚实、更无害。三者有张力，「偏好由谁定义」是最受争议的问题。它不是给模型装道德模块，而是继续塑造概率分布，因此可以被推回去（越狱）。 <span class=glossary-ref>（第 9 章：从续写机到助手）<\/span><\/li><li data-term='rlhf'>RLHF — 从人类反馈中强化学习：用人类排序训练一个奖励模型，再用强化学习让语言模型生成得分更高的回答。2022 年 ChatGPT 的关键技术。难点：奖励模型可被「讨好」（奖励破解），训练不稳定。 <span class=glossary-ref>（第 9 章：从续写机到助手）<\/span><\/li><li data-term='dpo'>DPO — 直接偏好优化：把「回答 A 胜过 B」直接写成损失函数，用梯度下降优化，绕开奖励模型与强化学习。与 RLHF 目标等价而更简单稳定，是开源社区的标准做法。 <span class=glossary-ref>（第 9 章：从续写机到助手）<\/span><\/li><li data-term='涌现'>涌现 — 模型规模跨过某个门槛后，某些能力从「完全不会」跳到「突然会了」，如多步推理、上下文学习。是否真是突变有争议（可能是评估指标造成的假象），但「大到某个程度后能做以前做不了的事」是行业押注规模的理由。 <span class=glossary-ref>（第 9 章：从续写机到助手）<\/span><\/li><li data-term='思维链'>思维链 — 让模型把中间推理步骤写出来再给答案。因为模型每步只预测一个 token、没有内部草稿纸，把步骤写进上下文相当于提供草稿纸，在数学与逻辑题上显著提高准确率。推理模型把它训练成默认习惯。 <span class=glossary-ref>（第 9 章：从续写机到助手）<\/span><\/li><li data-term='推理模型'>推理模型 — 用强化学习专门奖励「先写推理过程、答案正确」而训练出的模型，回答前自发生成几百到几万 token 的思考。数学、编程、科学问题上跃升一个台阶，代价是慢与贵。它意味着能力可以靠推理时的算力购买。 <span class=glossary-ref>（第 9 章：从续写机到助手）<\/span><\/li><li data-term='混合专家'>混合专家 — 把前馈网络换成几十个并列的「专家」，由路由器为每个 token 只挑两三个计算。总参数可以很大，每次激活的参数很小，训练与推理成本按激活参数算。2024 年底起成为大模型默认选择。 <span class=glossary-ref>（第 9 章：从续写机到助手）<\/span><\/li><li data-term='幻觉'>幻觉 — 模型以自信的语气生成看似合理但不真实的内容：不存在的引文、错误的数字、张冠李戴的事实。根源是训练目标里只有「像」没有「真」，在冷门话题与需要精确细节处更多。不会被消灭，但可用检索、引用、允许说不知道、交叉验证与人工把关压制。 <span class=glossary-ref>（第 10 章：它为什么会一本正经地胡说）<\/span><\/li><li data-term='知识截止日期'>知识截止日期 — 预训练数据收集截止的时间。此后的事模型一无所知，但它不一定知道自己不知道，可能基于旧知识编一个合理回答。联网搜索与检索可补缺口，但模型「自己」的知识始终有日期。 <span class=glossary-ref>（第 10 章：它为什么会一本正经地胡说）<\/span><\/li><li data-term='检索增强生成'>检索增强生成 — 回答前先用向量相似度从可信资料库找出相关段落放进上下文，让模型基于材料回答。续写的依据从模糊的训练印象变成眼前的文本，编造空间大减。企业级 AI 问答、「把 AI 接到自己的知识库」都是它。不能完全消除幻觉。 <span class=glossary-ref>（第 10 章：它为什么会一本正经地胡说）<\/span><\/li><li data-term='接地'>接地 — 让模型的陈述有可追溯的依据：来自上下文里的材料、可访问的链接或工具的返回结果。要求引用是最简单的接地手段。给不出依据的陈述应按未验证处理。 <span class=glossary-ref>（第 10 章：它为什么会一本正经地胡说）<\/span><\/li><li data-term='校准'>校准 — 模型表达的把握程度与实际正确率的一致性。基础模型校准通常很好，对齐后常变差，因为标注者偏爱肯定的语气。于是「自信」不再对应「正确」。实用建议：把语气当噪声，把多次回答的一致性当信号。 <span class=glossary-ref>（第 10 章：它为什么会一本正经地胡说）<\/span><\/li><li data-term='可解释性'>可解释性 — 研究如何理解神经网络内部在做什么的方向。因为模型不按人可读的规则运行，我们很难说清它答对是推理还是记忆、答错是哪一步的问题。这带来安全（未测试的输入上无保证）与责任（不能解释就不能独自负责）两个后果。 <span class=glossary-ref>（第 10 章：它为什么会一本正经地胡说）<\/span><\/li><li data-term='提示注入'>提示注入 — 模型读取的外部内容（网页、邮件、文件、工具描述）里藏着给模型的指令，模型无法区分它与用户的指令。聊天时代最坏结果是错误文字，智能体时代可能是泄露数据或执行危险操作。目前没有完美解法，靠限制权限、隔离内容、关键操作人工确认。 <span class=glossary-ref>（第 10 章：它为什么会一本正经地胡说）<\/span><\/li><li data-term='智能体'>智能体 — 把语言模型放进一个循环：给它目标和工具，让它自己决定下一步、调用工具、看结果、再决定，直到完成任务。它是模型、搜索、规则与强化学习的合流。与只回答问题的「模型」相比，智能体会执行有后果的行动，因此需要权限限制与人工确认。 <span class=glossary-ref>（第 11 章：模型长出了眼睛和手）<\/span><\/li><li data-term='多模态'>多模态 — 模型同时处理文字、图像、音频、视频。原理是「一切都是 token」：图切成小方块、音频切成时间片，各自变成向量进同一个 Transformer。原生多模态（预训练起就同时学）比外挂式（先转文字描述）保留更多信息。 <span class=glossary-ref>（第 11 章：模型长出了眼睛和手）<\/span><\/li><li data-term='扩散模型'>扩散模型 — 今天图像与视频生成的主流方法：训练时给清晰图逐步加噪声，让网络学会「从更噪恢复更清晰」的一步；生成时从纯噪声出发反复应用几十次，图像从噪声中显影，文字提示通过注意力引导方向。 <span class=glossary-ref>（第 11 章：模型长出了眼睛和手）<\/span><\/li><li data-term='语音合成'>语音合成 — 从文字生成语音。近年越来越多地直接用语言模型预测「声音的 token」，能带情感、停顿与口音，几秒钟的样本足以克隆一个人的声音。这使声音不再能作为身份证明。 <span class=glossary-ref>（第 11 章：模型长出了眼睛和手）<\/span><\/li><li data-term='工具调用'>工具调用 — 约定某些特殊格式的输出不是给人看的，而是触发程序去执行（搜索、计算、查数据库、操作文件），结果贴回上下文让模型继续。在微调与对齐阶段训练进模型。它让模型「长出了手」。 <span class=glossary-ref>（第 11 章：模型长出了眼睛和手）<\/span><\/li><li data-term='mcp'>MCP — 模型上下文协议，2024 年底提出的开放标准：工具用统一格式描述自己能做什么、需要什么参数，任何支持协议的模型客户端都能直接接入，无需为每个组合单独开发。类似 USB 之于硬件。后交由中立基金会管理。 <span class=glossary-ref>（第 11 章：模型长出了眼睛和手）<\/span><\/li><li data-term='编程智能体'>编程智能体 — 能读懂代码库、修改多个文件、运行测试、修复错误并提交改动的智能体。它最先成熟，因为代码可编译、可测试，反馈清晰自动。由此推断：反馈越清晰的领域，智能体成熟得越快。本站就是这样写出来的。 <span class=glossary-ref>（第 11 章：模型长出了眼睛和手）<\/span><\/li><li data-term='沙盒'>沙盒 — 让智能体在受限的隔离环境中执行操作（有限的文件、网络与权限），即使被提示注入或犯错，损害也被圈在沙盒里。与「行动分级：可逆的自动做、不可逆的先问」一起构成智能体的安全带。 <span class=glossary-ref>（第 11 章：模型长出了眼睛和手）<\/span><\/li><li data-term='人在回路'>人在回路 — 在 AI 的输出被采纳、或行动被执行之前，由人审核或批准。聊天时代是「核对输出」，智能体时代是「批准行动」。它是 AI 不承担责任这一事实在流程上的体现：每件由 AI 参与的事，最后有一个人为它负责。 <span class=glossary-ref>（第 11 章：模型长出了眼睛和手）<\/span><\/li><li data-term='驾具'>驾具 — 围绕模型的那一整套程序：组装上下文、解析并执行工具调用、管理权限、压缩上下文、维护记忆、派出子智能体、验证与交付。借自马具一词：模型是马，驾具让力气变成前进。智能体的可靠性一大半来自它，2025 年后模型公司开始自己发布驾具。 <span class=glossary-ref>（第 12 章：智能体的一天）<\/span><\/li><li data-term='系统提示'>系统提示 — 驾具写给模型、排在每次调用最前面的总说明：身份与规则、工作方式、每个工具的说明、安全边界、环境信息、技能清单。编程智能体的系统提示在 2026年已达几万 token，且逐版变化；Anthropic 逐版公开 Claude 网页版的系统提示（不含工具说明）。它能这么长，靠的是模型能遵守、窗口装得下、键值缓存只算一次。 <span class=glossary-ref>（第 12 章：智能体的一天）<\/span><\/li><li data-term='指令文件'>指令文件 — 项目或个人写给智能体的文本（常见文件名如 CLAUDE.md、AGENTS.md，个人智能体的记忆文件也属此类），每次任务开始时被放进上下文。它告诉通用模型这个项目怎么跑、怎么测、什么不能碰。写好它是省掉大量往返的最有效办法。 <span class=glossary-ref>（第 12 章：智能体的一天）<\/span><\/li><li data-term='智能体循环'>智能体循环 — 调用模型 → 模型输出工具调用 → 驾具执行 → 结果贴回上下文 → 再调用模型，直到模型宣布完成或被人叫停。一个二十分钟的编程任务可能转一百多圈；每一圈都把整段历史重新送入，键值缓存让这不至于太贵。 <span class=glossary-ref>（第 12 章：智能体的一天）<\/span><\/li><li data-term='权限策略'>权限策略 — 驾具里规定哪些动作自动放行、哪些按白名单、哪些每次要人点头、哪些禁止。读通常自动，写与执行按策略，不可逆的操作（部署、删除、发送）应当要问。它是智能体的安全带，与沙盒和钩子一起构成「限制模型」的那一半工程。 <span class=glossary-ref>（第 12 章：智能体的一天）<\/span><\/li><li data-term='上下文压缩'>上下文压缩 — 长任务中上下文将满时，让模型把历史按固定结构（原始要求、已完成、进行中、问题、计划、涉及文件）总结后替换原文。做得差会「失忆」；做得好还会把关键状态写进外部文件，不只依赖总结。 <span class=glossary-ref>（第 12 章：智能体的一天）<\/span><\/li><li data-term='子智能体'>子智能体 — 由主智能体派出的分身：带一个明确任务和独立的上下文出发，读完几十个文件后只把结论交回。用途是并行与隔离细节，不让主上下文被中间材料撑满。多个子智能体可以同时出发。 <span class=glossary-ref>（第 12 章：智能体的一天）<\/span><\/li><li data-term='技能'>技能 — 把「怎样做一件事」写成带步骤、注意事项和示例的文本文件，放在约定位置，驾具在需要时读入上下文，模型照着做。没有代码、不用训练，靠上下文学习起效；价值在可传递，风险在说明书里可以藏指令。 <span class=glossary-ref>（第 12 章：智能体的一天）<\/span><\/li><li data-term='渐进式披露'>渐进式披露 — 把信息分层交给模型的设计：启动时只给每份技能的名字和一句描述（约一百token），任务匹配时才读整份说明书，附件与脚本只在用到时读或运行。它把「上下文是稀缺资源」变成了一种结构，让驾具能装几十份技能而不占地方。 <span class=glossary-ref>（第 12 章：智能体的一天）<\/span><\/li><li data-term='钩子'>钩子 — 在某个事件（如每次工具调用前后、每次改文件后）自动运行的脚本，由驾具触发，不经模型判断。用途是用确定性代码约束模型：自动跑格式检查、禁止写入某些目录、强制验证。它是规则系统在智能体里的现代形态。 <span class=glossary-ref>（第 12 章：智能体的一天）<\/span><\/li><li data-term='个人智能体'>个人智能体 — 接入个人的聊天软件、邮箱、日历、文件与浏览器，常驻在自己机器上的智能体。2026 年初以「龙虾」为代表出圈，随后暴露出「难养、难管、难放心」的问题：维护成本、权限集中、提示注入。稳妥用法是专用账号、最小权限、定期看日志。 <span class=glossary-ref>（第 12 章：智能体的一天）<\/span><\/li><li data-term='多智能体协作'>多智能体协作 — 多个智能体分工：主从（一个拆任务派活）、并行分支（各做一遍取最好）、流水线（写、审、测接力）、「白班夜班」（人布置、智能体夜里跑）。不是免费的乘法：协调有成本，错误会累积，同样的盲点互审等于没审。先把一个用好，再考虑一群。 <span class=glossary-ref>（第 12 章：智能体的一天）<\/span><\/li><li data-term='智能体的失败模式'>智能体的失败模式 — 说做完了其实没做完、为通过测试而改测试、越界、原地循环、被文件里的话指挥、压缩后失忆、成本失控。没有一种来自模型不够聪明，全部对应驾具、指令与权限的设计，因此都可以由人减少。 <span class=glossary-ref>（第 12 章：智能体的一天）<\/span><\/li><li data-term='提示词'>提示词 — 你给模型的全部文字，即它的上下文，决定了续写的方向。好的提示说清任务、对象与标准，给例子而不是形容，让模型先想再做。它本质上是在用文字塑造一个概率分布的形状，理解这一点就不需要背模板。 <span class=glossary-ref>（第 14 章：与 AI 共事）<\/span><\/li><li data-term='验证习惯'>验证习惯 — 与模型共事的三个习惯：关键事实（数字、日期、引文、人名、条款、剂量）必查；不懂的领域不用它做最终判断；要求它给出依据。它们不是不信任，而是由模型的工作方式推出的必然。 <span class=glossary-ref>（第 14 章：与 AI 共事）<\/span><\/li><li data-term='数据最小化'>数据最小化 — 把内容交给 AI 服务前，只提供任务需要的部分，能匿名的先匿名，条款不明的服务不交学生作业、病历、内部文件。同时只给智能体必需的权限，因为每一项权限都是提示注入可利用的通道。 <span class=glossary-ref>（第 14 章：与 AI 共事）<\/span><\/li><li data-term='ai 素养'>AI 素养 — 本书的答案不是「学提示词」或「学编程」，而是三种在 AI 之前就重要、现在更显眼的能力：提出好问题、判断产出的好坏与真假、愿意并能够为 AI 参与的事负责。当产出的成本趋近于零，判断成为最稀缺的东西。 <span class=glossary-ref>（第 14 章：与 AI 共事）<\/span><\/li><li data-term='长尾'>长尾 — 每一种都极其罕见、加起来却经常遇到的情况。一辆车开一百万公里能见到几乎所有常见路况，但「几乎所有」不是「所有」；事故发生在没见过的情况里。长尾不能靠更多数据穷尽，只能靠仿真生成、数据闭环和模型外的规则底线共同应对。判断任何高风险 AI，问它在长尾上怎么办。 <span class=glossary-ref>（第 14 章：与 AI 共事）<\/span><\/li><li data-term='数据闭环'>数据闭环 — 车队把遇到的不确定情况（预测分歧、人接管、急刹）上传，云端筛选、标注、训练、仿真验证、再推送回车队，每周甚至每天转一次。规模是核心：一百万辆车一天遇到的罕见情况比一百辆车一年多得多。代价是隐私，以及「模型不知道自己不知道的情况永远不会被上传」。 <span class=glossary-ref>（第 14 章：与 AI 共事）<\/span><\/li><\/ul>", "__diagnosis__": "<h1>🩺 诊断测试<\/h1><p>系统会从全书中抽题。答错的题会自动沿知识依赖链回溯，告诉你真正需要补的前置知识点。<\/p><div class='diag-controls'><button id='diag-start'>开始诊断（随机抽 5 题）<\/button><span id='diag-progress'><\/span><\/div><div id='diag-stage'><\/div><div id='diag-result'><\/div>", "__patterns__": "<h1>模式与框架库<\/h1>\n<p>这本书真正反复使用的分析框架不多，但每一个都能迁移到你要判断的具体产品上。下面按「什么时候用、怎么用、边界在哪」写。<\/p>\n<h2>框架一：六层地图<\/h2>\n<p><strong>什么时候用<\/strong>：听到「AI」「大模型」「生成式 AI」「智能体」混着说，先分层。<\/p>\n<p><strong>怎么用<\/strong>：<\/p>\n<ol><li>\n最外层是人工智能，包含所有让机器完成人类智能任务的方法。\n<\/li><li>\n往里是机器学习：从数据学规律，而不是人写死规则。\n<\/li><li>\n再往里是深度学习：多层神经网络，特征也由模型自己学。\n<\/li><li>\n大语言模型是深度学习里以文本为主、规模极大的分支。\n<\/li><li>\n生成式 AI 是按用途切的一层：造新内容，不只做判断。\n<\/li><li>\n智能体是按用法切的一层：把模型放进循环里，能调用工具、执行多步任务。\n<\/ol>\n<p><strong>边界<\/strong>：层与层不是替代关系。搜索、规则系统、强化学习仍然在大量系统里工作，不会因为大模型出现就消失。<\/p>\n<h2>框架二：四种能力拆解<\/h2>\n<p><strong>什么时候用<\/strong>：面对一个新产品，想知道它到底在做什么、哪里最可能出错。<\/p>\n<p><strong>怎么用<\/strong>：<\/p>\n<ul><li>\n识别：输入一个东西，判断它是什么。最成熟，很多任务超过人。\n<\/li><li>\n预测：根据过去估计未知。质量取决于历史数据是否包含未来的规律。\n<\/li><li>\n生成：造出原本不存在的内容。最容易「像而不对」。\n<\/li><li>\n决策：在环境里选择行动。有后果，会改变环境。\n<\/ul>\n<p>拆完再问：这条链路里哪一环错了代价最大？哪一环有验证手段？哪一环必须人确认？<\/p>\n<p><strong>边界<\/strong>：真实产品常常四种全用，拆解是为了定位风险，不是为了贴标签。<\/p>\n<h2>框架三：数据、算力、算法三角<\/h2>\n<p><strong>什么时候用<\/strong>：看到「某算法带来突破」的叙事，想判断条件是否成立。<\/p>\n<p><strong>怎么用<\/strong>：问三件事——数据够不够、算力够不够、算法是否可训练。三者缺一，突破不会发生。<\/p>\n<p><strong>边界<\/strong>：三角解释的是「为什么现在能做成」，不解释「为什么这个方向值得做」。后者是价值判断。<\/p>\n<h2>框架四：训练三件套<\/h2>\n<p><strong>什么时候用<\/strong>：想理解一个模型的能力从哪来，或者判断「微调能不能解决」。<\/p>\n<p><strong>怎么用<\/strong>：<\/p>\n<ul><li>\n预训练：学语言和世界，产物是基础模型。\n<\/li><li>\n监督微调：教对话格式和风格，不擅长灌新知识。\n<\/li><li>\n对齐：按人类偏好调整取舍，可以被越狱，也会带来校准下降。\n<\/ul>\n<p><strong>边界<\/strong>：三件套之后，模型仍然是概率分布，不是规则库。它没有可读的「道德模块」。<\/p>\n<h2>框架五：评估三份数据<\/h2>\n<p><strong>什么时候用<\/strong>：看到「准确率 95%」这类数字，想判断它是否可信。<\/p>\n<p><strong>怎么用<\/strong>：<\/p>\n<ol><li>\n训练集学参数。\n<\/li><li>\n验证集调超参、早停、选模型。\n<\/li><li>\n测试集最后只考一次。\n<\/ol>\n<p>再问：类别平衡吗？只报了平均吗？有没有校准？有没有分组？测试集被反复用过吗？<\/p>\n<p><strong>边界<\/strong>：三份数据只能防「自己骗自己」，防不了分布偏移。部署后仍要监控。<\/p>\n<h2>框架六：生成—检索—对齐<\/h2>\n<p><strong>什么时候用<\/strong>：想降低幻觉，或设计一个知识型应用。<\/p>\n<p><strong>怎么用<\/strong>：<\/p>\n<ul><li>\n生成：模型续写，容易编。\n<\/li><li>\n检索：回答前先找材料，把依据放进上下文。\n<\/li><li>\n对齐：用偏好数据调整「承认不知道」的行为。\n<\/li><li>\n接地：要求引用、链接、工具返回，给不出依据就标未验证。\n<\/ul>\n<p><strong>边界<\/strong>：RAG 降低概率，不提供保证。检索会漏、会错，模型会误读。<\/p>\n<h2>框架七：驾具循环<\/h2>\n<p><strong>什么时候用<\/strong>：设计或评估一个智能体。<\/p>\n<p><strong>怎么用<\/strong>：把循环拆成七件事——组装上下文、模型决策、权限检查、执行工具、压缩上下文、验证产物、交付结果。<\/p>\n<p>再问：模型说完成时，谁独立验证？上下文太长时怎么压缩？危险操作谁批？出错后能回滚吗？<\/p>\n<p><strong>边界<\/strong>：驾具能截断错误累积，但不能让一个错误的判断变成正确。判断本身仍要看模型和资料。<\/p>\n<h2>框架八：AI 做科学三条件<\/h2>\n<p><strong>什么时候用<\/strong>：判断一个「AI for Science」项目是真实加速还是包装。<\/p>\n<p><strong>怎么用<\/strong>：问三件事——数据够多吗？目标能写成明确的预测吗？答案能被实验检验吗？<\/p>\n<p>三个都满足，AI 最容易成功；缺一个，就要降低预期。<\/p>\n<p><strong>边界<\/strong>：AI 加速的是预测和筛选，不自动产生因果解释。实验验证和机制研究仍由人负责。<\/p>\n<h2>决策规则<\/h2>\n<ul><li>\n如果任务有大量先例、答案可检查、错了可改 → 优先让 AI 做初稿或初筛。\n<\/li><li>\n如果任务需要定义目标、核对关键事实、对具体人负责 → 人做最终判断。\n<\/li><li>\n如果知识会更新 → 优先 RAG，不要靠微调灌知识。\n<\/li><li>\n如果只想改风格和格式 → 微调，不要从头训练。\n<\/li><li>\n如果数据只有几百条 → 先做傻基线，再试树模型或预训练表示，不要上深网络。\n<\/li><li>\n如果错了代价不可逆 → 人在回路，先批准再执行。\n<\/li><li>\n如果模型说「已完成」 → 独立验证产物，不信自述。\n<\/li><li>\n如果模型语气很自信 → 把它当噪声，查原始来源。\n<\/ul>\n<h2>反模式<\/h2>\n<p><strong>「AI 就是大模型」<\/strong>。把最里面一层当成全部，会忽略搜索、规则、强化学习，也会误判传统系统的价值。替代方案：先用六层地图定位。<\/p>\n<p><strong>「准确率高就是好模型」<\/strong>。类别不平衡时准确率会被多数类绑架；测试集反复调也会虚高。替代方案：看混淆矩阵、分组表现、校准和代价。<\/p>\n<p><strong>「知识不够就微调」<\/strong>。微调擅长格式和风格，不擅长灌新知识。替代方案：先 RAG，再考虑继续预训练。<\/p>\n<p><strong>「模型越大越可靠」<\/strong>。规模买得到能力，买不到真实性。替代方案：检索、引用、验证、人。<\/p>\n<p><strong>「智能体能自己搞定」<\/strong>。长任务错误会累积，模型还会假完成。替代方案：驾具 + 权限 + 独立验证 + 人工检查点。<\/p>\n<p><strong>「开源模型就是完全开源」<\/strong>。多数只开放权重。替代方案：查清开放的是代码、数据还是权重，读许可证。<\/p>\n<p><strong>「AI 会替代科学家」<\/strong>。它加速预测和筛选，不替代问题选择、实验验证和机制解释。替代方案：把 AI 当仪器，不当作者。<\/p>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>核心公式与规则<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>A* 评价函数<\/td><td><span class=\"katex-inline\">f(n)=g(n)+h(n)<\/span>；<span class=\"katex-inline\">h<\/span> 不高估时保证最短路<\/td><\/tr><tr><td>监督学习损失<\/td><td><span class=\"katex-inline\">L=\\frac{1}{n}\\sum_i(\\hat y_i-y_i)^2<\/span><\/td><\/tr><tr><td>梯度下降<\/td><td><span class=\"katex-inline\">w\\leftarrow w-\\eta\\nabla L(w)<\/span><\/td><\/tr><tr><td>精确率<\/td><td><span class=\"katex-inline\">TP/(TP+FP)<\/span>，误报代价<\/td><\/tr><tr><td>召回率<\/td><td><span class=\"katex-inline\">TP/(TP+FN)<\/span>，漏报代价<\/td><\/tr><tr><td>注意力打分<\/td><td><span class=\"katex-inline\">\\mathrm{softmax}(QK^\\top/\\sqrt{d_k})V<\/span><\/td><\/tr><tr><td>缩放定律<\/td><td><span class=\"katex-inline\">L(x)=L_\\infty+a x^{-b}<\/span><\/td><\/tr><tr><td>训练算力估算<\/td><td><span class=\"katex-inline\">C\\approx6ND<\/span><\/td><\/tr><tr><td>扩散前向<\/td><td><span class=\"katex-inline\">x_t=\\sqrt{\\alpha_t}x_0+\\sqrt{1-\\alpha_t}\\epsilon<\/span><\/td><\/tr><tr><td>扩散训练目标<\/td><td>预测噪声 <span class=\"katex-inline\">\\epsilon<\/span>，损失 <span class=\"katex-inline\">\\|\\epsilon-\\epsilon_\\theta(x_t,t)\\|^2<\/span><\/td><\/tr><tr><td>奖励模型损失<\/td><td><span class=\"katex-inline\">-\\log\\sigma(r(x,y^+)-r(x,y^-))<\/span><\/td><\/tr><tr><td>RLHF 目标<\/td><td>奖励减去 KL 惩罚：<span class=\"katex-inline\">r-\\beta\\mathrm{KL}(\\pi_\\theta\\|\\pi_{\\text{ref}})<\/span><\/td><\/tr><tr><td>余弦相似度<\/td><td><span class=\"katex-inline\">\\cos(a,b)=a\\cdot b/(\\|a\\|\\|b\\|)<\/span><\/td><\/tr><\/tbody><\/table>\n<h2>概念对照<\/h2>\n<table><thead><tr><th>容易混<\/th><th>区别<\/th><\/tr><\/thead><tbody><tr><td>参数量 vs 数据量<\/td><td>参数是模型容量，数据是学习材料；固定算力下要按比例增长<\/td><\/tr><tr><td>预训练 vs 微调<\/td><td>预训练学语言与世界，微调改行为与格式<\/td><\/tr><tr><td>RLHF vs DPO<\/td><td>RLHF 用奖励模型 + 强化学习；DPO 直接优化偏好对<\/td><\/tr><tr><td>幻觉 vs 错误<\/td><td>幻觉是自信地编造看似合理的内容；错误也可能是算错、看错<\/td><\/tr><tr><td>RAG vs 微调<\/td><td>RAG 改回答时看到的材料；微调改模型行为<\/td><\/tr><tr><td>开放权重 vs 开源<\/td><td>开放权重给参数；开源还要求代码、数据、可复现<\/td><\/tr><tr><td>识别 vs 预测<\/td><td>识别判断「是什么」；预测估计「会怎样」<\/td><\/tr><tr><td>生成 vs 决策<\/td><td>生成造内容；决策选行动并承担后果<\/td><\/tr><tr><td>过拟合 vs 欠拟合<\/td><td>过拟合训练好验证差；欠拟合两者都差<\/td><\/tr><tr><td>分布偏移 vs 过拟合<\/td><td>偏移是部署数据变了；过拟合是模型背了训练噪声<\/td><\/tr><\/tbody><\/table>\n<h2>判断流程<\/h2>\n<ol><li>\n这个任务属于识别、预测、生成还是决策？\n<\/li><li>\n数据够不够？标签从哪来？会不会泄漏？\n<\/li><li>\n傻基线是什么？多好算好？\n<\/li><li>\n错了代价是什么？可逆吗？谁承担？\n<\/li><li>\n需要检索、工具、人工确认中的哪几项？\n<\/li><li>\n怎么验证？测试集是否只考一次？\n<\/li><li>\n部署后怎么监控漂移？\n<\/ol>\n<h2>成本量级<\/h2>\n<table><thead><tr><th>做法<\/th><th>数据<\/th><th>算力<\/th><th>量级<\/th><\/tr><\/thead><tbody><tr><td>提示/技能<\/td><td>无<\/td><td>推理<\/td><td>几乎零成本<\/td><\/tr><tr><td>RAG<\/td><td>文档库 + 向量索引<\/td><td>推理 + 检索<\/td><td>几百到几万元<\/td><\/tr><tr><td>微调<\/td><td>几千到几万条示例<\/td><td>几块 GPU<\/td><td>几千元级<\/td><\/tr><tr><td>中等预训练<\/td><td>几十到几百亿 token<\/td><td>几十块 GPU<\/td><td>几万元级<\/td><\/tr><tr><td>前沿预训练<\/td><td>几万亿 token<\/td><td>几万块 GPU<\/td><td>几亿到几十亿元<\/td><\/tr><\/tbody><\/table>\n<h2>术语速记<\/h2>\n<ul><li>\n<strong>Token<\/strong>：模型读写的最小单位，不等于字或词。\n<\/li><li>\n<strong>嵌入<\/strong>：把 token 变成连续向量。\n<\/li><li>\n<strong>注意力<\/strong>：每个位置按相关度从其他位置收集信息。\n<\/li><li>\n<strong>残差<\/strong>：给梯度一条直路，让深网络可训练。\n<\/li><li>\n<strong>校准<\/strong>：说 80% 把握时，实际是否约 80% 正确。\n<\/li><li>\n<strong>接地<\/strong>：陈述要有可追溯依据。\n<\/li><li>\n<strong>驾具<\/strong>：模型外面的上下文、工具、权限、验证、交付系统。\n<\/li><li>\n<strong>沙盒<\/strong>：把执行限制在隔离环境里。\n<\/li><li>\n<strong>长尾<\/strong>：极少出现却可能致命的罕见场景。\n<\/ul>"}};
const pages = DATA.rendered;
const manifest = DATA.manifest;
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SLUG = manifest.slug || 'book';
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(SLUG+':'+k)||'null') }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(SLUG+':'+k, JSON.stringify(v)) }catch(e){} }
};
let state = { visited: store.get('visited')||[], quiz: store.get('quiz')||{}, cards: store.get('cards')||{}, mastery: store.get('mastery')||{} };

/* ---------- 导航 ---------- */
function renderNav(){
  const nav = $('#nav'); nav.innerHTML='';
  const build = items => items.forEach(it=>{
    if(it.children){
      const sec=document.createElement('div'); sec.className='nav-sec'; sec.textContent=it.label; nav.appendChild(sec);
      it.children.forEach(c=>{
        const a=document.createElement('a'); a.className='nav-item'; a.href=c.href; a.textContent=c.label;
        const id=routeId(c.href);
        if(state.visited.includes(id)) a.innerHTML = esc(c.label)+' <span class="done">✓</span>';
        nav.appendChild(a);
      });
    }else{
      const a=document.createElement('a'); a.className='nav-item'; a.href=it.href; a.textContent=it.label;
      const id=routeId(it.href);
      if(state.visited.includes(id)) a.innerHTML = esc(it.label)+' <span class="done">✓</span>';
      nav.appendChild(a);
    }
  });
  build(DATA.nav);
  updateProgress();
}
function routeId(href){ return href.replace('#/',''); }

/* ---------- 路由 ---------- */
function routeIdFromHash(){
  let h = location.hash.replace(/^#\//,'');
  if(!h) return 'path';
  if(h==='path') return 'path';
  if(h==='diagnosis') return 'diagnosis';
  const m = h.match(/^(chapter|concept)\/(.+)$/);
  if(m) return m[1]+'/'+m[2];
  return h;
}
function showPage(rid){
  let id;
  if(rid==='path') id='__path__';
  else if(rid==='diagnosis') id='__diagnosis__';
  else if(rid==='graph') id='__graph__';
  else if(rid.startsWith('quiz/')) id='__quiz_'+rid.split('/')[1]+'__';
  else if(rid==='cards') id='__cards__';
  else if(rid==='glossary') id='__glossary__';
  else if(rid==='patterns') id='__patterns__';
  else if(rid==='cheatsheet') id='__cheatsheet__';
  else if(rid.startsWith('chapter/')) id=rid.split('/')[1];
  else if(rid.startsWith('concept/')) id=rid.split('/')[1];
  else id=rid;
  const html = pages[id] || '<div class="empty">页面不存在</div>';
  $('#view').innerHTML = html;
  $$('.nav-item').forEach(a=>a.classList.toggle('active', routeId(a.getAttribute('href'))===rid));
  if(!state.visited.includes(rid) && (rid.startsWith('chapter/')||rid.startsWith('concept/'))){
    state.visited.push(rid); store.set('visited', state.visited); renderNav();
  }
  window.scrollTo(0,0);
  if(rid==='cards') initCards();
  if(rid==='glossary') initGlossary();
  if(rid.startsWith('quiz')) initQuizzes(rid);
  if(rid==='diagnosis') initDiagnosis();
  if(rid==='graph') initGraph();
  if(id==='__path__') updatePath();
  renderMath();
  renderMermaid();
}

/* ---------- KaTeX 渲染（多源回退） ---------- */
let katexLoading = false, katexReady = false;
function renderMath(){
  const hasMath = document.querySelector('.katex-inline, .katex-block');
  if(!hasMath) return;
  if(katexReady){ doRenderMath(); return; }
  if(katexLoading) return;
  katexLoading = true;
  const cssUrls = [
    'https://registry.npmmirror.com/katex/0.16.9/files/dist/katex.min.css',
    'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css',
    'https://unpkg.com/katex@0.16.9/dist/katex.min.css'
  ];
  const jsUrls = [
    'https://registry.npmmirror.com/katex/0.16.9/files/dist/katex.min.js',
    'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js',
    'https://unpkg.com/katex@0.16.9/dist/katex.min.js'
  ];
  let ci = 0, ji = 0;
  const tryCss = () => {
    if(ci >= cssUrls.length) return;
    const link = document.createElement('link');
    link.rel = 'stylesheet'; link.href = cssUrls[ci++];
    link.onload = tryJs; link.onerror = () => { link.remove(); tryCss(); };
    document.head.appendChild(link);
  };
  const tryJs = () => {
    if(ji >= jsUrls.length){ katexLoading = false; return; }
    const s = document.createElement('script');
    s.src = jsUrls[ji++];
    s.onload = () => { katexReady = true; katexLoading = false; doRenderMath(); };
    s.onerror = () => { s.remove(); tryJs(); };
    document.head.appendChild(s);
  };
  tryCss();
}
function doRenderMath(){
  if(typeof katex === 'undefined') return;
  // 行内公式：.katex-inline 里的内容
  $$('.katex-inline').forEach(el=>{
    try{ katex.render(el.textContent, el, {throwOnError:false}); }catch(e){}
  });
  // 块级公式：.katex-block 里的内容
  $$('.katex-block').forEach(el=>{
    try{ katex.render(el.textContent, el, {displayMode:true, throwOnError:false}); }catch(e){}
  });
}
// 公式内容预处理：把 < 后跟字母的位置转成 &lt;，避免被 HTML 解析器当标签吃掉
// （这是 first-principles-derivation 踩过的坑：$m<n$ 会变成残留 $m）
function sanitizeMathHTML(){
  $$('.katex-inline, .katex-block').forEach(el=>{
    el.innerHTML = el.innerHTML.replace(/<([a-zA-Z])/g, '&lt;$1');
  });
}

/* ---------- 进度 ---------- */
function updateProgress(){
  const chs = (manifest.chapters||[]).length;
  const done = (manifest.chapters||[]).filter(c=>state.visited.includes('chapter/'+c.id)).length;
  const pct = chs? Math.round(done/chs*100) : 0;
  $('#progress-fill').style.width = pct+'%';
  $('#progress-label').textContent = `进度 ${pct}% · 已学 ${done}/${chs} 章`;
}
function updatePath(){
  $$('.path-step').forEach(el=>{
    const step = el.id.replace('path-','');
    const s = (manifest.learningPath||[]).find(x=>x.step===step);
    if(s && (s.chapterIds||[]).every(c=>state.visited.includes('chapter/'+c))){
      el.classList.add('passed');
      const lbl = el.querySelector('.checkpoint-ok'); if(!lbl){ const sp=document.createElement('span'); sp.className='done'; sp.textContent=' ✓ 已完成'; el.appendChild(sp); }
    }
  });
}

/* ---------- 概念/章节依赖查找（用于诊断倒推） ---------- */
function findConcept(id){ return (manifest.concepts||[]).find(c=>c.id===id); }
function findChapter(id){ return (manifest.chapters||[]).find(c=>c.id===id); }
function getPrereqs(node){
  if(!node) return [];
  return node.prerequisites || node.prereqs || [];
}
/**
 * 答错倒推：从错题关联的概念/章节出发，沿 prerequisites 回溯，
 * 返回一串"你可能需要先补的"节点，带跳转链接。
 */
function traceBack(startConceptId, startChapterId){
  const visited = new Set();
  const chain = [];
  const queue = [];
  if(startConceptId){ const c = findConcept(startConceptId); if(c) queue.push({node:c, kind:'concept'}); }
  if(startChapterId){ const c = findChapter(startChapterId); if(c) queue.push({node:c, kind:'chapter'}); }
  while(queue.length && chain.length < 6){
    const {node, kind} = queue.shift();
    if(visited.has(node.id)) continue;
    visited.add(node.id);
    chain.push({node, kind});
    (getPrereqs(node)||[]).forEach(pid=>{
      const cn = findConcept(pid); if(cn){ queue.push({node:cn, kind:'concept'}); return; }
      const ch = findChapter(pid); if(ch) queue.push({node:ch, kind:'chapter'});
    });
  }
  return chain;
}

/* ---------- 测验（带倒推） ---------- */
function initQuizzes(rid){
  $$('.quiz-item').forEach(item=>{
    const btn = item.querySelector('.quiz-check');
    if(!btn || item.dataset.inited){ return }
    item.dataset.inited='1';
    btn.addEventListener('click', ()=>{
      const qid = item.dataset.qid; const type = item.dataset.type;
      const q = (manifest.quizzes||[]).find(x=>x.id===qid); if(!q) return;
      let user, correct=false, fb;
      if(type==='single'){
        const sel = item.querySelector('input:checked');
        user = sel? parseInt(sel.value) : null;
        correct = user===q.answer;
        fb = correct?'✓ 正确':'✗ 错误'+(user==null?'（未作答）':'');
      } else if(type==='multi'){
        user = Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
        const ans = Array.isArray(q.answer)? q.answer.slice().sort(): [q.answer];
        correct = user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
        fb = correct?'✓ 正确':'✗ 错误';
      } else if(type==='blank'){
        const v = (item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
        const a = String(q.answer).trim().toLowerCase();
        correct = v===a;
        fb = correct?'✓ 正确':'✗ 错误'+(v?'':'（未作答）');
      }
      item.querySelectorAll('input:checked').forEach(i=>{
        const val=parseInt(i.value);
        i.parentElement.style.color = (Array.isArray(q.answer)? q.answer.includes(val) : val===q.answer) ? 'var(--ok)' : 'var(--bad)';
      });
      const feed = item.querySelector('.quiz-feedback');
      feed.className = 'quiz-feedback '+(correct?'fb-ok':'fb-bad');
      feed.textContent = fb;
      let ex = item.querySelector('.quiz-explain');
      if(!ex){ ex=document.createElement('div'); ex.className='quiz-explain'; item.appendChild(ex); }
      ex.innerHTML = '解析：' + esc(q.explain||'');
      // 答错时：倒推前置 + 误解卡片 + 掌握度更新
      if(!correct){
        let remedy = item.querySelector('.quiz-remedy');
        if(!remedy){ remedy = document.createElement('div'); remedy.className='quiz-remedy'; item.appendChild(remedy); }
        const chain = traceBack(item.dataset.concept, item.dataset.chapter);
        if(chain.length > 1){
          const links = chain.slice(1).map(({node,kind})=>{
            const href = kind==='concept' ? `#/concept/${node.id}` : `#/chapter/${node.id}`;
            return `<a href="${href}">${esc(node.title||node.id)}</a>`;
          }).join(' → ');
          remedy.innerHTML = '🔍 可能的根因（沿依赖链回溯）：' + links;
        }
        // 误解卡片：如果选错的选项标注了 misconceptionId
        const checked = item.querySelector('input:checked');
        const misId = checked ? checked.dataset.misconception : '';
        if(misId){
          const mis = (manifest.misconceptions||[]).find(m=>m.id===misId);
          if(mis){
            let misCard = item.querySelector('.misconception-card');
            if(!misCard){ misCard = document.createElement('div'); misCard.className='misconception-card'; item.appendChild(misCard); }
            misCard.innerHTML = `<b>⚠ 常见误解</b><br>你选了「${esc(mis.wrong)}」——${esc(mis.correction)}`;
          }
        }
        // 掌握度下降
        updateMastery(item.dataset.concept, -0.15);
      } else {
        updateMastery(item.dataset.concept, +0.15);
      }
      const ch = q.chapterId||'__all__';
      if(!state.quiz[ch]) state.quiz[ch]={done:0,total:0};
      state.quiz[ch].done = Math.min(state.quiz[ch].total+1, state.quiz[ch].done+1);
      state.quiz[ch].total += 1;
      store.set('quiz', state.quiz);
    });
  });
}

/* ---------- 知识图谱（vis-network） ---------- */
let networkLoaded = false;
function loadVisNetwork(cb){
  if(networkLoaded){ cb(); return; }
  const urls = [
    'https://registry.npmmirror.com/vis-network/9.1.9/dist/dist/vis-network.min.js',
    'https://cdn.jsdelivr.net/npm/vis-network@9.1.9/standalone/umd/vis-network.min.js',
    'https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js'
  ];
  let i = 0;
  const tryNext = () => {
    if(i >= urls.length) return;
    const s = document.createElement('script');
    s.src = urls[i++];
    s.onload = () => { networkLoaded = true; cb(); };
    s.onerror = () => { s.remove(); tryNext(); };
    document.head.appendChild(s);
  };
  tryNext();
}
function initGraph(){
  const container = document.getElementById('graph-container');
  if(!container) return;
  loadVisNetwork(() => {
    if(typeof vis === 'undefined'){ container.innerHTML = '<p class="empty">图谱库加载失败，请联网后刷新</p>'; return; }
    const concepts = manifest.concepts || [];
    const chapters = manifest.chapters || [];
    const nodes = [];
    const edges = [];
    concepts.forEach(c => {
      const mastery = Math.round(getMastery(c.id)*100);
      nodes.push({
        id: 'c_' + c.id,
        label: c.title || c.id,
        title: (c.title||c.id) + '（掌握度 ' + mastery + '%）',
        color: mastery > 70 ? '#86efac' : mastery > 40 ? '#fde68a' : '#fca5a5',
        shape: 'dot',
        size: mastery > 70 ? 20 : 14,
        font: { size: 13 }
      });
    });
    chapters.forEach(ch => {
      nodes.push({
        id: 'ch_' + ch.id,
        label: ch.title || ch.id,
        shape: 'box',
        color: '#93c5fd',
        font: { size: 12 }
      });
    });
    // 前置边
    concepts.forEach(c => {
      (c.prerequisites || []).forEach(p => {
        const pid = typeof p === 'string' ? p : p.id;
        const ptype = typeof p === 'string' ? 'hard' : (p.type || 'hard');
        const from = (pid.startsWith('ch') ? 'ch_' : 'c_') + pid;
        const to = 'c_' + c.id;
        if(nodes.find(n => n.id === from)){
          edges.push({
            from: from, to: to,
            color: { color: ptype === 'hard' ? '#dc2626' : ptype === 'soft' ? '#9ca3af' : '#3b82f6' },
            arrows: 'to',
            width: ptype === 'hard' ? 2 : 1,
            dashes: ptype !== 'hard'
          });
        }
      });
    });
    const data = { nodes: new vis.DataSet(nodes), edges: new vis.DataSet(edges) };
    const options = {
      physics: { stabilization: true, barnesHut: { gravitationalConstant: -3000 } },
      interaction: { hover: true, tooltipDelay: 200 }
    };
    const net = new vis.Network(container, data, options);
    net.on('click', params => {
      if(params.nodes.length > 0){
        const nid = params.nodes[0];
        if(nid.startsWith('c_')) location.hash = '#/concept/' + nid.slice(2);
        else if(nid.startsWith('ch_')) location.hash = '#/chapter/' + nid.slice(3);
      }
    });
  });
}

/* ---------- 诊断模式 ---------- */
let diagQueue = [], diagIdx = 0, diagWrong = [];
function initDiagnosis(){
  const startBtn = $('#diag-start');
  if(!startBtn || startBtn.dataset.inited) return;
  startBtn.dataset.inited='1';
  startBtn.addEventListener('click', ()=>{
    const all = (manifest.quizzes||[]).slice();
    // 随机抽 5 题（不够就全抽）
    for(let i = all.length-1; i>0; i--){ const j = Math.floor(Math.random()*(i+1)); [all[i],all[j]]=[all[j],all[i]]; }
    diagQueue = all.slice(0, Math.min(5, all.length));
    diagIdx = 0; diagWrong = [];
    showDiagQuestion();
  });
}
function showDiagQuestion(){
  const stage = $('#diag-stage');
  const result = $('#diag-result');
  result.innerHTML = '';
  if(diagIdx >= diagQueue.length){ finishDiagnosis(); return; }
  const q = diagQueue[diagIdx];
  $('#diag-progress').textContent = `第 ${diagIdx+1} / ${diagQueue.length} 题`;
  const fakeItem = document.createElement('div');
  fakeItem.innerHTML = _renderQuizHTML(q, diagIdx+1);
  stage.innerHTML = fakeItem.innerHTML;
  // 绑定检查按钮
  const item = stage.querySelector('.quiz-item');
  const btn = item.querySelector('.quiz-check');
  btn.addEventListener('click', ()=>{
    const type = item.dataset.type;
    let user, correct=false;
    if(type==='single'){
      const sel = item.querySelector('input:checked');
      user = sel? parseInt(sel.value) : null;
      correct = user===q.answer;
    } else if(type==='multi'){
      user = Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
      const ans = Array.isArray(q.answer)? q.answer.slice().sort(): [q.answer];
      correct = user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
    } else if(type==='blank'){
      const v = (item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
      correct = v===String(q.answer).trim().toLowerCase();
    }
    if(!correct){
      diagWrong.push(q);
      const chain = traceBack(q.relatedConceptId, q.chapterId);
      if(chain.length > 1){
        const links = chain.slice(1).map(({node,kind})=>{
          const href = kind==='concept' ? `#/concept/${node.id}` : `#/chapter/${node.id}`;
          return `<div class="diag-remedy-item">建议先学：<a href="${href}">${esc(node.title||node.id)}</a></div>`;
        }).join('');
        $('#diag-result').innerHTML = '<h3>这道题答错了，可能的根因：</h3>' + links +
          '<p><button id="diag-next" class="quiz-check">下一题 →</button></p>';
      } else {
        $('#diag-result').innerHTML = '<p><button id="diag-next" class="quiz-check">下一题 →</button></p>';
      }
    } else {
      $('#diag-result').innerHTML = '<p>✓ 正确。<button id="diag-next" class="quiz-check">下一题 →</button></p>';
    }
    $('#diag-next').addEventListener('click', ()=>{ diagIdx++; showDiagQuestion(); });
  });
}
function _renderQuizHTML(q, idx){
  // 复用服务端渲染的 quiz HTML 结构
  const qtype = q.type||'single';
  const qid = q.id||('diag'+idx);
  let html = `<div class='quiz-item' data-qid='${qid}' data-type='${qtype}' data-concept='${esc(q.relatedConceptId||"")}' data-chapter='${esc(q.chapterId||"")}'>`;
  html += `<p class='quiz-q'><b>Q${idx}.</b> ${esc(q.question||"")}</p>`;
  if(qtype==='single'||qtype==='multi'){
    const it = qtype==='single'?'radio':'checkbox';
    html += "<div class='quiz-opts'>";
    (q.options||[]).forEach((o,i)=>{ html += `<label class='quiz-opt'><input type='${it}' name='${qid}' value='${i}'> ${esc(String(o))}</label>`; });
    html += '</div>';
  } else {
    html += `<input class='quiz-blank' type='text' placeholder='填写答案'>`;
  }
  html += `<div class='quiz-actions'><button class='quiz-check'>检查答案</button><span class='quiz-feedback'></span></div></div>`;
  return html;
}
function finishDiagnosis(){
  const total = diagQueue.length;
  const wrong = diagWrong.length;
  const right = total - wrong;
  let html = `<h2>诊断完成：${right}/${total} 正确</h2>`;
  if(wrong === 0){
    html += '<p>🎉 这组题全对，可以继续往下学。</p>';
  } else {
    html += `<p>有 ${wrong} 道题答错。下面是按依赖链回溯的补强建议：</p>`;
    const seen = new Set();
    diagWrong.forEach(q=>{
      const chain = traceBack(q.relatedConceptId, q.chapterId);
      chain.slice(1).forEach(({node,kind})=>{
        if(seen.has(node.id)) return;
        seen.add(node.id);
        const href = kind==='concept' ? `#/concept/${node.id}` : `#/chapter/${node.id}`;
        html += `<div class="diag-remedy-item">📚 <a href="${href}">${esc(node.title||node.id)}</a></div>`;
      });
    });
  }
  html += '<p><button id="diag-restart" class="quiz-check">重新诊断</button></p>';
  $('#diag-stage').innerHTML = '';
  $('#diag-progress').textContent = '';
  $('#diag-result').innerHTML = html;
  $('#diag-restart').addEventListener('click', ()=>{
    $('#diag-start').click();
  });
}

/* ---------- 掌握度（简化 BKT） ---------- */
function getMastery(cid){
  if(!cid) return 0.5;
  const m = (state.mastery||{})[cid];
  return m !== undefined ? m : 0.3;
}
function updateMastery(cid, delta){
  if(!cid) return;
  if(!state.mastery) state.mastery = {};
  const cur = state.mastery[cid] !== undefined ? state.mastery[cid] : 0.3;
  state.mastery[cid] = Math.max(0, Math.min(1, cur + delta));
  store.set('mastery', state.mastery);
}
function masteryBar(cid){
  const v = Math.round(getMastery(cid)*100);
  return `<div class="mastery-bar"><div style="width:${v}%"></div></div><span class="mastery-label">掌握度 ${v}%</span>`;
}

/* ---------- 抽认卡 ---------- */
let cardIdx = 0, cardList = [];
function initCards(){
  const cards = manifest.flashcards||[];
  cardList = cards.slice();
  cardIdx = 0;
  const sel = $('#card-filter');
  sel.innerHTML = '<option value="">全部</option>';
  [...new Set(cards.map(c=>c.chapterId).filter(Boolean))].forEach(c=>{
    const o=document.createElement('option'); o.value=c; o.textContent=manifestChTitle(c); sel.appendChild(o);
  });
  sel.onchange = ()=>{ const v=sel.value; cardList = v? cards.filter(c=>c.chapterId===v): cards.slice(); cardIdx=0; showCard(); };
  $('#flashcard').onclick = ()=>$('#flashcard').classList.toggle('flip');
  $('#card-known-btn').onclick = ()=>{ markCard(true); };
  $('#card-again-btn').onclick = ()=>{ markCard(false); };
  showCard();
}
function showCard(){
  updateCardCounts();
  if(cardIdx>=cardList.length){ $('#card-stage').innerHTML='<div class="empty">本组卡片已全部复习完 🎉</div>'; return; }
  const c = cardList[cardIdx];
  document.querySelector('.fc-front').textContent = c.front;
  document.querySelector('.fc-back').textContent = c.back;
  $('#flashcard').classList.remove('flip');
}
function markCard(known){
  const c = cardList[cardIdx]; if(!c) return;
  state.cards[c.id] = known?'known':'again';
  store.set('cards', state.cards);
  cardIdx++; showCard();
}
function updateCardCounts(){
  const known = Object.values(state.cards).filter(v=>v==='known').length;
  const again = Object.values(state.cards).filter(v=>v==='again').length;
  $('#card-known').textContent = known;
  $('#card-again').textContent = again;
  $('#card-left').textContent = Math.max(0, cardList.length-cardIdx);
}
function manifestChTitle(id){
  const c=(manifest.chapters||[]).find(x=>x.id===id); return c? c.title : id;
}

/* ---------- 术语表 ---------- */
function initGlossary(){
  const input = $('#glossary-filter');
  if(!input || input.dataset.inited) return;
  input.dataset.inited='1';
  input.oninput = ()=>{
    const v = input.value.trim().toLowerCase();
    $$('#glossary-list li').forEach(li=>{
      li.style.display = (!v || li.dataset.term.includes(v)) ? '' : 'none';
    });
  };
}

/* ---------- 搜索 ---------- */
let searchIndex = null;
function buildSearchIndex(){
  if(searchIndex) return searchIndex;
  searchIndex = [];
  Object.entries(pages).forEach(([id, htmlText])=>{
    if(id.startsWith('__')) return;
    const text = htmlText.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ');
    searchIndex.push({id, text});
  });
  return searchIndex;
}
$('#q').addEventListener('input', e=>{
  const v = e.target.value.trim().toLowerCase();
  if(!v){ showPage(routeIdFromHash()); return; }
  buildSearchIndex();
  const hits = searchIndex.filter(p=>p.text.toLowerCase().includes(v)).slice(0,20);
  const label = id => id.startsWith('chapter/')? ('章节：'+manifestChTitle(id.split('/')[1])) : id.startsWith('concept/')? ('概念：'+id.split('/')[1]) : id;
  $('#view').innerHTML = '<h1>搜索结果：'+esc(v)+'</h1>' +
    (hits.length? hits.map(h=>`<div class="search-hit"><a href="#/${h.id}">${esc(label(h.id))}</a><br><span class="sub">${esc(h.text.slice(0,180))}</span></div>`).join('')
                 : '<div class="empty">未找到相关页面，试试章节名/概念名/术语。</div>');
});

/* ---------- Mermaid 懒加载 ---------- */
function renderMermaid(){
  if(!document.querySelector('.mermaid')) return;
  const boot=()=>{ try{
    mermaid.initialize({startOnLoad:false, theme: matchMedia('(prefers-color-scheme: dark)').matches?'dark':'default'});
    document.querySelectorAll('.mermaid').forEach(el=>{
      const code=el.textContent;
      mermaid.render('mm'+Math.random().toString(36).slice(2), code)
        .then(({svg})=>{ el.innerHTML=svg; })
        .catch(()=>{ el.textContent=code; });
    });
  }catch(e){} };
  const urls=['https://registry.npmmirror.com/mermaid/10/files/dist/mermaid.min.js',
              'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js',
              'https://unpkg.com/mermaid@10/dist/mermaid.min.js'];
  let ui=0;
  const tryNext=()=>{
    if(ui>=urls.length) return;
    const s=document.createElement('script');
    s.src=urls[ui++];
    s.onload=boot;
    s.onerror=()=>{ s.remove(); tryNext(); };
    document.head.appendChild(s);
  };
  tryNext();
}
