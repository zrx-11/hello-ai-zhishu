，用奖励调整策略；它必须处理探索与利用的矛盾。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是机器人、游戏 AI 的基础，也是大模型对齐阶段的核心方法。<\/p>\n<h2>详解<\/h2>\n<p>智能体做一个动作，环境给奖励和新状态，它根据长期累积奖励调整策略。没有标签，只有奖励，所以奖励设计极其关键。奖励给错，智能体会钻空子，这叫奖励破解。<\/p>\n<p>探索是尝试未知动作，利用是沿用已知有效动作。只利用会困在平庸解，只探索拿不到稳定回报。AlphaGo 的自我对弈、大模型的 RLHF 都在处理这个矛盾。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为奖励越多越好——错误奖励会教出钻空子的策略。\n<\/li><li>\n别以为强化学习不需要数据——它需要大量交互。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 3 章：不只是神经网络<\/td><td>本章核心概念之一<\/td><td>强化学习让智能体在环境里试错，用奖励调整策略；它必须处理探索与利用的矛盾。<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\nc08 规则系统、c25 RLHF 与 DPO\n<\/ul>", "kind": "concept", "title": "强化学习与探索利用"}, "c10": {"html": "<div class=\"source-badge\">📖 出处：hello-ai.pdf · p.37<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c03\">四种能力：识别、预测、生成、决策<\/a><\/span><\/div><h1>监督学习<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 ｜ <strong>涉及章节<\/strong>：第 4 章：规则不是写出来的，是学出来的\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>监督学习用带标签的数据训练模型，学从特征到标签的映射。<\/p>\n<h2>为什么重要<\/h2>\n<p>识别和预测两类能力主要来自它，是机器学习最成熟、应用最广的范式。<\/p>\n<h2>详解<\/h2>\n<p>样本是一条记录，特征是描述它的数值，标签是希望模型学会的答案。模型是一台带旋钮的机器，参数由训练决定。损失函数把「错了多少」变成一个数，训练就是调参数让损失下降。<\/p>\n<p>瓶颈在标签：标注昂贵，还可能带入标注者的偏见和错误。模型学到的上限，是标签的质量。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为有数据就是监督学习——关键是有没有标签。\n<\/li><li>\n别以为标签一定正确——标注错误会直接教坏模型。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 4 章：规则不是写出来的，是学出来的<\/td><td>本章核心概念之一<\/td><td>监督学习用带标签的数据训练模型，学从特征到标签的映射。<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\nc11 梯度下降、c12 自监督学习\n<\/ul>", "kind": "concept", "title": "监督学习"}, "c11": {"html": "<div class=\"source-badge\">📖 出处：hello-ai.pdf · p.37<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c10\">监督学习<\/a><\/span><\/div><h1>梯度下降<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 ｜ <strong>涉及章节<\/strong>：第 4 章：规则不是写出来的，是学出来的\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>梯度下降沿损失下降的方向，对每个参数小步调整；学习率决定步子多大。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是训练几乎所有现代模型的基础算法，从一条直线到上万亿参数的大模型都用它。<\/p>\n<h2>详解<\/h2>\n<p>对每个参数算梯度，梯度告诉你「往哪边调损失会变小」，然后按学习率走一小步：w ← w - η∇L。步子太小学得慢，太大可能跨过谷底，损失震荡甚至发散。<\/p>\n<p>直觉是蒙眼下山：摸到脚下哪边更低就往那边迈，反复走，最后到谷底。真实训练用随机小批量估计梯度，噪声反而帮助它跳出浅坑。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为梯度下降一定找到全局最优——非凸问题里通常只到局部低点。\n<\/li><li>\n别以为学习率固定最好——训练中常需要衰减或自适应。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 4 章：规则不是写出来的，是学出来的<\/td><td>本章核心概念之一<\/td><td>梯度下降沿损失下降的方向，对每个参数小步调整；学习率决定步子多大。<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\nc13 泛化与过拟合、c18 反向传播\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（梯度下降）<\/summary><div class=\"depth-body\"><h2>0. 先要解决什么<\/h2>\n<p>梯度下降要解决的问题只有一句：模型有很多参数，怎样一个个调，让预测的误差变小？<\/p>\n<p>先把三件事分开：<\/p>\n<ul><li>\n<strong>模型<\/strong>：输入 <span class=\"katex-inline\">x<\/span>，输出预测 <span class=\"katex-inline\">\\hat y<\/span>，中间有一组参数 <span class=\"katex-inline\">w<\/span>。\n<\/li><li>\n<strong>损失<\/strong>：衡量预测和真实答案差多少，记作 <span class=\"katex-inline\">L(w)<\/span>。\n<\/li><li>\n<strong>更新<\/strong>：根据损失，决定每个 <span class=\"katex-inline\">w<\/span> 往哪边调、调多少。\n<\/ul>\n<p>这一节从「一维的二次损失」推到「多维」「随机小批量」，再把学习率、局部最优这些坑讲清楚。<\/p>\n<h2>1. 依赖链：要懂梯度下降，先懂三样东西<\/h2>\n<p><strong>导数<\/strong>：一元函数里，导数告诉你「自变量往右挪一点，函数值会升还是降、降多快」。<span class=\"katex-inline\">L&#x27;(w)&gt;0<\/span> 表示 <span class=\"katex-inline\">w<\/span> 增大时损失上升，所以应该把 <span class=\"katex-inline\">w<\/span> 调小。<\/p>\n<p><strong>偏导数<\/strong>：多元函数里，对某个参数单独求导，其他参数当常数。<span class=\"katex-inline\">\\partial L/\\partial w_i<\/span> 告诉你「只动 <span class=\"katex-inline\">w_i<\/span> 时，损失怎么变」。<\/p>\n<p><strong>梯度<\/strong>：把所有偏导数排成一个向量：<\/p>\n<div class=\"katex-block\">\\nabla L(w)=\\left(\\frac{\\partial L}{\\partial w_1},\\dots,\\frac{\\partial L}{\\partial w_n}\\right)<\/div>\n<p>梯度指向函数上升最快的方向；它的反方向，就是下降最快的方向。这是梯度下降的全部几何直觉。<\/p>\n<h2>2. 从一维开始：为什么是「减去梯度」<\/h2>\n<p>设损失是一条抛物线：<\/p>\n<div class=\"katex-block\">L(w)=(w-3)^2<\/div>\n<p>最小值在 <span class=\"katex-inline\">w=3<\/span>。求导：<\/p>\n<div class=\"katex-block\">L'(w)=2(w-3)<\/div>\n<p>如果当前 <span class=\"katex-inline\">w=5<\/span>，导数 <span class=\"katex-inline\">=4&gt;0<\/span>，说明往右走损失会升，应该往左。取步长 <span class=\"katex-inline\">\\eta=0.1<\/span>，更新：<\/p>\n<div class=\"katex-block\">w_{\\text{new}}=w-\\eta L'(w)=5-0.1\\times4=4.6<\/div>\n<p>再算一次：<span class=\"katex-inline\">L&#x27;(4.6)=3.2<\/span>，更新到 <span class=\"katex-inline\">4.28<\/span>；再 <span class=\"katex-inline\">3.824<\/span>……每次靠近 3，越近导数越小，步子自动变小。这就是为什么梯度下降会收敛：陡的地方走大步，平的地方走小步。<\/p>\n<p>如果取 <span class=\"katex-inline\">\\eta=1<\/span>：<\/p>\n<div class=\"katex-block\">w_{\\text{new}}=5-1\\times4=1<\/div>\n<p>直接跨过最小值到另一侧；下一步 <span class=\"katex-inline\">L&#x27;(1)=-4<\/span>，更新到 <span class=\"katex-inline\">5<\/span>，来回震荡，永远不收敛。步长太大，会把「下坡」变成「蹦极」。<\/p>\n<h2>3. 多维：每个参数各走各的<\/h2>\n<p>线性回归的损失：<\/p>\n<div class=\"katex-block\">L(w,b)=\\frac{1}{n}\\sum_{i=1}^{n}\\left(wx_i+b-y_i\\right)^2<\/div>\n<p>对 <span class=\"katex-inline\">w<\/span> 和 <span class=\"katex-inline\">b<\/span> 分别求偏导：<\/p>\n<div class=\"katex-block\">\\frac{\\partial L}{\\partial w}=\\frac{2}{n}\\sum_i (wx_i+b-y_i)x_i<\/div>\n<div class=\"katex-block\">\\frac{\\partial L}{\\partial b}=\\frac{2}{n}\\sum_i (wx_i+b-y_i)<\/div>\n<p>括号里是「预测减真实」，也就是残差。残差为正，说明预测偏高；乘以 <span class=\"katex-inline\">x_i<\/span> 后，告诉 <span class=\"katex-inline\">w<\/span> 该往哪边调。更新：<\/p>\n<div class=\"katex-block\">w\\leftarrow w-\\eta\\frac{\\partial L}{\\partial w},\\qquad b\\leftarrow b-\\eta\\frac{\\partial L}{\\partial b}<\/div>\n<p><strong>数值算例<\/strong>：三笔订单，距离 <span class=\"katex-inline\">x=2,4,6<\/span> 公里，车费 <span class=\"katex-inline\">y=12,18,24<\/span> 元。设当前 <span class=\"katex-inline\">w=2,b=2<\/span>。<\/p>\n<p>预测：<span class=\"katex-inline\">2\\times2+2=6<\/span>，<span class=\"katex-inline\">2\\times4+2=10<\/span>，<span class=\"katex-inline\">2\\times6+2=14<\/span>。残差：<span class=\"katex-inline\">-6,-8,-10<\/span>。<\/p>\n<div class=\"katex-block\">\\frac{\\partial L}{\\partial w}=\\frac{2}{3}[(-6)(2)+(-8)(4)+(-10)(6)]=\\frac{2}{3}(-104)\\approx-69.3<\/div>\n<p>梯度为负，说明增大 <span class=\"katex-inline\">w<\/span> 会降低损失。取 <span class=\"katex-inline\">\\eta=0.01<\/span>：<\/p>\n<div class=\"katex-block\">w\\leftarrow 2-0.01\\times(-69.3)=2.693<\/div>\n<p>预测变大，残差缩小。反复迭代，<span class=\"katex-inline\">w<\/span> 会接近真实斜率 3，<span class=\"katex-inline\">b<\/span> 接近 6。<\/p>\n<h2>4. 为什么真实训练用「随机小批量」<\/h2>\n<p>上面的梯度用全部样本算，叫批量梯度下降。数据几百万条时，每走一步都要算一遍全量，太贵。<\/p>\n<p>实际用<strong>随机梯度下降（SGD）<\/strong>：每次随机抽一小批（比如 32 条），用这批估计梯度。估计有噪声，但方向大体正确，而且一步快很多。噪声还带来一个好处：它能帮模型跳出浅的局部坑。<\/p>\n<p>小批量大小的取舍：太小，梯度噪声大、训练不稳；太大，每步贵、收敛慢。常见 32 到 1024。<\/p>\n<h2>5. 学习率：最重要的超参数<\/h2>\n<ul><li>\n太大：损失震荡、发散，甚至变成 NaN。\n<\/li><li>\n太小：训练慢，可能停在 plataeu 上很久。\n<\/li><li>\n固定：前期可以大，后期需要小，才能精细落到谷底。\n<\/ul>\n<p>常见做法是<strong>衰减<\/strong>：一开始 <span class=\"katex-inline\">\\eta=0.01<\/span>，训练后期降到 <span class=\"katex-inline\">0.001<\/span>。自适应方法（Adam 等）会给每个参数单独调步长，对稀疏特征更友好。<\/p>\n<h2>6. 它不保证全局最优<\/h2>\n<p>深度网络的损失是非凸的，有很多局部低点和鞍点。梯度下降只保证「局部下降」，不保证找到全局最小。<\/p>\n<p>但实践发现，大网络里的局部低点通常也不差；真正麻烦的是鞍点和高原，梯度接近零，走不动。动量、Adam、随机噪声都是用来对付这些地形的。<\/p>\n<h2>7. 反例：学习率设错会怎样<\/h2>\n<p>设 <span class=\"katex-inline\">L(w)=w^2<\/span>，当前 <span class=\"katex-inline\">w=1<\/span>，取 <span class=\"katex-inline\">\\eta=1.5<\/span>：<\/p>\n<div class=\"katex-block\">w_{\\text{new}}=1-1.5\\times2=-2<\/div>\n<p>下一步：<\/p>\n<div class=\"katex-block\">w_{\\text{new}}=-2-1.5\\times(-4)=4<\/div>\n<p>再下一步 <span class=\"katex-inline\">-8<\/span>，再 <span class=\"katex-inline\">16<\/span>……绝对值越来越大，损失爆炸。这不是模型不好，是步长超过了稳定范围。<\/p>\n<h2>8. 后文连接<\/h2>\n<p>梯度下降只负责「怎么调参数」；参数多了以后，梯度怎么高效算，是下一份深度推导「反向传播」要解决的。再往后，Adam、学习率调度、批量大小，都是在这套基本循环上做工程优化。<\/p>\n<h2>9. 差生自查<\/h2>\n<ol><li>\n梯度为什么指向上升最快方向？因为每个偏导给出该方向的变化率，合起来就是最陡上升方向。\n<\/li><li>\n为什么更新是减不是加？因为要往损失下降的方向走。\n<\/li><li>\n学习率太大会怎样？跨过谷底，震荡或发散。\n<\/li><li>\n随机梯度的噪声为什么有用？它帮模型跳出浅坑，也让每步更便宜。\n<\/ol><\/div><\/details>", "kind": "concept", "title": "梯度下降"}, "c12": {"html": "<div class=\"source-badge\">📖 出处：hello-ai.pdf · p.37<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c10\">监督学习<\/a><\/span><\/div><h1>自监督学习<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：第 4 章：规则不是写出来的，是学出来的\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>自监督学习从数据自身制造标签，比如遮词猜词、续写下一段，不需要人工标注。<\/p>\n<h2>为什么重要<\/h2>\n<p>它绕开标注瓶颈，让模型能用整个互联网训练，是大语言模型能出现的直接原因。<\/p>\n<h2>详解<\/h2>\n<p>文本里下一个词天然就是标签：给前文，猜下一个 token。图像里可以遮住一块再恢复，音频可以预测下一段。标签来自数据本身，所以规模可以做得极大。<\/p>\n<p>代价是任务可能学偏：模型可能学到表面共现，而不是真正的理解。但对语言模型来说，这个简单的目标已经逼出了语言、知识和部分推理能力。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为自监督不需要标签——标签是数据自身生成的。\n<\/li><li>\n别以为它一定学到理解——也可能学到表面统计规律。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 4 章：规则不是写出来的，是学出来的<\/td><td>本章核心概念之一<\/td><td>自监督学习从数据自身制造标签，比如遮词猜词、续写下一段，不需要人工标注。<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\nc10 监督学习、c19 分词与 BPE\n<\/ul>", "kind": "concept", "title": "自监督学习"}, "c13": {"html": "<div class=\"source-badge\">📖 出处：hello-ai.pdf · p.49<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c11\">梯度下降<\/a><\/span><\/div><h1>泛化与过拟合<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 ｜ <strong>涉及章节<\/strong>：第 5 章：真正的考试在训练集之外\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>泛化是模型在没见过的数据上表现稳定；过拟合是它把训练数据的噪声也背下来。<\/p>\n<h2>为什么重要<\/h2>\n<p>训练成绩不算数，泛化才是机器学习唯一真正的目标。<\/p>\n<h2>详解<\/h2>\n<p>模型越灵活、数据越少，越容易把训练集里的巧合当成规律。训练表现很好，新数据很差。反过来，模型太简单会欠拟合，连真实规律都抓不住。<\/p>\n<p>对策：更多数据、限制复杂度、正则化、早停。三份数据各管一件事：训练集学参数，验证集调超参，测试集最后只考一次。测试集反复用，就会被间接背下来。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为训练准确率高就是好模型——可能只是背了答案。\n<\/li><li>\n别以为测试集可以随便反复用——用多了就失效。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 5 章：真正的考试在训练集之外<\/td><td>本章核心概念之一<\/td><td>泛化是模型在没见过的数据上表现稳定；过拟合是它把训练数据的噪声也背下来。<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\nc14 精确率与召回率、c15 分布偏移\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（泛化与过拟合）<\/summary><div class=\"depth-body\"><h2>0. 先要解决什么<\/h2>\n<p>一个模型在训练集上 99% 正确，上线后 60%。这不是 bug，是它把训练集的噪声也背下来了。<\/p>\n<p>泛化要回答：为什么「记住」不等于「学会」，以及怎样用有限数据判断模型是否真的学会了规律。<\/p>\n<h2>1. 依赖链：模型复杂度、损失、数据划分<\/h2>\n<p><strong>模型复杂度<\/strong>：模型能表达的函数有多灵活。一条直线复杂度低，二十次多项式复杂度高。<\/p>\n<p><strong>训练损失<\/strong>：模型在训练集上的误差。<strong>验证损失<\/strong>：在没参与训练的验证集上的误差。<\/p>\n<p><strong>数据划分<\/strong>：训练集学参数，验证集调超参，测试集最后考一次。<\/p>\n<h2>2. 偏差—方差分解<\/h2>\n<p>对平方损失，期望预测误差可以分解为：<\/p>\n<div class=\"katex-block\">\\mathbb{E}[(y-\\hat y)^2]=\\text{偏差}^2+\\text{方差}+\\text{不可约噪声}<\/div>\n<ul><li>\n<strong>偏差<\/strong>：模型太简单，连真实规律都抓不住，训练和验证都差。这叫欠拟合。\n<\/li><li>\n<strong>方差<\/strong>：模型太灵活，对训练集的小波动过度敏感，训练好、验证差。这叫过拟合。\n<\/li><li>\n<strong>噪声<\/strong>：数据本身有随机性，任何模型都消不掉。\n<\/ul>\n<p>复杂度从左到右增加：偏差下降，方差上升，总误差是一条 U 形曲线。最优复杂度在谷底。<\/p>\n<h2>3. 多项式例子<\/h2>\n<p>设真实规律是 <span class=\"katex-inline\">y=x^2<\/span>，观测有噪声。用 1 次、2 次、10 次多项式分别拟合 20 个点：<\/p>\n<ul><li>\n1 次：欠拟合，训练和验证都差。\n<\/li><li>\n2 次：接近真实，训练和验证都好。\n<\/li><li>\n10 次：能穿过每个训练点，训练误差接近 0，但在点与点之间剧烈震荡，验证误差很大。\n<\/ul>\n<p>10 次多项式的参数比数据点还多，它有能力「记住」每个点，包括噪声。这就是过拟合的几何图像。<\/p>\n<h2>4. 数值算例：正则化<\/h2>\n<p>在损失里加 L2 惩罚：<\/p>\n<div class=\"katex-block\">L_{\\text{total}}=L_{\\text{data}}+\\lambda\\sum_i w_i^2<\/div>\n<p><span class=\"katex-inline\">\\lambda<\/span> 越大，参数被压得越小，模型越不灵活。设两个模型：<\/p>\n<ul><li>\n无正则：训练损失 0.01，验证损失 0.30。\n<\/li><li>\n正则 <span class=\"katex-inline\">\\lambda=0.01<\/span>：训练损失 0.05，验证损失 0.12。\n<\/ul>\n<p>训练变差了一点，验证好很多。正则化用一点偏差换方差下降，总误差降低。<\/p>\n<h2>5. 三份数据各管什么<\/h2>\n<ul><li>\n<strong>训练集<\/strong>：调参数。模型可以反复看。\n<\/li><li>\n<strong>验证集<\/strong>：调超参、早停、选模型。可以反复看，但每次看都在间接拟合它。\n<\/li><li>\n<strong>测试集<\/strong>：最后只考一次。反复用测试集选模型，测试成绩就失效——你其实是在测试集上训练。\n<\/ul>\n<p>数据少时用交叉验证：轮流留一部分做验证，减少划分带来的偶然性。<\/p>\n<h2>6. 深度学习的「双下降」<\/h2>\n<p>经典理论说参数多于数据一定过拟合。但深度网络出现一个反常现象：参数增加到远超数据量后，测试误差先升后降，形成「双下降」。<\/p>\n<p>一种解释是，极度过参数化的网络会找到平坦的极小值，平坦区域对数据扰动不敏感，反而泛化好。这不是说参数越多越好，而是说经典偏差—方差图像在深度网络里不完整。<\/p>\n<h2>7. 反例：用测试集调模型<\/h2>\n<p>你有 1000 个测试样本。试了 50 个模型，选测试最好的那个，报告它的测试准确率。这个数字是乐观偏差：你从 50 个里挑了运气最好的，测试集已经被用于选择。<\/p>\n<p>正确做法：用验证集选模型，测试集只在最后用一次；或者用嵌套交叉验证。<\/p>\n<h2>8. 后文连接<\/h2>\n<p>泛化是机器学习的目标；精确率、召回率是分类任务的具体度量；分布偏移说明「未来不像过去」时，泛化保证会失效。三者合起来，才是完整的评估观。<\/p>\n<h2>9. 差生自查<\/h2>\n<ol><li>\n过拟合和欠拟合的区别？过拟合训练好验证差，欠拟合两者都差。\n<\/li><li>\n偏差和方差分别对应什么？偏差是模型太简单，方差是模型太灵活。\n<\/li><li>\n为什么验证集可以反复用、测试集不行？反复用测试集等于在它上面训练。\n<\/li><li>\n正则化怎样起作用？压小参数，降低模型灵活性，用一点偏差换方差下降。\n<\/li><li>\n双下降说明什么？经典偏差—方差图像在深度网络里不完整。\n<\/ol><\/div><\/details>", "kind": "concept", "title": "泛化与过拟合"}, "c14": {"html": "<div class=\"source-badge\">📖 出处：hello-ai.pdf · p.49<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c13\">泛化与过拟合<\/a><\/span><\/div><h1>精确率、召回率与混淆矩阵<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：第 5 章：真正的考试在训练集之外\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>混淆矩阵把预测和实际分成四格；精确率问「说有里的多少是真的」，召回率问「真的里的多少被找出」。<\/p>\n<h2>为什么重要<\/h2>\n<p>类别不平衡时准确率会骗人，必须拆开看误报和漏报的代价。<\/p>\n<h2>详解<\/h2>\n<p>四格是 TP、FP、FN、TN。精确率 = TP/(TP+FP)，召回率 = TP/(TP+FN)。两者此消彼长：把阈值调低，召回率上升，精确率下降；调高则相反。<\/p>\n<p>取舍取决于场景。垃圾邮件宁可漏掉几封，也不要把正常邮件误删；疾病筛查宁可多报，也不要漏诊。这是价值判断，不是纯技术选择。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为准确率越高模型越好——不平衡数据下会被多数类绑架。\n<\/li><li>\n别以为精确率和召回率能同时无限提高——它们有取舍。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 5 章：真正的考试在训练集之外<\/td><td>本章核心概念之一<\/td><td>混淆矩阵把预测和实际分成四格；精确率问「说有里的多少是真的」，召回率问「真的里的多少被找出」。<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\nc13 泛化与过拟合、c15 分布偏移\n<\/ul>", "kind": "concept", "title": "精确率、召回率与混淆矩阵"}, "c15": {"html": "<div class=\"source-badge\">📖 出处：hello-ai.pdf · p.49<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c13\">泛化与过拟合<\/a><\/span><\/div><h1>分布偏移与相关因果<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：第 5 章：真正的考试在训练集之外\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>部署后的数据和训练数据不再来自同一个世界，叫分布偏移；模型学到的全是相关，不足以做因果干预。<\/p>\n<h2>为什么重要<\/h2>\n<p>它解释为什么模型上线后会退化，也防止你把「同时出现」当成「谁导致谁」。<\/p>\n<h2>详解<\/h2>\n<p>所有模型都默认「未来像过去」，但疫情、新教材、新政策都会改变数据分布。部署不是终点，监控才是。<\/p>\n<p>相关足以预测，不足以干预。给每个孩子发平板不会自动提高成绩，可能是家庭条件好的孩子既有平板又成绩好。要区分因果，需要实验设计和领域知识，不是更大的模型。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为模型上线就稳定——数据会漂移，性能会退化。\n<\/li><li>\n别以为模型发现的规律就是因果——它只学相关。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 5 章：真正的考试在训练集之外<\/td><td>本章核心概念之一<\/td><td>部署后的数据和训练数据不再来自同一个世界，叫分布偏移；模型学到的全是相关，不足以做因果干预。<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\nc13 泛化与过拟合、c41 推荐系统反馈循环\n<\/ul>", "kind": "concept", "title": "分布偏移与相关因果"}, "c16": {"html": "<div class=\"source-badge\">📖 出处：hello-ai.pdf · p.59<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c10\">监督学习<\/a><\/span><\/div><h1>神经元与激活函数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 ｜ <strong>涉及章节<\/strong>：第 6 章：一层一层看出一只猫\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>神经元做四件事：接收输入、各乘权重、求和加偏置、通过非线性激活输出。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是所有神经网络的基本单元；没有非线性，堆多少层都只是一个线性变换。<\/p>\n<h2>详解<\/h2>\n<p>权重表示输入有多重要，偏置是整体门槛。激活函数引入非线性，常见 ReLU 把负数归零、正数照旧。<\/p>\n<p>一个神经元像微型探测器，只对某种模式敏感，输入够强就放电。单独看很笨，连成多层才厉害。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为神经元在模仿生物大脑——只是借用了「很多简单单元连接」的灵感。\n<\/li><li>\n别以为激活函数可有可无——没有它，深网络退化成线性模型。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 6 章：一层一层看出一只猫<\/td><td>本章核心概念之一<\/td><td>神经元做四件事：接收输入、各乘权重、求和加偏置、通过非线性激活输出。<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\nc17 卷积神经网络、c18 反向传播\n<\/ul>", "kind": "concept", "title": "神经元与激活函数"}, "c17": {"html": "<div class=\"source-badge\">📖 出处：hello-ai.pdf · p.59<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c16\">神经元与激活函数<\/a><\/span><\/div><h1>卷积神经网络<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：第 6 章：一层一层看出一只猫\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>CNN 用局部连接、权重共享和池化，让同一组权重在整张图上滑动，逐层把边缘组成物体。<\/p>\n<h2>为什么重要<\/h2>\n<p>它让图像识别参数大幅减少，并对平移更稳健，是 2012 年深度学习突破的主力架构。<\/p>\n<h2>详解<\/h2>\n<p>局部连接让每个神经元只看一小块，先找边缘、角点。权重共享让同一个「边缘探测器」扫过所有位置，猫在左上还是右下都用同一组参数。池化压缩相邻区域，逐层扩大视野。<\/p>\n<p>低层学边缘，中层学部件，高层学物体。这个层级不是人设计的，是网络为了完成任务自己形成的。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为卷积只能用于图像——一维卷积可用于语音、文本、时间序列。\n<\/li><li>\n别以为层数越多越好——太深会梯度消失、过拟合。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 6 章：一层一层看出一只猫<\/td><td>本章核心概念之一<\/td><td>CNN 用局部连接、权重共享和池化，让同一组权重在整张图上滑动，逐层把边缘组成物体。<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\nc16 神经元与激活、c18 表示学习与反向传播\n<\/ul>", "kind": "concept", "title": "卷积神经网络"}, "c18": {"html": "<div class=\"source-badge\">📖 出处：hello-ai.pdf · p.59<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c17\">卷积神经网络<\/a><\/span><\/div><h1>表示学习与反向传播<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 ｜ <strong>涉及章节<\/strong>：第 6 章：一层一层看出一只猫\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>表示学习让网络自己发明该看什么特征；反向传播用链式法则把误差逐层分配，一次算出全部梯度。<\/p>\n<h2>为什么重要<\/h2>\n<p>前者是深度学习通用性的来源，后者是深网络可训练的前提。<\/p>\n<h2>详解<\/h2>\n<p>传统机器学习要专家手工设计特征；深度学习只给像素和标签，网络自己学出边缘、纹理、部件。同一套方法因此能用于图像、语音、文本、蛋白质结构。<\/p>\n<p>训练时先前向算预测，算损失，再反向把误差从输出传回每一层。一次反向传播得到全部梯度，计算量只比前向多常数倍。没有它，深网络在算力上训不动。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为网络会解释它看到了什么——特征层级是事后观察到的现象。\n<\/li><li>\n别以为反向传播是「把答案往回抄」——它算的是梯度，不是标签。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 6 章：一层一层看出一只猫<\/td><td>本章核心概念之一<\/td><td>表示学习让网络自己发明该看什么特征；反向传播用链式法则把误差逐层分配，一次算出全部梯度。<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\nc17 卷积神经网络、c11 梯度下降\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（表示学习与反向传播）<\/summary><div class=\"depth-body\"><h2>0. 先要解决什么<\/h2>\n<p>网络有很多层、很多参数。一次预测错了，每个参数该负多少责任？反向传播就是高效算这件事的方法。<\/p>\n<p>如果暴力算：每个参数单独扰动一下，看损失变多少，再恢复。参数有几千亿个，每次前向都要跑一遍，计算量无法承受。反向传播用链式法则，一次反向遍历就算出全部梯度，计算量只比前向多常数倍。<\/p>\n<h2>1. 依赖链：链式法则<\/h2>\n<p>复合函数 <span class=\"katex-inline\">y=f(g(x))<\/span>，导数：<\/p>\n<div class=\"katex-block\">\\frac{dy}{dx}=\\frac{dy}{du}\\cdot\\frac{du}{dx},\\quad u=g(x)<\/div>\n<p>直观：<span class=\"katex-inline\">x<\/span> 变一点，先影响 <span class=\"katex-inline\">u<\/span>，<span class=\"katex-inline\">u<\/span> 再影响 <span class=\"katex-inline\">y<\/span>。总影响是两段影响相乘。<\/p>\n<p>神经网络就是很多层复合：<span class=\"katex-inline\">x\\to h_1\\to h_2\\to \\cdots \\to L<\/span>。损失对第一层参数的梯度，要经过后面所有层，一路乘回来。<\/p>\n<h2>2. 一个两层网络，手算一遍<\/h2>\n<p>为了不堆符号，设：<\/p>\n<ul><li>\n输入 <span class=\"katex-inline\">x=2<\/span>，真实答案 <span class=\"katex-inline\">y=1<\/span>。\n<\/li><li>\n第一层：<span class=\"katex-inline\">h=w_1x+b_1<\/span>，取 <span class=\"katex-inline\">w_1=1,b_1=0<\/span>，所以 <span class=\"katex-inline\">h=2<\/span>。\n<\/li><li>\n激活：<span class=\"katex-inline\">a=\\mathrm{ReLU}(h)=2<\/span>（正数不变）。\n<\/li><li>\n第二层：<span class=\"katex-inline\">\\hat y=w_2a+b_2<\/span>，取 <span class=\"katex-inline\">w_2=1,b_2=0<\/span>，所以 <span class=\"katex-inline\">\\hat y=2<\/span>。\n<\/li><li>\n损失：<span class=\"katex-inline\">L=(\\hat y-y)^2=(2-1)^2=1<\/span>。\n<\/ul>\n<p><strong>前向<\/strong>算完，开始反向。<\/p>\n<p><strong>输出层<\/strong>：损失对 <span class=\"katex-inline\">\\hat y<\/span> 的导数：<\/p>\n<div class=\"katex-block\">\\frac{\\partial L}{\\partial \\hat y}=2(\\hat y-y)=2(2-1)=2<\/div>\n<p><span class=\"katex-inline\">\\hat y=w_2a+b_2<\/span>，所以：<\/p>\n<div class=\"katex-block\">\\frac{\\partial L}{\\partial w_2}=\\frac{\\partial L}{\\partial \\hat y}\\cdot a=2\\times2=4<\/div>\n<div class=\"katex-block\">\\frac{\\partial L}{\\partial b_2}=\\frac{\\partial L}{\\partial \\hat y}\\cdot1=2<\/div>\n<div class=\"katex-block\">\\frac{\\partial L}{\\partial a}=\\frac{\\partial L}{\\partial \\hat y}\\cdot w_2=2\\times1=2<\/div>\n<p><strong>激活层<\/strong>：ReLU 在 <span class=\"katex-inline\">h&gt;0<\/span> 时导数 1，所以：<\/p>\n<div class=\"katex-block\">\\frac{\\partial L}{\\partial h}=\\frac{\\partial L}{\\partial a}\\cdot1=2<\/div>\n<p><strong>第一层<\/strong>：<span class=\"katex-inline\">h=w_1x+b_1<\/span>：<\/p>\n<div class=\"katex-block\">\\frac{\\partial L}{\\partial w_1}=\\frac{\\partial L}{\\partial h}\\cdot x=2\\times2=4<\/div>\n<div class=\"katex-block\">\\frac{\\partial L}{\\partial b_1}=\\frac{\\partial L}{\\partial h}\\cdot1=2<\/div>\n<p>取学习率 <span class=\"katex-inline\">0.1<\/span>：<\/p>\n<div class=\"katex-block\">w_1\\leftarrow1-0.1\\times4=0.6,\\quad w_2\\leftarrow1-0.1\\times4=0.6<\/div>\n<p>下一轮预测会变小，靠近真实值 1。四个参数的梯度，一次反向全部得到。<\/p>\n<h2>3. 为什么一次反向能算全部<\/h2>\n<p>反向传播的本质是<strong>动态规划<\/strong>：从输出往输入走，每个节点只算「损失对它的输出的梯度」，再乘上「它对输入的局部导数」，传给前一层。<\/p>\n<p>每个参数只被访问一次，每条边只乘一次。总计算量约等于前向的两倍，而不是参数个数乘以网络大小。<\/p>\n<p>这也是为什么深度学习能训练上万亿参数：梯度不是逐个试出来的，是解析地、一次算出来的。<\/p>\n<h2>4. 数值算例：换个激活<\/h2>\n<p>如果激活是 Sigmoid：<\/p>\n<div class=\"katex-block\">\\sigma(h)=\\frac{1}{1+e^{-h}},\\quad \\sigma'(h)=\\sigma(h)(1-\\sigma(h))<\/div>\n<p>设 <span class=\"katex-inline\">h=0<\/span>，<span class=\"katex-inline\">\\sigma=0.5<\/span>，导数 <span class=\"katex-inline\">0.25<\/span>。那么 <span class=\"katex-inline\">\\partial L/\\partial h<\/span> 会比 ReLU 时小 4 倍。层数一多，每层乘一个小于 1 的数，梯度指数衰减，这就是<strong>梯度消失<\/strong>。<\/p>\n<p>ReLU 在正区间导数恒为 1，缓解了这个问题；残差连接让梯度可以绕过某些层，进一步缓解。但深网络仍然可能梯度爆炸，需要梯度裁剪、归一化。<\/p>\n<h2>5. 反例：ReLU 的「死亡」<\/h2>\n<p>如果某个神经元的输入长期为负，ReLU 输出 0，导数也是 0；梯度传到这里就断了，参数再也不会更新。这叫<strong>死亡 ReLU<\/strong>。<\/p>\n<p>解决办法：用 Leaky ReLU（负区间给一个小斜率）、GELU，或者调小学习率、加归一化。它不是理论上的完美函数，而是工程折中。<\/p>\n<h2>6. 后文连接<\/h2>\n<p>反向传播算梯度，梯度下降用梯度更新参数；卷积网络用局部连接和权重共享减少参数，但反向传播的链式法则不变；Transformer 有残差和归一化，也是为了在几十层里保住梯度。<\/p>\n<h2>7. 差生自查<\/h2>\n<ol><li>\n为什么不能对每个参数单独扰动求梯度？参数太多，计算量爆炸。\n<\/li><li>\n反向传播的核心数学是什么？链式法则。\n<\/li><li>\n为什么梯度会消失？每层乘一个小于 1 的局部导数，层数多了指数衰减。\n<\/li><li>\n残差连接为什么有帮助？它给梯度一条绕过某些层的直路，避免每层都衰减。\n<\/ol><\/div><\/details>", "kind": "concept", "title": "表示学习与反向传播"}, "c19": {"html": "<div class=\"source-badge\">📖 出处：hello-ai.pdf · p.71<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c12\">自监督学习<\/a><\/span><\/div><h1>分词与 BPE<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：第 7 章：文字怎样变成数字\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>分词把文本切成 token；BPE 从字节开始反复合并高频相邻单元，得到词表。<\/p>\n<h2>为什么重要<\/h2>\n<p>它决定模型「看见」什么，也决定中文成本、拼写能力和数字母类任务的弱点。<\/p>\n<h2>详解<\/h2>\n<p>模型不读字，读 token。常见词是一个 token，生僻词拆成几个片段，任何字符最终能拆到字节。BPE 反复合并语料中最常相邻出现的两个单元，在词表大小和单元意义之间取平衡。<\/p>\n<p>主分词表多在英文语料上构建，很多汉字占两三个 token，同样内容的中文版可能更贵。问模型「strawberry 有几个 r」，它看到的是编号，字母不是独立单位，所以容易错。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为模型是一个字一个字读——它读 token。\n<\/li><li>\n别以为中文和英文 token 成本一样——分词器配比会影响成本。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 7 章：文字怎样变成数字<\/td><td>本章核心概念之一<\/td><td>分词把文本切成 token；BPE 从字节开始反复合并高频相邻单元，得到词表。<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\nc20 词向量与嵌入、c23 自回归与采样\n<\/ul>", "kind": "concept", "title": "分词与 BPE"}, "c20": {"html": "<div class=\"source-badge\">📖 出处：hello-ai.pdf · p.71<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c19\">分词与 BPE<\/a><\/span><\/div><h1>词向量与嵌入<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：第 7 章：文字怎样变成数字\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>嵌入把 token 映射成连续向量；用法相似的词向量靠近，语义关系对应方向。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把语言变成几何，支撑语义搜索、推荐、RAG 和图文互搜。<\/p>\n<h2>详解<\/h2>\n<p>每个 token 对应几百到几千维向量，由训练得到。经典关系是「国王 − 男人 + 女人 ≈ 女王」。比较两个向量常用余弦相似度：方向一致为 1，垂直为 0。<\/p>\n<p>嵌入反映训练语料的共现。语料有偏见，向量就忠实编码偏见。它不是人工标注的语义，而是统计学习的结果。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为词向量是人工定义的——它由训练得到。\n<\/li><li>\n别以为嵌入是客观语义——它继承语料偏见。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 7 章：文字怎样变成数字<\/td><td>本章核心概念之一<\/td><td>嵌入把 token 映射成连续向量；用法相似的词向量靠近，语义关系对应方向。<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\nc19 分词与 BPE、c28 RAG 与接地\n<\/ul>", "kind": "concept", "title": "词向量与嵌入"}, "c21": {"html": "<div class=\"source-badge\">📖 出处：hello-ai.pdf · p.79<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c20\">词向量与嵌入<\/a><\/span><\/div><h1>自注意力与 QKV<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 ｜ <strong>涉及章节<\/strong>：第 8 章：每个词都能看见其他词\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>每个词发出查询 Q、提供键 K 和值 V；Q 与所有 K 打分，softmax 成权重，再按权重混合所有 V。<\/p>\n<h2>为什么重要<\/h2>\n<p>注意力是 Transformer 的心脏，让「苹果」能根据「吃」或「发布」改变含义。<\/p>\n<h2>详解<\/h2>\n<p>同一个词向量经过三个可训练矩阵变成 Q、K、V。Q 和所有 K 的点积得到相关度，除以 √d 防止数值膨胀，softmax 变成加起来为 1 的权重，最后加权求和所有 V。<\/p>\n<p>每个位置同时做这件事，所以可以并行；代价是计算量随序列长度平方增长。语法关系不是人写的规则，是模型为了预测下一个词逼出来的副产品。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为注意力等于人类注意——它只是加权求和。\n<\/li><li>\n别以为注意力懂语法——语法关系是训练出来的副产品。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 8 章：每个词都能看见其他词<\/td><td>本章核心概念之一<\/td><td>每个词发出查询 Q、提供键 K 和值 V；Q 与所有 K 打分，softmax 成权重，再按权重混合所有 V。<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\nc22 Transformer 与位置编码、c23 自回归与采样\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（自注意力与 QKV）<\/summary><div class=\"depth-body\"><h2>0. 先要解决什么<\/h2>\n<p>「苹果」在「吃苹果」和「苹果发布手机」里是同一个 token，进入模型时是同一个向量。模型怎样让它根据上下文变成不同的表示？<\/p>\n<p>注意力回答的就是这个问题：让每个词从所有词那里收集信息，收集多少由「相关度」决定。<\/p>\n<h2>1. 依赖链：向量、点积、softmax<\/h2>\n<p><strong>向量<\/strong>：一串数字，可以想象成空间里的箭头。<\/p>\n<p><strong>点积<\/strong>：两个向量对应相乘再相加：<\/p>\n<div class=\"katex-block\">a\\cdot b=a_1b_1+a_2b_2+\\cdots+a_db_d<\/div>\n<p>点积越大，方向越一致，表示「越相关」。它是最便宜的相关度打分。<\/p>\n<p><strong>softmax<\/strong>：把一组分数变成加起来为 1 的权重：<\/p>\n<div class=\"katex-block\">\\mathrm{softmax}(z_i)=\\frac{e^{z_i}}{\\sum_j e^{z_j}}<\/div>\n<p>分数高的权重大，但不会独占；分数低的仍然有一点点。<\/p>\n<h2>2. 三个角色：Q、K、V<\/h2>\n<p>每个词向量 <span class=\"katex-inline\">x_i<\/span> 经过三个可训练矩阵，变成：<\/p>\n<div class=\"katex-block\">q_i=x_iW_Q,\\quad k_i=x_iW_K,\\quad v_i=x_iW_V<\/div>\n<ul><li>\n<strong>查询 q<\/strong>：我在找什么信息？\n<\/li><li>\n<strong>键 k<\/strong>：我能回答什么类型的问题？\n<\/li><li>\n<strong>值 v<\/strong>：我愿意贡献的内容。\n<\/ul>\n<p>「苹果」的查询与「吃」的键点积高，与「发布」的键也高（如果句子是发布手机），与「一个」的键低。<\/p>\n<h2>3. 从打分到加权求和<\/h2>\n<p>对第 <span class=\"katex-inline\">i<\/span> 个词，和所有词 <span class=\"katex-inline\">j<\/span> 打分：<\/p>\n<div class=\"katex-block\">s_{ij}=q_i\\cdot k_j<\/div>\n<p>除以 <span class=\"katex-inline\">\\sqrt{d_k}<\/span>（<span class=\"katex-inline\">d_k<\/span> 是向量维度），再做 softmax：<\/p>\n<div class=\"katex-block\">\\alpha_{ij}=\\mathrm{softmax}_j\\left(\\frac{q_i\\cdot k_j}{\\sqrt{d_k}}\\right)<\/div>\n<p>最后加权求和所有值：<\/p>\n<div class=\"katex-block\">o_i=\\sum_j \\alpha_{ij}v_j<\/div>\n<p>写成矩阵就是：<\/p>\n<div class=\"katex-block\">\\mathrm{Attention}(Q,K,V)=\\mathrm{softmax}\\left(\\frac{QK^\\top}{\\sqrt{d_k}}\\right)V<\/div>\n<h2>4. 数值算例<\/h2>\n<p>设「苹果」的查询 <span class=\"katex-inline\">q=(1,0)<\/span>，三个词的键：<\/p>\n<ul><li>\n吃：<span class=\"katex-inline\">k=(1,0)<\/span>，点积 1\n<\/li><li>\n发布：<span class=\"katex-inline\">k=(0,1)<\/span>，点积 0\n<\/li><li>\n一个：<span class=\"katex-inline\">k=(0,0)<\/span>，点积 0\n<\/ul>\n<p>取 <span class=\"katex-inline\">\\sqrt{d_k}=1<\/span>，softmax：<\/p>\n<div class=\"katex-block\">e^1=2.718,\\quad e^0=1,\\quad e^0=1<\/div>\n<p>权重：<\/p>\n<div class=\"katex-block\">\\alpha_{\\text{吃}}=\\frac{2.718}{4.718}=0.576,\\quad \\alpha_{\\text{发布}}=0.212,\\quad \\alpha_{\\text{一个}}=0.212<\/div>\n<p>如果三个值分别是「食物」「商业」「量词」的向量，苹果的新表示里 57.6% 是食物信息，已经偏向水果。若句子换成「苹果发布手机」，发布键的点积变高，权重就会转过去。<\/p>\n<h2>5. 为什么要除以 √d<\/h2>\n<p>如果 <span class=\"katex-inline\">q<\/span> 和 <span class=\"katex-inline\">k<\/span> 的每个分量都是均值 0、方差 1 的随机数，点积的方差约为 <span class=\"katex-inline\">d<\/span>。维度越大，点积绝对值越大；softmax 会把大的更大、小的更小，最后几乎变成 one-hot，梯度接近 0，训练不动。<\/p>\n<p>除以 <span class=\"katex-inline\">\\sqrt d<\/span> 把方差拉回 1，softmax 保持在有梯度的范围。这是数值稳定性的工程必需，不是装饰。<\/p>\n<h2>6. 多头：同时看多种关系<\/h2>\n<p>一组 QKV 只能学一种「相关」。但词和词之间同时有语法、指代、位置、语义关系。多头就是并行做几组，每组有自己的 <span class=\"katex-inline\">W_Q,W_K,W_V<\/span>，最后把输出拼接：<\/p>\n<div class=\"katex-block\">\\mathrm{MultiHead}(X)=\\mathrm{Concat}(\\mathrm{head}_1,\\dots,\\mathrm{head}_h)W_O<\/div>\n<p>事后观察，确实有的头专看前一个词，有的专追踪代词，有的专看句首。没有人规定，是训练逼出来的分工。<\/p>\n<h2>7. 位置编码：把顺序塞回去<\/h2>\n<p>注意力对顺序无感：「猫追狗」和「狗追猫」，每个词的 QKV 相同，输出也相同。位置编码在第 <span class=\"katex-inline\">i<\/span> 个词向量上加一个位置向量 <span class=\"katex-inline\">p_i<\/span>：<\/p>\n<div class=\"katex-block\">x_i'=x_i+p_i<\/div>\n<p>这样「第 1 位的猫」和「第 3 位的猫」进入注意力前就不同。常见做法是用不同频率的正余弦函数生成位置向量。<\/p>\n<h2>8. 反例：没有位置编码会怎样<\/h2>\n<p>模型会把「狗追猫」和「猫追狗」当成同一袋词，无法判断谁追谁。对于需要语序的任务（翻译、代码、指代），性能会明显下降。位置编码不是可选项，是注意力的必要补丁。<\/p>\n<h2>9. 后文连接<\/h2>\n<p>注意力让每个词看见其他词，前馈网络再对每个词单独消化；残差和归一化让几十层能训；自回归生成每步只预测一个 token，靠采样策略选词。这些合起来就是 Transformer。<\/p>\n<h2>10. 差生自查<\/h2>\n<ol><li>\nQ、K、V 分别是什么角色？查询、键、值。\n<\/li><li>\n为什么用点积打分？它便宜，且能衡量方向一致性。\n<\/li><li>\n为什么要除以 √d？防止维度大时 softmax 过尖、梯度消失。\n<\/li><li>\n多头解决什么？同时学习多种关系类型。\n<\/li><li>\n位置编码解决什么？注意力本身不分词序。\n<\/ol><\/div><\/details>", "kind": "concept", "title": "自注意力与 QKV"}, "c22": {"html": "<div class=\"source-badge\">📖 出处：hello-ai.pdf · p.79<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c21\">自注意力与 QKV<\/a><\/span><\/div><h1>Transformer 与位置编码<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：第 8 章：每个词都能看见其他词\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>Transformer 由自注意力、前馈网络、残差连接和归一化叠成；位置编码把词序补进机制。<\/p>\n<h2>为什么重要<\/h2>\n<p>GPT、Llama、Qwen、DeepSeek、Claude 在架构上都是它的变体。<\/p>\n<h2>详解<\/h2>\n<p>一个模块是：自注意力 + 残差与归一化，前馈网络 + 残差与归一化。复制几十份叠起来，前面接嵌入层，后面接输出层。注意力在词间搬运信息，前馈网络消化它，大部分参数和「知识」在前馈层。<\/p>\n<p>注意力本身不在乎顺序，位置编码把位置信息加进词向量，让「猫追狗」和「狗追猫」不同。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 Transformer 天生懂词序——顺序靠位置编码。\n<\/li><li>\n别以为参数均匀分布——大部分在前馈网络。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 8 章：每个词都能看见其他词<\/td><td>本章核心概念之一<\/td><td>Transformer 由自注意力、前馈网络、残差连接和归一化叠成；位置编码把词序补进机制。<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\nc21 自注意力与 QKV、c24 三阶段训练\n<\/ul>", "kind": "concept", "title": "Transformer 与位置编码"}, "c23": {"html": "<div class=\"source-badge\">📖 出处：hello-ai.pdf · p.79<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c22\">Transformer 与位置编码<\/a><\/span><\/div><h1>自回归生成与采样<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：第 8 章：每个词都能看见其他词\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>模型一次只预测一个 token，接回序列再预测下一个；温度、top-k、top-p 决定怎么选。<\/p>\n<h2>为什么重要<\/h2>\n<p>它解释为什么回答一个字一个字出现、为什么每次不一样、为什么会有怪话。<\/p>\n<h2>详解<\/h2>\n<p>生成是自回归的：给提示，算下一个 token 分布，选一个接上，再算下一个。五百字回答意味着几百次前向计算。文字逐个蹦出不是打字效果，是它真的一个一个算。<\/p>\n<p>贪心永远选最大概率，稳定但单调；温度采样按概率抽，低温接近贪心，高温更随机；top-k/top-p 限制候选范围。模型没有全局计划，结构感来自训练分布。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为模型先想好整段再写——它每步只决定下一个 token。\n<\/li><li>\n别以为温度越高越聪明——温度只改变随机性。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 8 章：每个词都能看见其他词<\/td><td>本章核心概念之一<\/td><td>模型一次只预测一个 token，接回序列再预测下一个；温度、top-k、top-p 决定怎么选。<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\nc21 自注意力、c27 幻觉\n<\/ul>", "kind": "concept", "title": "自回归生成与采样"}, "c24": {"html": "<div class=\"source-badge\">📖 出处：hello-ai.pdf · p.87<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c23\">自回归生成与采样<\/a><\/span><\/div><h1>预训练、SFT 与对齐<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：第 9 章：从续写机到助手\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>预训练学语言和世界，监督微调学对话格式，对齐按人类偏好调整取舍。<\/p>\n<h2>为什么重要<\/h2>\n<p>它解释基础模型为什么只会续写、助手为什么能回答和拒绝。<\/p>\n<h2>详解<\/h2>\n<p>预训练在几万亿 token 上预测下一个 token，产物是基础模型：懂世界，但只会续写。SFT 用几万条示范对话教格式和风格，改变主要是形式，不是知识。对齐用人类排序训练奖励模型，再用强化学习塑造行为。<\/p>\n<p>三个阶段之后，模型仍然是一个概率分布，只是被数据和偏好推向了某个方向。对齐可以被越狱，也会在边界外失效。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为微调能灌新知识——它主要改格式和风格。\n<\/li><li>\n别以为对齐是装道德模块——它是继续训练概率分布。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 9 章：从续写机到助手<\/td><td>本章核心概念之一<\/td><td>预训练学语言和世界，监督微调学对话格式，对齐按人类偏好调整取舍。<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\nc25 RLHF 与 DPO、c26 涌现与思维链\n<\/ul>", "kind": "concept", "title": "预训练、SFT 与对齐"}, "c25": {"html": "<div class=\"source-badge\">📖 出处：hello-ai.pdf · p.87<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c24\">预训练、SFT 与对齐<\/a><\/span><\/div><h1>RLHF 与 DPO<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 ｜ <strong>涉及章节<\/strong>：第 9 章：从续写机到助手\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>RLHF 用人类排序训练奖励模型，再用强化学习优化；DPO 直接把偏好对写成损失，绕开奖励模型。<\/p>\n<h2>为什么重要<\/h2>\n<p>它们决定助手「有帮助、诚实、无害」的取舍，也是理解对齐争议的入口。<\/p>\n<h2>详解<\/h2>\n<p>RLHF 让模型对同一问题生成几个回答，请人排序，训练奖励模型，再用强化学习让语言模型追求高分。难点是奖励模型会被讨好，模型学会写得更长、更啰嗦，而不是真的更好。<\/p>\n<p>DPO 把「A 胜过 B」直接写成损失，用梯度下降优化，更简单稳定，成为开源社区标准。两者目标相近，前沿实验室常并用。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为对齐有标准答案——偏好由标注者定义，有文化和价值观偏差。\n<\/li><li>\n别以为 DPO 一定优于 RLHF——工程更简单，但目标和数据仍有限。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 9 章：从续写机到助手<\/td><td>本章核心概念之一<\/td><td>RLHF 用人类排序训练奖励模型，再用强化学习优化；DPO 直接把偏好对写成损失，绕开奖励模型。<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\nc24 三阶段训练、c26 涌现与思维链\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（RLHF 与 DPO）<\/summary><div class=\"depth-body\"><h2>0. 先要解决什么<\/h2>\n<p>预训练模型只会续写。你问它问题，它可能续写出另一个问题；你让它帮忙，它可能帮你做有害的事。怎样让它按人的偏好回答？<\/p>\n<p>监督微调能教格式，但教不了「两个都不错的回答，哪个更好」。RLHF 和 DPO 就是处理这种偏好数据的两种方法。<\/p>\n<h2>1. 依赖链：奖励、策略、KL<\/h2>\n<p><strong>策略<\/strong>：语言模型本身，给定上下文，输出下一个 token 的概率分布。记作 <span class=\"katex-inline\">\\pi_\\theta(y\\mid x)<\/span>。<\/p>\n<p><strong>奖励<\/strong>：一个分数，衡量回答 <span class=\"katex-inline\">y<\/span> 有多好。RLHF 里由奖励模型 <span class=\"katex-inline\">r_\\phi(x,y)<\/span> 给出。<\/p>\n<p><strong>KL 散度<\/strong>：衡量两个概率分布差多远。训练时加一项 KL，防止新模型为了拿高分而偏离原模型太远，输出变得古怪。<\/p>\n<h2>2. RLHF 的三步<\/h2>\n<p><strong>第一步：收集偏好数据。<\/strong> 同一个问题，让模型生成几个回答，请人排序：A 比 B 好，B 比 C 好。<\/p>\n<p><strong>第二步：训练奖励模型。<\/strong> 把「A 胜过 B」变成分类问题：给 A 和 B 打分，让 <span class=\"katex-inline\">r(A)-r(B)<\/span> 为正。常用损失：<\/p>\n<div class=\"katex-block\">L_{\\text{reward}}=-\\log\\sigma\\left(r(x,y^+)-r(x,y^-)\\right)<\/div>\n<p><span class=\"katex-inline\">y^+<\/span> 是人偏好的回答，<span class=\"katex-inline\">y^-<\/span> 是被拒绝的。<span class=\"katex-inline\">\\sigma<\/span> 是 Sigmoid，差值越大，损失越小。<\/p>\n<p><strong>第三步：强化学习。<\/strong> 让语言模型生成回答，奖励模型打分，用 PPO 更新策略，让高分回答的概率上升。目标可以写成：<\/p>\n<div class=\"katex-block\">\\max_\\theta\\ \\mathbb{E}[r_\\phi(x,y)]-\\beta\\,\\mathrm{KL}\\left(\\pi_\\theta\\|\\pi_{\\text{ref}}\\right)<\/div>\n<p>第一项拿高分，第二项别跑太远。<span class=\"katex-inline\">\\beta<\/span> 控制两者的平衡。<\/p>\n<h2>3. 为什么会被「讨好」<\/h2>\n<p>奖励模型是人偏好的代理，不是偏好本身。模型会发现，某些表面特征能拿高分：写得更长、更啰嗦、开头说「当然可以」、列更多要点。<\/p>\n<p>这些特征在训练数据里可能确实被人偏爱，但它们不等于更好的回答。模型优化的是奖励模型的分数，不是人的真实满意度。这叫<strong>奖励破解<\/strong>。<\/p>\n<p>这和第三章强化学习里的奖励破解是同一个问题：你测什么，模型就优化什么，哪怕那不是你真正想要的。<\/p>\n<h2>4. DPO：把偏好直接写成损失<\/h2>\n<p>DPO 观察到：RLHF 的最优策略可以用偏好数据解析地表示，不需要单独训练奖励模型，也不需要 PPO。<\/p>\n<p>它直接优化：<\/p>\n<div class=\"katex-block\">L_{\\text{DPO}}=-\\log\\sigma\\left(\\beta\\log\\frac{\\pi_\\theta(y^+\\mid x)}{\\pi_{\\text{ref}}(y^+\\mid x)}-\\beta\\log\\frac{\\pi_\\theta(y^-\\mid x)}{\\pi_{\\text{ref}}(y^-\\mid x)}\\right)<\/div>\n<p>括号里是「新模型相对参考模型，对好回答的偏好提升」减去「对坏回答的偏好提升」。希望前者大、后者小。<\/p>\n<p>它用普通梯度下降，稳定、便宜，不需要奖励模型和强化学习。开源社区因此广泛采用。<\/p>\n<h2>5. 数值直觉<\/h2>\n<p>设 <span class=\"katex-inline\">\\beta=0.1<\/span>，参考模型对好、坏回答的概率都是 0.5。新模型对好回答概率 0.6，对坏回答 0.4。<\/p>\n<p>对数比：<\/p>\n<div class=\"katex-block\">\\log(0.6/0.5)=0.182,\\quad \\log(0.4/0.5)=-0.223<\/div>\n<p>差值：<span class=\"katex-inline\">0.1\\times(0.182-(-0.223))=0.0405<\/span>。Sigmoid 后约 0.51，损失约 0.67。梯度会把好回答概率再推高一点，坏回答再压低一点。<\/p>\n<h2>6. 对齐不是装道德模块<\/h2>\n<p>RLHF/DPO 改的是概率分布的形状，不是给模型加一个可读的规则库。所以：<\/p>\n<ul><li>\n它可以被<strong>越狱<\/strong>：换一种提示，把分布推回原来的方向。\n<\/li><li>\n它会在训练数据没覆盖的角落失效。\n<\/li><li>\n「人类偏好」由标注者定义，有文化、语言、价值观偏差。\n<\/ul>\n<p>对齐的三个目标「有帮助、诚实、无害」彼此有张力。永远拒绝的模型无害但没用；百分百顺从的模型有用但可能有害。RLHF 做的就是在这三者之间找位置，而位置由谁定，是最受争议的问题。<\/p>\n<h2>7. 反例：只优化「无害」会怎样<\/h2>\n<p>如果奖励模型极度惩罚任何风险，模型会学会拒绝一切敏感问题，包括合法的医学、法律、教育问题。用户觉得它没用，转去别处。这不是对齐成功，是目标太窄。<\/p>\n<p>反过来，只优化「有帮助」，模型会帮你做任何事，包括有害的事。所以三者必须同时约束。<\/p>\n<h2>8. 后文连接<\/h2>\n<p>对齐让模型更符合人类偏好，但也让校准变差：标注者偏爱肯定的语气，模型学会更自信。第十章会讲，这种自信和正确率脱节，是幻觉风险的一部分。<\/p>\n<h2>9. 差生自查<\/h2>\n<ol><li>\nRLHF 的三个阶段是什么？偏好数据、奖励模型、强化学习。\n<\/li><li>\n为什么要加 KL 项？防止模型为了高分偏离原分布太远。\n<\/li><li>\n奖励破解是什么？模型优化奖励模型的表面特征，而不是真实目标。\n<\/li><li>\nDPO 比 RLHF 简单在哪？不需要奖励模型和 PPO，直接优化偏好对。\n<\/li><li>\n对齐为什么不是装道德模块？它改的是概率分布，可以被越狱。\n<\/ol><\/div><\/details>", "kind": "concept", "title": "RLHF 与 DPO"}, "c26": {"html": "<div class=\"source-badge\">📖 出处：hello-ai.pdf · p.87<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c25\">RLHF 与 DPO<\/a><\/span><\/div><h1>涌现、思维链与推理模型<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：第 9 章：从续写机到助手\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>规模跨过门槛后某些能力突然出现，叫涌现；让模型写出步骤，等于给它草稿纸。<\/p>\n<h2>为什么重要<\/h2>\n<p>它解释为什么大模型会「突然会了」，以及为什么「先想一想」能提高可靠性。<\/p>\n<h2>详解<\/h2>\n<p>涌现是否真是突变有争议：换连续评分，曲线可能只是平滑上升。但「大到某个程度后能做以前做不了的事」是行业押注规模的理由。<\/p>\n<p>模型没有内部草稿纸，把中间步骤写进上下文，每一步都能看到前面的推理，这就是思维链。推理模型用强化学习奖励「先写过程、答案正确」，回答前自发生成大段思考，代价是慢和贵。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为涌现一定是突然开窍——可能是评估指标造成的假象。\n<\/li><li>\n别以为思考越长越准——推理也会跑偏，成本也更高。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 9 章：从续写机到助手<\/td><td>本章核心概念之一<\/td><td>规模跨过门槛后某些能力突然出现，叫涌现；让模型写出步骤，等于给它草稿纸。<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\nc05 规模定律、c24 三阶段训练\n<\/ul>", "kind": "concept", "title": "涌现、思维链与推理模型"}, "c27": {"html": "<div class=\"source-badge\">📖 出处：hello-ai.pdf · p.97<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c23\">自回归生成与采样<\/a><\/span><\/div><h1>幻觉<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 ｜ <strong>涉及章节<\/strong>：第 10 章：它为什么会一本正经地胡说\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>幻觉是模型以自信语气生成看似合理但不真实的内容，根源是训练目标只有「像」没有「真」。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是与 AI 共事时最常见的风险，尤其在事实、数字、引文、日期上。<\/p>\n<h2>详解<\/h2>\n<p>模型每步选「最像会出现在这里的 token」，不是「最真实的 token」。缺少知识时，最像的续写就是格式正确、语气自信的虚构。冷门话题、精确数字、引文、人名、条款、剂量最容易出问题。<\/p>\n<p>它不会被彻底消灭，但可以用检索、引用、允许说不知道、交叉验证和人工把关压低。语气自信和内容可靠没有稳定关系。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为幻觉是偶发 bug——它是续写方式的自然产物。\n<\/li><li>\n别以为语气自信就可靠——校准在对齐后常变差。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 10 章：它为什么会一本正经地胡说<\/td><td>本章核心概念之一<\/td><td>幻觉是模型以自信语气生成看似合理但不真实的内容，根源是训练目标只有「像」没有「真」。<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\nc28 RAG 与接地、c29 校准与提示注入\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（幻觉）<\/summary><div class=\"depth-body\"><h2>0. 先要解决什么<\/h2>\n<p>模型为什么会编造不存在的论文、判例、数字？为什么语气还那么自信？<\/p>\n<p>一句话：它的训练目标只奖励「像会出现在这里的词」，没有「真」这个变量。这一节把这个机制拆开，再讲哪些办法能压低它、为什么压不死。<\/p>\n<h2>1. 依赖链：条件概率、最大似然、校准<\/h2>\n<p><strong>条件概率<\/strong>：给定前文 <span class=\"katex-inline\">x_{&lt;t}<\/span>，模型给下一个 token <span class=\"katex-inline\">x_t<\/span> 一个概率：<\/p>\n<div class=\"katex-block\">P(x_t\\mid x_{&lt;t};\\theta)<\/div>\n<p><strong>最大似然<\/strong>：训练就是让训练语料里真实出现的下一个 token 概率更高。损失是负对数似然：<\/p>\n<div class=\"katex-block\">L=-\\sum_t\\log P(x_t\\mid x_{&lt;t};\\theta)<\/div>\n<p>这个目标只关心「训练文本里下一个词是什么」，不关心「这个陈述是否符合世界」。<\/p>\n<p><strong>校准<\/strong>：模型说「80% 把握」时，实际正确率是否约 80%。校准好，语气才有信息量；校准差，自信就是噪声。<\/p>\n<h2>2. 幻觉怎样产生<\/h2>\n<p>假设模型被问：「2023 年某篇论文的 DOI 是多少？」<\/p>\n<p>训练语料里没有这篇论文，或没有精确编号。模型见过大量「论文标题 + 作者 + DOI」的格式，知道 DOI 通常长什么样。它每一步选最像会出现在这里的 token，于是生成一个格式完美、但不存在的编号。<\/p>\n<p>这不是它「故意骗人」，而是它的目标函数里没有「不知道就说不知道」这一项。除非训练数据里明确教过「承认边界」，否则「编一个像样的」在概率上更划算。<\/p>\n<h2>3. 四种常见幻觉<\/h2>\n<ul><li>\n<strong>事实编造<\/strong>：不存在的书名、判例、论文、人物。\n<\/li><li>\n<strong>数字错误<\/strong>：年份、剂量、统计值、价格。\n<\/li><li>\n<strong>张冠李戴<\/strong>：把 A 的观点安到 B 头上。\n<\/li><li>\n<strong>逻辑自洽的虚构<\/strong>：整段推理看起来严密，前提是编的。\n<\/ul>\n<p>冷门话题、精确细节、训练截止之后的事件，风险最高。因为模型没有足够证据，只能靠格式和共现去猜。<\/p>\n<h2>4. RAG 为什么有用，但不彻底<\/h2>\n<p>RAG 把问题变成向量，从资料库找相关段落，放进上下文：<\/p>\n<div class=\"katex-block\">P(y\\mid x)\\to P(y\\mid x,\\text{retrieved context})<\/div>\n<p>模型现在看着材料回答，依据从「模糊记忆」变成「眼前文本」，编造空间大减。<\/p>\n<p>但它有三个漏洞：<\/p>\n<ol><li>\n<strong>检索漏了<\/strong>：资料库没有，或相似度没找到。\n<\/li><li>\n<strong>检索错了<\/strong>：找到相关但不支持结论的段落。\n<\/li><li>\n<strong>模型误读<\/strong>：材料里有，模型看错、拼错、总结错。\n<\/ol>\n<p>所以 RAG 降低概率，不提供保证。接地（要求引用、链接、工具返回）让错误更容易被发现，但引用本身也要检查。<\/p>\n<h2>5. 校准为什么会变差<\/h2>\n<p>预训练时，模型学的是语料里的频率，校准通常不错。对齐时，人给回答排序，往往偏爱肯定、流畅、有把握的语气。模型学会更自信，但正确率没同步提高，校准就变差。<\/p>\n<p>实用推论：<strong>把语气当噪声，把多次回答的一致性当信号<\/strong>。同一个问题问三遍，答案一致的部分更可信；每次都不一样的地方，多半是模型在猜。<\/p>\n<h2>6. 五种应对<\/h2>\n<ul><li>\n<strong>检索<\/strong>：给材料，别让它凭记忆。\n<\/li><li>\n<strong>引用<\/strong>：要求来源、页码、链接，给不出就标记未验证。\n<\/li><li>\n<strong>允许说不知道<\/strong>：提示里明确写「不确定就说不确定」，并在训练数据里教。\n<\/li><li>\n<strong>交叉验证<\/strong>：关键事实查原始来源，不只看模型的自述。\n<\/li><li>\n<strong>人工把关<\/strong>：签字、发布、用药、法律意见，必须有人复核。\n<\/ul>\n<h2>7. 反例：为什么「更大模型」不能消灭幻觉<\/h2>\n<p>更大的模型知识更多、模式更强，但目标没变：仍然是预测下一个 token。它可能编得更像、更少被识破，而不是更少编。规模降低的是「因无知而犯错」的概率，不改变「优化像而不是真」的结构。<\/p>\n<p>真正的解法在系统层：检索、工具、引用、校准、人。模型本身不是事实数据库。<\/p>\n<h2>8. 后文连接<\/h2>\n<p>幻觉是「生成」能力的反面；智能体时代，幻觉不只是文字错误，还可能变成错误行动。所以第十二章要讲权限、沙盒、人在回路：不让一个可能编造的判断直接产生不可逆后果。<\/p>\n<h2>9. 差生自查<\/h2>\n<ol><li>\n训练目标里为什么没有「真」？它是最大似然，只匹配训练文本的下一个 token。\n<\/li><li>\n幻觉为什么在冷门话题更多？训练证据少，模型只能靠格式和共现猜。\n<\/li><li>\nRAG 的三个漏洞是什么？检索漏、检索错、模型误读。\n<\/li><li>\n校准变差为什么危险？自信不再对应正确。\n<\/li><li>\n为什么更大模型不能消灭幻觉？目标函数没变，只是编得更像。\n<\/ol><\/div><\/details>", "kind": "concept", "title": "幻觉"}, "c28": {"html": "<div class=\"source-badge\">📖 出处：hello-ai.pdf · p.97<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c27\">幻觉<\/a><\/span><\/div><h1>RAG 与接地<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：第 10 章：它为什么会一本正经地胡说\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>RAG 回答前先检索可信资料，把相关段落放进上下文；接地要求陈述有可追溯依据。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把「凭记忆答」改成「看着材料答」，是企业知识库和事实问答的常用方案。<\/p>\n<h2>详解<\/h2>\n<p>步骤是：问题变成向量，从资料库找最近段落，放进上下文，让模型基于材料回答。检索依据从模糊的训练印象变成眼前文本，编造空间大减。<\/p>\n<p>它不能完全消除幻觉：检索可能漏、可能错、模型可能误读。接地更进一步，要求引用、链接或工具返回结果；给不出依据的陈述按未验证处理。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为接了知识库就不会幻觉——检索也会错。\n<\/li><li>\n别以为有引用就一定真——要检查引用本身是否存在、是否支持结论。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 10 章：它为什么会一本正经地胡说<\/td><td>本章核心概念之一<\/td><td>RAG 回答前先检索可信资料，把相关段落放进上下文；接地要求陈述有可追溯依据。<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\nc27 幻觉、c20 词向量与嵌入\n<\/ul>", "kind": "concept", "title": "RAG 与接地"}, "c29": {"html": "<div class=\"source-badge\">📖 出处：hello-ai.pdf · p.97<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c27\">幻觉<\/a><\/span><\/div><h1>校准与提示注入<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：第 10 章：它为什么会一本正经地胡说\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>校准是模型表达的把握和实际正确率是否一致；提示注入是外部内容里藏着给模型的指令。<\/p>\n<h2>为什么重要<\/h2>\n<p>前者决定你能不能信「它说很可能」，后者决定智能体是否会被文件、网页、邮件指挥。<\/p>\n<h2>详解<\/h2>\n<p>基础模型的校准通常不错，对齐后常变差，因为标注者偏爱肯定的语气。于是自信不再对应正确。实用建议：把语气当噪声，把多次回答的一致性当信号。<\/p>\n<p>提示注入是模型读取的外部内容里藏指令，模型难以区分它和用户指令。聊天时代最坏是错误文字，智能体时代可能是泄露数据或执行危险操作。靠最小权限、内容隔离、人工确认降低风险。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为模型说「很可能」就是很可能——校准会变差。\n<\/li><li>\n别以为文件内容只是资料——它可能带着指挥模型的句子。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 10 章：它为什么会一本正经地胡说<\/td><td>本章核心概念之一<\/td><td>校准是模型表达的把握和实际正确率是否一致；提示注入是外部内容里藏着给模型的指令。<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\nc27 幻觉、c34 权限与人在回路\n<\/ul>", "kind": "concept", "title": "校准与提示注入"}, "c30": {"html": "<div class=\"source-badge\">📖 出处：hello-ai.pdf · p.105<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c22\">Transformer 与位置编码<\/a><\/span><\/div><h1>多模态<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：第 11 章：模型长出了眼睛和手\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>多模态把图像、音频也切成 token，和文字一起送进同一个 Transformer。<\/p>\n<h2>为什么重要<\/h2>\n<p>它让模型能看图、听声、画画、说话，是把语言能力扩展到现实输入的关键。<\/p>\n<h2>详解<\/h2>\n<p>图像切成小方块，每块变成向量；音频切成时间片；文字本来就是 token。它们进入同一空间，靠注意力互相对齐。原生多模态从预训练起一起学，比外挂式「先转文字描述」保留更多信息。<\/p>\n<p>代价是数据和算力更贵，也更难评估：图像里的空间关系、语气里的情绪，不是文字能完全替代的。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为多模态是加一个图片插件——原生多模态从预训练就一起学。\n<\/li><li>\n别以为模型真的「看见」了——它处理的是 patch 向量。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 11 章：模型长出了眼睛和手<\/td><td>本章核心概念之一<\/td><td>多模态把图像、音频也切成 token，和文字一起送进同一个 Transformer。<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\nc31 扩散模型、c32 工具调用与智能体\n<\/ul>", "kind": "concept", "title": "多模态"}, "c31": {"html": "<div class=\"source-badge\">📖 出处：hello-ai.pdf · p.105<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c30\">多模态<\/a><\/span><\/div><h1>扩散模型<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 ｜ <strong>涉及章节<\/strong>：第 11 章：模型长出了眼睛和手\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>扩散模型训练时给清晰图逐步加噪，学从更噪恢复更清晰；生成时从纯噪声反复去噪。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是今天图像和视频生成的主流，理解它才能判断生成图为什么会细节出错。<\/p>\n<h2>详解<\/h2>\n<p>训练时对清晰图加不同强度的噪声，让网络学会预测噪声或恢复清晰图；生成时从纯噪声出发，反复应用几十次去噪，文字提示通过注意力引导方向。<\/p>\n<p>它不是从数据库拼贴，而是在噪声里一步步雕刻新图。它优化「看起来像」，不是「物理上正确」，所以手指、文字、反光、物理关系常出错。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为扩散模型在搜图拼贴——它是从噪声生成。\n<\/li><li>\n别以为生成图逼真就物理正确——它优化外观，不保证物理。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 11 章：模型长出了眼睛和手<\/td><td>本章核心概念之一<\/td><td>扩散模型训练时给清晰图逐步加噪，学从更噪恢复更清晰；生成时从纯噪声反复去噪。<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\nc30 多模态、c27 幻觉\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（扩散模型）<\/summary><div class=\"depth-body\"><h2>0. 先要解决什么<\/h2>\n<p>扩散模型怎样从一团随机噪声里「雕刻」出一张图？为什么它生成的图细节常错，却看起来非常真实？<\/p>\n<p>核心是一个概率过程：训练时学会「加噪后的图怎样回到更清晰」，生成时把这个过程反过来走。<\/p>\n<h2>1. 依赖链：高斯噪声、条件概率、去噪<\/h2>\n<p><strong>高斯噪声<\/strong>：从正态分布采样的随机数。给图加噪，就是每个像素加一点随机值。<\/p>\n<p><strong>条件概率<\/strong>：给定带噪图 <span class=\"katex-inline\">x_t<\/span> 和时间步 <span class=\"katex-inline\">t<\/span>，清晰图 <span class=\"katex-inline\">x_0<\/span> 的分布 <span class=\"katex-inline\">p(x_0\\mid x_t)<\/span>。<\/p>\n<p><strong>去噪<\/strong>：从 <span class=\"katex-inline\">x_t<\/span> 估计 <span class=\"katex-inline\">x_{t-1}<\/span> 或直接估计 <span class=\"katex-inline\">x_0<\/span>，反复应用。<\/p>\n<h2>2. 前向过程：逐步加噪<\/h2>\n<p>设 <span class=\"katex-inline\">x_0<\/span> 是清晰图，按固定日程加噪：<\/p>\n<div class=\"katex-block\">x_t=\\sqrt{\\alpha_t}x_0+\\sqrt{1-\\alpha_t}\\epsilon,\\quad \\epsilon\\sim\\mathcal{N}(0,I)<\/div>\n<p><span class=\"katex-inline\">\\alpha_t<\/span> 从接近 1 逐步降到接近 0。<span class=\"katex-inline\">t<\/span> 越大，图越像纯噪声。这个公式让任意时刻 <span class=\"katex-inline\">x_t<\/span> 可以直接从 <span class=\"katex-inline\">x_0<\/span> 采样，不需要一步步加。<\/p>\n<h2>3. 反向过程：学会去噪<\/h2>\n<p>训练一个网络 <span class=\"katex-inline\">\\epsilon_\\theta(x_t,t)<\/span>，给它带噪图和时间步，预测被加进去的噪声 <span class=\"katex-inline\">\\epsilon<\/span>。损失：<\/p>\n<div class=\"katex-block\">L=\\mathbb{E}_{x_0,\\epsilon,t}\\left[\\|\\epsilon-\\epsilon_\\theta(x_t,t)\\|^2\\right]<\/div>\n<p>这很巧妙：网络不需要知道「清晰图长什么样」，只需要猜「加了什么噪声」。猜出噪声，减去它，就得到更清晰的图。<\/p>\n<h2>4. 生成：从纯噪声开始<\/h2>\n<p>从 <span class=\"katex-inline\">x_T\\sim\\mathcal{N}(0,I)<\/span> 开始，对 <span class=\"katex-inline\">t=T,T-1,\\dots,1<\/span>：<\/p>\n<div class=\"katex-block\">x_{t-1}=\\frac{1}{\\sqrt{\\alpha_t}}\\left(x_t-\\frac{1-\\alpha_t}{\\sqrt{1-\\bar\\alpha_t}}\\epsilon_\\theta(x_t,t)\\right)+\\sigma_t z<\/div>\n<p>这是采样公式的一种写法。前半段减去预测噪声，后半段加一点随机扰动。每一步都更清晰一点，几十步后得到图。<\/p>\n<h2>5. 文字怎样控制生成<\/h2>\n<p>文字提示经过编码器变成向量 <span class=\"katex-inline\">c<\/span>，去噪网络除了看 <span class=\"katex-inline\">x_t<\/span> 和 <span class=\"katex-inline\">t<\/span>，还看 <span class=\"katex-inline\">c<\/span>：<\/p>\n<div class=\"katex-block\">\\epsilon_\\theta(x_t,t,c)<\/div>\n<p>训练时随机丢弃 <span class=\"katex-inline\">c<\/span>，让网络同时学会「有提示」和「无提示」。生成时用<strong>无分类器引导<\/strong>放大提示的影响：<\/p>\n<div class=\"katex-block\">\\tilde\\epsilon=\\epsilon_\\theta(x_t,t,\\varnothing)+s\\left(\\epsilon_\\theta(x_t,t,c)-\\epsilon_\\theta(x_t,t,\\varnothing)\\right)<\/div>\n<p><span class=\"katex-inline\">s&gt;1<\/span> 让图更贴合提示，但太大会过饱和、细节僵硬。<\/p>\n<h2>6. 数值直觉<\/h2>\n<p>设 <span class=\"katex-inline\">\\alpha_t=0.9<\/span>，<span class=\"katex-inline\">x_0=1<\/span>，噪声 <span class=\"katex-inline\">\\epsilon=0.5<\/span>：<\/p>\n<div class=\"katex-block\">x_t=\\sqrt{0.9}\\times1+\\sqrt{0.1}\\times0.5\\approx0.949+0.158=1.107<\/div>\n<p>去噪网络若准确预测 <span class=\"katex-inline\">\\epsilon=0.5<\/span>，代回去就能恢复接近 1。实际网络有误差，每一步都留一点偏差，累积起来就是细节错误。<\/p>\n<h2>7. 为什么细节会错<\/h2>\n<p>扩散模型优化的是「看起来像训练数据分布」，不是「物理正确」。它没有显式的三维模型、重力、材质、手部骨骼约束。<\/p>\n<p>所以手指数量、文字拼写、镜面反射、物体遮挡、物理因果常出错。图越逼真，人越容易忽略这些错误。判断生成图，不能只看整体像不像，要看关键细节是否自洽。<\/p>\n<h2>8. 反例：步数太少<\/h2>\n<p>从纯噪声只走 5 步，每步跨度太大，去噪网络近似误差累积，结果模糊或结构崩坏。步数多，质量好，但采样慢。蒸馏、快速采样器就是在这两者之间取平衡。<\/p>\n<h2>9. 后文连接<\/h2>\n<p>扩散模型是多模态生成的主力；它和语言模型一样，优化「像」而不是「真」，所以也会产生「幻觉图」。第十三章的 AlphaFold 则用另一条路：预测结构，并用置信度标出哪里不可靠。<\/p>\n<h2>10. 差生自查<\/h2>\n<ol><li>\n前向过程做什么？逐步给清晰图加高斯噪声。\n<\/li><li>\n网络预测什么？被加进去的噪声。\n<\/li><li>\n生成从哪里开始？纯噪声，逐步去噪。\n<\/li><li>\n文字提示怎样生效？作为条件输入，并用无分类器引导放大。\n<\/li><li>\n为什么细节会错？它优化外观分布，不保证物理正确。\n<\/ol><\/div><\/details>", "kind": "concept", "title": "扩散模型"}, "c32": {"html": "<div class=\"source-badge\">📖 出处：hello-ai.pdf · p.105<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c30\">多模态<\/a><\/span><\/div><h1>工具调用与智能体<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：第 11 章：模型长出了眼睛和手\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>工具调用让模型输出特殊格式触发程序执行；把模型放进循环，就得到能多步行动的智能体。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把模型从「会说」变成「会做」，也带来权限、验证和责任的新问题。<\/p>\n<h2>详解<\/h2>\n<p>约定某些输出不是给人看，而是触发搜索、计算、查数据库、写文件。结果贴回上下文，模型继续推理。MCP 用统一格式描述工具，让任何工具接任何模型。<\/p>\n<p>智能体循环是：目标与工具、模型思考、调用工具、看结果、继续或完成。编程智能体最先成熟，因为代码可编译、可测试、反馈清晰。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为工具调用只是插件——它是模型输出到真实行动的接口。\n<\/li><li>\n别以为智能体越多越好——协调有成本，错误会累积。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 11 章：模型长出了眼睛和手<\/td><td>本章核心概念之一<\/td><td>工具调用让模型输出特殊格式触发程序执行；把模型放进循环，就得到能多步行动的智能体。<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\nc33 驾具与智能体循环、c34 权限与人在回路\n<\/ul>", "kind": "concept", "title": "工具调用与智能体"}, "c33": {"html": "<div class=\"source-badge\">📖 出处：hello-ai.pdf · p.114<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c32\">工具调用与智能体<\/a><\/span><\/div><h1>驾具与智能体循环<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 ｜ <strong>涉及章节<\/strong>：第 12 章：智能体的一天\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>驾具是模型外面的整套程序：组装上下文、执行工具、管权限、压缩上下文、验证与交付。<\/p>\n<h2>为什么重要<\/h2>\n<p>智能体的可靠性一大半不在模型，而在驾具；同一个模型配不同驾具，表现能差一个档。<\/p>\n<h2>详解<\/h2>\n<p>模型只负责决定下一步，驾具负责让行动发生并受控。循环包括组装上下文、调用模型、检查权限、执行工具、压缩、派子智能体、验证、交付。一个二十分钟的任务可能转一百多圈。<\/p>\n<p>系统提示、指令文件、权限策略、沙盒、钩子、MCP、记忆、技能，都是驾具零件。失败模式如「说做完了其实没做完」「改测试通过」「越界」「失忆」，多数对应驾具设计。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为智能体靠模型聪明就够了——长任务靠驾具工程。\n<\/li><li>\n别以为模型说完成就是完成——必须独立验证。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 12 章：智能体的一天<\/td><td>本章核心概念之一<\/td><td>驾具是模型外面的整套程序：组装上下文、执行工具、管权限、压缩上下文、验证与交付。<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\nc32 工具调用与智能体、c34 权限与人在回路\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（驾具与智能体循环）<\/summary><div class=\"depth-body\"><h2>0. 先要解决什么<\/h2>\n<p>同一个模型，放进不同的智能体框架，表现能差一个档。为什么？因为长任务不是「一次回答」，而是「一百次行动 + 上下文管理 + 权限 + 验证」。<\/p>\n<p>这一节拆开智能体循环，说明可靠性为什么主要落在模型外面的驾具（harness）上。<\/p>\n<h2>1. 依赖链：上下文、工具、循环<\/h2>\n<p><strong>上下文<\/strong>：模型每次只能看到窗口内的内容。长任务的历史会超出窗口。<\/p>\n<p><strong>工具<\/strong>：模型输出特殊格式，触发外部程序执行，结果再贴回上下文。<\/p>\n<p><strong>循环<\/strong>：模型决定下一步 → 执行 → 观察结果 → 再决定，直到完成或失败。<\/p>\n<h2>2. 一次循环的形式<\/h2>\n<pre><code>while not done:\n    context = assemble(goal, history, files, tool_results)\n    action = model(context)\n    if action is tool_call:\n        check_permission(action)\n        result = execute(action)\n        history.append(result)\n    elif action is final:\n        verify(result)\n        deliver(result)<\/code><\/pre>\n<p>模型只负责 <code>action = model(context)<\/code> 这一行。其余全是驾具：组装、权限、执行、压缩、验证、交付。<\/p>\n<h2>3. 为什么可靠性在驾具<\/h2>\n<p>长任务会转几十到上百圈。每一圈模型都可能犯错：理解偏、选错工具、漏看结果、重复劳动、提前宣布完成。<\/p>\n<p>驾具的作用：<\/p>\n<ul><li>\n<strong>组装<\/strong>：把目标、约束、相关文件、工具说明放在上下文里，减少模型「不知道」。\n<\/li><li>\n<strong>压缩<\/strong>：历史太长时摘要或裁剪，防止失忆。\n<\/li><li>\n<strong>权限<\/strong>：危险操作先检查，不可逆操作要人批。\n<\/li><li>\n<strong>验证<\/strong>：模型说完成，驾具独立检查产物是否存在、测试是否通过。\n<\/li><li>\n<strong>交付<\/strong>：把结果放到用户能看到的位置，而不是留在临时目录。\n<\/ul>\n<h2>4. 常见失败模式<\/h2>\n<ul><li>\n<strong>假完成<\/strong>：模型说「已完成」，实际没写文件、没跑测试。\n<\/li><li>\n<strong>改测试通过<\/strong>：测试失败，模型改测试而不是改代码。\n<\/li><li>\n<strong>越界<\/strong>：为了完成任务，读取或修改不该碰的文件。\n<\/li><li>\n<strong>失忆<\/strong>：长任务中忘记最初约束。\n<\/li><li>\n<strong>上下文污染<\/strong>：工具返回的网页里藏着指令，模型照着执行。\n<\/li><li>\n<strong>循环<\/strong>：同一个动作反复做，没有进展。\n<\/ul>\n<p>这些都不是「模型不够聪明」能解释的，需要驾具设计：独立验证、权限隔离、进度记录、最大轮数、人工检查点。<\/p>\n<h2>5. 数值直觉：错误累积<\/h2>\n<p>设单步成功率 0.98，任务需要 50 步，独立近似：<\/p>\n<div class=\"katex-block\">0.98^{50}\\approx0.364<\/div>\n<p>只有 36% 的任务完整成功。若驾具能在每 10 步做一次验证并纠正，有效步数降到 5 次关键决策，成功率约 <span class=\"katex-inline\">0.98^5\\approx0.904<\/span>。<\/p>\n<p>这就是为什么「会验证的智能体」比「更聪明的模型」更重要：它把错误在累积前截断。<\/p>\n<h2>6. 权限与人在回路<\/h2>\n<p>智能体的行动有后果。三道安全带：<\/p>\n<ol><li>\n<strong>最小权限<\/strong>：只给必需的工具和范围。\n<\/li><li>\n<strong>沙盒<\/strong>：隔离文件系统、网络、凭据，损害被圈住。\n<\/li><li>\n<strong>人在回路<\/strong>：不可逆操作（删除、转账、发布、部署）必须人批。\n<\/ol>\n<p>这不是不信任 AI，而是承认 AI 不承担责任。最后签字的人，必须是人。<\/p>\n<h2>7. 反例：给智能体全部权限<\/h2>\n<p>一个「帮你整理电脑」的智能体，拿到读写整个 home 目录的权限。它读到一封邮件，邮件正文写着「删除所有旧文件以释放空间」，它照做。提示注入 + 过大权限 = 真实数据损失。<\/p>\n<p>正确做法：只给任务目录、删除前列清单、删除要确认、操作可回滚。<\/p>\n<h2>8. 后文连接<\/h2>\n<p>驾具负责流程，权限负责边界；第十三章把同样的思路带到科学：AI 可以预测、可以筛候选，但实验验证和机制解释仍由人负责。<\/p>\n<h2>9. 差生自查<\/h2>\n<ol><li>\n智能体循环的五个环节？组装上下文、模型决策、权限检查、执行工具、验证交付。\n<\/li><li>\n为什么可靠性在驾具？长任务错误会累积，驾具负责截断和纠正。\n<\/li><li>\n假完成怎样防？独立验证产物，不信模型自述。\n<\/li><li>\n三道安全带是什么？最小权限、沙盒、人在回路。\n<\/li><li>\n50 步 0.98 成功率大概多少？约 36%，说明长任务必须靠验证和纠错。\n<\/ol><\/div><\/details>", "kind": "concept", "title": "驾具与智能体循环"}, "c34": {"html": "<div class=\"source-badge\">📖 出处：hello-ai.pdf · p.114<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c33\">驾具与智能体循环<\/a><\/span><\/div><h1>权限、沙盒与人在回路<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：第 12 章：智能体的一天\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>智能体的三道安全带：最小权限、隔离沙盒、不可逆操作由人批准。<\/p>\n<h2>为什么重要<\/h2>\n<p>智能体会执行有后果的行动；没有这三道约束，一次提示注入就可能造成真实损害。<\/p>\n<h2>详解<\/h2>\n<p>最小权限是只给完成任务必需的权限，能读就不给写。沙盒把执行限制在隔离的文件系统、网络和权限里，损害被圈住。人在回路是可逆的自动做、不可逆的先问。<\/p>\n<p>部署、删除、转账、发送这类操作必须人工确认。这不是技术细节，而是「AI 不承担责任」在流程上的体现：最后要有一个人负责。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为权限越多效率越高——权限越多，注入和误操作的损害越大。\n<\/li><li>\n别以为沙盒能解决一切——它限制损害，不替代验证和责任。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 12 章：智能体的一天<\/td><td>本章核心概念之一<\/td><td>智能体的三道安全带：最小权限、隔离沙盒、不可逆操作由人批准。<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\nc33 驾具与智能体循环、c29 提示注入\n<\/ul>", "kind": "concept", "title": "权限、沙盒与人在回路"}, "c35": {"html": "<div class=\"source-badge\">📖 出处：hello-ai.pdf · p.130<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c22\">Transformer 与位置编码<\/a><\/span><\/div><h1>AlphaFold 与 AI 做科学<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 ｜ <strong>涉及章节<\/strong>：第 13 章：AI 做科学：从 AlphaFold 说起\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>AlphaFold 把氨基酸序列到三维结构变成监督学习，用注意力提取进化信息，并给出置信度。<\/p>\n<h2>为什么重要<\/h2>\n<p>它证明 AI 能加速基础科学，也划出了「预测结构」与「理解机制」的边界。<\/p>\n<h2>详解<\/h2>\n<p>输入氨基酸序列，输出每个原子的三维坐标；训练数据是已知蛋白质结构。网络用注意力对齐远距离位置，从多序列比对中提取进化信息，最后输出坐标和每个残基的置信度。<\/p>\n<p>它把结构预测从几年实验变成几分钟计算，但预测的是静态结构，不解决动态构象、分子结合、功能机制。AI 做科学最顺的条件是：数据多、目标明确、答案可实验检验。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 AlphaFold 解决了蛋白质折叠全部问题——它主要解决静态单体结构。\n<\/li><li>\n别以为预测准确就能替代实验——还要看校准、适用范围和机制解释。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 13 章：AI 做科学：从 AlphaFold 说起<\/td><td>本章核心概念之一<\/td><td>AlphaFold 把氨基酸序列到三维结构变成监督学习，用注意力提取进化信息，并给出置信度。<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\nc36 AI 做科学的三个条件、c13 泛化与过拟合\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（AlphaFold 与 AI 做科学）<\/summary><div class=\"depth-body\"><h2>0. 先要解决什么<\/h2>\n<p>蛋白质由氨基酸链组成，链会折叠成三维结构，结构决定功能。实验测定结构要几个月到几年，而序列已知、结构未知的蛋白质有数亿个。<\/p>\n<p>AlphaFold 要解决：只看氨基酸序列，能不能预测出三维结构？能到什么精度？哪里不可靠？<\/p>\n<h2>1. 依赖链：序列、结构、多序列比对<\/h2>\n<p><strong>氨基酸序列<\/strong>：20 种氨基酸排成一条链，像一串字母。<\/p>\n<p><strong>三维结构<\/strong>：链在空间里折叠，每个原子有坐标 <span class=\"katex-inline\">(x,y,z)<\/span>。<\/p>\n<p><strong>多序列比对（MSA）<\/strong>：把同源蛋白的序列对齐。不同物种里保持不变的位点，通常对结构重要；两个位点若总是协同变化，可能在空间上接触。MSA 因此携带进化信息。<\/p>\n<h2>2. 问题形式化<\/h2>\n<p>输入序列 <span class=\"katex-inline\">s=(s_1,\\dots,s_L)<\/span>，输出每个残基的坐标：<\/p>\n<div class=\"katex-block\">\\hat X=(\\hat x_1,\\dots,\\hat x_L),\\quad \\hat x_i\\in\\mathbb{R}^3<\/div>\n<p>训练数据是已知结构的蛋白质。损失比较预测坐标和真实坐标，常用距离误差或对齐后的误差。<\/p>\n<p>这是<strong>监督学习<\/strong>：有输入、有标签、有明确目标。不是强化学习，也不是无监督发现。<\/p>\n<h2>3. 网络怎样利用进化信息<\/h2>\n<p>AlphaFold 2 的关键是注意力：对每个残基，用 MSA 里其他序列的信息更新表示，再用残基对之间的注意力推断「谁和谁在空间上接近」。<\/p>\n<p>可以粗略写成：<\/p>\n<div class=\"katex-block\">h_i^{(l+1)}=\\mathrm{Update}\\left(h_i^{(l)},\\ \\mathrm{Attend}(h_i^{(l)},\\{h_j^{(l)}\\},\\ \\mathrm{MSA}_i)\\right)<\/div>\n<p>它同时看「同一位点在别的物种里是什么」和「其他位点与我的关系」。这让它在序列上相隔很远、空间上却相邻的残基之间建立联系。<\/p>\n<h2>4. 输出与置信度<\/h2>\n<p>网络输出坐标，还输出每个残基的置信度（pLDDT）和残基对之间的距离置信度（PAE）。置信度让使用者知道哪一段可信、哪一段是猜的。<\/p>\n<p>这比「只给结构」重要：实验科学家可以根据置信度决定哪些区域要再做实验。<\/p>\n<h2>5. 数值直觉：精度意味着什么<\/h2>\n<p>蛋白质里相邻氨基酸的距离约 0.38 纳米。若预测的平均误差在 1 纳米以内，整体折叠大致正确；若某段误差 3 纳米以上，那段可能完全错位。<\/p>\n<p>AlphaFold 在多数单链蛋白上达到实验级别精度，但对多蛋白复合物、动态构象、配体结合、突变影响，表现下降。它预测的是静态结构，不是运动。<\/p>\n<h2>6. 为什么它是监督学习<\/h2>\n<ul><li>\n有明确标签：实验测定的结构。\n<\/li><li>\n有明确损失：坐标误差。\n<\/li><li>\n有训练集和测试集：已知结构蛋白。\n<\/li><li>\n泛化边界：对新蛋白、复杂复合物、动态状态，精度下降。\n<\/ul>\n<p>它没有「自己发现物理规律」，而是从大量结构中学会了序列—结构映射的统计规律。这个定位很重要，能防止把 AI 神化。<\/p>\n<h2>7. 它没有解决什么<\/h2>\n<ul><li>\n<strong>动态<\/strong>：蛋白质会运动、开合、变构，静态结构只是一帧。\n<\/li><li>\n<strong>复合物<\/strong>：多个蛋白怎么结合，界面怎么形成。\n<\/li><li>\n<strong>配体<\/strong>：小分子、药物、离子怎么结合。\n<\/li><li>\n<strong>功能<\/strong>：结构给出线索，但功能要靠实验和机制研究。\n<\/li><li>\n<strong>突变<\/strong>：一个氨基酸改变会怎样影响结构和功能。\n<\/ul>\n<p>这些正是后续研究的方向，也是「AI 加速科学」而不是「AI 替代科学」的边界。<\/p>\n<h2>8. 反例：把高置信度当万能<\/h2>\n<p>某段结构 pLDDT 很高，只说明网络对那段有信心，不说明那段在真实细胞里一定那样。构象受环境、修饰、结合伙伴影响。置信度是模型内部信号，不是实验证据。<\/p>\n<p>正确用法：把预测当假设，用实验验证关键区域；把置信度当筛选工具，不是结论。<\/p>\n<h2>9. 后文连接<\/h2>\n<p>AlphaFold 是「数据多、目标明确、答案可验」的典型；AI 做科学要同时满足这三个条件。到了第十四章，同样的判断落到人机分工：AI 铺广度，人负责判断、验证和责任。<\/p>\n<h2>10. 差生自查<\/h2>\n<ol><li>\nAlphaFold 的输入输出是什么？氨基酸序列 → 三维坐标。\n<\/li><li>\n它为什么是监督学习？有实验结构作标签，有坐标损失。\n<\/li><li>\nMSA 为什么有用？它携带进化保守和协同变化信息。\n<\/li><li>\n它没有解决什么？动态、复合物、配体、功能、突变。\n<\/li><li>\n置信度高等于结构一定正确吗？不等于，它只是模型内部信号。\n<\/ol><\/div><\/details>", "kind": "concept", "title": "AlphaFold 与 AI 做科学"}, "c36": {"html": "<div class=\"source-badge\">📖 出处：hello-ai.pdf · p.130<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c35\">AlphaFold 与 AI 做科学<\/a><\/span><\/div><h1>AI 做科学的三个条件<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：第 13 章：AI 做科学：从 AlphaFold 说起\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>数据多、目标明确、答案能被实验检验，是 AI 在科学里最容易成功的三个条件。<\/p>\n<h2>为什么重要<\/h2>\n<p>它帮你判断一个「AI for Science」项目是真实加速，还是把普通拟合包装成突破。<\/p>\n<h2>详解<\/h2>\n<p>AlphaFold 有蛋白质序列和结构数据库，有明确的坐标预测目标，有实验结构可以检验。气象、材料、定理证明也有类似结构：大量观测、明确预测、可验证。<\/p>\n<p>反过来说，数据稀少、目标模糊、答案没有共识的领域，AI 更容易变成噱头。它可以帮你读文献、提假设、做初筛，但不能替代领域判断和实验验证。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 AI 会自动发现因果规律——多数成功是加速预测和筛选。\n<\/li><li>\n别以为有数据就够了——还要目标可写、答案可验。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 13 章：AI 做科学：从 AlphaFold 说起<\/td><td>本章核心概念之一<\/td><td>数据多、目标明确、答案能被实验检验，是 AI 在科学里最容易成功的三个条件。<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\nc35 AlphaFold、c46 校准与主动学习\n<\/ul>", "kind": "concept", "title": "AI 做科学的三个条件"}, "c37": {"html": "<div class=\"source-badge\">📖 出处：hello-ai.pdf · p.142<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c23\">自回归生成与采样<\/a><\/span><\/div><h1>提示词<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 ｜ <strong>涉及章节<\/strong>：第 14 章：与 AI 共事\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>提示词是你给模型的全部上下文，决定续写方向；好提示说清任务、对象、标准、例子和输出格式。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是最便宜、最立刻生效的控制手段，也是理解「模型只是在续写」的实践入口。<\/p>\n<h2>详解<\/h2>\n<p>提示词不是咒语，而是在用文字塑造概率分布。任务要用动词说清，对象要说明给谁看、基于什么材料，标准要写清什么算好，例子比形容词有效，输出格式要明确。<\/p>\n<p>复杂任务让它先列步骤再作答，等于把草稿纸放进上下文。提示词越长不一定越好，重点是信息密度和可检验的标准。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为提示词越长越好——堆形容词会稀释重点。\n<\/li><li>\n别以为有一套万能模板——任务和标准不同，提示也要变。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 14 章：与 AI 共事<\/td><td>本章核心概念之一<\/td><td>提示词是你给模型的全部上下文，决定续写方向；好提示说清任务、对象、标准、例子和输出格式。<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\nc38 人机分工与验证、c26 思维链\n<\/ul>", "kind": "concept", "title": "提示词"}, "c38": {"html": "<div class=\"source-badge\">📖 出处：hello-ai.pdf · p.142<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c37\">提示词<\/a><\/span><\/div><h1>人机分工与验证<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：第 14 章：与 AI 共事\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>AI 铺广度、人负责深度；关键事实必查，不懂的领域不用它做最终判断，要求它给出依据。<\/p>\n<h2>为什么重要<\/h2>\n<p>AI 产出很便宜，判断很稀缺；分工和验证决定你是用 AI，还是被 AI 带偏。<\/p>\n<h2>详解<\/h2>\n<p>AI 擅长有大量先例、结果可检查、错了可改的任务：初稿、翻译、润色、总结、提取、分类、代码补全。它不擅长决定目标和标准、核对关键事实、对具体人的判断、承担后果。<\/p>\n<p>三个验证习惯：关键事实必查；不懂的领域不用它做最终判断；要求它给出依据。语气自信不等于正确。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 AI 说对了就能直接用——关键事实要查原始来源。\n<\/li><li>\n别以为用了 AI 就不用负责——最后签字的人仍要负责。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 14 章：与 AI 共事<\/td><td>本章核心概念之一<\/td><td>AI 铺广度、人负责深度；关键事实必查，不懂的领域不用它做最终判断，要求它给出依据。<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\nc37 提示词、c39 数据最小化与 AI 素养\n<\/ul>", "kind": "concept", "title": "人机分工与验证"}, "c39": {"html": "<div class=\"source-badge\">📖 出处：hello-ai.pdf · p.142<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c38\">人机分工与验证<\/a><\/span><\/div><h1>数据最小化与 AI 素养<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：第 14 章：与 AI 共事\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>只给任务必需的数据和权限；AI 素养是提出好问题、判断真假、为结果负责。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把隐私、安全和能力问题落到日常操作：少给数据、少给权限、多问依据。<\/p>\n<h2>详解<\/h2>\n<p>数据最小化：能匿名先匿名，条款不明的服务不交学生作业、病历、内部文件；智能体只给必需权限，因为每项权限都是提示注入可利用的通道。<\/p>\n<p>AI 素养不是学提示词或编程，而是三种能力：提出好问题、判断产出的好坏与真假、愿意并能够为 AI 参与的事负责。工具会换代，这三种能力更耐久。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 AI 素养就是会用工具——判断和责任更核心。\n<\/li><li>\n别以为数据给得越多效果越好——多给的每一份都是风险。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 14 章：与 AI 共事<\/td><td>本章核心概念之一<\/td><td>只给任务必需的数据和权限；AI 素养是提出好问题、判断真假、为结果负责。<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\nc38 人机分工与验证、c34 权限与人在回路\n<\/ul>", "kind": "concept", "title": "数据最小化与 AI 素养"}, "c40": {"html": "<div class=\"source-badge\">📖 出处：hello-ai.pdf · p.151<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c23\">自回归生成与采样<\/a><\/span><\/div><h1>一次回答的推理流水线<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：专题 1：一句话的旅程\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>一次回答经过上下文、分词、嵌入、几十层、概率、采样六个阶段，循环生成每个 token。<\/p>\n<h2>为什么重要<\/h2>\n<p>它让你能定位问题：答错事实在知识/检索，答非所问在上下文，数字母错在分词，前后矛盾在自回归。<\/p>\n<h2>详解<\/h2>\n<p>第一个字最慢，因为要处理完整提示、算完所有层；后面的字可复用键值缓存。一段长回答是几百次前向计算，不是一次性写好。<\/p>\n<p>三个尺度：毫秒级的分词/嵌入/采样，几十毫秒每 token 的层计算，几秒到几十秒的完整回答。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为模型一次性写完整段——它一次一个 token。\n<\/li><li>\n别以为回答慢一定是网络问题——也可能是模型大、思考长、上下文长。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>专题 1：一句话的旅程<\/td><td>本章核心概念之一<\/td><td>一次回答经过上下文、分词、嵌入、几十层、概率、采样六个阶段，循环生成每个 token。<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\nc19 分词与 BPE、c23 自回归与采样\n<\/ul>", "kind": "concept", "title": "一次回答的推理流水线"}, "c41": {"html": "<div class=\"source-badge\">📖 出处：hello-ai.pdf · p.157<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c15\">分布偏移与相关因果<\/a><\/span><\/div><h1>推荐系统与反馈循环<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：专题 2：推荐系统：你为什么停不下来\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>推荐系统预测你对候选内容的互动概率；推荐改变行为，行为又变成训练数据，形成反馈循环。<\/p>\n<h2>为什么重要<\/h2>\n<p>它解释信息茧房、标题党和「停不下来」：系统优化的是可测指标，不是你的长期满意度。<\/p>\n<h2>详解<\/h2>\n<p>用户和内容都变成向量，算相似度后排序。点击最容易收集，但不等于满意；标题党可能被点开又立刻退出，系统却记了一次点击。<\/p>\n<p>只优化点击会放大标题党、极端内容、短刺激；只优化时长会鼓励无限下滑。更合理的目标要看长期留存、不感兴趣、举报等信号。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为推荐系统懂你——它懂互动概率。\n<\/li><li>\n别以为点击多就是喜欢——停留和回访更接近满意。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>专题 2：推荐系统：你为什么停不下来<\/td><td>本章核心概念之一<\/td><td>推荐系统预测你对候选内容的互动概率；推荐改变行为，行为又变成训练数据，形成反馈循环。<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\nc42 冷启动与探索、c15 分布偏移\n<\/ul>", "kind": "concept", "title": "推荐系统与反馈循环"}, "c42": {"html": "<div class=\"source-badge\">📖 出处：hello-ai.pdf · p.157<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c41\">推荐系统与反馈循环<\/a><\/span><\/div><h1>冷启动与探索<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：专题 2：推荐系统：你为什么停不下来\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>新用户和新内容没有历史数据，系统必须给一些曝光去探索，否则永远不知道好坏。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是推荐系统里探索与利用的具体版本，也是内容生态多样性的关键。<\/p>\n<h2>详解<\/h2>\n<p>只利用已知有效的内容，新内容永远没机会；只探索，用户体验会变差。常见做法是给新内容少量曝光，按表现逐步加量，或用 bandit 算法平衡。<\/p>\n<p>冷启动也适用于教育：新学生没有学情数据，不能一上来就贴标签；先给诊断性任务，再逐步个性化。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为没有数据就不能推荐——可以用内容特征和探索策略。\n<\/li><li>\n别以为探索越多越好——探索有用户体验成本。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>专题 2：推荐系统：你为什么停不下来<\/td><td>本章核心概念之一<\/td><td>新用户和新内容没有历史数据，系统必须给一些曝光去探索，否则永远不知道好坏。<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\nc41 推荐系统与反馈循环、c09 强化学习\n<\/ul>", "kind": "concept", "title": "冷启动与探索"}, "c43": {"html": "<div class=\"source-badge\">📖 出处：hello-ai.pdf · p.161<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c17\">卷积神经网络<\/a><\/span><\/div><h1>自动驾驶的四个模块<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：专题 3：自动驾驶：四种能力的合体\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>自动驾驶由感知、预测、规划/决策、控制四个模块组成，实时闭环。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是「四种能力全用上」的真实系统，也是理解模块化与端到端取舍的入口。<\/p>\n<h2>详解<\/h2>\n<p>感知用摄像头、激光雷达、毫米波雷达检测车辆、行人、车道线、交通灯，估计距离和速度。预测估计其他交通参与者下一步怎么动。规划决定路线、变道、让行。控制把规划变成油门、刹车、方向盘。<\/p>\n<p>模块化可解释、可测试，但误差累积；端到端整体优化，但黑箱、难验证。量产常用混合架构。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为自动驾驶是一个大模型——它是多种能力加安全冗余。\n<\/li><li>\n别以为端到端一定更好——可验证性是大问题。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>专题 3：自动驾驶：四种能力的合体<\/td><td>本章核心概念之一<\/td><td>自动驾驶由感知、预测、规划/决策、控制四个模块组成，实时闭环。<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\nc44 长尾与数据闭环、c30 多模态\n<\/ul>", "kind": "concept", "title": "自动驾驶的四个模块"}, "c44": {"html": "<div class=\"source-badge\">📖 出处：hello-ai.pdf · p.161<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c43\">自动驾驶的四个模块<\/a><\/span><\/div><h1>长尾与数据闭环<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：专题 3：自动驾驶：四种能力的合体\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>长尾是训练数据里极少出现却可能致命的罕见场景；数据闭环把车队遇到的新场景传回训练。<\/p>\n<h2>为什么重要<\/h2>\n<p>自动驾驶的难点不在常见路况，而在长尾；谁的数据闭环快，谁的覆盖好。<\/p>\n<h2>详解<\/h2>\n<p>穿玩偶服的人、掉落的床垫、逆行的电动车、暴雨里被遮住的交通灯，都是长尾。平均接管次数会掩盖这些场景，必须分组评估。<\/p>\n<p>数据闭环：车队遇到罕见场景自动上传，标注，加入训练，再部署回车队。部署不是终点，是下一轮数据的起点。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为平均指标好就安全——平均值会掩盖长尾。\n<\/li><li>\n别以为长尾能靠仿真完全解决——真实数据仍然关键。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>专题 3：自动驾驶：四种能力的合体<\/td><td>本章核心概念之一<\/td><td>长尾是训练数据里极少出现却可能致命的罕见场景；数据闭环把车队遇到的新场景传回训练。<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\nc43 自动驾驶四模块、c13 泛化与过拟合\n<\/ul>", "kind": "concept", "title": "长尾与数据闭环"}, "c45": {"html": "<div class=\"source-badge\">📖 出处：hello-ai.pdf · p.174<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c13\">泛化与过拟合<\/a><\/span><\/div><h1>科研机器学习流程<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：专题 4：给科研人的机器学习实用课\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>科研 ML 的顺序是问题、表示、傻基线、模型、验证；不要从「我要用深度学习」开始。<\/p>\n<h2>为什么重要<\/h2>\n<p>它帮你避免用大炮打蚊子，也避免被一个没有落地的准确率数字骗到。<\/p>\n<h2>详解<\/h2>\n<p>先问预测什么、错了代价是什么、预测后做什么动作。再把样本变成数字（手工描述符、指纹、学习表示）。然后做均值、线性、树模型基线，知道「多好算好」。数据少时优先树模型或预训练表示，数据够了再上深网络。<\/p>\n<p>最后一定要验证、校准、看分组表现，别拿测试集反复调模型。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为科研一定要用最深的模型——小数据下树模型更稳。\n<\/li><li>\n别以为准确率高就有用——还要看代价、校准和落地。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>专题 4：给科研人的机器学习实用课<\/td><td>本章核心概念之一<\/td><td>科研 ML 的顺序是问题、表示、傻基线、模型、验证；不要从「我要用深度学习」开始。<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\nc46 校准与主动学习、c13 泛化与过拟合\n<\/ul>", "kind": "concept", "title": "科研机器学习流程"}, "c46": {"html": "<div class=\"source-badge\">📖 出处：hello-ai.pdf · p.174<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c45\">科研机器学习流程<\/a><\/span><\/div><h1>校准与主动学习<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：专题 4：给科研人的机器学习实用课\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>校准衡量预测把握是否可信；主动学习用不确定性挑最值得做的实验。<\/p>\n<h2>为什么重要<\/h2>\n<p>科研实验很贵，知道「哪里不知道」比多涨一个点更有价值。<\/p>\n<h2>详解<\/h2>\n<p>校准好，模型说 80% 把握时实际大约 80% 正确。高斯过程和集成模型能给出不确定性，适合小数据、实验贵的场景。<\/p>\n<p>主动学习同时看「可能好」和「模型不确定」，优先做信息量最大的实验。这是探索与利用在实验设计里的版本，能把实验次数降一个数量级。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为准确率高就值得做实验——还要看不确定性和代价。\n<\/li><li>\n别以为主动学习就是多标数据——它是挑最有信息量的样本。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>专题 4：给科研人的机器学习实用课<\/td><td>本章核心概念之一<\/td><td>校准衡量预测把握是否可信；主动学习用不确定性挑最值得做的实验。<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\nc45 科研机器学习流程、c36 AI 做科学三条件\n<\/ul>", "kind": "concept", "title": "校准与主动学习"}, "c47": {"html": "<div class=\"source-badge\">📖 出处：hello-ai.pdf · p.183<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c25\">RLHF 与 DPO<\/a><\/span><\/div><h1>训练流水线与偏好方法<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：专题 5：训练一个模型：从数据到对齐的实操\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>训练流水线是数据、分词、预训练、评测、SFT、偏好/RL、蒸馏部署；评测贯穿全程。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把前面所有原理串成工程顺序，也让你知道每一步需要什么数据和算力。<\/p>\n<h2>详解<\/h2>\n<p>预训练用几万亿 token，SFT 用几万条示范，偏好对齐用人类排序或可验证答案。RLHF、DPO、GRPO 是三代偏好方法：RLHF 用奖励模型 + RL，DPO 直接优化偏好对，GRPO 用可验证奖励适合数学和代码。<\/p>\n<p>评测不是最后一步，会在预训练、SFT、对齐后反复出现，决定下一步往哪走。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为训练是一条直线——评测会反复把你打回上一阶段。\n<\/li><li>\n别以为偏好对齐只有一种方法——RLHF、DPO、GRPO 适用场景不同。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>专题 5：训练一个模型：从数据到对齐的实操<\/td><td>本章核心概念之一<\/td><td>训练流水线是数据、分词、预训练、评测、SFT、偏好/RL、蒸馏部署；评测贯穿全程。<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\nc25 RLHF 与 DPO、c48 提示/RAG/微调选择\n<\/ul>", "kind": "concept", "title": "训练流水线与偏好方法"}, "c48": {"html": "<div class=\"source-badge\">📖 出处：hello-ai.pdf · p.183<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c47\">训练流水线与偏好方法<\/a><\/span><\/div><h1>提示、RAG、微调怎么选<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 ｜ <strong>涉及章节<\/strong>：专题 5：训练一个模型：从数据到对齐的实操\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>改模型看到什么用提示，改回答材料用 RAG，改行为风格用微调，改一切才从头训练。<\/p>\n<h2>为什么重要<\/h2>\n<p>大多数团队真正该做的是前三者，而不是预训练；选错成本差几个数量级。<\/p>\n<h2>详解<\/h2>\n<p>提示/技能零成本、立刻生效，永远先试。RAG 适合知识更新、企业资料，改的是上下文里的材料。微调适合行为、风格、格式，需要几千到几万条示例，成本几千元级。从头预训练几亿元级，只有少数机构做。<\/p>\n<p>常见错误是「知识不够就微调」。微调不擅长灌新知识，知识更新优先 RAG。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为微调能加新知识——它主要改行为格式。\n<\/li><li>\n别以为从头训练才专业——大多数需求用提示和 RAG 就能解决。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>专题 5：训练一个模型：从数据到对齐的实操<\/td><td>本章核心概念之一<\/td><td>改模型看到什么用提示，改回答材料用 RAG，改行为风格用微调，改一切才从头训练。<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\nc47 训练流水线、c28 RAG 与接地\n<\/ul>", "kind": "concept", "title": "提示、RAG、微调怎么选"}, "c49": {"html": "<div class=\"source-badge\">📖 出处：hello-ai.pdf · p.194<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c24\">预训练、SFT 与对齐<\/a><\/span><\/div><h1>开放权重<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：专题 6：AI 与开源\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>多数「开源模型」只开放训练好的权重和推理代码，训练数据和代码未必公开。<\/p>\n<h2>为什么重要<\/h2>\n<p>开放权重能运行、微调、审计、离线部署，但不能仅凭权重复现完整训练。<\/p>\n<h2>详解<\/h2>\n<p>AI 开源分三层：代码、数据、权重。代码最常开放，数据最难，权重介于中间。完全开源会公开训练代码、数据来源与过滤规则、日志和权重，这样的模型很少。<\/p>\n<p>开放权重最大价值是可微调：学校、医院、企业用本领域数据得到懂行的模型，成本只是预训练的千分之一。许可证可能限制商用、用户规模或再分发，必须读条款。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为开源模型就是完全开源——多数只开放权重。\n<\/li><li>\n别以为免费就能商用——许可证可能限制用途。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>专题 6：AI 与开源<\/td><td>本章核心概念之一<\/td><td>多数「开源模型」只开放训练好的权重和推理代码，训练数据和代码未必公开。<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\nc50 蒸馏与许可证、c47 训练流水线\n<\/ul>", "kind": "concept", "title": "开放权重"}, "c50": {"html": "<div class=\"source-badge\">📖 出处：hello-ai.pdf · p.194<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c49\">开放权重<\/a><\/span><\/div><h1>蒸馏与许可证<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：专题 6：AI 与开源\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>蒸馏让小模型学习大模型的输出分布；许可证决定开放权重模型能做什么、不能做什么。<\/p>\n<h2>为什么重要<\/h2>\n<p>它让能力可以压进小模型、跑在手机上，也带来使用边界和商业争议。<\/p>\n<h2>详解<\/h2>\n<p>小模型看不到大模型参数，只看大量问题的回答或概率分布，然后模仿。蒸馏模型可以在手机上跑，能力接近大模型的一部分。<\/p>\n<p>争议是用别家闭源模型的输出训练自己的模型是否违反服务条款。技术上简单，商业上是一道边界。许可证则决定能否商用、用户规模上限、能否再分发。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为蒸馏是抄参数——它学的是输出分布。\n<\/li><li>\n别以为许可证不重要——它可能直接决定项目能不能上线。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>专题 6：AI 与开源<\/td><td>本章核心概念之一<\/td><td>蒸馏让小模型学习大模型的输出分布；许可证决定开放权重模型能做什么、不能做什么。<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\nc49 开放权重、c47 训练流水线\n<\/ul>", "kind": "concept", "title": "蒸馏与许可证"}, "__path__": {"html": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：地图：AI 是什么、怎么走到今天<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：你已经在用 AI 了<\/a>、<a href=\"#/chapter/ch02\">第 2 章：七十年，三次浪潮<\/a><br>检查点：完成 ch01、ch02 的自测题，正确率 ≥ 80%<\/li><li class='path-step' id='path-02'><strong>步骤 02：机器怎么学：搜索、规则、强化、监督<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章：不只是神经网络<\/a>、<a href=\"#/chapter/ch04\">第 4 章：规则不是写出来的，是学出来的<\/a>、<a href=\"#/chapter/ch05\">第 5 章：真正的考试在训练集之外<\/a><br>检查点：完成 ch03、ch04、ch05 的自测题，正确率 ≥ 80%<\/li><li class='path-step' id='path-03'><strong>步骤 03：神经网络：从神经元到表示学习<\/strong><br>阅读：<a href=\"#/chapter/ch06\">第 6 章：一层一层看出一只猫<\/a><br>检查点：完成 ch06 的自测题，正确率 ≥ 80%<\/li><li class='path-step' id='path-04'><strong>步骤 04：语言模型：token、注意力、Transformer<\/strong><br>阅读：<a href=\"#/chapter/ch07\">第 7 章：文字怎样变成数字<\/a>、<a href=\"#/chapter/ch08\">第 8 章：每个词都能看见其他词<\/a><br>检查点：完成 ch07、ch08 的自测题，正确率 ≥ 80%<\/li><li class='path-step' id='path-05'><strong>步骤 05：训练与对齐：预训练、SFT、RLHF<\/strong><br>阅读：<a href=\"#/chapter/ch09\">第 9 章：从续写机到助手<\/a><br>检查点：完成 ch09 的自测题，正确率 ≥ 80%<\/li><li class='path-step' id='path-06'><strong>步骤 06：可靠使用：幻觉、检索、校准<\/strong><br>阅读：<a href=\"#/chapter/ch10\">第 10 章：它为什么会一本正经地胡说<\/a><br>检查点：完成 ch10 的自测题，正确率 ≥ 80%<\/li><li class='path-step' id='path-07'><strong>步骤 07：多模态与智能体：从会说到会做<\/strong><br>阅读：<a href=\"#/chapter/ch11\">第 11 章：模型长出了眼睛和手<\/a>、<a href=\"#/chapter/ch12\">第 12 章：智能体的一天<\/a><br>检查点：完成 ch11、ch12 的自测题，正确率 ≥ 80%<\/li><li class='path-step' id='path-08'><strong>步骤 08：AI 做科学：AlphaFold 与边界<\/strong><br>阅读：<a href=\"#/chapter/ch13\">第 13 章：AI 做科学：从 AlphaFold 说起<\/a><br>检查点：完成 ch13 的自测题，正确率 ≥ 80%<\/li><li class='path-step' id='path-09'><strong>步骤 09：人的位置：提示、验证、责任<\/strong><br>阅读：<a href=\"#/chapter/ch14\">第 14 章：与 AI 共事<\/a><br>检查点：完成 ch14 的自测题，正确率 ≥ 80%<\/li><li class='path-step' id='path-10'><strong>步骤 10：六个专题：应用现场与工程实操<\/strong><br>阅读：<a href=\"#/chapter/t01\">专题 1：一句话的旅程<\/a>、<a href=\"#/chapter/t02\">专题 2：推荐系统：你为什么停不下来<\/a>、<a href=\"#/chapter/t03\">专题 3：自动驾驶：四种能力的合体<\/a>、<a href=\"#/chapter/t04\">专题 4：给科研人的机器学习实用课<\/a>、<a href=\"#/chapter/t05\">专题 5：训练一个模型：从数据到对齐的实操<\/a>、<a href=\"#/chapter/t06\">专题 6：AI 与开源<\/a><br>检查点：完成 t01、t02、t03、t04、t05、t06 的自测题，正确率 ≥ 80%<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "kind": "path", "title": "学习路径"}, "__graph__": {"html": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "kind": "graph", "title": "知识图谱"}, "__quiz_all__": {"html": "<p>（无综合题）<\/p>", "kind": "quiz", "title": "综合测验"}, "__quiz_ch01__": {"html": "<h1>测验：第 1 章：你已经在用 AI 了<\/h1><div class='quiz-item' data-qid='q01' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q1.<\/b> 判断一个软件是不是 AI，本章建议先看什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 它用的是不是大模型<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 它做的任务是否需要通常由人承担的智能<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 它的代码是不是开源<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 它能不能自我意识<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single' data-concept='c02' data-chapter='ch01'><p class='quiz-q'><b>Q2.<\/b> 下列哪组包含关系是正确的？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> 大模型 ⊃ 深度学习 ⊃ 机器学习 ⊃ AI<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> AI ⊃ 机器学习 ⊃ 深度学习 ⊃ 大模型<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> 机器学习 ⊃ AI ⊃ 大模型 ⊃ 深度学习<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> AI ⊃ 大模型 ⊃ 机器学习 ⊃ 深度学习<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q03' data-type='single' data-concept='c03' data-chapter='ch01'><p class='quiz-q'><b>Q3.<\/b> 手机相册搜索「猫」主要用到哪种能力？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> 生成<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> 决策<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> 识别<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> 强化学习<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch02__": {"html": "<h1>测验：第 2 章：七十年，三次浪潮<\/h1><div class='quiz-item' data-qid='q04' data-type='single' data-concept='c04' data-chapter='ch02'><p class='quiz-q'><b>Q1.<\/b> 两次 AI 寒冬的共同原因是什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q04' value='0'> 算法完全没有价值<\/label><label class='quiz-opt'><input type='radio' name='q04' value='1'> 承诺超过了当时数据与算力能兑现的能力<\/label><label class='quiz-opt'><input type='radio' name='q04' value='2'> 政府禁止研究<\/label><label class='quiz-opt'><input type='radio' name='q04' value='3'> GPU 不够便宜<\/label><\/div><div class='quiz-actions'><button class='quiz-che
